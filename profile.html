<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>My Profile | ATH DIGITAL HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0c15;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }
        .back-btn {
            background: rgba(0,212,255,0.15);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            color: #00d4ff;
            margin-bottom: 20px;
            display: inline-block;
            text-decoration: none;
        }
        .profile-card {
            max-width: 400px;
            margin: 0 auto;
            background: rgba(18,22,35,0.95);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
        }
        .profile-icon { font-size: 4rem; color: #00d4ff; margin-bottom: 20px; }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .clear-btn {
            background: #f43f5e;
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Store</a>
    <div class="profile-card">
        <div class="profile-icon"><i class="fas fa-user-circle"></i></div>
        <h2>My Profile</h2>
        <div class="info-row">
            <span>📞 Phone Number</span>
            <span id="profilePhone">-</span>
        </div>
        <div class="info-row">
            <span>📅 Member Since</span>
            <span id="memberSince">-</span>
        </div>
        <button class="clear-btn" id="clearPhoneBtn"><i class="fas fa-trash"></i> Clear Saved Phone</button>
    </div>
    <script>
        const myPhone = localStorage.getItem('myOrderPhone') || '';
        document.getElementById('profilePhone').innerText = myPhone || 'Not set';
        document.getElementById('memberSince').innerText = new Date().toLocaleDateString();
        
        document.getElementById('clearPhoneBtn').addEventListener('click', () => {
            if (confirm('Clear your saved phone number?')) {
                localStorage.removeItem('myOrderPhone');
                alert('Phone number cleared!');
                location.reload();
            }
        });
    </script>
</body>
</html>
