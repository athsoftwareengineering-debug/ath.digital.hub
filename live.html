<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Live Feed | ATH DIGITAL HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0c15;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }
        .back-btn {
            background: rgba(0,212,255,0.15);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            color: #00d4ff;
            margin-bottom: 20px;
            display: inline-block;
            text-decoration: none;
        }
        .live-container { max-width: 800px; margin: 0 auto; }
        .order-card {
            background: rgba(18,22,35,0.95);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
            border-left: 3px solid #00d4ff;
        }
        .new-badge {
            background: #f43f5e;
            color: white;
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 8px;
        }
        .status-approved { color: #10b981; }
        .status-pending { color: #f59e0b; }
        .auto-refresh { text-align: center; font-size: 0.7rem; color: #64748b; margin-top: 20px; }
    </style>
</head>
<body>
    <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Store</a>
    <div class="live-container">
        <h2><i class="fas fa-broadcast-tower"></i> Live Feed <span style="font-size:0.7rem; color:#f43f5e;">● LIVE</span></h2>
        <div id="feedList" class="empty-msg">Loading...</div>
        <div class="auto-refresh" id="refreshTimer">Auto refresh: 30s</div>
    </div>
    <script>
        const API_BASE = window.location.origin;
        let myPhone = localStorage.getItem('myOrderPhone') || '';
        let refreshSec = 30;
        
        function maskPhone(p) { return p && p.length >= 8 ? p.substring(0,5)+'***'+p.substring(p.length-3) : p; }
        
        async function loadFeed() {
            try {
                const res = await fetch(`${API_BASE}/api/orders`);
                const data = await res.json();
                let orders = (data.orders || []).filter(o => o.phone !== myPhone);
                if (orders.length === 0) {
                    document.getElementById('feedList').innerHTML = '<div class="empty-msg">No orders from others yet.</div>';
                    return;
                }
                document.getElementById('feedList').innerHTML = orders.map(o => `
                    <div class="order-card">
                        ${Date.now() - new Date(o.created_at).getTime() < 120000 ? '<div class="new-badge">NEW</div>' : ''}
                        <div><strong>${o.plan}</strong> <span class="status-${o.status.toLowerCase()}">${o.status}</span></div>
                        <div>📞 ${maskPhone(o.phone)}</div>
                        <div>💰 ${o.price.toLocaleString()} KS</div>
                        <div>🕐 ${new Date(o.created_at).toLocaleTimeString()}</div>
                    </div>
                `).join('');
            } catch(e) {
                document.getElementById('feedList').innerHTML = '<div class="empty-msg">Error loading feed.</div>';
            }
        }
        
        let timer = setInterval(() => {
            refreshSec--;
            document.getElementById('refreshTimer').innerHTML = `Auto refresh: ${refreshSec}s`;
            if (refreshSec <= 0) {
                refreshSec = 30;
                loadFeed();
            }
        }, 1000);
        
        loadFeed();
    </script>
</body>
</html>
