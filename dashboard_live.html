<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>My Plans & LIVE | ATH</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-deep: #0a0c15;
            --cyan: #00d4ff;
            --violet: #8b5cf6;
            --emerald: #10b981;
            --rose: #f43f5e;
            --amber: #f59e0b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }
        body {
            background: #0a0c15;
            color: var(--text-primary);
            font-family: 'Noto Sans Myanmar', 'Inter', sans-serif;
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at 20% 30%, rgba(139,92,246,0.15) 0%, transparent 60%),
                radial-gradient(circle at 85% 70%, rgba(0,212,255,0.1) 0%, transparent 55%),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 2px);
            background-size: 100% 100%, 100% 100%, 100% 100%;
            padding: 20px 16px 40px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .dashboard-header {
            backdrop-filter: blur(20px);
            background: rgba(10,12,21,0.6);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 1.5rem;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }
        .brand {
            font-family: 'Space Grotesk', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #94a3b8, var(--cyan));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand i {
            color: var(--cyan);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { text-shadow: 0 0 0px rgba(0,212,255,0); }
            50% { text-shadow: 0 0 8px rgba(0,212,255,0.6); }
        }
        .back-home {
            background: rgba(0,212,255,0.15);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            text-decoration: none;
            color: var(--cyan);
            transition: 0.2s;
        }
        .back-home:hover {
            background: var(--cyan);
            color: #030712;
        }
        .search-section {
            background: rgba(0,212,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 1.2rem;
            padding: 16px;
            margin-bottom: 28px;
            border: 1px solid rgba(0,212,255,0.15);
        }
        .search-title {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .search-box {
            display: flex;
            gap: 8px;
        }
        .search-box input {
            flex: 1;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 60px;
            padding: 10px 16px;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }
        .search-box input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 8px rgba(0,212,255,0.3);
        }
        .search-box button {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            border: none;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: bold;
            color: #030712;
            cursor: pointer;
            transition: 0.2s;
        }
        .search-box button:hover {
            transform: scale(0.96);
        }
        .search-box button.clear {
            background: #334155;
            color: white;
        }
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 24px 0 12px;
        }
        .section-title h2 {
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        /* LIVE badge - အမြဲမှိတ်တုတ် */
        .live-badge {
            font-size: 0.6rem;
            background: rgba(244,63,94,0.2);
            color: #f43f5e;
            padding: 3px 10px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            animation: blinkRed 0.8s step-end infinite;
        }
        @keyframes blinkRed {
            0%,100% { background: rgba(244,63,94,0.2); color: #f43f5e; }
            50% { background: rgba(244,63,94,0.9); color: white; }
        }
        /* cards */
        .my-card {
            background: linear-gradient(145deg, rgba(18,22,35,0.95), rgba(10,12,21,0.98));
            border-radius: 1.2rem;
            padding: 14px;
            margin-bottom: 12px;
            border-left: 3px solid var(--cyan);
            transition: all 0.2s ease;
        }
        .my-card:hover {
            transform: translateX(5px);
            border-left-color: var(--violet);
            box-shadow: 0 8px 20px rgba(0,212,255,0.1);
        }
        .live-card {
            background: linear-gradient(145deg, rgba(18,22,35,0.95), rgba(10,12,21,0.98));
            border-radius: 1.2rem;
            padding: 14px;
            margin-bottom: 12px;
            border-left: 3px solid var(--amber);
            transition: all 0.2s ease;
        }
        .live-card:hover {
            transform: translateX(5px);
            border-left-color: #f97316;
            box-shadow: 0 8px 20px rgba(245,158,11,0.1);
        }
        /* မှိတ်တုတ် effect 2 မျိုး */
        @keyframes blinkYellow {
            0% { background: linear-gradient(145deg, rgba(18,22,35,0.95), rgba(10,12,21,0.98)); border-left-color: var(--amber); }
            25% { background: rgba(245,158,11,0.4); border-left-color: #fbbf24; box-shadow: 0 0 15px #f59e0b; }
            50% { background: linear-gradient(145deg, rgba(18,22,35,0.95), rgba(10,12,21,0.98)); border-left-color: var(--amber); }
            75% { background: rgba(245,158,11,0.4); border-left-color: #fbbf24; box-shadow: 0 0 15px #f59e0b; }
            100% { background: linear-gradient(145deg, rgba(18,22,35,0.95), rgba(10,12,21,0.98)); border-left-color: var(--amber); }
        }
        @keyframes blinkCyan {
            0% { background: linear-gradient(145deg, rgba(18,22,35,0.95), rgba(10,12,21,0.98)); border-left-color: var(--cyan); }
            25% { background: rgba(0,212,255,0.3); border-left-color: #00d4ff; box-shadow: 0 0 15px #00d4ff; }
            50% { background: linear-gradient(145deg, rgba(18,22,35,0.95), rgba(10,12,21,0.98)); border-left-color: var(--cyan); }
            75% { background: rgba(0,212,255,0.3); border-left-color: #00d4ff; box-shadow: 0 0 15px #00d4ff; }
            100% { background: linear-gradient(145deg, rgba(18,22,35,0.95), rgba(10,12,21,0.98)); border-left-color: var(--cyan); }
        }
        .blink-live {
            animation: blinkYellow 0.6s ease-in-out 2;
        }
        .blink-rotate {
            animation: blinkCyan 0.5s ease-in-out 2;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .plan {
            font-weight: 700;
            font-size: 0.85rem;
        }
        .my-card .plan { color: var(--cyan); }
        .live-card .plan { color: var(--amber); }
        .status {
            font-size: 0.65rem;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 600;
        }
        .status.pending { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .status.approved { background: rgba(16,185,129,0.2); color: #34d399; }
        .status.rejected { background: rgba(244,63,94,0.2); color: #fb7185; }
        .price {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--emerald);
        }
        .date {
            font-size: 0.6rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        .countdown {
            background: rgba(0,212,255,0.1);
            border-radius: 40px;
            padding: 6px 12px;
            margin-top: 8px;
            font-size: 0.65rem;
            font-family: monospace;
            text-align: center;
        }
        .phone-mask {
            font-size: 0.7rem;
            font-family: monospace;
            background: #1e293b;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 40px;
        }
        .empty {
            text-align: center;
            padding: 32px;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
        .separator {
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0,212,255,0.3), transparent);
            margin: 16px 0 8px;
        }
        .footer {
            text-align: center;
            font-size: 0.6rem;
            color: #475569;
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .stack-container {
            position: relative;
            min-height: 280px;
        }
        i { margin-right: 4px; }
    </style>
</head>
<body>
<div class="container">
    <div class="dashboard-header">
        <div class="brand"><i class="fas fa-chart-line"></i> ATH DIGITAL HUB</div>
        <a href="/" class="back-home"><i class="fas fa-store"></i> စတိုး</a>
    </div>

    <div class="search-section">
        <div class="search-title"><i class="fas fa-search"></i> သင့်ဖုန်းနံပါတ်ရှာရန်</div>
        <div class="search-box">
            <input type="tel" id="searchPhone" placeholder="📱 09xxxxxxxxx" value="">
            <button id="searchBtn"><i class="fas fa-search"></i> ရှာ</button>
            <button id="clearBtn" class="clear"><i class="fas fa-times"></i> ရှင်း</button>
        </div>
    </div>

    <div class="my-section">
        <div class="section-title">
            <h2><i class="fas fa-ticket-alt"></i> ကျွန်ုပ်၏ Plan များ</h2>
            <span id="myCount" style="font-size:0.65rem; background:#1e293b; padding:2px 10px; border-radius:40px;">0</span>
        </div>
        <div id="myOrdersContainer">
            <div class="empty"><i class="fas fa-search"></i> ဖုန်းနံပါတ်ရှာပါ</div>
        </div>
    </div>

    <div class="separator"></div>

    <div class="live-section">
        <div class="section-title">
            <h2><i class="fas fa-broadcast-tower"></i> LIVE အော်ဒါများ <span class="live-badge"><i class="fas fa-circle"></i> LIVE</span></h2>
            <span id="liveTimer" style="font-size:0.6rem; background:#1e293b; padding:2px 10px; border-radius:40px;">auto 30s</span>
        </div>
        <div id="liveContainer" class="stack-container">
            <div class="empty"><i class="fas fa-spinner fa-pulse"></i> စောင့်နေသည်...</div>
        </div>
    </div>

    <div class="footer">⚡ အော်ဒါအသစ်ဝင်တိုင်း မှိတ်တုတ်မှိတ်တုတ် / ၁၀ စက္ကန့်တစ်ခါ rotate လည်မည်</div>
</div>

<script>
    const API_BASE = window.location.origin;
    let currentSearchPhone = "";
    let liveOrders = [];
    let lastOrderIds = [];
    let autoRefreshInterval = null, rotateInterval = null, timerInterval = null;
    let refreshSec = 30;

    function maskPhone(p) {
        if (!p || p.length < 8) return p;
        return p.substring(0,5) + "***" + p.substring(p.length-3);
    }
    function formatDate(d) {
        if(!d) return "";
        let date = new Date(d);
        return `${date.getDate()}/${date.getMonth()+1}/${date.getFullYear()}`;
    }
    function remainingTime(activatedAt) {
        if (!activatedAt) return null;
        let end = new Date(activatedAt).getTime() + (30 * 24 * 60 * 60 * 1000);
        let remain = end - Date.now();
        if (remain <= 0) return "✅ သက်တမ်းကုန်";
        let days = Math.floor(remain / 86400000);
        let hours = Math.floor((remain % 86400000) / 3600000);
        let mins = Math.floor((remain % 3600000) / 60000);
        return `${days}ရက် ${hours}နာရီ ${mins}မိနစ်`;
    }

    async function fetchMyOrders(phone) {
        if(!phone) return [];
        try {
            let res = await fetch(`${API_BASE}/api/orders/${encodeURIComponent(phone)}`);
            let data = await res.json();
            return data.orders || [];
        } catch(e) { return []; }
    }
    async function fetchLiveOrders(excludePhone) {
        try {
            let res = await fetch(`${API_BASE}/api/admin/orders`);
            let data = await res.json();
            if(data.orders) {
                let filtered = data.orders.filter(o => o.phone !== excludePhone);
                filtered.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
                return filtered.slice(0, 30);
            }
            return [];
        } catch(e) { return []; }
    }

    function renderMyPlans(orders) {
        let container = document.getElementById('myOrdersContainer');
        let countSpan = document.getElementById('myCount');
        if(!currentSearchPhone) {
            container.innerHTML = '<div class="empty"><i class="fas fa-search"></i> ဖုန်းနံပါတ်ရှာပါ</div>';
            countSpan.innerText = "0";
            return;
        }
        if(orders.length === 0) {
            container.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i> အော်ဒါမရှိသေးပါ</div>';
            countSpan.innerText = "0";
            return;
        }
        countSpan.innerText = orders.length;
        let html = "";
        for(let o of orders) {
            let statusClass = o.status === "Pending" ? "pending" : (o.status === "Approved" ? "approved" : "rejected");
            let statusText = o.status === "Pending" ? "⏳ စောင့်ဆိုင်းဆဲ" : (o.status === "Approved" ? "✅ အတည်ပြုပြီး" : "❌ ပယ်ဖျက်ခံရ");
            let countdownHtml = "";
            if(o.status === "Approved" && o.activated_at) {
                let remain = remainingTime(o.activated_at);
                countdownHtml = `<div class="countdown"><i class="fas fa-hourglass-half"></i> ကျန်ရှိ: ${remain}</div>`;
            }
            html += `
                <div class="my-card">
                    <div class="card-header">
                        <span class="plan"><i class="fas fa-tag"></i> ${o.plan}</span>
                        <span class="status ${statusClass}">${statusText}</span>
                    </div>
                    <div><span class="price">${o.price.toLocaleString()} MMK</span></div>
                    <div class="date"><i class="fas fa-calendar-alt"></i> ဝယ်ရက်: ${formatDate(o.created_at)}</div>
                    ${countdownHtml}
                </div>
            `;
        }
        container.innerHTML = html;
    }

    function renderLiveFeed(orders, isNewOrder = false) {
        let container = document.getElementById('liveContainer');
        if(!orders.length) {
            container.innerHTML = '<div class="empty"><i class="fas fa-eye-slash"></i> လက်ရှိ LIVE အော်ဒါမရှိ</div>';
            return;
        }
        let html = "";
        for(let o of orders) {
            let statusClass = o.status === "Pending" ? "pending" : (o.status === "Approved" ? "approved" : "rejected");
            let statusText = o.status === "Pending" ? "Pending" : (o.status === "Approved" ? "Approved" : "Rejected");
            let remainHtml = "";
            if(o.status === "Approved" && o.activated_at) {
                let remain = remainingTime(o.activated_at);
                remainHtml = `<div class="countdown" style="margin-top:4px;"><i class="fas fa-hourglass-start"></i> ${remain}</div>`;
            }
            html += `
                <div class="live-card" data-order-id="${o.id}">
                    <div class="card-header">
                        <span class="plan"><i class="fas fa-mobile-alt"></i> ${o.plan}</span>
                        <span class="status ${statusClass}">${statusText}</span>
                    </div>
                    <div><span class="phone-mask"><i class="fas fa-phone"></i> ${maskPhone(o.phone)}</span>  <span class="price">${o.price.toLocaleString()}K</span></div>
                    <div class="date"><i class="fas fa-clock"></i> ${new Date(o.created_at).toLocaleTimeString()}</div>
                    ${remainHtml}
                </div>
            `;
        }
        container.innerHTML = html;
        
        // blink effect for new orders
        if(isNewOrder && orders.length > 0) {
            const firstCard = document.querySelector('.live-card');
            if(firstCard) {
                firstCard.classList.add('blink-live');
                setTimeout(() => firstCard.classList.remove('blink-live'), 1200);
            }
        }
    }

    async function refreshData(isManual = false) {
        if(!currentSearchPhone) {
            let live = await fetchLiveOrders("");
            // check if new orders arrived
            let newIds = live.map(o => o.id);
            let hasNew = false;
            if(lastOrderIds.length > 0 && newIds.length > 0 && newIds[0] !== lastOrderIds[0]) {
                hasNew = true;
            }
            lastOrderIds = newIds;
            liveOrders = live;
            renderLiveFeed(liveOrders, hasNew);
            document.getElementById('myOrdersContainer').innerHTML = '<div class="empty"><i class="fas fa-search"></i> ဖုန်းနံပါတ်ရှာပါ</div>';
            document.getElementById('myCount').innerText = "0";
            return;
        }
        let my = await fetchMyOrders(currentSearchPhone);
        let live = await fetchLiveOrders(currentSearchPhone);
        let newIds = live.map(o => o.id);
        let hasNew = false;
        if(lastOrderIds.length > 0 && newIds.length > 0 && newIds[0] !== lastOrderIds[0]) {
            hasNew = true;
        }
        lastOrderIds = newIds;
        liveOrders = live;
        renderMyPlans(my);
        renderLiveFeed(live, hasNew);
    }

    // rotate with blink
    function rotateLiveOrders() {
        if(liveOrders.length <= 1) return;
        const lastItem = liveOrders.pop();
        liveOrders.unshift(lastItem);
        renderLiveFeed(liveOrders, false);
        const firstCard = document.querySelector('.live-card');
        if(firstCard) {
            firstCard.classList.add('blink-rotate');
            setTimeout(() => firstCard.classList.remove('blink-rotate'), 1000);
        }
    }

    function startAutoRefresh() {
        if(autoRefreshInterval) clearInterval(autoRefreshInterval);
        if(timerInterval) clearInterval(timerInterval);
        if(rotateInterval) clearInterval(rotateInterval);
        
        refreshSec = 30;
        const timerSpan = document.getElementById('liveTimer');
        const updateTimer = () => {
            if(timerSpan) timerSpan.innerText = `auto ${refreshSec}s`;
            refreshSec--;
            if(refreshSec < 0) refreshSec = 30;
        };
        timerInterval = setInterval(updateTimer, 1000);
        
        autoRefreshInterval = setInterval(async () => {
            await refreshData();
            refreshSec = 30;
            if(timerSpan) timerSpan.innerText = `auto 30s`;
        }, 30000);
        
        rotateInterval = setInterval(() => {
            if(liveOrders.length > 1) {
                rotateLiveOrders();
            }
        }, 10000);
    }

    async function searchPhone() {
        let input = document.getElementById('searchPhone').value.trim();
        if(input === "") {
            currentSearchPhone = "";
            await refreshData();
            return;
        }
        if(input.length < 9) {
            alert("ဖုန်းနံပါတ် မှန်ကန်စွာထည့်ပါ (09xxxxxxxxx)");
            return;
        }
        currentSearchPhone = input;
        await refreshData();
    }
    function clearSearch() {
        document.getElementById('searchPhone').value = "";
        currentSearchPhone = "";
        refreshData();
    }

    document.getElementById('searchBtn').addEventListener('click', searchPhone);
    document.getElementById('clearBtn').addEventListener('click', clearSearch);
    document.getElementById('searchPhone').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') searchPhone();
    });

    (async () => {
        startAutoRefresh();
        let live = await fetchLiveOrders("");
        lastOrderIds = live.map(o => o.id);
        liveOrders = live;
        renderLiveFeed(live, false);
        document.getElementById('myOrdersContainer').innerHTML = '<div class="empty"><i class="fas fa-search"></i> ဖုန်းနံပါတ်ရှာပါ</div>';
    })();
</script>
</body>
</html>
