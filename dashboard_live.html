<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>My Dashboard | ATH DIGITAL HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-deep: #0a0c15;
            --cyan: #00d4ff;
            --violet: #8b5cf6;
            --emerald: #10b981;
            --rose: #f43f5e;
            --amber: #f59e0b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }
        body {
            background: #0a0c15;
            color: var(--text-primary);
            font-family: 'Noto Sans Myanmar', 'Inter', sans-serif;
            min-height: 100vh;
            /* 🌌 Space Background - Animation နဲ့ Gradient ထည့်ထားတယ် */
            background-image: 
                radial-gradient(ellipse at 20% 30%, rgba(139,92,246,0.15) 0%, transparent 60%),
                radial-gradient(circle at 85% 70%, rgba(0,212,255,0.1) 0%, transparent 55%),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 2px);
            background-size: 100% 100%, 100% 100%, 100% 100%;
            padding: 20px 16px 40px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        /* animated header */
        .dashboard-header {
            backdrop-filter: blur(20px);
            background: rgba(10,12,21,0.6);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 1.5rem;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            transition: all 0.3s;
        }
        .brand {
            font-family: 'Space Grotesk', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #94a3b8, var(--cyan));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand i {
            background: none;
            color: var(--cyan);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { text-shadow: 0 0 0px rgba(0,212,255,0); }
            50% { text-shadow: 0 0 8px rgba(0,212,255,0.8); }
            100% { text-shadow: 0 0 0px rgba(0,212,255,0); }
        }
        /* search box with glassmorphism */
        .search-box {
            background: rgba(0,212,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            padding: 6px;
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border: 1px solid rgba(0,212,255,0.2);
            transition: 0.2s;
        }
        .search-box:focus-within {
            border-color: var(--cyan);
            box-shadow: 0 0 12px rgba(0,212,255,0.3);
        }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 16px;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }
        .search-box button {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: bold;
            color: #030712;
            cursor: pointer;
            transition: 0.2s;
        }
        .search-box button:hover {
            transform: scale(0.96);
            filter: brightness(1.05);
        }
        .search-box button.clear {
            background: #334155;
            color: white;
        }
        /* section */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 20px 0 12px;
        }
        .section-title h2 {
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .live-badge {
            font-size: 0.6rem;
            background: rgba(244,63,94,0.2);
            color: #f43f5e;
            padding: 3px 10px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            animation: liveBlink 1s step-end infinite;
        }
        @keyframes liveBlink {
            0%,100% { background: rgba(244,63,94,0.2); color: #f43f5e; }
            50% { background: rgba(244,63,94,0.8); color: white; }
        }
        /* Cards with hover & glow */
        .card {
            background: linear-gradient(145deg, rgba(18,22,35,0.9), rgba(10,12,21,0.95));
            backdrop-filter: blur(10px);
            border-radius: 1.2rem;
            padding: 14px;
            margin-bottom: 12px;
            border-left: 3px solid var(--cyan);
            transition: all 0.2s ease;
        }
        .card:hover {
            transform: translateX(5px);
            border-left-color: var(--violet);
            box-shadow: 0 8px 20px rgba(0,212,255,0.1);
        }
        .card.live-card {
            border-left-color: var(--amber);
        }
        .card.live-card:hover {
            border-left-color: #f97316;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .plan {
            font-weight: 700;
            color: var(--cyan);
        }
        .status {
            font-size: 0.65rem;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 600;
        }
        .status.pending { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .status.approved { background: rgba(16,185,129,0.2); color: #34d399; }
        .status.rejected { background: rgba(244,63,94,0.2); color: #fb7185; }
        .price {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--emerald);
        }
        .date {
            font-size: 0.6rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        .countdown {
            background: rgba(0,212,255,0.1);
            border-radius: 40px;
            padding: 6px 12px;
            margin-top: 8px;
            font-size: 0.65rem;
            font-family: monospace;
            text-align: center;
        }
        .phone-mask {
            font-size: 0.7rem;
            font-family: monospace;
            background: #1e293b;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 40px;
        }
        .empty {
            text-align: center;
            padding: 32px;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
        .footer {
            text-align: center;
            font-size: 0.6rem;
            color: #475569;
            margin-top: 32px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
        }
        /* scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <div class="dashboard-header">
        <div class="brand"><i class="fas fa-chart-line"></i> ATH Dashboard</div>
        <a href="/" style="background:rgba(0,212,255,0.15);padding:6px 14px;border-radius:40px;font-size:0.7rem;text-decoration:none;color:var(--cyan);"><i class="fas fa-store"></i> စတိုး</a>
    </div>

    <div class="search-box">
        <input type="tel" id="searchPhone" placeholder="📱 ဖုန်းနံပါတ်ရိုက်ထည့်ပါ (09...)" value="">
        <button id="searchBtn"><i class="fas fa-search"></i> ရှာ</button>
        <button id="clearBtn" class="clear"><i class="fas fa-times"></i></button>
    </div>

    <div class="section-title">
        <h2><i class="fas fa-ticket-alt"></i> ဝယ်ထားသော Plan များ</h2>
        <span id="myCount" style="font-size:0.65rem;">0</span>
    </div>
    <div id="myOrdersContainer">
        <div class="empty"><i class="fas fa-search"></i> ဖုန်းနံပါတ်ရှာပါ</div>
    </div>

    <div class="section-title">
        <h2><i class="fas fa-broadcast-tower"></i> LIVE အော်ဒါများ <span class="live-badge"><i class="fas fa-circle"></i> LIVE</span></h2>
        <span id="liveTimer" style="font-size:0.6rem;">auto 30s</span>
    </div>
    <div id="liveContainer">
        <div class="empty"><i class="fas fa-spinner fa-pulse"></i> စောင့်နေသည်...</div>
    </div>
    <div class="footer">⚡ အခြားသူများ၏ အော်ဒါအသစ်များ အလိုအလျောက် ပြောင်းလဲပြသည်</div>
</div>

<script>
    const API_BASE = window.location.origin;
    let currentSearchPhone = "";
    let liveOrders = [];
    let autoInterval = null, timerInterval = null;

    function maskPhone(p) {
        if (!p || p.length < 8) return p;
        return p.substring(0,5) + "***" + p.substring(p.length-3);
    }
    function formatDate(d) {
        if(!d) return "";
        let date = new Date(d);
        return `${date.getDate()}/${date.getMonth()+1}/${date.getFullYear()}`;
    }
    function remainingTime(activatedAt) {
        if (!activatedAt) return null;
        let end = new Date(activatedAt).getTime() + (30 * 24 * 60 * 60 * 1000);
        let remain = end - Date.now();
        if (remain <= 0) return "✅ သက်တမ်းကုန်";
        let days = Math.floor(remain / 86400000);
        let hours = Math.floor((remain % 86400000) / 3600000);
        let mins = Math.floor((remain % 3600000) / 60000);
        return `${days}ရက် ${hours}နာရီ ${mins}မိနစ်`;
    }

    async function fetchMyOrders(phone) {
        if(!phone) return [];
        try {
            let res = await fetch(`${API_BASE}/api/orders/${encodeURIComponent(phone)}`);
            let data = await res.json();
            return data.orders || [];
        } catch(e) { return []; }
    }
    async function fetchLiveOrders(excludePhone) {
        try {
            let res = await fetch(`${API_BASE}/api/admin/orders`);
            let data = await res.json();
            if(data.orders) {
                let filtered = data.orders.filter(o => o.phone !== excludePhone);
                filtered.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
                return filtered.slice(0, 25);
            }
            return [];
        } catch(e) { return []; }
    }

    function renderMyPlans(orders, searchPhone) {
        let container = document.getElementById('myOrdersContainer');
        let countSpan = document.getElementById('myCount');
        if(!searchPhone) {
            container.innerHTML = '<div class="empty"><i class="fas fa-search"></i> ဖုန်းနံပါတ်ရှာပါ</div>';
            countSpan.innerText = "0";
            return;
        }
        if(orders.length === 0) {
            container.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i> အော်ဒါမရှိသေးပါ</div>';
            countSpan.innerText = "0";
            return;
        }
        countSpan.innerText = orders.length;
        let html = "";
        for(let o of orders) {
            let statusClass = o.status === "Pending" ? "pending" : (o.status === "Approved" ? "approved" : "rejected");
            let statusText = o.status === "Pending" ? "⏳ စောင့်ဆိုင်းဆဲ" : (o.status === "Approved" ? "✅ အတည်ပြုပြီး" : "❌ ပယ်ဖျက်ခံရ");
            let countdownHtml = "";
            if(o.status === "Approved" && o.activated_at) {
                let remain = remainingTime(o.activated_at);
                countdownHtml = `<div class="countdown"><i class="fas fa-hourglass-half"></i> ကျန်ရှိ: ${remain}</div>`;
            }
            html += `
                <div class="card">
                    <div class="card-header">
                        <span class="plan"><i class="fas fa-tag"></i> ${o.plan}</span>
                        <span class="status ${statusClass}">${statusText}</span>
                    </div>
                    <div><span class="price">${o.price.toLocaleString()} MMK</span></div>
                    <div class="date"><i class="fas fa-calendar-alt"></i> ဝယ်ရက်: ${formatDate(o.created_at)}</div>
                    ${countdownHtml}
                </div>
            `;
        }
        container.innerHTML = html;
    }

    function renderLiveFeed(orders) {
        let container = document.getElementById('liveContainer');
        if(!orders.length) {
            container.innerHTML = '<div class="empty"><i class="fas fa-eye-slash"></i> လက်ရှိ LIVE အော်ဒါမရှိ</div>';
            return;
        }
        let html = "";
        for(let o of orders) {
            let statusClass = o.status === "Pending" ? "pending" : (o.status === "Approved" ? "approved" : "rejected");
            let statusText = o.status === "Pending" ? "Pending" : (o.status === "Approved" ? "Approved" : "Rejected");
            let remainHtml = "";
            if(o.status === "Approved" && o.activated_at) {
                let remain = remainingTime(o.activated_at);
                remainHtml = `<div class="countdown" style="margin-top:4px;"><i class="fas fa-hourglass-start"></i> ${remain}</div>`;
            }
            html += `
                <div class="card live-card">
                    <div class="card-header">
                        <span class="plan"><i class="fas fa-mobile-alt"></i> ${o.plan}</span>
                        <span class="status ${statusClass}">${statusText}</span>
                    </div>
                    <div><span class="phone-mask"><i class="fas fa-phone"></i> ${maskPhone(o.phone)}</span>  <span class="price">${o.price.toLocaleString()}K</span></div>
                    <div class="date"><i class="fas fa-clock"></i> ${new Date(o.created_at).toLocaleTimeString()}</div>
                    ${remainHtml}
                </div>
            `;
        }
        container.innerHTML = html;
    }

    async function refreshData() {
        if(!currentSearchPhone) {
            let live = await fetchLiveOrders("");
            liveOrders = live;
            renderLiveFeed(liveOrders);
            document.getElementById('myOrdersContainer').innerHTML = '<div class="empty"><i class="fas fa-search"></i> ဖုန်းနံပါတ်ရှာပါ</div>';
            document.getElementById('myCount').innerText = "0";
            return;
        }
        let my = await fetchMyOrders(currentSearchPhone);
        let live = await fetchLiveOrders(currentSearchPhone);
        renderMyPlans(my, currentSearchPhone);
        renderLiveFeed(live);
    }

    function startAutoRefresh() {
        if(autoInterval) clearInterval(autoInterval);
        if(timerInterval) clearInterval(timerInterval);
        let sec = 30;
        const timerSpan = document.getElementById('liveTimer');
        const updateTimer = () => {
            if(timerSpan) timerSpan.innerText = `auto ${sec}s`;
            sec--;
            if(sec < 0) sec = 30;
        };
        timerInterval = setInterval(updateTimer, 1000);
        autoInterval = setInterval(async () => {
            if(currentSearchPhone) {
                let live = await fetchLiveOrders(currentSearchPhone);
                liveOrders = live;
                renderLiveFeed(live);
            } else {
                let live = await fetchLiveOrders("");
                liveOrders = live;
                renderLiveFeed(live);
            }
            sec = 30;
            if(timerSpan) timerSpan.innerText = `auto 30s`;
        }, 30000);
    }

    async function searchPhone() {
        let input = document.getElementById('searchPhone').value.trim();
        if(input === "") {
            currentSearchPhone = "";
            await refreshData();
            return;
        }
        if(input.length < 9) {
            alert("ဖုန်းနံပါတ် မှန်ကန်စွာထည့်ပါ (09xxxxxxxxx)");
            return;
        }
        currentSearchPhone = input;
        await refreshData();
    }
    function clearSearch() {
        document.getElementById('searchPhone').value = "";
        currentSearchPhone = "";
        refreshData();
    }

    document.getElementById('searchBtn').addEventListener('click', searchPhone);
    document.getElementById('clearBtn').addEventListener('click', clearSearch);
    document.getElementById('searchPhone').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') searchPhone();
    });

    (async () => {
        startAutoRefresh();
        let live = await fetchLiveOrders("");
        liveOrders = live;
        renderLiveFeed(live);
        document.getElementById('myOrdersContainer').innerHTML = '<div class="empty"><i class="fas fa-search"></i> ဖုန်းနံပါတ်ရှာပါ</div>';
    })();
</script>
</body>
</html>
