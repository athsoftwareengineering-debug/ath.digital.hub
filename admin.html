<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Admin Panel | ATH DIGITAL HUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #030712;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 2rem;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(6,182,212,0.3);
        }
        h1 { font-family: 'Space Grotesk', sans-serif; color: #06b6d4; }
        .header-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .refresh-btn {
            background: rgba(6,182,212,0.15);
            border: 1px solid rgba(6,182,212,0.4);
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            color: #06b6d4;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .refresh-btn:hover { background: #06b6d4; color: #030712; }
        .logout-btn {
            background: rgba(244,63,94,0.2);
            border: 1px solid rgba(244,63,94,0.4);
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            color: #fb7185;
        }
        .auto-refresh-status {
            font-size: 0.7rem;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 1rem;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .stat-card {
            background: rgba(17,24,39,0.75);
            border-radius: 24px;
            padding: 1rem 1.5rem;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .orders-table {
            background: rgba(17,24,39,0.5);
            border-radius: 24px;
            overflow-x: auto;
            padding: 1rem;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
        th { color: #06b6d4; font-weight: 600; }
        .status-pending { background: rgba(245,158,11,0.2); color: #fbbf24; padding: 4px 8px; border-radius: 20px; font-size: 0.7rem; display: inline-block; }
        .status-approved { background: rgba(16,185,129,0.2); color: #34d399; padding: 4px 8px; border-radius: 20px; font-size: 0.7rem; display: inline-block; }
        .status-rejected { background: rgba(244,63,94,0.2); color: #fb7185; padding: 4px 8px; border-radius: 20px; font-size: 0.7rem; display: inline-block; }
        .btn-approve { background: #10b981; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; color: white; margin-right: 5px; }
        .btn-reject { background: #f43f5e; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; color: white; }
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(17,24,39,0.9);
            border-radius: 32px;
            padding: 2rem;
            text-align: center;
            border: 1px solid rgba(6,182,212,0.3);
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 60px;
            color: white;
        }
        .login-btn {
            background: #06b6d4;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
        }
        .loading { text-align: center; padding: 2rem; color: #94a3b8; }
        .last-update {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 1rem;
            text-align: center;
        }
        @media (max-width: 768px) { th, td { font-size: 0.75rem; padding: 8px; } body { padding: 1rem; } }
    </style>
</head>
<body>
<div id="app">
    <div class="container" id="adminContent" style="display: none;">
        <div class="header">
            <h1><i class="fas fa-shield-alt"></i> Admin Panel - ATH DIGITAL HUB</h1>
            <div class="header-buttons">
                <button class="refresh-btn" onclick="manualRefresh()"><i class="fas fa-sync-alt"></i> Refresh Now</button>
                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
        <div class="auto-refresh-status">
            <i class="fas fa-clock"></i> Auto-refresh every 30 seconds <span id="countdownTimer">(30s)</span>
        </div>
        <div class="stats" id="stats"></div>
        <div class="orders-table">
            <h3 style="margin-bottom: 1rem;"><i class="fas fa-list-ul"></i> All Orders</h3>
            <div id="ordersList"><div class="loading"><i class="fas fa-spinner fa-pulse"></i> Loading orders...</div></div>
        </div>
        <div class="last-update" id="lastUpdate"></div>
    </div>
    <div id="loginBox" class="login-box">
        <i class="fas fa-lock" style="font-size: 3rem; color: #06b6d4;"></i>
        <h2 style="margin: 1rem 0;">Admin Login</h2>
        <input type="password" id="adminPassword" placeholder="Enter Admin Password">
        <button class="login-btn" onclick="login()">Login</button>
    </div>
</div>
<script>
    const API_BASE = window.location.origin;
    let token = localStorage.getItem('adminToken');
    let autoRefreshInterval = null;
    let countdownInterval = null;
    let secondsLeft = 30;

    function updateCountdownDisplay() {
        const timerElement = document.getElementById('countdownTimer');
        if (timerElement) timerElement.innerText = `(${secondsLeft}s)`;
    }

    function startCountdown() {
        if (countdownInterval) clearInterval(countdownInterval);
        secondsLeft = 30;
        updateCountdownDisplay();
        countdownInterval = setInterval(() => {
            secondsLeft--;
            updateCountdownDisplay();
            if (secondsLeft <= 0) secondsLeft = 30;
        }, 1000);
    }

    function startAutoRefresh() {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        startCountdown();
        autoRefreshInterval = setInterval(() => {
            if (token === 'logged_in' && document.getElementById('adminContent').style.display !== 'none') {
                loadOrders();
                secondsLeft = 30;
                updateCountdownDisplay();
            }
        }, 30000);
    }

    async function login() {
        const password = document.getElementById('adminPassword').value;
        const res = await fetch(`${API_BASE}/api/admin/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('adminToken', 'logged_in');
            token = 'logged_in';
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            loadOrders();
            startAutoRefresh();
        } else {
            alert('Invalid password!');
        }
    }

    function logout() {
        localStorage.removeItem('adminToken');
        token = null;
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        if (countdownInterval) clearInterval(countdownInterval);
        document.getElementById('loginBox').style.display = 'block';
        document.getElementById('adminContent').style.display = 'none';
    }

    function manualRefresh() {
        if (token === 'logged_in') {
            loadOrders();
            secondsLeft = 30;
            updateCountdownDisplay();
            showToast('🔄 Refreshed manually!');
        }
    }

    async function loadOrders() {
        try {
            const res = await fetch(`${API_BASE}/api/admin/orders`);
            const data = await res.json();
            if (data.orders) {
                renderOrders(data.orders);
                updateStats(data.orders);
                document.getElementById('lastUpdate').innerHTML = `<i class="fas fa-clock"></i> Last updated: ${new Date().toLocaleString()}`;
            }
        } catch(e) {
            console.error(e);
            document.getElementById('ordersList').innerHTML = '<div class="loading">Error loading orders</div>';
        }
    }

    function renderOrders(orders) {
        if (!orders || orders.length === 0) {
            document.getElementById('ordersList').innerHTML = '<div class="loading">No orders found</div>';
            return;
        }
        let html = '<table><thead><tr><th>ID</th><th>Phone</th><th>Plan</th><th>Price</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead><tbody>';
        for (const order of orders) {
            let statusClass = '';
            if (order.status === 'Pending') statusClass = 'status-pending';
            else if (order.status === 'Approved') statusClass = 'status-approved';
            else statusClass = 'status-rejected';
            const dateStr = new Date(order.created_at).toLocaleString();
            html += `<tr>
                <td>${order.id}</td>
                <td>${order.phone}</td>
                <td>${order.plan}</td>
                <td>${order.price.toLocaleString()} KS}</td>
                <td><span class="${statusClass}">${order.status}</span></td>
                <td>${dateStr}</td>
                <td>
                    ${order.status === 'Pending' ? `
                        <button class="btn-approve" onclick="approveOrder(${order.id})">✓ Approve</button>
                        <button class="btn-reject" onclick="rejectOrder(${order.id})">✗ Reject</button>
                    ` : '-'}
                </td>
            </tr>`;
        }
        html += '</tbody></table>';
        document.getElementById('ordersList').innerHTML = html;
    }

    function updateStats(orders) {
        const total = orders.length;
        const pending = orders.filter(o => o.status === 'Pending').length;
        const approved = orders.filter(o => o.status === 'Approved').length;
        const rejected = orders.filter(o => o.status === 'Rejected').length;
        document.getElementById('stats').innerHTML = `
            <div class="stat-card"><i class="fas fa-shopping-cart"></i> Total Orders: ${total}</div>
            <div class="stat-card"><i class="fas fa-clock" style="color:#fbbf24;"></i> Pending: ${pending}</div>
            <div class="stat-card"><i class="fas fa-check-circle" style="color:#34d399;"></i> Approved: ${approved}</div>
            <div class="stat-card"><i class="fas fa-times-circle" style="color:#fb7185;"></i> Rejected: ${rejected}</div>
        `;
    }

    async function approveOrder(id) {
        const res = await fetch(`${API_BASE}/api/admin/orders/${id}/approve`, { method: 'PUT' });
        if (res.ok) { showToast('✅ Order approved!'); loadOrders(); }
        else alert('Error approving order');
    }

    async function rejectOrder(id) {
        const res = await fetch(`${API_BASE}/api/admin/orders/${id}/reject`, { method: 'PUT' });
        if (res.ok) { showToast('❌ Order rejected'); loadOrders(); }
        else alert('Error rejecting order');
    }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.right = '20px';
        toast.style.background = '#10b981';
        toast.style.color = '#030712';
        toast.style.padding = '12px 24px';
        toast.style.borderRadius = '60px';
        toast.style.fontWeight = 'bold';
        toast.style.zIndex = '9999';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    window.approveOrder = approveOrder;
    window.rejectOrder = rejectOrder;
    window.logout = logout;
    window.manualRefresh = manualRefresh;

    if (token === 'logged_in') {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        loadOrders();
        startAutoRefresh();
    }
</script>
</body>
</html>
