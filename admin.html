<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Admin Panel | ATH DIGITAL HUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deep: #0a0c15;
            --cyan: #00d4ff;
            --emerald: #10b981;
            --rose: #f43f5e;
            --amber: #f59e0b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }
        body {
            background: #0a0c15;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 12px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 85% 70%, rgba(0, 212, 255, 0.1) 0%, transparent 60%);
            z-index: -2;
        }
        
        .container { max-width: 800px; margin: 0 auto; }
        
        /* Header */
        .header {
            backdrop-filter: blur(20px);
            background: rgba(10, 12, 21, 0.7);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 1.5rem;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-size: 1.2rem;
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, #fff, var(--cyan));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sync-status {
            background: rgba(0,212,255,0.15);
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        /* Tab Bar */
        .tab-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            background: rgba(18,22,35,0.8);
            padding: 6px;
            border-radius: 60px;
            backdrop-filter: blur(10px);
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 0;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--cyan);
            color: #030712;
            box-shadow: 0 0 10px rgba(0,212,255,0.3);
        }
        
        /* Stats Cards Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: linear-gradient(145deg, rgba(18,22,35,0.9), rgba(10,12,21,0.95));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1rem;
            padding: 10px;
            text-align: center;
        }
        .stat-number {
            font-size: 1.3rem;
            font-weight: 800;
            font-family: 'Space Grotesk', monospace;
            color: var(--cyan);
        }
        .stat-label {
            font-size: 0.55rem;
            color: var(--text-secondary);
            margin-top: 3px;
        }
        .stat-number.profit { color: var(--emerald); }
        
        /* Filter Bar */
        .filter-bar {
            background: rgba(18, 22, 35, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,212,255,0.15);
            border-radius: 1rem;
            padding: 12px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: space-between;
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex: 1;
        }
        .filter-input {
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 40px;
            padding: 8px 12px;
            color: white;
            font-size: 0.7rem;
            flex: 1;
            min-width: 100px;
        }
        .filter-input:focus { border-color: var(--cyan); outline: none; }
        .filter-btn {
            background: rgba(0,212,255,0.15);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
            font-weight: 500;
        }
        .filter-btn:hover { background: var(--cyan); color: #030712; }
        
        /* Search Bar */
        .search-bar {
            background: rgba(18, 22, 35, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,212,255,0.15);
            border-radius: 1rem;
            padding: 12px;
            margin-bottom: 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-input {
            flex: 1;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 40px;
            padding: 10px 16px;
            color: white;
            font-size: 0.8rem;
        }
        .search-input:focus { border-color: var(--cyan); outline: none; }
        .search-btn {
            background: rgba(0,212,255,0.15);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .search-btn:hover { background: var(--cyan); color: #030712; }
        .clear-search {
            background: #334155;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        
        /* Orders Cards List - Card Layout for Mobile */
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }
        .order-card {
            background: linear-gradient(145deg, rgba(18,22,35,0.85), rgba(10,12,21,0.9));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,212,255,0.1);
            border-radius: 1.2rem;
            padding: 14px;
            transition: all 0.2s;
        }
        .order-card:hover { border-color: rgba(0,212,255,0.3); transform: translateX(3px); }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .order-id {
            font-family: monospace;
            font-size: 0.7rem;
            background: rgba(0,212,255,0.1);
            padding: 3px 8px;
            border-radius: 20px;
            color: var(--cyan);
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 700;
        }
        .status-pending { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .status-approved { background: rgba(16,185,129,0.2); color: #34d399; }
        .status-rejected { background: rgba(244,63,94,0.2); color: #fb7185; }
        
        .order-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }
        .order-label {
            font-size: 0.6rem;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .order-value {
            font-size: 0.8rem;
            font-weight: 600;
        }
        .order-value.price { color: var(--emerald); }
        
        .order-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
            flex-wrap: wrap;
        }
        .action-btn {
            flex: 1;
            border: none;
            padding: 8px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .action-btn.approve { background: #10b981; color: white; }
        .action-btn.reject { background: #f43f5e; color: white; }
        .action-btn.delete { background: #475569; color: white; }
        .screenshot-btn {
            background: rgba(0,212,255,0.15);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--cyan);
        }
        
        /* Users Cards List */
        .users-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }
        .user-card {
            background: linear-gradient(145deg, rgba(18,22,35,0.85), rgba(10,12,21,0.9));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,212,255,0.1);
            border-radius: 1.2rem;
            padding: 14px;
        }
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .user-phone {
            font-family: monospace;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .user-status {
            font-size: 0.6rem;
            padding: 3px 8px;
            border-radius: 40px;
        }
        .user-status.suspect { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .user-status.blocked { background: rgba(244,63,94,0.2); color: #fb7185; }
        .user-status.normal { background: rgba(16,185,129,0.2); color: #34d399; }
        
        .user-stats {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .user-stat {
            text-align: center;
            flex: 1;
        }
        .user-stat-value {
            font-size: 1rem;
            font-weight: 700;
        }
        .user-stat-label {
            font-size: 0.55rem;
            color: #64748b;
        }
        .reject-rate.high { color: var(--rose); }
        .reject-rate.medium { color: var(--amber); }
        
        .user-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .user-action-btn {
            flex: 1;
            padding: 6px;
            border-radius: 40px;
            font-size: 0.65rem;
            cursor: pointer;
            font-weight: 500;
            border: none;
        }
        .user-action-btn.block { background: rgba(244,63,94,0.2); color: #fb7185; }
        .user-action-btn.unblock { background: rgba(16,185,129,0.2); color: #34d399; }
        .user-action-btn.clear { background: rgba(0,212,255,0.15); color: var(--cyan); }
        
        /* Bottom Status Bar */
        .bottom-status {
            background: rgba(18,22,35,0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,212,255,0.15);
            border-radius: 1rem;
            padding: 8px 12px;
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.6rem;
            color: #64748b;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f43f5e;
            animation: liveBlink 1s step-end infinite;
            display: inline-block;
            margin-right: 4px;
        }
        @keyframes liveBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* Floating Action Buttons */
        .fab-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }
        .fab {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--cyan), #0891b2);
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,212,255,0.4);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fab:hover { transform: scale(1.05); }
        .fab.logout { background: linear-gradient(135deg, #f43f5e, #e11d48); box-shadow: 0 4px 15px rgba(244,63,94,0.4); }
        
        /* Screenshot Modal */
        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s;
        }
        .image-modal.active {
            visibility: visible;
            opacity: 1;
        }
        .image-modal-content {
            max-width: 90%;
            max-height: 90%;
            background: rgba(18,22,35,0.95);
            border-radius: 24px;
            padding: 10px;
            border: 1px solid rgba(0,212,255,0.5);
        }
        .image-modal-content img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 16px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(0,212,255,0.2);
        }
        .close-modal {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .login-box {
            max-width: 350px;
            margin: 80px auto;
            background: linear-gradient(145deg, rgba(18,22,35,0.95), rgba(10,12,21,0.98));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0,212,255,0.4);
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 60px;
            color: white;
        }
        .login-btn {
            background: linear-gradient(135deg, var(--cyan), #0891b2);
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
        }
        
        .loading { text-align: center; padding: 2rem; color: #64748b; }
        .empty-msg { text-align: center; padding: 2rem; color: #64748b; }
        .hidden { display: none; }
        
        .search-result-badge {
            background: rgba(0,212,255,0.1);
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="container" id="adminContent" style="display: none;">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-crown"></i> ATH Admin</h1>
            <div class="sync-status">
                <span class="sync-dot"></span>
                <span id="autoSyncTimer">Auto Sync: 30s</span>
            </div>
        </div>
        
        <!-- Tab Bar -->
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="orders"><i class="fas fa-list-ul"></i> Orders</button>
            <button class="tab-btn" data-tab="users"><i class="fas fa-users"></i> Users</button>
        </div>
        
        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="totalOrders">0</div><div class="stat-label">Total</div></div>
            <div class="stat-card"><div class="stat-number" id="pendingOrders">0</div><div class="stat-label">Pending</div></div>
            <div class="stat-card"><div class="stat-number" id="approvedOrders">0</div><div class="stat-label">Approved</div></div>
            <div class="stat-card"><div class="stat-number profit" id="totalProfit">0</div><div class="stat-label">Profit (K)</div></div>
        </div>
        
        <!-- Search Bar -->
        <div class="search-bar">
            <input type="tel" id="searchPhoneInput" class="search-input" placeholder="🔍 Search by phone number (09xxxxxxxxx)">
            <button class="search-btn" onclick="searchByPhone()"><i class="fas fa-search"></i> Search</button>
            <button class="clear-search" onclick="clearSearch()"><i class="fas fa-times"></i> Clear</button>
        </div>
        
        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <input type="date" id="startDate" class="filter-input" placeholder="Start">
                <input type="date" id="endDate" class="filter-input" placeholder="End">
                <select id="statusFilter" class="filter-input">
                    <option value="all">All</option>
                    <option value="Pending">Pending</option>
                    <option value="Approved">Approved</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>
            <div>
                <button class="filter-btn" onclick="applyFilters()"><i class="fas fa-filter"></i> Filter</button>
                <button class="filter-btn reset" onclick="clearFilters()" style="background:#334155;"><i class="fas fa-undo"></i></button>
            </div>
        </div>
        
        <!-- Orders Tab - Card Layout -->
        <div id="ordersTab">
            <div class="orders-list" id="ordersList">
                <div class="loading"><i class="fas fa-spinner fa-pulse"></i> Loading orders...</div>
            </div>
        </div>
        
        <!-- Users Tab -->
        <div id="usersTab" class="hidden">
            <div class="users-list" id="usersList">
                <div class="loading"><i class="fas fa-spinner fa-pulse"></i> Loading users...</div>
            </div>
        </div>
        
        <!-- Bottom Status Bar -->
        <div class="bottom-status">
            <span><span class="live-dot"></span> LIVE</span>
            <span><i class="fas fa-sync-alt"></i> 30s auto sync</span>
            <span id="orderCountSpan"><i class="fas fa-shopping-cart"></i> 0 orders</span>
        </div>
    </div>
    
    <!-- Floating Action Buttons -->
    <div class="fab-container" id="fabContainer" style="display: none;">
        <button class="fab" onclick="manualRefresh()" title="Sync Now"><i class="fas fa-sync-alt"></i></button>
        <button class="fab" onclick="window.location.href='/'" title="Go to Store"><i class="fas fa-store"></i></button>
        <button class="fab logout" onclick="logout()" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
    </div>
    
    <div id="loginBox" class="login-box">
        <i class="fas fa-lock" style="font-size: 2rem; color: var(--cyan); margin-bottom: 1rem;"></i>
        <h2>Admin Access</h2>
        <input type="password" id="adminPassword" placeholder="Enter Password">
        <button class="login-btn" onclick="login()"><i class="fas fa-unlock-alt"></i> Login</button>
    </div>
</div>

<!-- Screenshot Modal -->
<div id="screenshotModal" class="image-modal" onclick="closeModal()">
    <div class="image-modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span><i class="fas fa-image"></i> Payment Screenshot</span>
            <button class="close-modal" onclick="closeModal()">&times;</button>
        </div>
        <img id="modalImage" src="" alt="Screenshot">
    </div>
</div>

<script>
    const API_BASE = window.location.origin;
    let token = localStorage.getItem('adminToken');
    let allOrders = [];
    let userStats = [];
    let autoSyncInterval = null, countdownInterval = null;
    let secondsLeft = 30;
    let currentSearchPhone = "";
    let currentTab = "orders";
    
    const costPriceMap = {
        "VIP LEVEL - 1": 14500,
        "VIP LEVEL - 2": 19500,
        "VIP LEVEL - 3": 24500,
        "VIP LEVEL - 4 (ULTRA)": 29000
    };
    
    function getCostPrice(plan) { return costPriceMap[plan] || 0; }
    function getProfit(price, plan) { return price - getCostPrice(plan); }
    
    function maskPhone(phone) {
        if (!phone || phone.length < 8) return phone || '';
        return phone.substring(0, 5) + '***' + phone.substring(phone.length - 3);
    }
    
    async function login() {
        const password = document.getElementById('adminPassword').value;
        const res = await fetch(`${API_BASE}/api/admin/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('adminToken', 'logged_in'); token = 'logged_in';
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            document.getElementById('fabContainer').style.display = 'flex';
            loadAllData(); startAutoSync();
        } else { alert('Invalid Password'); }
    }
    
    function logout() { stopAutoSync(); localStorage.removeItem('adminToken'); token = null; location.reload(); }
    
    async function loadAllData() {
        await loadOrders();
        await loadUserStats();
    }
    
    async function loadOrders() {
        try {
            const res = await fetch(`${API_BASE}/api/admin/orders`);
            const data = await res.json();
            if (data.orders) { allOrders = data.orders; applyFiltersAndRender(); }
        } catch(e) { document.getElementById('ordersList').innerHTML = '<div class="loading">Connection Error</div>'; }
    }
    
    async function loadUserStats() {
        try {
            const res = await fetch(`${API_BASE}/api/admin/user-stats`);
            const data = await res.json();
            if (data.stats) { userStats = data.stats; renderUsersTab(); }
        } catch(e) { console.error('Error loading user stats:', e); }
    }
    
    async function blockUser(phone, block) {
        const res = await fetch(`${API_BASE}/api/admin/user-block`, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, block })
        });
        if (res.ok) { loadUserStats(); showToast(block ? '✅ User blocked' : '✅ User unblocked'); }
        else alert('Error');
    }
    
    async function clearSuspectFlag(phone) {
        const res = await fetch(`${API_BASE}/api/admin/clear-suspect`, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone })
        });
        if (res.ok) { loadUserStats(); showToast('✅ Suspect flag cleared'); }
        else alert('Error');
    }
    
    function updateStats(orders) {
        const total = orders.length;
        const pending = orders.filter(o => o.status === 'Pending');
        const approved = orders.filter(o => o.status === 'Approved');
        const profit = approved.reduce((s, o) => s + getProfit(o.price, o.plan), 0);
        
        document.getElementById('totalOrders').innerHTML = total;
        document.getElementById('pendingOrders').innerHTML = pending.length;
        document.getElementById('approvedOrders').innerHTML = approved.length;
        document.getElementById('totalProfit').innerHTML = profit.toLocaleString();
        document.getElementById('orderCountSpan').innerHTML = `<i class="fas fa-shopping-cart"></i> ${total} orders`;
    }
    
    function renderUsersTab() {
        const container = document.getElementById('usersList');
        if (!userStats.length) {
            container.innerHTML = '<div class="empty-msg">No user data available</div>';
            return;
        }
        
        let html = '';
        for (const user of userStats) {
            const rejectRate = user.order_count > 0 ? ((user.reject_count / user.order_count) * 100).toFixed(0) : 0;
            let rateClass = '';
            if (rejectRate >= 50) rateClass = 'high';
            else if (rejectRate >= 30) rateClass = 'medium';
            
            let statusClass = 'normal';
            let statusText = '🟢 Normal';
            if (user.blocked) { statusClass = 'blocked'; statusText = '🔴 Blocked'; }
            else if (user.suspect_flag) { statusClass = 'suspect'; statusText = '🟡 Suspect'; }
            
            html += `
                <div class="user-card">
                    <div class="user-header">
                        <span class="user-phone">📞 ${maskPhone(user.phone)}</span>
                        <span class="user-status ${statusClass}">${statusText}</span>
                    </div>
                    <div class="user-stats">
                        <div class="user-stat">
                            <div class="user-stat-value">${user.order_count || 0}</div>
                            <div class="user-stat-label">Orders</div>
                        </div>
                        <div class="user-stat">
                            <div class="user-stat-value ${rejectRate >= 50 ? 'high' : (rejectRate >= 30 ? 'medium' : '')}">${user.reject_count || 0}</div>
                            <div class="user-stat-label">Rejected</div>
                        </div>
                        <div class="user-stat">
                            <div class="user-stat-value reject-rate ${rateClass}">${rejectRate}%</div>
                            <div class="user-stat-label">Reject Rate</div>
                        </div>
                    </div>
                    <div class="user-actions">
                        ${!user.blocked ? `<button class="user-action-btn block" onclick="blockUser('${user.phone}', true)"><i class="fas fa-ban"></i> Block</button>` : `<button class="user-action-btn unblock" onclick="blockUser('${user.phone}', false)"><i class="fas fa-check"></i> Unblock</button>`}
                        ${user.suspect_flag ? `<button class="user-action-btn clear" onclick="clearSuspectFlag('${user.phone}')"><i class="fas fa-flag"></i> Clear Flag</button>` : ''}
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }
    
    function applyFiltersAndRender() {
        let filtered = [...allOrders];
        
        if (currentSearchPhone) {
            filtered = filtered.filter(o => o.phone === currentSearchPhone);
        }
        
        const status = document.getElementById('statusFilter').value;
        if (status !== 'all') filtered = filtered.filter(o => o.status === status);
        
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        if (startDate) { const start = new Date(startDate); start.setHours(0,0,0,0); filtered = filtered.filter(o => new Date(o.created_at) >= start); }
        if (endDate) { const end = new Date(endDate); end.setHours(23,59,59,999); filtered = filtered.filter(o => new Date(o.created_at) <= end); }
        
        renderOrders(filtered);
        updateStats(filtered);
        
        if (currentSearchPhone) {
            if (!document.getElementById('searchResultMsg')) {
                const msgDiv = document.createElement('div');
                msgDiv.id = 'searchResultMsg';
                msgDiv.className = 'search-result-badge';
                msgDiv.style.marginBottom = '12px';
                document.querySelector('.filter-bar').after(msgDiv);
            }
            document.getElementById('searchResultMsg').innerHTML = `<i class="fas fa-phone-alt"></i> Phone: ${maskPhone(currentSearchPhone)} | Found: ${filtered.length} order(s)`;
        } else {
            if (document.getElementById('searchResultMsg')) {
                document.getElementById('searchResultMsg').remove();
            }
        }
    }
    
    function renderOrders(orders) {
        const container = document.getElementById('ordersList');
        if (!orders || orders.length === 0) { 
            container.innerHTML = '<div class="loading">No orders found</div>'; 
            return; 
        }
        
        let html = '';
        for (const o of orders) {
            let statusClass = o.status === 'Pending' ? 'status-pending' : (o.status === 'Approved' ? 'status-approved' : 'status-rejected');
            let statusText = o.status === 'Pending' ? '⏳ Pending' : (o.status === 'Approved' ? '✅ Approved' : '❌ Rejected');
            
            html += `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-id"><i class="fas fa-hashtag"></i> ${o.id}</span>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                    <div class="order-row">
                        <span class="order-label"><i class="fas fa-mobile-alt"></i> Phone</span>
                        <span class="order-value">${maskPhone(o.phone)}</span>
                    </div>
                    <div class="order-row">
                        <span class="order-label"><i class="fas fa-tag"></i> Plan</span>
                        <span class="order-value">${o.plan}</span>
                    </div>
                    <div class="order-row">
                        <span class="order-label"><i class="fas fa-coins"></i> Price</span>
                        <span class="order-value price">${o.price.toLocaleString()} KS</span>
                    </div>
                    <div class="order-row">
                        <span class="order-label"><i class="fas fa-calendar"></i> Date</span>
                        <span class="order-value" style="font-size:0.7rem;">${new Date(o.created_at).toLocaleString()}</span>
                    </div>
                    <div class="order-row">
                        <span class="order-label"><i class="fas fa-chart-line"></i> Profit</span>
                        <span class="order-value price">${getProfit(o.price, o.plan).toLocaleString()} KS</span>
                    </div>
                    <div class="order-actions">
                        ${o.slip_url ? `<button class="screenshot-btn" onclick="openScreenshot('${o.slip_url}')"><i class="fas fa-image"></i> Slip</button>` : '<span style="font-size:0.6rem;color:#64748b;">No slip</span>'}
                        ${o.status === 'Pending' ? `
                            <button class="action-btn approve" onclick="approveOrder(${o.id})"><i class="fas fa-check"></i> Approve</button>
                            <button class="action-btn reject" onclick="rejectOrder(${o.id})"><i class="fas fa-times"></i> Reject</button>
                        ` : ''}
                        <button class="action-btn delete" onclick="deleteOrder(${o.id})"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }
    
    function searchByPhone() {
        const phone = document.getElementById('searchPhoneInput').value.trim();
        if (!phone) {
            alert('Please enter a phone number');
            return;
        }
        currentSearchPhone = phone;
        applyFiltersAndRender();
    }
    
    function clearSearch() {
        currentSearchPhone = "";
        document.getElementById('searchPhoneInput').value = "";
        applyFiltersAndRender();
    }
    
    function applyFilters() { applyFiltersAndRender(); }
    function clearFilters() {
        document.getElementById('startDate').value = '';
        document.getElementById('endDate').value = '';
        document.getElementById('statusFilter').value = 'all';
        applyFiltersAndRender();
    }
    
    async function approveOrder(id) { const res = await fetch(`${API_BASE}/api/admin/orders/${id}/approve`, { method: 'PUT' }); if (res.ok) { showToast('✅ Approved'); loadOrders(); } else alert('Error'); }
    async function rejectOrder(id) { const res = await fetch(`${API_BASE}/api/admin/orders/${id}/reject`, { method: 'PUT' }); if (res.ok) { showToast('❌ Rejected'); loadOrders(); loadUserStats(); } else alert('Error'); }
    async function deleteOrder(id) { if (confirm('Delete this order?')) { const res = await fetch(`${API_BASE}/api/admin/orders/${id}`, { method: 'DELETE' }); if (res.ok) { showToast('🗑 Deleted'); loadOrders(); } else alert('Error'); } }
    
    function openScreenshot(url) { const modal = document.getElementById('screenshotModal'); const img = document.getElementById('modalImage'); img.src = url.startsWith('/') ? API_BASE + url : url; modal.classList.add('active'); }
    function closeModal() { document.getElementById('screenshotModal').classList.remove('active'); }
    function manualRefresh() { loadAllData(); showToast('🔄 Synced'); secondsLeft = 30; updateCountdown(); }
    function showToast(msg) { const t = document.createElement('div'); t.style.cssText = 'position:fixed;bottom:80px;right:20px;background:#10b981;color:#030712;padding:8px 16px;border-radius:60px;font-size:0.8rem;font-weight:bold;z-index:9999'; t.innerHTML = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }
    
    function startAutoSync() {
        if (autoSyncInterval) clearInterval(autoSyncInterval);
        if (countdownInterval) clearInterval(countdownInterval);
        secondsLeft = 30; updateCountdown();
        countdownInterval = setInterval(() => { secondsLeft--; if (secondsLeft < 0) secondsLeft = 30; updateCountdown(); }, 1000);
        autoSyncInterval = setInterval(() => { if (token === 'logged_in') { loadAllData(); secondsLeft = 30; updateCountdown(); } }, 30000);
    }
    function stopAutoSync() { if (autoSyncInterval) clearInterval(autoSyncInterval); if (countdownInterval) clearInterval(countdownInterval); }
    function updateCountdown() { const el = document.getElementById('autoSyncTimer'); if (el) el.innerHTML = `Auto Sync: ${secondsLeft}s`; }
    
    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTab = btn.dataset.tab;
            if (currentTab === 'orders') {
                document.getElementById('ordersTab').classList.remove('hidden');
                document.getElementById('usersTab').classList.add('hidden');
                applyFiltersAndRender();
            } else {
                document.getElementById('ordersTab').classList.add('hidden');
                document.getElementById('usersTab').classList.remove('hidden');
                loadUserStats();
            }
        });
    });
    
    document.getElementById('screenshotModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
    document.getElementById('searchPhoneInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') searchByPhone(); });
    
    window.approveOrder = approveOrder; window.rejectOrder = rejectOrder; window.deleteOrder = deleteOrder; window.logout = logout;
    window.applyFilters = applyFilters; window.clearFilters = clearFilters; window.openScreenshot = openScreenshot; window.manualRefresh = manualRefresh;
    window.searchByPhone = searchByPhone; window.clearSearch = clearSearch;
    window.blockUser = blockUser; window.clearSuspectFlag = clearSuspectFlag;
    
    if (token === 'logged_in') { document.getElementById('loginBox').style.display = 'none'; document.getElementById('adminContent').style.display = 'block'; document.getElementById('fabContainer').style.display = 'flex'; loadAllData(); startAutoSync(); }
</script>
</body>
</html>
