<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin Panel | ATH DIGITAL HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; }
        :root {
            --bg-deep: #0a0c15;
            --cyan: #00d4ff;
            --emerald: #10b981;
            --rose: #f43f5e;
            --amber: #f59e0b;
            --violet: #8b5cf6;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }
        body {
            background: #0a0c15;
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            padding: 12px;
            padding-bottom: 70px;
        }
        .container { max-width: 700px; margin: 0 auto; }
        
        /* Sales Hours Card */
        .sales-hours-card {
            background: linear-gradient(145deg, rgba(18,22,35,0.9), rgba(10,12,21,0.95));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,212,255,0.15);
            border-radius: 1.2rem;
            padding: 12px;
            margin-bottom: 16px;
        }
        .sales-hours-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--cyan);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sales-hours-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 34px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .toggle-slider {
            background: linear-gradient(135deg, var(--cyan), #0891b2);
        }
        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }
        .hour-select {
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 40px;
            padding: 6px 12px;
            color: white;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .sales-status {
            font-size: 0.7rem;
            padding: 10px;
            border-radius: 40px;
            text-align: center;
            margin-top: 12px;
            font-weight: 500;
        }
        .sales-status.open {
            background: rgba(16,185,129,0.15);
            color: #34d399;
        }
        .sales-status.closed {
            background: rgba(244,63,94,0.15);
            color: #fb7185;
        }
        
        /* Mode Buttons */
        .mode-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 16px;
        }
        .mode-btn {
            padding: 6px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            border: none;
        }
        .mode-btn.auto {
            background: linear-gradient(135deg, var(--cyan), #0891b2);
            color: white;
        }
        .mode-btn.manual {
            background: rgba(0,212,255,0.2);
            color: var(--cyan);
            border: 1px solid rgba(0,212,255,0.3);
        }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
        .stat-card {
            background: linear-gradient(145deg, rgba(18,22,35,0.9), rgba(10,12,21,0.95));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1.2rem;
            padding: 12px;
            text-align: center;
        }
        .stat-number { font-size: 1.5rem; font-weight: 800; font-family: monospace; color: var(--cyan); }
        .stat-label { font-size: 0.6rem; color: var(--text-secondary); margin-top: 4px; }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--emerald);
            color: #030712;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 0.8rem;
            z-index: 1000;
            display: none;
            white-space: nowrap;
        }
        
        /* Login Box */
        .login-box {
            max-width: 350px;
            margin: 80px auto;
            background: linear-gradient(145deg, rgba(18,22,35,0.95), rgba(10,12,21,0.98));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0,212,255,0.4);
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 60px;
            color: white;
        }
        .login-btn {
            background: linear-gradient(135deg, var(--cyan), #0891b2);
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
        }
        
        .hidden { display: none; }
        .top-bar { margin-bottom: 16px; text-align: center; }
        .top-bar h2 { color: var(--cyan); }
        
        /* Manual Mode Toggle Row */
        .manual-toggle-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .manual-status-text {
            font-size: 0.7rem;
            font-weight: 600;
        }
        .manual-status-text.open { color: #34d399; }
        .manual-status-text.closed { color: #fb7185; }
        
        /* Auto Mode Controls */
        .auto-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="container" id="adminContent" style="display: none;">
        <div class="top-bar">
            <h2><i class="fas fa-crown"></i> ATH Admin Panel</h2>
        </div>
        
        <!-- Sales Hours Control Card -->
        <div class="sales-hours-card">
            <div class="sales-hours-title">
                <i class="fas fa-clock"></i> ရောင်းချချိန် သတ်မှတ်ချက်
            </div>
            
            <div class="mode-buttons">
                <button id="autoModeBtn" class="mode-btn auto" onclick="setMode('auto')">
                    <i class="fas fa-robot"></i> အလိုအလျောက်မုဒ်
                </button>
                <button id="manualModeBtn" class="mode-btn manual" onclick="setMode('manual')">
                    <i class="fas fa-hand-pointer"></i> လက်ဖြင့်မုဒ်
                </button>
            </div>
            
            <!-- Auto Mode Controls -->
            <div id="autoModeControls" class="auto-controls">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-size: 0.7rem;">ဖွင့်/ပိတ်:</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="salesEnabled" onchange="updateSalesHours()">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 0.7rem;">စတင်ချိန်:</span>
                    <select id="startHour" class="hour-select" onchange="updateSalesHours()">
                        <option value="0">12 ည</option><option value="1">1 နံနက်</option><option value="2">2 နံနက်</option>
                        <option value="3">3 နံနက်</option><option value="4">4 နံနက်</option><option value="5">5 နံနက်</option>
                        <option value="6">6 နံနက်</option><option value="7">7 နံနက်</option><option value="8">8 နံနက်</option>
                        <option value="9" selected>9 နံနက်</option><option value="10">10 နံနက်</option><option value="11">11 နံနက်</option>
                        <option value="12">12 မွန်းတည့်</option><option value="13">1 ညနေ</option><option value="14">2 ညနေ</option>
                        <option value="15">3 ညနေ</option><option value="16">4 ညနေ</option><option value="17">5 ညနေ</option>
                        <option value="18">6 ညနေ</option><option value="19">7 ညနေ</option><option value="20">8 ညနေ</option>
                        <option value="21">9 ညနေ</option><option value="22">10 ညနေ</option><option value="23">11 ညနေ</option>
                    </select>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 0.7rem;">ပိတ်ချိန်:</span>
                    <select id="endHour" class="hour-select" onchange="updateSalesHours()">
                        <option value="0">12 ည</option><option value="1">1 နံနက်</option><option value="2">2 နံနက်</option>
                        <option value="3">3 နံနက်</option><option value="4">4 နံနက်</option><option value="5">5 နံနက်</option>
                        <option value="6">6 နံနက်</option><option value="7">7 နံနက်</option><option value="8">8 နံနက်</option>
                        <option value="9">9 နံနက်</option><option value="10">10 နံနက်</option><option value="11">11 နံနက်</option>
                        <option value="12">12 မွန်းတည့်</option><option value="13">1 ညနေ</option><option value="14">2 ညနေ</option>
                        <option value="15">3 ညနေ</option><option value="16">4 ညနေ</option><option value="17">5 ညနေ</option>
                        <option value="18">6 ညနေ</option><option value="19" selected>7 ညနေ</option><option value="20">8 ညနေ</option>
                        <option value="21">9 ညနေ</option><option value="22">10 ညနေ</option><option value="23">11 ညနေ</option>
                    </select>
                </div>
            </div>
            
            <!-- Manual Mode Controls -->
            <div id="manualModeControls" style="display: none;">
                <div class="manual-toggle-row">
                    <span style="font-size: 0.7rem;">ဆိုင်အခြေအနေ:</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="manualToggle" onchange="toggleManualShop()">
                        <span class="toggle-slider"></span>
                    </label>
                    <span id="manualStatusText" class="manual-status-text closed">🔴 ပိတ်ထား</span>
                </div>
            </div>
            
            <div id="salesStatus" class="sales-status closed">Loading...</div>
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="stat-number" id="totalOrders">0</div><div class="stat-label">စုစုပေါင်း အမိန့်စာ</div></div>
            <div class="stat-card"><div class="stat-number" id="pendingOrders">0</div><div class="stat-label">ဆိုင်းငံ့ထားသော</div></div>
            <div class="stat-card"><div class="stat-number" id="approvedOrders">0</div><div class="stat-label">အတည်ပြုပြီး</div></div>
            <div class="stat-card"><div class="stat-number" id="rejectedOrders">0</div><div class="stat-label">ပယ်ချထားသော</div></div>
        </div>
        
        <div style="text-align: center; padding: 16px;">
            <button onclick="manualRefresh()" style="background: rgba(0,212,255,0.2); border: 1px solid var(--cyan); padding: 8px 20px; border-radius: 40px; color: var(--cyan); cursor: pointer;">
                <i class="fas fa-sync-alt"></i> ဒေတာ Refresh
            </button>
            <button onclick="logout()" style="background: rgba(244,63,94,0.2); border: 1px solid #f43f5e; padding: 8px 20px; border-radius: 40px; color: #fb7185; cursor: pointer; margin-left: 10px;">
                <i class="fas fa-sign-out-alt"></i> ထွက်ရန်
            </button>
        </div>
    </div>
    
    <div id="loginBox" class="login-box">
        <i class="fas fa-lock" style="font-size: 2rem; color: var(--cyan); margin-bottom: 1rem;"></i>
        <h2>အဒ်မင် ဝင်ရောက်ရန်</h2>
        <input type="password" id="adminPassword" placeholder="စကားဝှက် ထည့်သွင်းပါ">
        <button class="login-btn" onclick="login()"><i class="fas fa-unlock-alt"></i> ဝင်ရောက်ရန်</button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    const API_BASE = window.location.origin;
    let token = localStorage.getItem('adminToken');
    
    function showToast(msg, isError) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#f43f5e' : '#10b981';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }
    
    async function login() {
        const password = document.getElementById('adminPassword').value;
        if (!password) {
            showToast('စကားဝှက် ထည့်ပါ', true);
            return;
        }
        try {
            const res = await fetch(`${API_BASE}/api/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password }),
                credentials: 'include'
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('adminToken', 'logged_in');
                token = 'logged_in';
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                loadSalesHours();
                loadStats();
                showToast('ဝင်ရောက်မှု အောင်မြင်ပါသည်');
            } else {
                showToast('စကားဝှက် မှားယွင်းနေသည်', true);
            }
        } catch(e) {
            showToast('ချိတ်ဆက်မှု အမှား', true);
        }
    }
    
    function logout() {
        localStorage.removeItem('adminToken');
        token = null;
        document.getElementById('loginBox').style.display = 'block';
        document.getElementById('adminContent').style.display = 'none';
        showToast('ထွက်ရန် အောင်မြင်ပါသည်');
    }
    
    async function loadStats() {
        try {
            const res = await fetch(`${API_BASE}/api/admin/orders`, { credentials: 'include' });
            if (res.status === 401) return;
            const data = await res.json();
            const orders = data.orders || [];
            const total = orders.length;
            const pending = orders.filter(o => o.status === 'Pending').length;
            const approved = orders.filter(o => o.status === 'Approved').length;
            const rejected = orders.filter(o => o.status === 'Rejected').length;
            
            document.getElementById('totalOrders').innerHTML = total;
            document.getElementById('pendingOrders').innerHTML = pending;
            document.getElementById('approvedOrders').innerHTML = approved;
            document.getElementById('rejectedOrders').innerHTML = rejected;
        } catch(e) {
            console.error('Error loading stats:', e);
        }
    }
    
    function updateManualStatusText(isOpen) {
        const textSpan = document.getElementById('manualStatusText');
        if (textSpan) {
            if (isOpen) {
                textSpan.innerHTML = '🟢 ဖွင့်ထား';
                textSpan.className = 'manual-status-text open';
            } else {
                textSpan.innerHTML = '🔴 ပိတ်ထား';
                textSpan.className = 'manual-status-text closed';
            }
        }
    }
    
    async function loadSalesHours() {
        try {
            const response = await fetch(`${API_BASE}/api/admin/sales-hours`, { credentials: 'include' });
            const data = await response.json();
            if (data.success) {
                const mode = data.salesHours.mode || 'auto';
                const autoBtn = document.getElementById('autoModeBtn');
                const manualBtn = document.getElementById('manualModeBtn');
                
                if (mode === 'auto') {
                    autoBtn.className = 'mode-btn auto';
                    manualBtn.className = 'mode-btn manual';
                    document.getElementById('autoModeControls').style.display = 'flex';
                    document.getElementById('manualModeControls').style.display = 'none';
                } else {
                    autoBtn.className = 'mode-btn manual';
                    manualBtn.className = 'mode-btn auto';
                    document.getElementById('autoModeControls').style.display = 'none';
                    document.getElementById('manualModeControls').style.display = 'block';
                }
                
                document.getElementById('salesEnabled').checked = data.salesHours.enabled;
                document.getElementById('startHour').value = data.salesHours.startHour;
                document.getElementById('endHour').value = data.salesHours.endHour;
                document.getElementById('manualToggle').checked = data.salesHours.manualStatus === true;
                updateManualStatusText(data.salesHours.manualStatus === true);
            }
            updateSalesStatusDisplay();
        } catch(e) { console.error('Error loading sales hours:', e); }
    }
    
    function setMode(mode) {
        const autoBtn = document.getElementById('autoModeBtn');
        const manualBtn = document.getElementById('manualModeBtn');
        
        if (mode === 'auto') {
            autoBtn.className = 'mode-btn auto';
            manualBtn.className = 'mode-btn manual';
            document.getElementById('autoModeControls').style.display = 'flex';
            document.getElementById('manualModeControls').style.display = 'none';
        } else {
            autoBtn.className = 'mode-btn manual';
            manualBtn.className = 'mode-btn auto';
            document.getElementById('autoModeControls').style.display = 'none';
            document.getElementById('manualModeControls').style.display = 'block';
        }
        updateSalesHoursWithMode(mode);
    }
    
    async function toggleManualShop() {
        const isOpen = document.getElementById('manualToggle').checked;
        updateManualStatusText(isOpen);
        await updateSalesHoursWithMode('manual');
    }
    
    async function updateSalesHours() {
        const currentMode = document.getElementById('autoModeControls').style.display === 'flex' ? 'auto' : 'manual';
        await updateSalesHoursWithMode(currentMode);
    }
    
    async function updateSalesHoursWithMode(mode) {
        const enabled = document.getElementById('salesEnabled').checked;
        const startHour = parseInt(document.getElementById('startHour').value);
        const endHour = parseInt(document.getElementById('endHour').value);
        const manualStatus = document.getElementById('manualToggle')?.checked || false;
        
        try {
            const response = await fetch(`${API_BASE}/api/admin/sales-hours`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled, startHour, endHour, mode, manualStatus }),
                credentials: 'include'
            });
            const data = await response.json();
            if (data.success) {
                showToast('✅ ရောင်းချချိန် သတ်မှတ်ချက်ကို ပြင်ဆင်ပြီးပါပြီ။');
                updateSalesStatusDisplay();
            } else {
                showToast('❌ သတ်မှတ်ချက် မအောင်မြင်ပါ။', true);
            }
        } catch(e) {
            showToast('Connection error', true);
        }
    }
    
    async function updateSalesStatusDisplay() {
        try {
            const response = await fetch(`${API_BASE}/api/sales/status`);
            const data = await response.json();
            const statusDiv = document.getElementById('salesStatus');
            if (statusDiv) {
                statusDiv.innerHTML = data.message;
                statusDiv.className = `sales-status ${data.isOpen ? 'open' : 'closed'}`;
            }
        } catch(e) { console.error('Error fetching sales status:', e); }
    }
    
    function manualRefresh() {
        loadStats();
        loadSalesHours();
        showToast('🔄 ဒေတာ Refresh လုပ်ပြီးပါပြီ');
    }
    
    if (token === 'logged_in') {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        loadStats();
        loadSalesHours();
    }
    
    window.login = login;
    window.logout = logout;
    window.setMode = setMode;
    window.toggleManualShop = toggleManualShop;
    window.updateSalesHours = updateSalesHours;
    window.manualRefresh = manualRefresh;
</script>
</body>
</html>
