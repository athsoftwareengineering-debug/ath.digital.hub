<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Admin Panel | ATH DIGITAL HUB | 3D Database</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deep: #0a0c15;
            --card-bg: rgba(18, 22, 35, 0.85);
            --cyan: #00d4ff;
            --violet: #8b5cf6;
            --emerald: #10b981;
            --rose: #f43f5e;
            --amber: #f59e0b;
            --border-light: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --glass-edge: rgba(0, 212, 255, 0.25);
        }
        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 85% 70%, rgba(0, 212, 255, 0.1) 0%, transparent 60%);
            z-index: -2;
        }
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 10px);
            pointer-events: none;
            z-index: -1;
        }
        
        .container { 
            max-width: 1600px; 
            margin: 0 auto; 
            padding: 16px; 
            position: relative; 
            z-index: 2; 
        }
        
        /* Responsive Header */
        .header {
            backdrop-filter: blur(20px);
            background: rgba(10, 12, 21, 0.6);
            border: 1px solid var(--glass-edge);
            border-radius: 1.5rem;
            padding: 0.8rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        @media (min-width: 768px) {
            .header { flex-direction: row; justify-content: space-between; align-items: center; padding: 1rem 2rem; }
            .container { padding: 20px; }
        }
        h1 { 
            font-family: 'Space Grotesk', sans-serif; 
            font-size: 1.4rem;
            background: linear-gradient(135deg, #ffffff, var(--cyan), var(--violet));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        @media (min-width: 768px) { h1 { font-size: 1.8rem; } }
        
        .header-buttons { 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap;
            justify-content: flex-start;
        }
        .glass-btn {
            background: rgba(0,212,255,0.1);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 8px 16px;
            border-radius: 60px;
            cursor: pointer;
            color: var(--cyan);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
        }
        @media (min-width: 768px) { .glass-btn { padding: 10px 24px; font-size: 0.85rem; } }
        .glass-btn:hover { background: var(--cyan); color: #030712; transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,212,255,0.4); }
        .logout-btn { background: rgba(244,63,94,0.15); border: 1px solid rgba(244,63,94,0.4); color: #fb7185; }
        .logout-btn:hover { background: var(--rose); color: white; }
        
        /* Auto Sync Status */
        .sync-status {
            background: rgba(0,212,255,0.1);
            border-radius: 40px;
            padding: 5px 12px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        /* Stats Grid - Responsive */
        .stats-section { margin-bottom: 1.5rem; }
        .stats-row { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            margin-bottom: 12px; 
        }
        @media (min-width: 640px) { .stats-row { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
        @media (min-width: 1024px) { .stats-row { gap: 20px; margin-bottom: 20px; } }
        
        .stat-card {
            background: linear-gradient(145deg, rgba(18,22,35,0.8), rgba(10,12,21,0.9));
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1rem;
            padding: 0.8rem;
            transition: all 0.3s;
            box-shadow: 0 10px 25px -10px rgba(0,0,0,0.4);
        }
        @media (min-width: 768px) { .stat-card { padding: 1rem 1.2rem; border-radius: 1.2rem; } }
        @media (min-width: 1024px) { .stat-card { padding: 1.2rem 1.5rem; border-radius: 1.5rem; } }
        
        .stat-number { 
            font-size: 1.2rem; 
            font-weight: 800; 
            font-family: 'Space Grotesk', monospace; 
            color: var(--cyan); 
        }
        @media (min-width: 768px) { .stat-number { font-size: 1.5rem; } }
        @media (min-width: 1024px) { .stat-number { font-size: 1.8rem; } }
        
        .stat-label { 
            font-size: 0.6rem; 
            color: var(--text-secondary); 
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        @media (min-width: 768px) { .stat-label { font-size: 0.7rem; } }
        
        .stat-number.profit { color: var(--emerald); }
        .stat-number.cost { color: var(--amber); }
        .profit-card { background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(0,212,255,0.05)); border: 1px solid rgba(16,185,129,0.3); }
        
        /* Filter Bar - Responsive */
        .filter-bar {
            background: rgba(18, 22, 35, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,212,255,0.15);
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        @media (min-width: 768px) { .filter-bar { flex-direction: row; justify-content: space-between; align-items: center; border-radius: 1.5rem; } }
        
        .filter-group { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
            align-items: center;
            justify-content: flex-start;
        }
        .filter-input {
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 40px;
            padding: 8px 12px;
            color: white;
            font-size: 0.75rem;
            flex: 1;
            min-width: 100px;
        }
        @media (min-width: 768px) { .filter-input { padding: 10px 18px; font-size: 0.85rem; min-width: 130px; } }
        
        .filter-input:focus { border-color: var(--cyan); outline: none; box-shadow: 0 0 10px rgba(0,212,255,0.3); }
        .filter-btn {
            background: rgba(0,212,255,0.12);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        @media (min-width: 768px) { .filter-btn { padding: 10px 22px; font-size: 0.8rem; } }
        .filter-btn:hover { background: var(--cyan); color: #030712; }
        .filter-btn.reset { background: rgba(100,116,139,0.2); border-color: rgba(100,116,139,0.4); }
        .filter-btn.reset:hover { background: #64748b; color: white; }
        
        /* Orders Table - Horizontal Scroll for Mobile */
        .orders-table {
            background: rgba(18, 22, 35, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 15px 35px -15px rgba(0,0,0,0.5);
        }
        @media (min-width: 768px) { .orders-table { border-radius: 1.5rem; } }
        
        .table-header {
            padding: 0.8rem 1rem;
            background: rgba(0,212,255,0.05);
            border-bottom: 1px solid rgba(0,212,255,0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        @media (min-width: 768px) { .table-header { flex-direction: row; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; } }
        
        .table-header h3 { 
            font-family: 'Space Grotesk', sans-serif; 
            color: var(--cyan); 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 0.9rem;
        }
        @media (min-width: 768px) { .table-header h3 { font-size: 1.1rem; } }
        
        .orders-container { 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch;
            padding: 0;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 800px;
        }
        @media (max-width: 768px) { table { min-width: 700px; } }
        
        th, td { 
            padding: 10px 8px; 
            text-align: left; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.7rem;
        }
        @media (min-width: 768px) { th, td { padding: 12px 12px; font-size: 0.8rem; } }
        
        th { color: var(--cyan); font-weight: 600; letter-spacing: 0.5px; }
        tr:hover { background: rgba(0,212,255,0.03); }
        
        .status-badge { 
            display: inline-block; 
            padding: 3px 10px; 
            border-radius: 40px; 
            font-size: 0.6rem; 
            font-weight: 700; 
            white-space: nowrap;
        }
        @media (min-width: 768px) { .status-badge { padding: 5px 14px; font-size: 0.7rem; } }
        
        .status-pending { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .status-approved { background: rgba(16,185,129,0.2); color: #34d399; }
        .status-rejected { background: rgba(244,63,94,0.2); color: #fb7185; }
        
        .screenshot-link {
            color: var(--cyan);
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.65rem;
            white-space: nowrap;
        }
        @media (min-width: 768px) { .screenshot-link { font-size: 0.75rem; } }
        
        .action-buttons { display: flex; gap: 4px; flex-wrap: wrap; }
        .action-btn {
            border: none;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.6rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            white-space: nowrap;
        }
        @media (min-width: 768px) { .action-btn { padding: 6px 12px; font-size: 0.7rem; } }
        
        .action-btn.approve { background: #10b981; color: white; }
        .action-btn.reject { background: #f43f5e; color: white; }
        .action-btn.delete { background: #475569; color: white; }
        
        /* Screenshot Modal - Responsive */
        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(15px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s;
        }
        .image-modal.active {
            visibility: visible;
            opacity: 1;
        }
        .image-modal-content {
            max-width: 95%;
            max-height: 95%;
            position: relative;
            margin: 0 16px;
        }
        .image-modal-content img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 20px;
            border: 2px solid rgba(0,212,255,0.5);
            box-shadow: 0 0 50px rgba(0,212,255,0.3);
        }
        .close-modal {
            position: absolute;
            top: -40px;
            right: -10px;
            font-size: 2rem;
            cursor: pointer;
            color: white;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media (min-width: 768px) { .close-modal { top: -40px; right: -40px; } }
        .close-modal:hover { color: var(--rose); }
        
        /* Login Box - Responsive */
        .login-box {
            max-width: 90%;
            width: 400px;
            margin: 50px auto;
            background: linear-gradient(145deg, rgba(18,22,35,0.95), rgba(10,12,21,0.98));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0,212,255,0.4);
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        @media (min-width: 768px) { .login-box { padding: 2.5rem; border-radius: 2rem; margin: 100px auto; } }
        
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            margin: 12px 0;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 60px;
            color: white;
            font-size: 0.9rem;
        }
        @media (min-width: 768px) { .login-box input { padding: 14px 20px; font-size: 1rem; } }
        
        .login-btn {
            background: linear-gradient(135deg, var(--cyan), #0891b2);
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        @media (min-width: 768px) { .login-btn { padding: 14px; font-size: 1rem; } }
        
        .loading { text-align: center; padding: 2rem; color: var(--text-secondary); }
        .last-update { font-size: 0.6rem; color: #64748b; margin-top: 1rem; text-align: center; padding: 0.8rem; }
        @media (min-width: 768px) { .last-update { font-size: 0.7rem; } }
        
        .footer-note { text-align: center; margin-top: 1.5rem; font-size: 0.6rem; color: #475569; }
        @media (min-width: 768px) { .footer-note { font-size: 0.7rem; margin-top: 2rem; } }
        
        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="container" id="adminContent" style="display: none;">
        <div class="header">
            <h1><i class="fas fa-cube"></i> 3D Database Admin</h1>
            <div class="header-buttons">
                <div class="sync-status">
                    <span class="sync-dot"></span>
                    <span id="autoSyncTimer">Auto Sync: 30s</span>
                </div>
                <button class="glass-btn" onclick="manualRefresh()"><i class="fas fa-sync-alt"></i> Sync Now</button>
                <button class="glass-btn" onclick="window.location.href='/'"><i class="fas fa-store"></i> Store</button>
                <button class="glass-btn logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Exit</button>
            </div>
        </div>
        
        <!-- Revenue & Profit Statistics -->
        <div class="stats-section">
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-number" id="totalOrders">0</div>
                    <div class="stat-label"><i class="fas fa-shopping-cart"></i> Total Orders</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="pendingOrders">0</div>
                    <div class="stat-label"><i class="fas fa-clock"></i> Pending</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="approvedOrders">0</div>
                    <div class="stat-label"><i class="fas fa-check-circle"></i> Approved</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="rejectedOrders">0</div>
                    <div class="stat-label"><i class="fas fa-times-circle"></i> Rejected</div>
                </div>
            </div>
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-number" id="totalRevenue">0</div>
                    <div class="stat-label"><i class="fas fa-coins"></i> Revenue</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number cost" id="totalCost">0</div>
                    <div class="stat-label"><i class="fas fa-boxes"></i> Cost</div>
                </div>
                <div class="stat-card profit-card">
                    <div class="stat-number profit" id="totalProfit">0</div>
                    <div class="stat-label"><i class="fas fa-chart-line"></i> Profit</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="avgProfit">0</div>
                    <div class="stat-label"><i class="fas fa-percent"></i> Avg Profit</div>
                </div>
            </div>
        </div>
        
        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <input type="date" id="startDate" class="filter-input" placeholder="Start Date">
                <input type="date" id="endDate" class="filter-input" placeholder="End Date">
                <select id="statusFilter" class="filter-input">
                    <option value="all">📊 All Status</option>
                    <option value="Pending">⏳ Pending</option>
                    <option value="Approved">✅ Approved</option>
                    <option value="Rejected">❌ Rejected</option>
                </select>
            </div>
            <div class="filter-group">
                <button class="filter-btn" onclick="applyFilters()"><i class="fas fa-filter"></i> Filter</button>
                <button class="filter-btn reset" onclick="clearFilters()"><i class="fas fa-undo-alt"></i> Reset</button>
            </div>
        </div>
        
        <!-- Orders Table -->
        <div class="orders-table">
            <div class="table-header">
                <h3><i class="fas fa-database"></i> Order Database | Auto Sync</h3>
            </div>
            <div class="orders-container">
                <div id="ordersList"><div class="loading"><i class="fas fa-spinner fa-pulse"></i> Loading 3D Database...</div></div>
            </div>
            <div class="last-update" id="lastUpdate"></div>
        </div>
        <div class="footer-note">
            <i class="fas fa-shield-alt"></i> Secure Admin Console | Auto Sync Every 30 Sec | Click Screenshot to View
        </div>
    </div>
    
    <div id="loginBox" class="login-box">
        <i class="fas fa-lock" style="font-size: 2.5rem; color: var(--cyan); margin-bottom: 1rem; display: inline-block;"></i>
        <h2 style="margin-bottom: 1rem; font-family: 'Space Grotesk'; font-size: 1.3rem;">Admin Access</h2>
        <input type="password" id="adminPassword" placeholder="Enter Security Key">
        <button class="login-btn" onclick="login()"><i class="fas fa-unlock-alt"></i> Authenticate</button>
        <p style="margin-top: 1rem; font-size: 0.65rem; color: #64748b;">Secured by 3D Database Encryption</p>
    </div>
</div>

<!-- Screenshot Modal -->
<div id="screenshotModal" class="image-modal" onclick="closeModal()">
    <div class="image-modal-content" onclick="event.stopPropagation()">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <img id="modalImage" src="" alt="Screenshot">
    </div>
</div>

<script>
    const API_BASE = window.location.origin;
    let token = localStorage.getItem('adminToken');
    let allOrders = [];
    let autoSyncInterval = null;
    let countdownInterval = null;
    let secondsLeft = 30;

    // Cost Price Mapping
    const costPriceMap = {
        "VIP LEVEL - 1": 14500,
        "VIP LEVEL - 2": 19500,
        "VIP LEVEL - 3": 24500,
        "VIP LEVEL - 4 (ULTRA)": 29000
    };

    function getCostPrice(plan) {
        return costPriceMap[plan] || 0;
    }

    function getProfit(sellingPrice, plan) {
        const cost = getCostPrice(plan);
        return sellingPrice - cost;
    }

    function updateCountdown() {
        const timerElement = document.getElementById('autoSyncTimer');
        if (timerElement) timerElement.innerHTML = `Auto Sync: ${secondsLeft}s`;
    }

    function startAutoSync() {
        if (autoSyncInterval) clearInterval(autoSyncInterval);
        if (countdownInterval) clearInterval(countdownInterval);
        secondsLeft = 30;
        updateCountdown();
        countdownInterval = setInterval(() => {
            secondsLeft--;
            if (secondsLeft < 0) secondsLeft = 30;
            updateCountdown();
        }, 1000);
        autoSyncInterval = setInterval(() => {
            if (token === 'logged_in') { loadOrders(); secondsLeft = 30; updateCountdown(); }
        }, 30000);
    }

    function stopAutoSync() {
        if (autoSyncInterval) clearInterval(autoSyncInterval);
        if (countdownInterval) clearInterval(countdownInterval);
    }

    function openScreenshot(url) {
        const modal = document.getElementById('screenshotModal');
        const img = document.getElementById('modalImage');
        img.src = url && url !== 'null' && url !== '' ? url : 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="400" height="300" fill="%231a1a2e"/><text x="200" y="150" text-anchor="middle" fill="%2364748b" font-size="16">No Screenshot Available</text></svg>';
        modal.classList.add('active');
    }

    function closeModal() { document.getElementById('screenshotModal').classList.remove('active'); }

    async function login() {
        const password = document.getElementById('adminPassword').value;
        const res = await fetch(`${API_BASE}/api/admin/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('adminToken', 'logged_in');
            token = 'logged_in';
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            loadOrders();
            startAutoSync();
        } else { alert('❌ Invalid Security Key'); }
    }

    function logout() {
        stopAutoSync();
        localStorage.removeItem('adminToken');
        token = null;
        document.getElementById('loginBox').style.display = 'block';
        document.getElementById('adminContent').style.display = 'none';
    }

    async function loadOrders() {
        try {
            const res = await fetch(`${API_BASE}/api/admin/orders`);
            const data = await res.json();
            if (data.orders) {
                allOrders = data.orders;
                renderOrders(allOrders);
                updateProfitStats(allOrders);
                document.getElementById('lastUpdate').innerHTML = `<i class="fas fa-clock"></i> Last Sync: ${new Date().toLocaleString()} | Total: ${allOrders.length}`;
            }
        } catch(e) { document.getElementById('ordersList').innerHTML = '<div class="loading">⚠️ Database Error</div>'; }
    }

    function updateProfitStats(orders) {
        const total = orders.length;
        const pending = orders.filter(o => o.status === 'Pending');
        const approved = orders.filter(o => o.status === 'Approved');
        const rejected = orders.filter(o => o.status === 'Rejected');
        const totalRevenue = approved.reduce((sum, o) => sum + o.price, 0);
        const totalCost = approved.reduce((sum, o) => sum + getCostPrice(o.plan), 0);
        const totalProfit = totalRevenue - totalCost;
        const avgProfit = approved.length > 0 ? Math.round(totalProfit / approved.length) : 0;
        
        document.getElementById('totalOrders').innerHTML = total;
        document.getElementById('pendingOrders').innerHTML = pending.length;
        document.getElementById('approvedOrders').innerHTML = approved.length;
        document.getElementById('rejectedOrders').innerHTML = rejected.length;
        document.getElementById('totalRevenue').innerHTML = totalRevenue.toLocaleString() + 'K';
        document.getElementById('totalCost').innerHTML = totalCost.toLocaleString() + 'K';
        document.getElementById('totalProfit').innerHTML = totalProfit.toLocaleString() + 'K';
        document.getElementById('avgProfit').innerHTML = avgProfit.toLocaleString() + 'K';
    }

    function applyFilters() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const status = document.getElementById('statusFilter').value;
        let filtered = [...allOrders];
        if (status !== 'all') filtered = filtered.filter(o => o.status === status);
        if (startDate) { const start = new Date(startDate); start.setHours(0,0,0,0); filtered = filtered.filter(o => new Date(o.created_at) >= start); }
        if (endDate) { const end = new Date(endDate); end.setHours(23,59,59,999); filtered = filtered.filter(o => new Date(o.created_at) <= end); }
        renderOrders(filtered);
        updateProfitStats(filtered);
    }
    
    function clearFilters() {
        document.getElementById('startDate').value = '';
        document.getElementById('endDate').value = '';
        document.getElementById('statusFilter').value = 'all';
        renderOrders(allOrders);
        updateProfitStats(allOrders);
    }

    function renderOrders(orders) {
        if (!orders || orders.length === 0) {
            document.getElementById('ordersList').innerHTML = '<div class="loading"><i class="fas fa-database"></i> No records found</div>';
            return;
        }
        let html = '<table><thead><tr><th>ID</th><th>Phone</th><th>Plan</th><th>Price</th><th>Cost</th><th>Profit</th><th>Status</th><th>Slip</th><th>Date</th><th>Actions</th></tr></thead><tbody>';
        for (const order of orders) {
            let statusClass = '';
            if (order.status === 'Pending') statusClass = 'status-pending';
            else if (order.status === 'Approved') statusClass = 'status-approved';
            else statusClass = 'status-rejected';
            const dateStr = new Date(order.created_at).toLocaleString();
            const costPrice = getCostPrice(order.plan);
            const profit = getProfit(order.price, order.plan);
            const profitColor = profit >= 0 ? '#34d399' : '#fb7185';
            const slipUrl = order.slip_url ? order.slip_url : null;
            
            html += `<tr>
                <td style="font-family:monospace;">${order.id}</td>
                <td>${order.phone}</td>
                <td><strong>${order.plan}</strong></td>
                <td>${order.price.toLocaleString()}</td>
                <td style="color:#fbbf24;">${costPrice.toLocaleString()}</td>
                <td style="color:${profitColor};">${profit.toLocaleString()}</td>
                <td><span class="status-badge ${statusClass}">${order.status}</span></td>
                <td>${slipUrl ? `<span class="screenshot-link" onclick="openScreenshot('${slipUrl}')"><i class="fas fa-image"></i> View</span>` : '<span style="color:#64748b;">—</span>'}</td>
                <td style="font-size:0.7rem;">${dateStr}</td>
                <td class="action-buttons">
                    ${order.status === 'Pending' ? `
                        <button class="action-btn approve" onclick="approveOrder(${order.id})"><i class="fas fa-check"></i></button>
                        <button class="action-btn reject" onclick="rejectOrder(${order.id})"><i class="fas fa-times"></i></button>
                    ` : ''}
                    <button class="action-btn delete" onclick="deleteOrder(${order.id})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`;
        }
        html += '</tbody></table>';
        document.getElementById('ordersList').innerHTML = html;
    }

    async function approveOrder(id) {
        const res = await fetch(`${API_BASE}/api/admin/orders/${id}/approve`, { method: 'PUT' });
        if (res.ok) { showToast('✅ Approved!'); loadOrders(); }
        else alert('Error');
    }

    async function rejectOrder(id) {
        const res = await fetch(`${API_BASE}/api/admin/orders/${id}/reject`, { method: 'PUT' });
        if (res.ok) { showToast('❌ Rejected'); loadOrders(); }
        else alert('Error');
    }

    async function deleteOrder(id) {
        if (confirm('⚠️ Delete this order?')) {
            const res = await fetch(`${API_BASE}/api/admin/orders/${id}`, { method: 'DELETE' });
            if (res.ok) { showToast('🗑 Deleted'); loadOrders(); }
            else alert('Error');
        }
    }

    function manualRefresh() { loadOrders(); showToast('🔄 Synced'); secondsLeft = 30; updateCountdown(); }
    
    function showToast(msg) {
        const toast = document.createElement('div');
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.right = '20px';
        toast.style.background = '#10b981';
        toast.style.color = '#030712';
        toast.style.padding = '10px 20px';
        toast.style.borderRadius = '60px';
        toast.style.fontWeight = 'bold';
        toast.style.zIndex = '9999';
        toast.style.fontSize = '0.8rem';
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    window.approveOrder = approveOrder;
    window.rejectOrder = rejectOrder;
    window.deleteOrder = deleteOrder;
    window.logout = logout;
    window.manualRefresh = manualRefresh;
    window.applyFilters = applyFilters;
    window.clearFilters = clearFilters;
    window.openScreenshot = openScreenshot;
    window.closeModal = closeModal;

    if (token === 'logged_in') {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        loadOrders();
        startAutoSync();
    }
</script>
</body>
</html>
