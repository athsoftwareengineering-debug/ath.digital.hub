<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Admin Panel | ATH DIGITAL HUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deep: #0a0c15;
            --cyan: #00d4ff;
            --emerald: #10b981;
            --rose: #f43f5e;
            --amber: #f59e0b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }
        body {
            background: #0a0c15;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 12px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 85% 70%, rgba(0, 212, 255, 0.1) 0%, transparent 60%);
            z-index: -2;
        }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Header */
        .header {
            backdrop-filter: blur(20px);
            background: rgba(10, 12, 21, 0.7);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 1.5rem;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-size: 1.2rem;
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, #fff, var(--cyan));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tab-bar {
            display: flex;
            gap: 8px;
            background: rgba(0,212,255,0.08);
            padding: 4px;
            border-radius: 60px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--cyan);
            color: #030712;
        }
        .sync-status {
            background: rgba(0,212,255,0.15);
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: linear-gradient(145deg, rgba(18,22,35,0.9), rgba(10,12,21,0.95));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1.2rem;
            padding: 12px;
            text-align: center;
        }
        .stat-number {
            font-size: 1.5rem;
            font-weight: 800;
            font-family: 'Space Grotesk', monospace;
            color: var(--cyan);
        }
        .stat-label {
            font-size: 0.6rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        /* Search & Filter */
        .filter-bar {
            background: rgba(18, 22, 35, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,212,255,0.15);
            border-radius: 1rem;
            padding: 12px;
            margin-bottom: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-input {
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 40px;
            padding: 8px 12px;
            color: white;
            font-size: 0.7rem;
        }
        .filter-input:focus { border-color: var(--cyan); outline: none; }
        .filter-btn {
            background: rgba(0,212,255,0.15);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .filter-btn:hover { background: var(--cyan); color: #030712; }
        
        /* Tables */
        .table-container {
            overflow-x: auto;
            margin-bottom: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(18,22,35,0.8);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            overflow: hidden;
        }
        th, td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.75rem;
        }
        th {
            background: rgba(0,212,255,0.1);
            color: var(--cyan);
            font-weight: 600;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 600;
        }
        .status-pending { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .status-approved { background: rgba(16,185,129,0.2); color: #34d399; }
        .status-rejected { background: rgba(244,63,94,0.2); color: #fb7185; }
        .suspect-badge { background: rgba(245,158,11,0.3); color: #fbbf24; }
        .blocked-badge { background: rgba(244,63,94,0.3); color: #fb7185; }
        
        .action-btn {
            background: rgba(0,212,255,0.15);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.65rem;
            cursor: pointer;
            margin: 2px;
        }
        .action-btn.danger { background: rgba(244,63,94,0.2); border-color: rgba(244,63,94,0.3); color: #fb7185; }
        .action-btn.success { background: rgba(16,185,129,0.2); border-color: rgba(16,185,129,0.3); color: #34d399; }
        .action-btn:hover { background: var(--cyan); color: #030712; }
        
        .login-box {
            max-width: 350px;
            margin: 80px auto;
            background: linear-gradient(145deg, rgba(18,22,35,0.95), rgba(10,12,21,0.98));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0,212,255,0.4);
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 60px;
            color: white;
        }
        .login-btn {
            background: linear-gradient(135deg, var(--cyan), #0891b2);
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
        }
        
        .fab-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }
        .fab {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--cyan), #0891b2);
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,212,255,0.4);
        }
        .fab.logout { background: linear-gradient(135deg, #f43f5e, #e11d48); }
        
        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s;
        }
        .image-modal.active { visibility: visible; opacity: 1; }
        .image-modal-content {
            max-width: 90%;
            max-height: 90%;
            background: rgba(18,22,35,0.95);
            border-radius: 24px;
            padding: 10px;
            border: 1px solid rgba(0,212,255,0.5);
        }
        .image-modal-content img { max-width: 100%; max-height: 70vh; border-radius: 16px; }
        .close-modal { background: rgba(255,255,255,0.1); border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
        
        .loading { text-align: center; padding: 2rem; color: #64748b; }
        .empty-msg { text-align: center; padding: 2rem; color: #64748b; }
        .hidden { display: none; }
        
        .user-cell {
            font-family: monospace;
            font-size: 0.7rem;
        }
        .reject-rate {
            font-weight: 600;
        }
        .reject-rate.high { color: var(--rose); }
        .reject-rate.medium { color: var(--amber); }
    </style>
</head>
<body>
<div id="app">
    <div class="container" id="adminContent" style="display: none;">
        <div class="header">
            <h1><i class="fas fa-crown"></i> ATH Admin</h1>
            <div class="tab-bar">
                <button class="tab-btn active" data-tab="orders">📋 Orders</button>
                <button class="tab-btn" data-tab="users">🚨 Users</button>
            </div>
            <div class="sync-status">
                <span class="sync-dot"></span>
                <span id="autoSyncTimer">Auto Sync: 30s</span>
            </div>
        </div>
        
        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="totalOrders">0</div><div class="stat-label">Total Orders</div></div>
            <div class="stat-card"><div class="stat-number" id="pendingOrders">0</div><div class="stat-label">Pending</div></div>
            <div class="stat-card"><div class="stat-number" id="approvedOrders">0</div><div class="stat-label">Approved</div></div>
            <div class="stat-card"><div class="stat-number" id="rejectedOrders">0</div><div class="stat-label">Rejected</div></div>
            <div class="stat-card"><div class="stat-number" id="totalRevenue">0</div><div class="stat-label">Revenue (K)</div></div>
            <div class="stat-card"><div class="stat-number" id="totalProfit">0</div><div class="stat-label">Profit (K)</div></div>
            <div class="stat-card"><div class="stat-number" id="suspectUsers">0</div><div class="stat-label">⚠️ Suspect</div></div>
            <div class="stat-card"><div class="stat-number" id="blockedUsers">0</div><div class="stat-label">🔴 Blocked</div></div>
        </div>
        
        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <input type="date" id="startDate" class="filter-input" placeholder="Start">
                <input type="date" id="endDate" class="filter-input" placeholder="End">
                <select id="statusFilter" class="filter-input">
                    <option value="all">All</option>
                    <option value="Pending">Pending</option>
                    <option value="Approved">Approved</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>
            <div>
                <button class="filter-btn" onclick="applyFilters()"><i class="fas fa-filter"></i> Filter</button>
                <button class="filter-btn" onclick="clearFilters()" style="background:#334155;"><i class="fas fa-undo"></i></button>
            </div>
        </div>
        
        <!-- Orders Tab -->
        <div id="ordersTab" class="table-container">
            <table id="ordersTable">
                <thead>
                    <tr><th>ID</th><th>Phone</th><th>Plan</th><th>Price</th><th>Status</th><th>Date</th><th>Actions</th></tr>
                </thead>
                <tbody id="ordersList"><tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-pulse"></i> Loading orders...</td></tr></tbody>
            </table>
        </div>
        
        <!-- Users Tab (Suspected Users) -->
        <div id="usersTab" class="table-container hidden">
            <table id="usersTable">
                <thead>
                    <tr><th>Phone</th><th>Orders</th><th>Rejected</th><th>Reject Rate</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="usersList"><tr><td colspan="6" class="loading"><i class="fas fa-spinner fa-pulse"></i> Loading users...</td></tr></tbody>
            </table>
        </div>
    </div>
    
    <div class="fab-container" id="fabContainer" style="display: none;">
        <button class="fab" onclick="manualRefresh()" title="Sync"><i class="fas fa-sync-alt"></i></button>
        <button class="fab" onclick="window.location.href='/'" title="Store"><i class="fas fa-store"></i></button>
        <button class="fab logout" onclick="logout()" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
    </div>
    
    <div id="loginBox" class="login-box">
        <i class="fas fa-lock" style="font-size: 2rem; color: var(--cyan); margin-bottom: 1rem;"></i>
        <h2>Admin Access</h2>
        <input type="password" id="adminPassword" placeholder="Enter Password">
        <button class="login-btn" onclick="login()"><i class="fas fa-unlock-alt"></i> Login</button>
    </div>
</div>

<div id="screenshotModal" class="image-modal" onclick="closeModal()">
    <div class="image-modal-content" onclick="event.stopPropagation()">
        <div class="modal-header" style="display:flex; justify-content:space-between; padding:8px 12px;">
            <span><i class="fas fa-image"></i> Payment Screenshot</span>
            <button class="close-modal" onclick="closeModal()">&times;</button>
        </div>
        <img id="modalImage" src="" alt="Screenshot">
    </div>
</div>

<script>
    const API_BASE = window.location.origin;
    let token = localStorage.getItem('adminToken');
    let allOrders = [];
    let userStats = [];
    let autoSyncInterval = null, countdownInterval = null;
    let secondsLeft = 30;
    let currentTab = 'orders';
    
    const costPriceMap = {
        "VIP LEVEL - 1": 14500,
        "VIP LEVEL - 2": 19500,
        "VIP LEVEL - 3": 24500,
        "VIP LEVEL - 4 (ULTRA)": 29000
    };
    
    function getCostPrice(plan) { return costPriceMap[plan] || 0; }
    
    async function login() {
        const password = document.getElementById('adminPassword').value;
        const res = await fetch(`${API_BASE}/api/admin/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('adminToken', 'logged_in'); token = 'logged_in';
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            document.getElementById('fabContainer').style.display = 'flex';
            loadAllData(); startAutoSync();
        } else { alert('Invalid Password'); }
    }
    
    function logout() { stopAutoSync(); localStorage.removeItem('adminToken'); token = null; location.reload(); }
    
    async function loadAllData() {
        await loadOrders();
        await loadUserStats();
    }
    
    async function loadOrders() {
        try {
            const res = await fetch(`${API_BASE}/api/admin/orders`);
            const data = await res.json();
            if (data.orders) { allOrders = data.orders; applyFiltersAndRender(); }
        } catch(e) { document.getElementById('ordersList').innerHTML = '<tr><td colspan="7" class="loading">Connection Error</td></tr>'; }
    }
    
    async function loadUserStats() {
        try {
            const res = await fetch(`${API_BASE}/api/admin/user-stats`);
            const data = await res.json();
            if (data.stats) { userStats = data.stats; renderUsersTab(); updateStatsCards(); }
        } catch(e) { console.error('Error loading user stats:', e); }
    }
    
    async function blockUser(phone, block) {
        const res = await fetch(`${API_BASE}/api/admin/user-block`, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, block })
        });
        if (res.ok) { loadUserStats(); showToast(block ? '✅ User blocked' : '✅ User unblocked'); }
        else alert('Error');
    }
    
    async function clearSuspectFlag(phone) {
        const res = await fetch(`${API_BASE}/api/admin/clear-suspect`, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone })
        });
        if (res.ok) { loadUserStats(); showToast('✅ Suspect flag cleared'); }
        else alert('Error');
    }
    
    function updateStatsCards() {
        const total = allOrders.length;
        const pending = allOrders.filter(o => o.status === 'Pending').length;
        const approved = allOrders.filter(o => o.status === 'Approved');
        const rejected = allOrders.filter(o => o.status === 'Rejected');
        const revenue = approved.reduce((s, o) => s + o.price, 0);
        const profit = approved.reduce((s, o) => s + (o.price - getCostPrice(o.plan)), 0);
        const suspectUsers = userStats.filter(u => u.suspect_flag).length;
        const blockedUsers = userStats.filter(u => u.blocked).length;
        
        document.getElementById('totalOrders').innerHTML = total;
        document.getElementById('pendingOrders').innerHTML = pending;
        document.getElementById('approvedOrders').innerHTML = approved.length;
        document.getElementById('rejectedOrders').innerHTML = rejected.length;
        document.getElementById('totalRevenue').innerHTML = revenue.toLocaleString() + 'K';
        document.getElementById('totalProfit').innerHTML = profit.toLocaleString() + 'K';
        document.getElementById('suspectUsers').innerHTML = suspectUsers;
        document.getElementById('blockedUsers').innerHTML = blockedUsers;
    }
    
    function renderUsersTab() {
        const tbody = document.getElementById('usersList');
        if (!userStats.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">No user data</td></tr>';
            return;
        }
        
        let html = '';
        for (const user of userStats) {
            const rejectRate = user.order_count > 0 ? ((user.reject_count / user.order_count) * 100).toFixed(0) : 0;
            let rateClass = '';
            if (rejectRate >= 50) rateClass = 'high';
            else if (rejectRate >= 30) rateClass = 'medium';
            
            let statusHtml = '';
            if (user.blocked) statusHtml = '<span class="status-badge blocked-badge">🔴 Blocked</span>';
            else if (user.suspect_flag) statusHtml = '<span class="status-badge suspect-badge">🟡 Suspect</span>';
            else statusHtml = '<span class="status-badge" style="background:rgba(16,185,129,0.2);color:#34d399;">🟢 Normal</span>';
            
            html += `<tr>
                <td class="user-cell">${maskPhone(user.phone)}</td>
                <td>${user.order_count || 0}</td>
                <td>${user.reject_count || 0}</td>
                <td><span class="reject-rate ${rateClass}">${rejectRate}%</span></td>
                <td>${statusHtml}</td>
                <td>
                    ${!user.blocked ? `<button class="action-btn danger" onclick="blockUser('${user.phone}', true)">🔴 Block</button>` : `<button class="action-btn success" onclick="blockUser('${user.phone}', false)">🟢 Unblock</button>`}
                    ${user.suspect_flag ? `<button class="action-btn" onclick="clearSuspectFlag('${user.phone}')">✓ Clear Suspect</button>` : ''}
                </td>
            </tr>`;
        }
        tbody.innerHTML = html;
    }
    
    function maskPhone(phone) {
        if (!phone || phone.length < 8) return phone;
        return phone.substring(0, 5) + '***' + phone.substring(phone.length - 3);
    }
    
    function applyFiltersAndRender() {
        let filtered = [...allOrders];
        const status = document.getElementById('statusFilter').value;
        if (status !== 'all') filtered = filtered.filter(o => o.status === status);
        
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        if (startDate) { const start = new Date(startDate); start.setHours(0,0,0,0); filtered = filtered.filter(o => new Date(o.created_at) >= start); }
        if (endDate) { const end = new Date(endDate); end.setHours(23,59,59,999); filtered = filtered.filter(o => new Date(o.created_at) <= end); }
        
        renderOrdersTable(filtered);
        updateStatsCards();
    }
    
    function renderOrdersTable(orders) {
        const tbody = document.getElementById('ordersList');
        if (!orders.length) { tbody.innerHTML = '<tr><td colspan="7" class="empty-msg">No orders found</td></tr>'; return; }
        
        let html = '';
        for (const o of orders) {
            let statusClass = o.status === 'Pending' ? 'status-pending' : (o.status === 'Approved' ? 'status-approved' : 'status-rejected');
            html += `<tr>
                <td>${o.id}</td>
                <td class="user-cell">${maskPhone(o.phone)}</td>
                <td>${o.plan}</td>
                <td>${o.price.toLocaleString()}K</td>
                <td><span class="status-badge ${statusClass}">${o.status}</span></td>
                <td>${new Date(o.created_at).toLocaleDateString()}</td>
                <td>
                    ${o.slip_url ? `<button class="action-btn" onclick="openScreenshot('${o.slip_url}')"><i class="fas fa-image"></i></button>` : ''}
                    ${o.status === 'Pending' ? `<button class="action-btn success" onclick="approveOrder(${o.id})">Approve</button><button class="action-btn danger" onclick="rejectOrder(${o.id})">Reject</button>` : ''}
                    <button class="action-btn" onclick="deleteOrder(${o.id})">Delete</button>
                </td>
            </tr>`;
        }
        tbody.innerHTML = html;
    }
    
    function applyFilters() { applyFiltersAndRender(); }
    function clearFilters() {
        document.getElementById('startDate').value = '';
        document.getElementById('endDate').value = '';
        document.getElementById('statusFilter').value = 'all';
        applyFiltersAndRender();
    }
    
    async function approveOrder(id) { const res = await fetch(`${API_BASE}/api/admin/orders/${id}/approve`, { method: 'PUT' }); if (res.ok) { showToast('✅ Approved'); loadOrders(); } else alert('Error'); }
    async function rejectOrder(id) { const res = await fetch(`${API_BASE}/api/admin/orders/${id}/reject`, { method: 'PUT' }); if (res.ok) { showToast('❌ Rejected'); loadOrders(); loadUserStats(); } else alert('Error'); }
    async function deleteOrder(id) { if (confirm('Delete this order?')) { const res = await fetch(`${API_BASE}/api/admin/orders/${id}`, { method: 'DELETE' }); if (res.ok) { showToast('🗑 Deleted'); loadOrders(); } else alert('Error'); } }
    
    function openScreenshot(url) { const modal = document.getElementById('screenshotModal'); const img = document.getElementById('modalImage'); img.src = url.startsWith('/') ? API_BASE + url : url; modal.classList.add('active'); }
    function closeModal() { document.getElementById('screenshotModal').classList.remove('active'); }
    function manualRefresh() { loadAllData(); showToast('🔄 Synced'); secondsLeft = 30; updateCountdown(); }
    function showToast(msg) { const t = document.createElement('div'); t.style.cssText = 'position:fixed;bottom:80px;right:20px;background:#10b981;color:#030712;padding:8px 16px;border-radius:60px;font-size:0.8rem;font-weight:bold;z-index:9999'; t.innerHTML = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2000); }
    
    function startAutoSync() {
        if (autoSyncInterval) clearInterval(autoSyncInterval);
        if (countdownInterval) clearInterval(countdownInterval);
        secondsLeft = 30; updateCountdown();
        countdownInterval = setInterval(() => { secondsLeft--; if (secondsLeft < 0) secondsLeft = 30; updateCountdown(); }, 1000);
        autoSyncInterval = setInterval(() => { if (token === 'logged_in') { loadAllData(); secondsLeft = 30; updateCountdown(); } }, 30000);
    }
    function stopAutoSync() { if (autoSyncInterval) clearInterval(autoSyncInterval); if (countdownInterval) clearInterval(countdownInterval); }
    function updateCountdown() { const el = document.getElementById('autoSyncTimer'); if (el) el.innerHTML = `Auto Sync: ${secondsLeft}s`; }
    
    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTab = btn.dataset.tab;
            if (currentTab === 'orders') {
                document.getElementById('ordersTab').classList.remove('hidden');
                document.getElementById('usersTab').classList.add('hidden');
            } else {
                document.getElementById('ordersTab').classList.add('hidden');
                document.getElementById('usersTab').classList.remove('hidden');
                loadUserStats();
            }
        });
    });
    
    document.getElementById('screenshotModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
    
    window.approveOrder = approveOrder; window.rejectOrder = rejectOrder; window.deleteOrder = deleteOrder; window.logout = logout;
    window.applyFilters = applyFilters; window.clearFilters = clearFilters; window.openScreenshot = openScreenshot; window.manualRefresh = manualRefresh;
    window.blockUser = blockUser; window.clearSuspectFlag = clearSuspectFlag;
    
    if (token === 'logged_in') { document.getElementById('loginBox').style.display = 'none'; document.getElementById('adminContent').style.display = 'block'; document.getElementById('fabContainer').style.display = 'flex'; loadAllData(); startAutoSync(); }
</script>
</body>
</html>
