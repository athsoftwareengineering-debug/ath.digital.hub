<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | ATH DIGITAL HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0c15;
            font-family: 'Inter', sans-serif;
            color: #f1f5f9;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(18,22,35,0.95);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(0,212,255,0.3);
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 40px;
            color: white;
        }
        .login-btn {
            background: linear-gradient(135deg, #00d4ff, #0891b2);
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: rgba(18,22,35,0.8);
            border-radius: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(18,22,35,0.8);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
        }
        .stat-number { font-size: 1.5rem; font-weight: 800; color: #00d4ff; }
        .orders-list { display: flex; flex-direction: column; gap: 15px; }
        .order-card {
            background: rgba(18,22,35,0.8);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(0,212,255,0.1);
        }
        .order-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .status-pending { color: #fbbf24; }
        .status-approved { color: #34d399; }
        .status-rejected { color: #fb7185; }
        .order-actions { display: flex; gap: 10px; margin-top: 10px; }
        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
        }
        .approve { background: #10b981; color: white; }
        .reject { background: #f43f5e; color: white; }
        .delete { background: #475569; color: white; }
        .hidden { display: none; }
        .logout-btn {
            background: rgba(244,63,94,0.2);
            border: 1px solid rgba(244,63,94,0.3);
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="loginSection" class="login-box">
    <i class="fas fa-lock" style="font-size: 2rem; color: #00d4ff;"></i>
    <h2>Admin Access</h2>
    <input type="password" id="adminPassword" placeholder="Enter Password">
    <button class="login-btn" onclick="adminLogin()">Login</button>
</div>

<div id="adminContent" class="container" style="display:none">
    <div class="header">
        <h2><i class="fas fa-crown"></i> ATH Admin Panel</h2>
        <button class="logout-btn" onclick="adminLogout()">Logout</button>
    </div>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="orders-list" id="ordersList"></div>
</div>

<script>
    const API_BASE = window.location.origin;
    
    async function adminLogin() {
        const password = document.getElementById('adminPassword').value;
        const res = await fetch(`${API_BASE}/api/admin/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
        });
        if (res.ok) {
            localStorage.setItem('adminAuth', 'true');
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            loadOrders();
            loadStats();
            setInterval(() => { loadOrders(); loadStats(); }, 30000);
        } else {
            alert('Invalid password');
        }
    }
    
    function adminLogout() {
        localStorage.removeItem('adminAuth');
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('adminContent').style.display = 'none';
    }
    
    async function loadOrders() {
        const res = await fetch(`${API_BASE}/api/admin/orders`);
        const data = await res.json();
        const orders = data.orders || [];
        const container = document.getElementById('ordersList');
        container.innerHTML = orders.map(order => `
            <div class="order-card">
                <div class="order-header">
                    <span>#${order.id}</span>
                    <span class="status-${order.status.toLowerCase()}">${order.status}</span>
                </div>
                <div>📞 ${order.phone}</div>
                <div>📦 ${order.plan} - ${order.price.toLocaleString()}K</div>
                <div>📅 ${new Date(order.created_at).toLocaleString()}</div>
                <div class="order-actions">
                    ${order.status === 'Pending' ? `
                        <button class="action-btn approve" onclick="approveOrder(${order.id})">✅ Approve</button>
                        <button class="action-btn reject" onclick="rejectOrder(${order.id})">❌ Reject</button>
                    ` : ''}
                    <button class="action-btn delete" onclick="deleteOrder(${order.id})">🗑 Delete</button>
                </div>
            </div>
        `).join('');
    }
    
    async function loadStats() {
        const res = await fetch(`${API_BASE}/api/admin/user-stats`);
        const data = await res.json();
        const stats = data.stats || [];
        const totalOrders = stats.reduce((s, u) => s + u.order_count, 0);
        const totalRejects = stats.reduce((s, u) => s + u.reject_count, 0);
        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card"><div class="stat-number">${stats.length}</div><div>Users</div></div>
            <div class="stat-card"><div class="stat-number">${totalOrders}</div><div>Total Orders</div></div>
            <div class="stat-card"><div class="stat-number">${totalRejects}</div><div>Total Rejects</div></div>
        `;
    }
    
    async function approveOrder(id) {
        await fetch(`${API_BASE}/api/admin/orders/${id}/approve`, { method: 'PUT' });
        loadOrders();
    }
    
    async function rejectOrder(id) {
        await fetch(`${API_BASE}/api/admin/orders/${id}/reject`, { method: 'PUT' });
        loadOrders();
    }
    
    async function deleteOrder(id) {
        if (confirm('Delete this order?')) {
            await fetch(`${API_BASE}/api/admin/orders/${id}`, { method: 'DELETE' });
            loadOrders();
        }
    }
    
    if (localStorage.getItem('adminAuth') === 'true') {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        loadOrders();
        loadStats();
        setInterval(() => { loadOrders(); loadStats(); }, 30000);
    }
</script>
</body>
</html>
