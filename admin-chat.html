<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Chat - ATH DIGITAL HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 0;
            margin: 0;
        }
        
        .admin-chat-container {
            position: fixed;
            bottom: 70px;
            right: 16px;
            width: 380px;
            height: 520px;
            background: linear-gradient(145deg, #0f111a, #0a0c15);
            border-radius: 1.2rem;
            border: 1px solid rgba(0,212,255,0.25);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }
        
        .admin-chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(0,212,255,0.05));
            border-bottom: 1px solid rgba(0,212,255,0.15);
        }
        
        .admin-chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .admin-chat-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .admin-chat-avatar i {
            font-size: 1.3rem;
            color: white;
        }
        
        .admin-chat-header-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f1f5f9;
        }
        
        .admin-chat-header-status {
            font-size: 0.6rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }
        
        .admin-online-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .admin-chat-close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            transition: all 0.2s;
        }
        
        .admin-chat-close-btn:hover {
            background: rgba(0,212,255,0.15);
            color: #00d4ff;
        }
        
        .admin-chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .admin-chat-message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .admin-chat-message.user {
            align-items: flex-start;
            margin-right: auto;
        }
        
        .admin-chat-message.admin {
            align-items: flex-end;
            margin-left: auto;
        }
        
        .admin-message-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            word-wrap: break-word;
            font-size: 0.8rem;
            line-height: 1.4;
        }
        
        .admin-chat-message.user .admin-message-bubble {
            background: rgba(255,255,255,0.08);
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        
        .admin-chat-message.admin .admin-message-bubble {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .admin-message-sender {
            font-size: 0.55rem;
            color: #94a3b8;
            margin-bottom: 4px;
            padding: 0 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .admin-message-time {
            font-size: 0.5rem;
            color: #64748b;
            margin-top: 4px;
            padding: 0 6px;
        }
        
        .admin-chat-input-container {
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border-top: 1px solid rgba(0,212,255,0.1);
        }
        
        .admin-chat-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        .admin-chat-input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 20px;
            color: white;
            font-size: 0.8rem;
            resize: none;
            font-family: inherit;
            max-height: 80px;
        }
        
        .admin-chat-input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        
        .admin-chat-send-btn {
            background: linear-gradient(135deg, #00d4ff, #0891b2);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .admin-chat-send-btn:hover {
            transform: scale(1.05);
        }
        
        .admin-chat-note {
            font-size: 0.55rem;
            color: #64748b;
            text-align: center;
            margin-top: 8px;
        }
        
        .admin-chat-loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
        
        @media (max-width: 480px) {
            .admin-chat-container {
                width: calc(100vw - 32px);
                right: 16px;
                left: 16px;
                height: 65vh;
                bottom: 75px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-chat-container">
        <div class="admin-chat-header">
            <div class="admin-chat-header-info">
                <div class="admin-chat-avatar">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div>
                    <div class="admin-chat-header-title">Admin Support</div>
                    <div class="admin-chat-header-status">
                        <span class="admin-online-dot"></span>
                        <span>Online - Admin Mode</span>
                    </div>
                </div>
            </div>
            <button class="admin-chat-close-btn" onclick="closeAdminChat()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="admin-chat-messages" id="adminChatMessages">
            <div class="admin-chat-loading">
                <i class="fas fa-spinner fa-pulse"></i> Loading messages...
            </div>
        </div>
        
        <div class="admin-chat-input-container">
            <div class="admin-chat-input-wrapper">
                <textarea id="adminChatInput" class="admin-chat-input" placeholder="Type reply as Admin..." rows="1" maxlength="500"></textarea>
                <button class="admin-chat-send-btn" onclick="sendAdminMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="admin-chat-note">
                <i class="fas fa-shield-alt"></i> Replying as Admin
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const API_BASE = window.location.origin;
        let chatSubscription = null;
        
        // Supabase configuration (use same as main app)
        const SUPABASE_URL = 'https://your-project.supabase.co';  // ← Replace
        const SUPABASE_ANON_KEY = 'your-anon-key';  // ← Replace
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        async function loadAdminChatMessages() {
            const container = document.getElementById('adminChatMessages');
            if (!container) return;
            
            try {
                const response = await fetch(`${API_BASE}/api/chat/messages`);
                const data = await response.json();
                
                if (data.success && data.messages) {
                    renderAdminChatMessages(data.messages);
                } else {
                    container.innerHTML = '<div class="admin-chat-loading">No messages yet</div>';
                }
            } catch (error) {
                container.innerHTML = '<div class="admin-chat-loading">Connection error</div>';
            }
        }
        
        function renderAdminChatMessages(messages) {
            const container = document.getElementById('adminChatMessages');
            if (!container) return;
            
            if (!messages || messages.length === 0) {
                container.innerHTML = '<div class="admin-chat-loading">✨ No messages yet</div>';
                return;
            }
            
            let html = '';
            for (const msg of messages) {
                const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const isAdmin = msg.is_admin;
                const senderName = isAdmin ? '👑 Admin' : (msg.username || 'User');
                const senderIcon = isAdmin ? '<i class="fas fa-shield-alt"></i>' : '<i class="fas fa-user"></i>';
                
                html += `
                    <div class="admin-chat-message ${isAdmin ? 'admin' : 'user'}">
                        <div class="admin-message-sender">
                            ${senderIcon} ${escapeHtml(senderName)}
                        </div>
                        <div class="admin-message-bubble">${escapeHtml(msg.message)}</div>
                        <div class="admin-message-time">${time}</div>
                    </div>
                `;
            }
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }
        
        async function sendAdminMessage() {
            const input = document.getElementById('adminChatInput');
            const message = input.value.trim();
            const sendBtn = document.querySelector('.admin-chat-send-btn');
            
            if (!message) return;
            
            input.disabled = true;
            sendBtn.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE}/api/chat/admin/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: 'admin',
                        username: 'Admin',
                        message: message
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    input.value = '';
                    input.style.height = 'auto';
                    await loadAdminChatMessages();
                } else {
                    alert('Failed to send');
                }
            } catch (error) {
                alert('Connection error');
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function autoResizeTextarea() {
            const textarea = document.getElementById('adminChatInput');
            if (textarea) {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 80) + 'px';
            }
        }
        
        function setupAdminRealtime() {
            if (chatSubscription) return;
            
            chatSubscription = supabaseClient
                .channel('admin_chat_realtime')
                .on('postgres_changes', 
                    { event: 'INSERT', schema: 'public', table: 'chat_messages' },
                    (payload) => {
                        loadAdminChatMessages();
                    }
                )
                .subscribe();
        }
        
        function setupKeyboardShortcuts() {
            const input = document.getElementById('adminChatInput');
            if (input) {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendAdminMessage();
                    }
                });
                input.addEventListener('input', autoResizeTextarea);
            }
        }
        
        function closeAdminChat() {
            if (window.parent && window.parent.closeAdminChatWidget) {
                window.parent.closeAdminChatWidget();
            }
        }
        
        async function initAdminChat() {
            await loadAdminChatMessages();
            setupAdminRealtime();
            setupKeyboardShortcuts();
            
            setInterval(() => {
                loadAdminChatMessages();
            }, 10000);
        }
        
        initAdminChat();
        
        window.sendAdminMessage = sendAdminMessage;
        window.closeAdminChat = closeAdminChat;
    </script>
</body>
</html>
