<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Admin Chat | ATH DIGITAL HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
        }

        /* ============ CHAT WIDGET ============ */
        .chat-widget-container {
            position: fixed;
            bottom: 70px;
            right: 16px;
            width: 380px;
            height: 560px;
            background: linear-gradient(145deg, #0f111a, #0a0c15);
            border-radius: 1.2rem;
            border: 1px solid rgba(0,212,255,0.25);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
            transition: height 0.3s ease, width 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .chat-widget-container.minimized {
            height: 55px;
            width: 280px;
        }

        .chat-widget-container.minimized .chat-body {
            display: none;
        }

        /* ============ CHAT HEADER ============ */
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(0,212,255,0.05));
            border-bottom: 1px solid rgba(0,212,255,0.15);
            cursor: pointer;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00d4ff, #0891b2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-avatar i {
            font-size: 1.2rem;
            color: white;
        }

        .chat-header-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f1f5f9;
        }

        .chat-header-status {
            font-size: 0.6rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .chat-header-actions {
            display: flex;
            gap: 8px;
        }

        .chat-minimize-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-minimize-btn:hover {
            background: rgba(0,212,255,0.15);
            color: #00d4ff;
        }

        /* ============ CHAT BODY ============ */
        .chat-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* User Selector */
        .user-selector {
            padding: 10px 12px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(0,212,255,0.1);
        }

        .user-select {
            width: 100%;
            padding: 8px 12px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 40px;
            color: white;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .user-select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .user-select option {
            background: #0f111a;
        }

        /* ============ MESSAGES CONTAINER ============ */
        .chat-messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-messages-container::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }

        .chat-messages-container::-webkit-scrollbar-thumb {
            background: #00d4ff;
            border-radius: 4px;
        }

        /* Empty state */
        .chat-messages-container:empty::after {
            content: "No messages yet";
            text-align: center;
            color: #64748b;
            padding: 40px;
            font-size: 0.8rem;
            display: block;
        }

        /* ============ MESSAGE BUBBLES ============ */
        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message.admin {
            align-items: flex-end;
            margin-left: auto;
        }

        .chat-message.user {
            align-items: flex-start;
            margin-right: auto;
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            word-wrap: break-word;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        .chat-message.admin .message-bubble {
            background: linear-gradient(135deg, #00d4ff, #0891b2);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-message.user .message-bubble {
            background: rgba(255,255,255,0.08);
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
        }

        .message-sender {
            font-size: 0.55rem;
            color: #94a3b8;
            margin-bottom: 4px;
            padding: 0 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .message-time {
            font-size: 0.5rem;
            color: #64748b;
            margin-top: 4px;
            padding: 0 6px;
        }

        /* ============ INPUT AREA ============ */
        .chat-input-container {
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border-top: 1px solid rgba(0,212,255,0.1);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-message-input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 20px;
            color: white;
            font-size: 0.8rem;
            resize: none;
            font-family: inherit;
            max-height: 80px;
            transition: all 0.2s;
            line-height: 1.4;
            overflow-y: auto;
        }

        .chat-message-input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 2px rgba(0,212,255,0.1);
        }

        .chat-send-btn {
            background: linear-gradient(135deg, #00d4ff, #0891b2);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 10px rgba(0,212,255,0.4);
        }

        .chat-send-btn:active {
            transform: scale(0.95);
        }

        .chat-send-btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .chat-send-btn.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .chat-note {
            font-size: 0.55rem;
            color: #64748b;
            text-align: center;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .chat-loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        /* Mark as read button */
        .mark-read-btn {
            background: none;
            border: none;
            color: #00d4ff;
            font-size: 0.6rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .mark-read-btn:hover {
            background: rgba(0,212,255,0.1);
        }

        /* ============ MOBILE RESPONSIVE ============ */
        @media (max-width: 480px) {
            .chat-widget-container {
                width: calc(100vw - 32px);
                right: 16px;
                left: 16px;
                height: 65vh;
                bottom: 75px;
            }
            
            .chat-widget-container.minimized {
                width: calc(100vw - 32px);
            }
            
            .chat-message {
                max-width: 90%;
            }
            
            .message-bubble {
                font-size: 0.75rem;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-widget-container" id="chatContainer">
        <div class="chat-header" onclick="toggleMinimize()">
            <div class="chat-header-info">
                <div class="chat-avatar">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div>
                    <div class="chat-header-title">Admin Support</div>
                    <div class="chat-header-status">
                        <span class="online-dot"></span>
                        <span>Online</span>
                    </div>
                </div>
            </div>
            <div class="chat-header-actions">
                <button class="chat-minimize-btn" onclick="event.stopPropagation(); toggleMinimize()" title="Minimize">
                    <i class="fas fa-minus"></i>
                </button>
                <button class="chat-minimize-btn" onclick="event.stopPropagation(); closeAdminChat()" title="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        
        <div class="chat-body">
            <div class="user-selector">
                <select id="userSelect" class="user-select" onchange="changeSelectedUser()">
                    <option value="">-- Select a user to chat --</option>
                </select>
            </div>
            
            <div class="chat-messages-container" id="chatMessages">
                <div class="chat-loading"><i class="fas fa-spinner fa-pulse"></i> Loading users...</div>
            </div>
            
            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <textarea id="chatInput" class="chat-message-input" placeholder="Type your message here..." rows="1" maxlength="1000"></textarea>
                    <button class="chat-send-btn" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="chat-note">
                    <i class="fas fa-lock"></i> Private message - Only you and the user can see
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const API_BASE = window.location.origin;
            let currentUserId = null;
            let currentUserPhone = null;
            let currentUserName = null;
            let messagesRefreshInterval = null;
            let usersRefreshInterval = null;
            let allUsers = [];
            let isAdmin = true;
            
            // Admin info
            const ADMIN_ID = 'admin';
            const ADMIN_NAME = 'Admin';
            
            // ============ SECURE ESCAPE HTML ============
            function escapeHtml(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }
            
            // ============ MYANMAR TIME ============
            function getMyanmarTime(timestamp) {
                const date = new Date(timestamp);
                const utcTime = date.getTime();
                const myanmarOffset = 6.5 * 60 * 60 * 1000;
                const myanmarDate = new Date(utcTime + myanmarOffset);
                let hours = myanmarDate.getUTCHours();
                const minutes = myanmarDate.getUTCMinutes();
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12;
                const minutesStr = minutes < 10 ? '0' + minutes : minutes;
                return `${hours}:${minutesStr} ${ampm}`;
            }
            
            function getMyanmarDate(timestamp) {
                const date = new Date(timestamp);
                const utcTime = date.getTime();
                const myanmarOffset = 6.5 * 60 * 60 * 1000;
                const myanmarDate = new Date(utcTime + myanmarOffset);
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                return `${months[myanmarDate.getUTCMonth()]} ${myanmarDate.getUTCDate()}`;
            }
            
            // ============ LOAD USERS ============
            async function loadUsers() {
                try {
                    const response = await fetch(`${API_BASE}/api/admin/users`, {
                        credentials: 'include'
                    });
                    
                    if (response.status === 401) {
                        console.log('Not authenticated');
                        return;
                    }
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data.success && data.users) {
                        allUsers = data.users;
                        renderUserSelect();
                    }
                } catch (error) {
                    console.error('Error loading users:', error);
                }
            }
            
            function renderUserSelect() {
                const select = document.getElementById('userSelect');
                if (!select) return;
                
                if (!allUsers.length) {
                    select.innerHTML = '<option value="">-- No users found --</option>';
                    return;
                }
                
                let html = '<option value="">-- Select a user to chat --</option>';
                for (const user of allUsers) {
                    const displayName = user.username || user.phone || user.user_id || 'Unknown';
                    const unreadBadge = user.unread_count > 0 ? ` (${user.unread_count} new)` : '';
                    html += `<option value="${escapeHtml(user.user_id)}" data-phone="${escapeHtml(user.phone || '')}" data-name="${escapeHtml(displayName)}">
                        ${escapeHtml(displayName)} - ${escapeHtml(user.phone || 'No phone')}${unreadBadge}
                    </option>`;
                }
                select.innerHTML = html;
                
                // Keep selected user if still exists
                if (currentUserId) {
                    const optionExists = Array.from(select.options).some(opt => opt.value === currentUserId);
                    if (!optionExists) {
                        currentUserId = null;
                        currentUserPhone = null;
                        currentUserName = null;
                        const messagesContainer = document.getElementById('chatMessages');
                        if (messagesContainer) {
                            messagesContainer.innerHTML = '<div class="chat-loading">Select a user to start chatting</div>';
                        }
                    } else {
                        select.value = currentUserId;
                    }
                }
            }
            
            // ============ LOAD MESSAGES ============
            async function loadMessages() {
                const container = document.getElementById('chatMessages');
                if (!container) return;
                
                if (!currentUserId) {
                    container.innerHTML = '<div class="chat-loading"><i class="fas fa-comment-dots"></i><br>Select a user to start chatting</div>';
                    return;
                }
                
                try {
                    const response = await fetch(`${API_BASE}/api/chat/private/conversation?userId=${currentUserId}&otherId=${ADMIN_ID}`, {
                        credentials: 'include'
                    });
                    
                    if (!response.ok) {
                        // Fallback to original endpoints
                        const url1 = `${API_BASE}/api/chat/private/${currentUserId}?currentUserId=${ADMIN_ID}`;
                        const response1 = await fetch(url1);
                        const data1 = await response1.json();
                        
                        const url2 = `${API_BASE}/api/chat/private/${currentUserId}?currentUserId=${currentUserId}`;
                        const response2 = await fetch(url2);
                        const data2 = await response2.json();
                        
                        let allMessages = [];
                        if (data1.success && data1.messages) allMessages.push(...data1.messages);
                        if (data2.success && data2.messages) allMessages.push(...data2.messages);
                        
                        const uniqueMessages = [];
                        const seenIds = new Set();
                        for (const msg of allMessages) {
                            if (!seenIds.has(msg.id)) {
                                seenIds.add(msg.id);
                                uniqueMessages.push(msg);
                            }
                        }
                        uniqueMessages.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                        renderMessages(uniqueMessages);
                        return;
                    }
                    
                    const data = await response.json();
                    if (data.success && data.messages) {
                        renderMessages(data.messages);
                        // Mark as read
                        await markMessagesAsRead();
                    } else {
                        container.innerHTML = '<div class="chat-loading">No messages yet. Send a message to start the conversation!</div>';
                    }
                } catch (error) {
                    console.error('Error loading messages:', error);
                    container.innerHTML = '<div class="chat-loading">Cannot connect to server</div>';
                }
            }
            
            async function markMessagesAsRead() {
                if (!currentUserId) return;
                
                try {
                    await fetch(`${API_BASE}/api/chat/private/mark-read/${currentUserId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ admin_id: ADMIN_ID }),
                        credentials: 'include'
                    });
                    // Update user list to reset unread count
                    loadUsers();
                } catch (e) {
                    console.error('Error marking messages as read:', e);
                }
            }
            
            function renderMessages(messages) {
                const container = document.getElementById('chatMessages');
                if (!container) return;
                
                if (!messages || messages.length === 0) {
                    container.innerHTML = '<div class="chat-loading">No messages yet. Send a message to start the conversation!</div>';
                    return;
                }
                
                let html = '';
                let lastDate = null;
                
                for (const msg of messages) {
                    const myanmarTime = getMyanmarTime(msg.created_at);
                    const myanmarDate = getMyanmarDate(msg.created_at);
                    
                    // Admin is sender if sender_id is 'admin' or sender_id === ADMIN_ID
                    const isAdminMsg = msg.sender_id === ADMIN_ID || msg.sender_id === 'admin';
                    const senderName = isAdminMsg ? '👑 Admin (You)' : (msg.sender_name || 'User');
                    const senderIcon = isAdminMsg ? '<i class="fas fa-shield-alt"></i>' : '<i class="fas fa-user"></i>';
                    
                    if (lastDate !== myanmarDate) {
                        html += `<div style="text-align:center; margin:8px 0;"><span style="background:rgba(0,212,255,0.1); padding:2px 10px; border-radius:40px; font-size:0.55rem; color:#64748b;">📅 ${escapeHtml(myanmarDate)}</span></div>`;
                        lastDate = myanmarDate;
                    }
                    
                    html += `
                        <div class="chat-message ${isAdminMsg ? 'admin' : 'user'}">
                            <div class="message-sender">
                                ${senderIcon} ${escapeHtml(senderName)}
                            </div>
                            <div class="message-bubble">${escapeHtml(msg.message)}</div>
                            <div class="message-time">🕐 ${escapeHtml(myanmarTime)}</div>
                        </div>
                    `;
                }
                
                container.innerHTML = html;
                container.scrollTop = container.scrollHeight;
            }
            
            // ============ SEND MESSAGE ============
            async function sendMessage() {
                const input = document.getElementById('chatInput');
                const message = input.value.trim();
                const sendBtn = document.querySelector('.chat-send-btn');
                
                if (!message) return;
                
                if (!currentUserId) {
                    showNotification("Please select a user first", true);
                    return;
                }
                
                // Disable input and show loading
                input.disabled = true;
                sendBtn.disabled = true;
                const originalBtnHtml = sendBtn.innerHTML;
                sendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
                sendBtn.classList.add('loading');
                
                try {
                    const response = await fetch(`${API_BASE}/api/chat/private/send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sender_id: ADMIN_ID,
                            receiver_id: currentUserId,
                            sender_name: ADMIN_NAME,
                            receiver_name: currentUserName || 'User',
                            message: message
                        }),
                        credentials: 'include'
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        input.value = '';
                        autoResizeTextarea();
                        await loadMessages();
                        showNotification('✅ Message sent successfully');
                    } else {
                        showNotification(data.error || "Failed to send message", true);
                    }
                } catch (error) {
                    console.error('Send error:', error);
                    showNotification("Connection error: " + error.message, true);
                } finally {
                    input.disabled = false;
                    sendBtn.disabled = false;
                    sendBtn.innerHTML = originalBtnHtml;
                    sendBtn.classList.remove('loading');
                    input.focus();
                }
            }
            
            // ============ CHANGE SELECTED USER ============
            function changeSelectedUser() {
                const select = document.getElementById('userSelect');
                const selectedOption = select.options[select.selectedIndex];
                
                if (select.value) {
                    currentUserId = select.value;
                    currentUserPhone = selectedOption?.getAttribute('data-phone') || '';
                    currentUserName = selectedOption?.getAttribute('data-name') || 'User';
                    
                    console.log(`Selected user: ${currentUserName} (${currentUserId})`);
                    loadMessages();
                } else {
                    currentUserId = null;
                    currentUserPhone = null;
                    currentUserName = null;
                    const container = document.getElementById('chatMessages');
                    if (container) {
                        container.innerHTML = '<div class="chat-loading">Select a user to start chatting</div>';
                    }
                }
            }
            
            // ============ SHOW NOTIFICATION ============
            function showNotification(message, isError = false) {
                console.log(`🔔 ${isError ? 'Error' : 'Success'}: ${message}`);
                
                // Try to use parent toast
                try {
                    if (window.parent && window.parent.showToast) {
                        window.parent.showToast(message, isError);
                        return;
                    }
                } catch(e) {}
                
                // Create temporary toast
                const toast = document.createElement('div');
                toast.textContent = message;
                toast.style.cssText = `
                    position: fixed;
                    bottom: 100px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: ${isError ? '#f43f5e' : '#10b981'};
                    color: white;
                    padding: 8px 16px;
                    border-radius: 40px;
                    font-size: 0.75rem;
                    z-index: 2000;
                    white-space: nowrap;
                    animation: fadeIn 0.3s ease;
                `;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 2500);
            }
            
            // ============ AUTO RESIZE TEXTAREA ============
            function autoResizeTextarea() {
                const textarea = document.getElementById('chatInput');
                if (textarea) {
                    textarea.style.height = 'auto';
                    textarea.style.height = Math.min(textarea.scrollHeight, 80) + 'px';
                }
            }
            
            // ============ KEYBOARD SHORTCUTS ============
            function setupKeyboardShortcuts() {
                const input = document.getElementById('chatInput');
                if (input) {
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            sendMessage();
                        }
                    });
                    input.addEventListener('input', autoResizeTextarea);
                }
            }
            
            // ============ TOGGLE MINIMIZE ============
            function toggleMinimize() {
                const container = document.getElementById('chatContainer');
                if (container) {
                    container.classList.toggle('minimized');
                }
            }
            
            // ============ CLOSE CHAT ============
            function closeAdminChat() {
                // Clear intervals
                if (messagesRefreshInterval) {
                    clearInterval(messagesRefreshInterval);
                    messagesRefreshInterval = null;
                }
                if (usersRefreshInterval) {
                    clearInterval(usersRefreshInterval);
                    usersRefreshInterval = null;
                }
                
                // Try to call parent close function
                try {
                    if (window.parent && window.parent.closeAdminChatWidget) {
                        window.parent.closeAdminChatWidget();
                    }
                } catch(e) {}
                
                // Remove iframe if exists
                const container = document.getElementById('chatContainer');
                if (container) {
                    container.style.display = 'none';
                }
            }
            
            // ============ INITIALIZE ============
            async function init() {
                console.log('🚀 Admin Chat widget initializing...');
                
                await loadUsers();
                setupKeyboardShortcuts();
                
                // Refresh users every 30 seconds
                usersRefreshInterval = setInterval(() => {
                    loadUsers();
                }, 30000);
                
                // Refresh messages every 5 seconds when a user is selected
                messagesRefreshInterval = setInterval(() => {
                    if (currentUserId) {
                        loadMessages();
                    }
                }, 5000);
                
                console.log('✅ Admin Chat widget initialized');
            }
            
            // ============ CLEANUP ============
            function cleanup() {
                if (messagesRefreshInterval) {
                    clearInterval(messagesRefreshInterval);
                    messagesRefreshInterval = null;
                }
                if (usersRefreshInterval) {
                    clearInterval(usersRefreshInterval);
                    usersRefreshInterval = null;
                }
                console.log('🧹 Admin Chat widget cleaned up');
            }
            
            // Export functions to window
            window.toggleMinimize = toggleMinimize;
            window.closeAdminChat = closeAdminChat;
            window.sendMessage = sendMessage;
            window.changeSelectedUser = changeSelectedUser;
            window.autoResizeTextarea = autoResizeTextarea;
            
            // Start initialization
            init();
            window.addEventListener('beforeunload', cleanup);
        })();
    </script>
</body>
</html>
