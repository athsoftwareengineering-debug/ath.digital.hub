<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Support - ATH DIGITAL HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div class="chat-widget-container">
        <div class="chat-header">
            <div class="chat-header-info">
                <div class="chat-avatar">
                    <i class="fas fa-headset"></i>
                </div>
                <div>
                    <div class="chat-header-title">Customer Support</div>
                    <div class="chat-header-status">
                        <span class="online-dot"></span>
                        <span>Online</span>
                    </div>
                </div>
            </div>
            <div class="chat-header-actions">
                <button class="chat-minimize-btn" onclick="toggleChat()">
                    <i class="fas fa-minus"></i>
                </button>
            </div>
        </div>
        
        <div class="chat-body" id="chatBody">
            <div class="chat-messages-container" id="chatMessages">
                <div class="chat-loading">
                    <i class="fas fa-spinner fa-pulse"></i> Loading messages...
                </div>
            </div>
            
            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <textarea id="chatMessageInput" class="chat-message-input" placeholder="Type your message here..." rows="1" maxlength="500"></textarea>
                    <button class="chat-send-btn" id="chatSendBtn" onclick="sendChatMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="chat-note">
                    <i class="fas fa-lock"></i> Encrypted · 
                    <i class="fas fa-clock"></i> Admin will reply soon
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="chat.js"></script>
</body>
</html>
