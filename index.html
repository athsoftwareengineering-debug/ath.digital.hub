<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ATH DIGITAL HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #0a0c15;
            --bg-card: #0f111a;
            --cyan: #00d4ff;
            --emerald: #10b981;
            --rose: #f43f5e;
            --amber: #f59e0b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #1e293b;
        }
        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', 'Noto Sans Myanmar', sans-serif;
            min-height: 100vh;
            background-image: radial-gradient(ellipse at 20% 30%, rgba(139,92,246,0.1) 0%, transparent 50%);
            padding-bottom: 70px;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 0 16px; }
        
        /* ========== APP BAR ========== */
        .app-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(10,12,21,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,212,255,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .menu-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.3rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-btn:hover { background: rgba(255,255,255,0.05); }
        .logo {
            font-family: 'Space Grotesk', monospace;
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, #fff, var(--cyan));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            position: relative;
        }
        .badge {
            position: absolute;
            top: 5px;
            right: 5px;
            background: var(--rose);
            color: white;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 20px;
            min-width: 18px;
            text-align: center;
        }
        
        /* ========== BOTTOM NAVIGATION ========== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10,12,21,0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,212,255,0.1);
            display: flex;
            justify-content: space-around;
            padding: 8px 12px;
            padding-bottom: env(safe-area-inset-bottom, 12px);
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 40px;
            transition: all 0.2s;
            font-size: 0.7rem;
        }
        .nav-item i { font-size: 1.3rem; }
        .nav-item.active { color: var(--cyan); background: rgba(0,212,255,0.1); }
        .nav-item .nav-badge {
            position: absolute;
            margin-top: -8px;
            margin-left: 15px;
            background: var(--rose);
            color: white;
            font-size: 0.55rem;
            padding: 2px 5px;
            border-radius: 20px;
        }
        
        /* ========== HOME TAB ========== */
        .welcome-card {
            background: linear-gradient(135deg, rgba(0,212,255,0.1), rgba(139,92,246,0.05));
            border-radius: 1.5rem;
            padding: 20px;
            margin: 16px 0;
            text-align: center;
            border: 1px solid rgba(0,212,255,0.2);
        }
        .greeting { font-size: 1.2rem; margin-bottom: 8px; }
        .clothing-ad {
            background: var(--bg-card);
            border-radius: 1.2rem;
            padding: 16px;
            margin: 16px 0;
            text-align: center;
            border: 1px solid rgba(0,212,255,0.2);
            transition: transform 0.3s;
        }
        .clothing-ad:hover { transform: translateY(-3px); border-color: var(--cyan); }
        .ad-img {
            width: 100%;
            border-radius: 1rem;
            margin-bottom: 10px;
        }
        .ad-badge {
            display: inline-block;
            background: rgba(0,212,255,0.15);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            margin: 6px;
        }
        .quick-actions {
            display: flex;
            gap: 12px;
            margin: 16px 0;
        }
        .quick-btn {
            flex: 1;
            background: rgba(0,212,255,0.1);
            border: 1px solid rgba(0,212,255,0.2);
            padding: 12px;
            border-radius: 1rem;
            text-align: center;
            cursor: pointer;
        }
        .announcement {
            background: rgba(245,158,11,0.1);
            border-left: 3px solid var(--amber);
            padding: 12px;
            border-radius: 0.8rem;
            margin: 16px 0;
        }
        
        /* ========== PLAN TAB ========== */
        .plan-card {
            background: linear-gradient(145deg, var(--bg-card), #0a0c15);
            border-radius: 1.2rem;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(0,212,255,0.1);
            transition: all 0.3s;
        }
        .plan-card:hover { transform: translateY(-3px); border-color: rgba(0,212,255,0.3); }
        .plan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .plan-name { font-size: 1.1rem; font-weight: 700; color: var(--cyan); }
        .plan-price { font-size: 1.2rem; font-weight: 800; color: var(--emerald); }
        .plan-features { list-style: none; margin: 12px 0; }
        .plan-features li { font-size: 0.75rem; margin: 8px 0; display: flex; align-items: center; gap: 8px; color: var(--text-secondary); }
        .buy-plan-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--cyan), #0891b2);
            border: none;
            padding: 10px;
            border-radius: 60px;
            color: #030712;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
        }
        
        /* ========== ORDERS TAB ========== */
        .order-card {
            background: var(--bg-card);
            border-radius: 1rem;
            padding: 14px;
            margin-bottom: 12px;
            border-left: 3px solid var(--cyan);
        }
        .order-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 600;
        }
        .status-pending { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .status-approved { background: rgba(16,185,129,0.2); color: #34d399; }
        .status-rejected { background: rgba(244,63,94,0.2); color: #fb7185; }
        .date-row { display: flex; gap: 12px; margin-top: 10px; font-size: 0.65rem; }
        .countdown { background: rgba(0,212,255,0.08); padding: 6px; border-radius: 40px; text-align: center; margin-top: 10px; }
        
        /* ========== LIVE TAB ========== */
        .live-card {
            background: var(--bg-card);
            border-radius: 1rem;
            padding: 14px;
            margin-bottom: 12px;
            border-left: 3px solid var(--amber);
            animation: slideUp 0.7s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .live-card.new-order { animation: slideUp 0.7s ease-out, blinkCyan 2s ease-in-out 1; }
        @keyframes blinkCyan {
            0% { background: rgba(0,212,255,0); border-left-color: var(--amber); }
            50% { background: rgba(0,212,255,0.25); border-left-color: var(--cyan); box-shadow: 0 0 15px var(--cyan); }
            100% { background: rgba(0,212,255,0); border-left-color: var(--amber); }
        }
        .live-card.search-highlight { animation: blinkAmber 2s ease-in-out 1; }
        @keyframes blinkAmber {
            0% { background: rgba(245,158,11,0); border-left-color: var(--amber); }
            50% { background: rgba(245,158,11,0.3); border-left-color: #fbbf24; box-shadow: 0 0 15px var(--amber); }
            100% { background: rgba(245,158,11,0); border-left-color: var(--amber); }
        }
        
        /* ========== PROFILE TAB ========== */
        .profile-card {
            background: var(--bg-card);
            border-radius: 1.5rem;
            padding: 20px;
            text-align: center;
            margin: 16px 0;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--cyan), #0891b2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 2rem;
        }
        .stats-grid-profile {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .stat-box {
            background: rgba(0,212,255,0.05);
            padding: 12px;
            border-radius: 1rem;
            text-align: center;
        }
        .stat-number { font-size: 1.3rem; font-weight: 800; color: var(--cyan); }
        .support-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 16px 0;
        }
        .support-link {
            background: rgba(0,212,255,0.1);
            padding: 8px 16px;
            border-radius: 40px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logout-btn {
            width: 100%;
            background: rgba(244,63,94,0.2);
            border: 1px solid rgba(244,63,94,0.3);
            padding: 12px;
            border-radius: 60px;
            color: #fb7185;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }
        .ban-message {
            background: rgba(244,63,94,0.15);
            border: 1px solid var(--rose);
            border-radius: 1rem;
            padding: 20px;
            text-align: center;
            margin: 16px 0;
        }
        
        /* ========== LOGIN SCREEN ========== */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-box {
            background: var(--bg-card);
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
            border: 1px solid rgba(0,212,255,0.3);
            width: 100%;
            max-width: 350px;
        }
        .login-box input {
            width: 100%;
            padding: 14px;
            margin: 16px 0;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 60px;
            color: white;
        }
        .login-submit {
            background: linear-gradient(135deg, var(--cyan), #0891b2);
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
        }
        
        .hidden { display: none; }
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--emerald);
            color: #030712;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 0.8rem;
            z-index: 1000;
            display: none;
            white-space: nowrap;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <i class="fas fa-mobile-alt" style="font-size: 2rem; color: var(--cyan);"></i>
        <h3>ATH DIGITAL HUB</h3>
        <p style="font-size: 0.7rem; color: var(--text-secondary);">ဝယ်ထားသော Plan များကြည့်ရန်</p>
        <input type="tel" id="loginPhone" placeholder="📱 09xxxxxxxxx">
        <button class="login-submit" onclick="login()">ဝင်ရောက်မည်</button>
    </div>
</div>

<div id="mainApp" style="display: none;">
    <!-- App Bar -->
    <div class="app-bar">
        <button class="menu-btn" onclick="toggleDrawer()"><i class="fas fa-bars"></i></button>
        <div class="logo">⚡ ATH DIGITAL HUB</div>
        <div style="display: flex; gap: 8px;">
            <button class="icon-btn" onclick="showNotifications()"><i class="fas fa-bell"></i><span id="notiBadge" class="badge hidden">0</span></button>
            <button class="icon-btn" onclick="toggleLanguage()"><i class="fas fa-globe"></i><span id="langText">🇲🇲</span></button>
        </div>
    </div>

    <!-- Tab Content -->
    <div class="container">
        <div id="homeTab" class="tab-content active">
            <div class="welcome-card">
                <div class="greeting">🌤️ မင်္ဂလာပါ, <span id="userName">မောင်မောင်</span></div>
                <div id="userPhoneDisplay" style="font-size: 0.7rem; color: var(--text-secondary);"></div>
            </div>
            
            <div class="clothing-ad" onclick="window.open('https://www.facebook.com/your-clothing-page', '_blank')">
                <img src="https://via.placeholder.com/600x200?text=Shwe+Clothing+Summer+Sale" class="ad-img" alt="Shwe Clothing" id="adImage">
                <div><span class="ad-badge"><i class="fas fa-tag"></i> 30% OFF</span><span class="ad-badge"><i class="fas fa-truck"></i> Free Delivery</span></div>
                <div style="margin-top: 8px; font-weight: 600;">Shwe Clothing Collection <i class="fas fa-arrow-right"></i></div>
            </div>
            
            <div class="quick-actions">
                <div class="quick-btn" onclick="switchTab('plans')"><i class="fas fa-sim-card"></i><br>Data Plan</div>
                <div class="quick-btn" onclick="switchTab('orders')"><i class="fas fa-list-ul"></i><br>My Orders</div>
                <div class="quick-btn" onclick="switchTab('live')"><i class="fas fa-broadcast-tower"></i><br>Live</div>
            </div>
            
            <div class="announcement">
                <i class="fas fa-bullhorn"></i> 🎉 New VIP Plan များ ထပ်ထည့်ထားပါသည်။ ယခုပဲ ဝယ်ယူလိုက်ပါ။
            </div>
        </div>

        <div id="plansTab" class="tab-content">
            <div id="plansContainer"></div>
        </div>

        <div id="ordersTab" class="tab-content">
            <div id="myOrdersContainer"><div class="loading" style="text-align:center; padding:40px;"><i class="fas fa-spinner fa-pulse"></i> Loading...</div></div>
        </div>

        <div id="liveTab" class="tab-content">
            <div class="search-section" style="margin-bottom: 16px;">
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="liveSearchInput" class="search-input" style="flex:1; background:rgba(0,0,0,0.5); border:1px solid #2d3a5e; border-radius:60px; padding:10px;" placeholder="🔍 Phone or User ID">
                    <button class="search-btn" onclick="searchLive()" style="background:var(--cyan); border:none; padding:0 16px; border-radius:60px;">ရှာ</button>
                    <button class="clear-btn" onclick="clearLiveSearch()" style="background:#334155; border:none; padding:0 12px; border-radius:60px;"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div id="liveContainer"><div class="loading" style="text-align:center; padding:40px;"><i class="fas fa-spinner fa-pulse"></i> Loading LIVE...</div></div>
        </div>

        <div id="profileTab" class="tab-content">
            <div id="profileContainer"></div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-item" data-tab="home"><i class="fas fa-home"></i><span>Home</span></button>
        <button class="nav-item" data-tab="plans"><i class="fas fa-sim-card"></i><span>Plan များ</span></button>
        <button class="nav-item" data-tab="orders"><i class="fas fa-list-ul"></i><span>My Orders</span></button>
        <button class="nav-item" data-tab="live"><i class="fas fa-broadcast-tower"></i><span>Live</span></button>
        <button class="nav-item" data-tab="profile"><i class="fas fa-user"></i><span>Profile</span></button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    const API_BASE = window.location.origin;
    let currentUser = null;
    let userStats = null;
    let allOrders = [];
    let liveOrders = [];
    let currentTab = "home";
    let liveRotateInterval = null;
    let liveRefreshInterval = null;
    let currentLiveIndex = 0;
    let currentLiveSearch = "";
    let liveCardsPerPage = window.innerWidth < 480 ? 1 : (window.innerWidth < 768 ? 2 : 4);
    
    // Plans Data
    const plans = [
        { name: "VIP LEVEL 1", price: 15000, features: ["22GB အမြန်နှုန်းမြင့်", "8,000 မိနစ် (ကွန်ရက်တွင်း)", "5,000 SMS"], color: "#fbbf24", icon: "🔥" },
        { name: "VIP LEVEL 2", price: 20000, features: ["40GB အာထရာဒေတာ", "250 မိနစ် (ကွန်ရက်တွင်း)", "25 မိနစ် (အခြားကွန်ရက်)"], color: "#00d4ff", icon: "⭐" },
        { name: "VIP LEVEL 3", price: 25000, features: ["40GB အမြန်နှုန်း + အပို", "1,400 မိနစ် (ကွန်ရက်တွင်း)", "8,000 SMS အကန့်အသတ်မရှိ"], color: "#22c55e", icon: "⭐" },
        { name: "VIP LEVEL 4 (ULTRA)", price: 30000, features: ["120GB ဂိမ်းဒေတာ", "အကန့်အသတ်မရှိ Streaming", "ဦးစားပေး ပံ့ပိုးမှု"], color: "#8b5cf6", icon: "👑" }
    ];
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#f43f5e' : '#10b981';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }
    
    function maskPhone(phone) {
        if (!phone || phone.length < 8) return phone || '';
        return phone.substring(0, 5) + '***' + phone.substring(phone.length - 3);
    }
    
    function getRemainingTime(activatedAt) {
        if (!activatedAt) return null;
        const remain = new Date(activatedAt).getTime() + (30 * 24 * 60 * 60 * 1000) - Date.now();
        if (remain <= 0) return "Expired";
        const days = Math.floor(remain / 86400000);
        const hours = Math.floor((remain % 86400000) / 3600000);
        const mins = Math.floor((remain % 3600000) / 60000);
        return `${days}ရက် ${hours}နာရီ ${mins}မိနစ်`;
    }
    
    async function login() {
        const phone = document.getElementById('loginPhone').value.trim();
        if (!phone || phone.length < 9) {
            showToast("ဖုန်းနံပါတ် မှန်ကန်စွာ ထည့်ပါ", true);
            return;
        }
        
        // Check if user is banned
        const statsRes = await fetch(`${API_BASE}/api/admin/user-stats`);
        const statsData = await statsRes.json();
        const userStat = statsData.stats?.find(u => u.phone === phone);
        
        if (userStat?.blocked) {
            showToast("သင့်အကောင့်အား ပိတ်ထားပါသည်။ Customer Support ကို ဆက်သွယ်ပါ။", true);
            return;
        }
        
        currentUser = phone;
        localStorage.setItem('userPhone', phone);
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('userName').innerHTML = maskPhone(phone);
        document.getElementById('userPhoneDisplay').innerHTML = `📞 ${phone}`;
        
        await loadUserData();
        await loadLiveOrders();
        startLiveRotation();
        startLiveRefresh();
        renderPlans();
        renderProfile();
    }
    
    async function loadUserData() {
        const res = await fetch(`${API_BASE}/api/orders/${encodeURIComponent(currentUser)}`);
        const data = await res.json();
        allOrders = data.orders || [];
        renderMyOrders();
    }
    
    async function loadLiveOrders() {
        const res = await fetch(`${API_BASE}/api/admin/orders`);
        const data = await res.json();
        if (data.orders) {
            liveOrders = data.orders.filter(o => o.phone !== currentUser);
            renderLiveOrders();
        }
    }
    
    function renderPlans() {
        const container = document.getElementById('plansContainer');
        let html = '';
        for (const plan of plans) {
            html += `
                <div class="plan-card">
                    <div class="plan-header">
                        <span class="plan-name">${plan.icon} ${plan.name}</span>
                        <span class="plan-price">${plan.price.toLocaleString()} MMK</span>
                    </div>
                    <ul class="plan-features">
                        ${plan.features.map(f => `<li><i class="fas fa-check-circle" style="color:var(--emerald);"></i> ${f}</li>`).join('')}
                    </ul>
                    <button class="buy-plan-btn" onclick="openPaymentModal('${plan.name}', ${plan.price})">ဝယ်ယူမည်</button>
                </div>
            `;
        }
        container.innerHTML = html;
    }
    
    function renderMyOrders() {
        const container = document.getElementById('myOrdersContainer');
        if (!allOrders.length) {
            container.innerHTML = '<div class="loading" style="text-align:center; padding:40px;">📭 အော်ဒါမရှိသေးပါ</div>';
            return;
        }
        let html = '';
        for (const o of allOrders) {
            let statusClass = o.status === 'Pending' ? 'status-pending' : (o.status === 'Approved' ? 'status-approved' : 'status-rejected');
            let statusText = o.status === 'Pending' ? '⏳ စောင့်ဆိုင်းဆဲ' : (o.status === 'Approved' ? '✅ အတည်ပြုပြီး' : '❌ ပယ်ဖျက်ခံရ');
            let countdownHtml = '';
            if (o.status === 'Approved' && o.activated_at) {
                countdownHtml = `<div class="countdown"><i class="fas fa-hourglass-half"></i> ကျန်ရှိ: ${getRemainingTime(o.activated_at)}</div>`;
            }
            html += `
                <div class="order-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:700;">${o.plan}</span>
                        <span class="order-status ${statusClass}">${statusText}</span>
                    </div>
                    <div style="margin-top:8px;">📞 ${o.phone}</div>
                    <div style="font-weight:700; color:var(--emerald);">${o.price.toLocaleString()} MMK</div>
                    <div class="date-row">
                        <span>📅 ဝယ်ရက်: ${new Date(o.created_at).toLocaleDateString()}</span>
                    </div>
                    ${o.status === 'Approved' && o.activated_at ? `
                        <div class="date-row">
                            <span>📅 စတင်ရက်: ${new Date(o.activated_at).toLocaleDateString()}</span>
                            <span>📅 ကုန်ဆုံးရက်: ${new Date(new Date(o.activated_at).getTime() + 30*86400000).toLocaleDateString()}</span>
                        </div>
                    ` : ''}
                    ${countdownHtml}
                </div>
            `;
        }
        container.innerHTML = html;
    }
    
    function renderLiveOrders() {
        const container = document.getElementById('liveContainer');
        let filtered = [...liveOrders];
        if (currentLiveSearch) {
            filtered = filtered.filter(o => o.phone.includes(currentLiveSearch) || o.user_id?.includes(currentLiveSearch));
        }
        
        if (!filtered.length) {
            container.innerHTML = '<div class="loading" style="text-align:center; padding:40px;">🔴 လက်ရှိ LIVE အော်ဒါမရှိပါ</div>';
            return;
        }
        
        // Show only cardsPerPage cards
        const start = currentLiveIndex;
        const end = start + liveCardsPerPage;
        const visibleOrders = filtered.slice(start, end);
        
        let html = '';
        for (const o of visibleOrders) {
            let statusClass = o.status === 'Pending' ? 'status-pending' : (o.status === 'Approved' ? 'status-approved' : 'status-rejected');
            let statusText = o.status === 'Pending' ? '⏳ Pending' : (o.status === 'Approved' ? '✅ Approved' : '❌ Rejected');
            html += `
                <div class="live-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:700; color:var(--amber);">${o.plan}</span>
                        <span class="order-status ${statusClass}">${statusText}</span>
                    </div>
                    <div style="margin-top:8px;">📞 ${maskPhone(o.phone)}</div>
                    <div style="font-weight:700; color:var(--emerald);">${o.price.toLocaleString()} MMK</div>
                    ${o.status === 'Approved' && o.activated_at ? `<div class="countdown" style="margin-top:8px;"><i class="fas fa-hourglass-half"></i> ကျန်ရှိ: ${getRemainingTime(o.activated_at)}</div>` : ''}
                </div>
            `;
        }
        container.innerHTML = html;
        
        // Update index for next rotation
        if (filtered.length > liveCardsPerPage) {
            currentLiveIndex = (currentLiveIndex + liveCardsPerPage) % filtered.length;
        }
    }
    
    function startLiveRotation() {
        if (liveRotateInterval) clearInterval(liveRotateInterval);
        liveRotateInterval = setInterval(() => {
            renderLiveOrders();
        }, 5000);
    }
    
    async function startLiveRefresh() {
        if (liveRefreshInterval) clearInterval(liveRefreshInterval);
        liveRefreshInterval = setInterval(async () => {
            await loadLiveOrders();
        }, 30000);
    }
    
    function searchLive() {
        currentLiveSearch = document.getElementById('liveSearchInput').value.trim();
        currentLiveIndex = 0;
        renderLiveOrders();
        setTimeout(() => {
            const highlighted = document.querySelector('.live-card.search-highlight');
            if (highlighted) highlighted.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    }
    
    function clearLiveSearch() {
        currentLiveSearch = "";
        document.getElementById('liveSearchInput').value = "";
        currentLiveIndex = 0;
        renderLiveOrders();
    }
    
    async function renderProfile() {
        const container = document.getElementById('profileContainer');
        
        // Get user stats
        const statsRes = await fetch(`${API_BASE}/api/admin/user-stats`);
        const statsData = await statsRes.json();
        userStats = statsData.stats?.find(u => u.phone === currentUser);
        
        const orderCount = allOrders.length;
        const approvedCount = allOrders.filter(o => o.status === 'Approved').length;
        const pendingCount = allOrders.filter(o => o.status === 'Pending').length;
        const rejectedCount = allOrders.filter(o => o.status === 'Rejected').length;
        
        let banHtml = '';
        if (userStats?.blocked) {
            banHtml = `
                <div class="ban-message">
                    <i class="fas fa-ban" style="font-size: 2rem; color: var(--rose);"></i>
                    <h3>🔴 သင့်အကောင့်အား ပိတ်ထားပါသည်</h3>
                    <p style="margin-top: 8px;">ဆက်လက်အသုံးပြုလိုပါက Customer Support ကို ဆက်သွယ်ပါ။</p>
                </div>
            `;
        }
        
        container.innerHTML = `
            <div class="profile-card">
                <div class="avatar"><i class="fas fa-user"></i></div>
                <h3>${maskPhone(currentUser)}</h3>
                <div style="font-size:0.7rem; color:var(--text-secondary); margin-top:4px;">🆔 User ID: ${userStats?.user_id || 'N/A'}</div>
                ${banHtml}
                <div class="stats-grid-profile">
                    <div class="stat-box"><div class="stat-number">${orderCount}</div><div>စုစုပေါင်း</div></div>
                    <div class="stat-box"><div class="stat-number" style="color:var(--emerald);">${approvedCount}</div><div>အတည်ပြုပြီး</div></div>
                    <div class="stat-box"><div class="stat-number" style="color:var(--amber);">${pendingCount}</div><div>စောင့်ဆိုင်းဆဲ</div></div>
                    <div class="stat-box"><div class="stat-number" style="color:var(--rose);">${rejectedCount}</div><div>ပယ်ဖျက်ခံရ</div></div>
                </div>
            </div>
            <div class="profile-card">
                <h4><i class="fas fa-headset"></i> Customer Support</h4>
                <div class="support-links">
                    <a href="https://t.me/ATHsupport" class="support-link"><i class="fab fa-telegram"></i> Telegram</a>
                    <a href="https://www.facebook.com/athdigitalhub" class="support-link"><i class="fab fa-facebook"></i> Facebook</a>
                    <a href="tel:09789999368" class="support-link"><i class="fas fa-phone"></i> Phone</a>
                    <a href="viber://chat?number=09799480995" class="support-link"><i class="fab fa-viber"></i> Viber</a>
                </div>
                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> ထွက်ရန်</button>
            </div>
        `;
    }
    
    function logout() {
        localStorage.removeItem('userPhone');
        currentUser = null;
        if (liveRotateInterval) clearInterval(liveRotateInterval);
        if (liveRefreshInterval) clearInterval(liveRefreshInterval);
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('mainApp').style.display = 'none';
        showToast("ထွက်ရန် အောင်မြင်ပါသည်။");
    }
    
    function openPaymentModal(plan, price) {
        // Simple payment modal - you can expand this
        showToast(`Order placed for ${plan} - ${price.toLocaleString()} MMK`);
    }
    
    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(`${tab}Tab`).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(item => {
            if (item.dataset.tab === tab) item.classList.add('active');
            else item.classList.remove('active');
        });
        
        if (tab === 'orders') loadUserData();
        if (tab === 'live') renderLiveOrders();
        if (tab === 'profile') renderProfile();
    }
    
    function toggleDrawer() {
        showToast("Menu Drawer - Coming Soon");
    }
    
    function showNotifications() {
        showToast("No new notifications");
    }
    
    function toggleLanguage() {
        showToast("Language: Myanmar");
    }
    
    // Initialize
    window.addEventListener('resize', () => {
        liveCardsPerPage = window.innerWidth < 480 ? 1 : (window.innerWidth < 768 ? 2 : 4);
        if (currentTab === 'live') renderLiveOrders();
    });
    
    const savedPhone = localStorage.getItem('userPhone');
    if (savedPhone) {
        document.getElementById('loginPhone').value = savedPhone;
        login();
    }
    
    document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
    
    window.switchTab = switchTab;
    window.openPaymentModal = openPaymentModal;
    window.login = login;
    window.logout = logout;
    window.searchLive = searchLive;
    window.clearLiveSearch = clearLiveSearch;
    window.toggleDrawer = toggleDrawer;
    window.showNotifications = showNotifications;
    window.toggleLanguage = toggleLanguage;
</script>
</body>
</html>
