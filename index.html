        :root {
            --primary: #00d4ff;
            --primary-dark: #0099cc;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #f43f5e;
            --dark: #0a0c15;
            --darker: #05070f;
            --card-bg: linear-gradient(145deg, #11131e, #0c0e16);
            --glass: rgba(18,22,35,0.8);
        }
        
        body {

            color: #fff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

        }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 16px; }
        
        /* Header */
        .header {
            background: rgba(10,12,21,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 20px;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo img {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,212,255,0.3);
        }
        
        .logo h1 {
            font-size: 1.3rem;
            background: linear-gradient(135deg, #fff, var(--primary));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        
        .logo p {
            font-size: 0.65rem;
            color: #64748b;
            margin-top: 2px;
        }
        
        .cart-btn {
            background: rgba(0,212,255,0.15);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            font-weight: 600;
        }
        
        .cart-btn:hover {
            background: rgba(0,212,255,0.3);
            transform: scale(1.02);
        }
        
        .cart-count {
            background: var(--danger);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        
        /* Categories */
        .categories {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            justify-content: center;
        }
        
        .cat-btn {
            background: rgba(18,22,35,0.8);
            border: 1px solid rgba(0,212,255,0.2);
            padding: 10px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
            font-weight: 500;
        }
        
        .cat-btn:hover {
            background: rgba(0,212,255,0.15);
            transform: translateY(-2px);
        }
        
        .cat-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #030712;
            border-color: transparent;
            box-shadow: 0 5px 15px rgba(0,212,255,0.3);
        }
        
        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }
        
        .product-card {
            background: var(--card-bg);
            border: 1px solid rgba(0,212,255,0.1);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--primary));
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .product-card:hover {
            transform: translateY(-8px);
            border-color: rgba(0,212,255,0.4);
            box-shadow: 0 20px 30px -15px rgba(0,212,255,0.2);
        }
        
        .product-card:hover::before { opacity: 1; }
        
        .product-type-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,212,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--primary);
            backdrop-filter: blur(5px);
        }
        
        .product-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .product-name {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .product-category {
            font-size: 0.65rem;
            color: var(--primary);
            margin-bottom: 10px;
            display: inline-block;
            padding: 3px 10px;
            background: rgba(0,212,255,0.1);
            border-radius: 20px;
        }
        
        .product-desc {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        
        .product-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 15px;
        }
        
        .add-btn {

            color: var(--primary);

            transition: all 0.2s;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;

        .add-btn:hover {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #030712;
            transform: scale(0.98);
        }
        
        /* Cart Sidebar */

            justify-content: center;

            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            color: white;

            height: 28px;

            padding: 12px;
            margin: 10px 0;
            background: rgba(0,0,0,0.5);

            border-radius: 40px;
            color: white;

            bottom: 20px;
            right: 20px;
            background: var(--success);
            color: #030712;
            padding: 12px 24px;
            border-radius: 40px;

            display: none;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            align-items: center;
            gap: 10px;
        }
        
        .toast.show { display: flex; animation: slideIn 0.3s ease; }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Footer */

        .social-icon.telegram { background: #0088cc; }
        .social-icon.viber { background: #7360f2; }

            .logo h1 { font-size: 1rem; }
        }

            padding: 40px;
            color: #64748b;
        }
        
        .hidden { display: none; }
    </style>
</head>

    ];
    
    // Categories
    const categoryNames = {
        all: { name: "အားလုံး", icon: "📦", color: "#00d4ff" },
        data: { name: "Data Plans", icon: "📡", color: "#00d4ff" },
        digital_product: { name: "Digital Products", icon: "🖥️", color: "#8b5cf6" },
        digital_course: { name: "Digital Courses", icon: "🎓", color: "#e11d48" },
        game_items: { name: "Game Items", icon: "🎮", color: "#f59e0b" },
        language_course: { name: "Language Courses", icon: "🌐", color: "#06b6d4" },
        pdf_books: { name: "PDF Books", icon: "📘", color: "#22c55e" },
        video_content: { name: "Video Content", icon: "🎬", color: "#ec4899" },
        clothing: { name: "Clothing", icon: "👕", color: "#10b981" },
        other: { name: "Others", icon: "🎁", color: "#64748b" }
    };
    
    let cart = [];
    let currentCategory = 'all';
    
    function getProductTypeName(type) {
        const types = { standard: '📦 Standard', digital: '💾 Digital', course: '🎓 Course', game: '🎮 Game', pdf: '📘 PDF', video: '🎬 Video' };
        return types[type] || type;
    }
    
    function renderCategories() {
        const container = document.getElementById('categories');
        let html = '';
        for (const [key, cat] of Object.entries(categoryNames)) {
            html += `<button class="cat-btn ${currentCategory === key ? 'active' : ''}" onclick="setCategory('${key}')" style="border-left: 3px solid ${cat.color};">${cat.icon} ${cat.name}</button>`;
        }
        container.innerHTML = html;
    }
    
    function setCategory(catId) {
        currentCategory = catId;
        renderCategories();
        renderProducts();
    }
    
    function renderProducts() {
        let filtered = products;
        if (currentCategory !== 'all') {
            filtered = products.filter(p => p.categoryId === currentCategory);
        }
        const container = document.getElementById('productsGrid');
        if (filtered.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:60px; color:#64748b;"><i class="fas fa-box-open" style="font-size:3rem; margin-bottom:15px;"></i><br>📭 ထုတ်ကုန်မရှိပါ</div>';
            return;
        }
        container.innerHTML = filtered.map(p => {
            const cat = categoryNames[p.categoryId] || categoryNames.other;
            return `
                <div class="product-card">
                    <div class="product-type-badge">${getProductTypeName(p.type)}</div>
                    <div class="product-icon">${p.icon}</div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-category">${cat.icon} ${cat.name}</div>
                    <div class="product-desc">${p.desc}</div>
                    <div class="product-price">${p.price.toLocaleString()} Ks</div>
                    <button class="add-btn" onclick="addToCart(${p.id})"><i class="fas fa-cart-plus"></i> ဈေးခြင်းထဲထည့်ရန်</button>
                </div>
            `;
        }).join('');
    }
    
    function addToCart(id) {
        const product = products.find(p => p.id === id);
        const existing = cart.find(i => i.id === id);
        if (existing) {
            existing.qty++;
        } else {
            cart.push({ ...product, qty: 1 });
        }
        updateCartUI();
        showToast(`${product.name} ထည့်သွင်းပြီး`);
    }
    
    function updateCartUI() {
        const count = cart.reduce((s, i) => s + i.qty, 0);
        document.getElementById('cartCount').innerText = count;
        
        const container = document.getElementById('cartItems');
        if (cart.length === 0) {
            container.innerHTML = '<div class="empty-cart"><i class="fas fa-shopping-cart" style="font-size:3rem; margin-bottom:10px;"></i><br>ဈေးခြင်းထဲတွင် ပစ္စည်းမရှိပါ</div>';
            document.getElementById('cartTotal').innerHTML = 'Total: 0 Ks';
            return;
        }
        
        let total = 0;
        container.innerHTML = cart.map(item => {
            total += item.price * item.qty;
            return `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.name}</div>
                        <div class="cart-item-price">${item.price.toLocaleString()} Ks</div>
                        <div class="cart-item-type">${getProductTypeName(item.type)}</div>
                    </div>
                    <div class="cart-item-actions">
                        <button class="cart-qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                        <span class="cart-qty">${item.qty}</span>
                        <button class="cart-qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                        <button class="cart-remove-btn" onclick="removeFromCart(${item.id})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `;
        }).join('');
        document.getElementById('cartTotal').innerHTML = `Total: ${total.toLocaleString()} Ks`;
    }
    
    function updateQty(id, delta) {
        const item = cart.find(i => i.id === id);
        if (item) {
            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
        }
    }
    
    function removeFromCart(id) {
        cart = cart.filter(i => i.id !== id);
        updateCartUI();
        showToast('ပစ္စည်းဖယ်ရှားပြီး');
    }
    
    async function placeOrder(phone, file) {
        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        const items = cart.map(i => `${i.name} x${i.qty}`).join(', ');
        const fd = new FormData();
        fd.append('phone', phone);
        fd.append('plan', items);
        fd.append('price', total);
        fd.append('slip', file);
        const res = await fetch('/api/orders', { method: 'POST', body: fd });
        return await res.json();
    }
    
    // Event Listeners
    document.getElementById('cartBtn').addEventListener('click', () => {
        document.getElementById('cartSidebar').classList.add('open');
    });
    document.getElementById('closeCartBtn').addEventListener('click', () => {
        document.getElementById('cartSidebar').classList.remove('open');
    });
    document.getElementById('checkoutBtn').addEventListener('click', () => {
        if (cart.length === 0) {
            showToast('ဈေးခြင်းထဲတွင် ပစ္စည်းမရှိပါ', true);
            return;
        }
        document.getElementById('paymentModal').classList.add('active');
    });
    document.getElementById('copyPhone').addEventListener('click', () => {
        navigator.clipboard.writeText("09789999368");
        showToast('ဖုန်းနံပါတ် ကူးယူပြီး');
    });
    
    document.getElementById('orderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const phone = document.getElementById('phone').value.trim();
        const file = document.getElementById('slip').files[0];
        if (!phone) { showToast('ဖုန်းနံပါတ်ထည့်ပါ', true); return; }
        if (!file) { showToast('ငွေလွှဲပြေစာထည့်ပါ', true); return; }
        if (cart.length === 0) { showToast('ဈေးခြင်းထဲတွင် ပစ္စည်းမရှိပါ', true); return; }
        
        const result = await placeOrder(phone, file);
        if (result.success) {
            showToast(`အော်ဒါအောင်မြင်ပါပြီ။ Order ID: ${result.orderId}`);
            cart = [];
            updateCartUI();
            document.getElementById('paymentModal').classList.remove('active');
            document.getElementById('orderForm').reset();
        } else {
            showToast(`အော်ဒါတင်ရာတွင် အမှား: ${result.error}`, true);
        }
    });
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        toastMsg.innerText = msg;
        toast.style.backgroundColor = isError ? '#f43f5e' : '#10b981';
        toast.querySelector('i').className = isError ? 'fas fa-exclamation-triangle' : 'fas fa-check-circle';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
    
    // Close modal on outside click
    window.onclick = (e) => {
        const modal = document.getElementById('paymentModal');
        if (e.target === modal) modal.classList.remove('active');
    };
    
    // Initialize
    renderCategories();
    renderProducts();
    
    window.setCategory = setCategory;
    window.addToCart = addToCart;
    window.updateQty = updateQty;
    window.removeFromCart = removeFromCart;
</script>
</body>
</html>
