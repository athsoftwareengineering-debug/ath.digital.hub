<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ATH DIGITAL HUB - Digital Products Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0c15;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
        
        .header {
            background: rgba(10,12,21,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 20px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo img { width: 45px; height: 45px; border-radius: 12px; }
        .logo h1 { font-size: 1.2rem; background: linear-gradient(135deg, #fff, #00d4ff); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .cart-btn {
            background: rgba(0,212,255,0.15);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cart-count { background: #f43f5e; border-radius: 50%; width: 22px; height: 22px; font-size: 0.7rem; display: inline-flex; align-items: center; justify-content: center; }
        
        .categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            justify-content: center;
        }
        .cat-btn {
            background: rgba(18,22,35,0.8);
            border: 1px solid rgba(0,212,255,0.2);
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .cat-btn.active { background: #00d4ff; color: #030712; }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .product-card {
            background: linear-gradient(145deg, #11131e, #0c0e16);
            border: 1px solid rgba(0,212,255,0.15);
            border-radius: 20px;
            padding: 18px;
            transition: all 0.3s;
            position: relative;
        }
        .product-card:hover { transform: translateY(-5px); border-color: #00d4ff; }
        .product-icon { font-size: 3rem; margin-bottom: 12px; text-align: center; }
        .product-name { font-size: 1rem; font-weight: 700; margin-bottom: 5px; }
        .product-category { font-size: 0.6rem; color: #00d4ff; margin-bottom: 8px; }
        .product-type-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,212,255,0.2);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.6rem;
            color: #00d4ff;
        }
        .product-desc { font-size: 0.7rem; color: #94a3b8; margin-bottom: 12px; }
        .product-price { font-size: 1.2rem; font-weight: 700; color: #10b981; margin-bottom: 12px; }
        .add-btn {
            width: 100%;
            padding: 8px;
            background: rgba(0,212,255,0.15);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 40px;
            color: #00d4ff;
            cursor: pointer;
        }
        .add-btn:hover { background: #00d4ff; color: #030712; }
        
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 90%;
            max-width: 450px;
            height: 100%;
            background: rgba(8,12,22,0.98);
            backdrop-filter: blur(24px);
            border-left: 1px solid #00d4ff;
            z-index: 1000;
            transition: right 0.3s;
            padding: 20px;
            overflow-y: auto;
        }
        .cart-sidebar.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; }
        .close-cart { font-size: 1.5rem; cursor: pointer; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .cart-total { margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 1.1rem; font-weight: 700; }
        .checkout-btn { width: 100%; margin-top: 15px; padding: 12px; background: #10b981; border: none; border-radius: 40px; color: white; font-weight: 700; cursor: pointer; }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s;
        }
        .modal.active { visibility: visible; opacity: 1; }
        .modal-content {
            background: linear-gradient(145deg, #11131e, #0c0e16);
            border: 1px solid #00d4ff;
            border-radius: 24px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
        }
        .modal input, .modal input[type="file"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 40px;
            color: white;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: #030712;
            padding: 12px 20px;
            border-radius: 40px;
            z-index: 3000;
            display: none;
        }
        .toast.show { display: block; }
        footer { text-align: center; padding: 30px; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 20px; }
    </style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="container">
    <div class="header">
        <div class="logo">
            <img src="https://i.postimg.cc/GpR4ctR1/photo-2026-05-31-22-35-50.jpg" alt="Logo">
            <h1>ATH DIGITAL HUB</h1>
        </div>
        <div class="cart-btn" id="cartBtn">
            <i class="fas fa-shopping-cart"></i>
            <span id="cartCount">0</span>
        </div>
    </div>
    
    <div class="categories" id="categories"></div>
    <div class="products-grid" id="productsGrid"></div>
</div>

<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <h3><i class="fas fa-shopping-cart"></i> ဈေးခြင်း</h3>
        <span class="close-cart" id="closeCartBtn">&times;</span>
    </div>
    <div id="cartItems"></div>
    <div class="cart-total" id="cartTotal">Total: 0 Ks</div>
    <button class="checkout-btn" id="checkoutBtn"><i class="fas fa-credit-card"></i> မှာယူမည်</button>
</div>

<div class="modal" id="paymentModal">
    <div class="modal-content">
        <h3 style="margin-bottom:20px; text-align:center;">ငွေပေးချေမှု</h3>
        <div style="background:rgba(0,212,255,0.1); border-radius:16px; padding:15px; margin-bottom:20px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>ငွေလွှဲနည်းလမ်း</span><span style="color:#00d4ff;">K-Pay / WavePay</span></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>အကောင့်အမည်</span><span style="color:#00d4ff;">AUNG THU HTWE</span></div>
            <div style="display:flex; justify-content:space-between;"><span>ဖုန်းနံပါတ်</span><span style="color:#00d4ff; cursor:pointer;" id="copyPhone">09789999368 📋</span></div>
        </div>
        <form id="orderForm" enctype="multipart/form-data">
            <input type="tel" id="phone" placeholder="📱 ဖုန်းနံပါတ် (09xxxxxxxxx)" required>
            <input type="file" id="slip" accept="image/*" required>
            <button type="submit" style="width:100%; padding:12px; background:#10b981; border:none; border-radius:40px; color:white; font-weight:700; cursor:pointer;">အော်ဒါတင်မည်</button>
        </form>
    </div>
</div>

<footer>
    <p>© 2026 ATH DIGITAL HUB | Digital Products Store</p>
</footer>

<script>
    // ============ LOAD DATA FROM LOCALSTORAGE ============
    let categories = [];
    let products = [];
    let cart = [];
    let currentCategory = 'all';
    
    function loadStoreData() {
        const savedCats = localStorage.getItem('store_categories');
        const savedProds = localStorage.getItem('store_products');
        
        if (savedCats) {
            categories = JSON.parse(savedCats);
        } else {
            categories = [
                { id: "data", name: "Data Plans", icon: "📡", color: "#00d4ff" },
                { id: "clothing", name: "Clothing", icon: "👕", color: "#10b981" },
                { id: "digital_product", name: "Digital Products", icon: "🖥️", color: "#8b5cf6" },
                { id: "digital_course", name: "Digital Courses", icon: "🎓", color: "#e11d48" },
                { id: "game_items", name: "Game Items", icon: "🎮", color: "#f59e0b" },
                { id: "language_course", name: "Language Courses", icon: "🌐", color: "#06b6d4" },
                { id: "pdf_books", name: "PDF Books", icon: "📘", color: "#22c55e" },
                { id: "video_content", name: "Video Content", icon: "🎬", color: "#ec4899" },
                { id: "other", name: "Others", icon: "🎁", color: "#64748b" }
            ];
        }
        
        if (savedProds) {
            products = JSON.parse(savedProds);
        } else {
            products = [
                { id: 1, name: "VIP LEVEL - 1", categoryId: "data", type: "standard", price: 15000, icon: "📱", desc: "22GB + 8,000 မိနစ်", link: "" },
                { id: 2, name: "Windows 11 Pro License", categoryId: "digital_product", type: "digital", price: 25000, icon: "🪟", desc: "Original License Key", link: "https://example.com/download/windows11" },
                { id: 3, name: "Full Stack Web Development", categoryId: "digital_course", type: "course", price: 150000, icon: "💻", desc: "Complete Web Dev Course", link: "https://example.com/course/webdev" },
                { id: 4, name: "Free Fire 500 Diamonds", categoryId: "game_items", type: "game", price: 15000, icon: "🔥", desc: "FF Diamonds Top Up", link: "" },
                { id: 5, name: "English Speaking Course", categoryId: "language_course", type: "course", price: 50000, icon: "🇬🇧", desc: "Beginner to Advanced", link: "https://example.com/course/english" },
                { id: 6, name: "Rich Dad Poor Dad (PDF)", categoryId: "pdf_books", type: "pdf", price: 8000, icon: "📚", desc: "Robert Kiyosaki", link: "https://example.com/pdf/richdad" },
                { id: 7, name: "Python Tutorial Video Series", categoryId: "video_content", type: "video", price: 45000, icon: "🐍", desc: "10+ Hours Video Course", link: "https://example.com/video/python" },
                { id: 8, name: "Men's T-Shirt", categoryId: "clothing", type: "standard", price: 15000, icon: "👕", desc: "Cotton T-Shirt", link: "" },
                { id: 9, name: "Smartphone", categoryId: "other", type: "standard", price: 250000, icon: "📱", desc: "6GB RAM, 128GB", link: "" }
            ];
        }
    }
    loadStoreData();
    
    function getProductTypeName(type) {
        const types = {
            standard: '📦 Product',
            digital: '💾 Digital',
            course: '🎓 Course',
            game: '🎮 Game',
            pdf: '📘 PDF',
            video: '🎬 Video'
        };
        return types[type] || type;
    }
    
    function renderCategories() {
        const container = document.getElementById('categories');
        let html = `<button class="cat-btn ${currentCategory === 'all' ? 'active' : ''}" onclick="setCategory('all')">📦 အားလုံး</button>`;
        categories.forEach(cat => {
            html += `<button class="cat-btn ${currentCategory === cat.id ? 'active' : ''}" onclick="setCategory('${cat.id}')" style="border-left-color: ${cat.color};">${cat.icon} ${cat.name}</button>`;
        });
        container.innerHTML = html;
    }
    
    function setCategory(catId) {
        currentCategory = catId;
        renderCategories();
        renderProducts();
    }
    
    function renderProducts() {
        let filtered = products;
        if (currentCategory !== 'all') {
            filtered = products.filter(p => p.categoryId === currentCategory);
        }
        const container = document.getElementById('productsGrid');
        if (filtered.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px;">📭 ထုတ်ကုန်မရှိပါ</div>';
            return;
        }
        container.innerHTML = filtered.map(p => {
            const cat = categories.find(c => c.id === p.categoryId);
            return `
                <div class="product-card">
                    <div class="product-type-badge">${getProductTypeName(p.type)}</div>
                    <div class="product-icon">${p.icon}</div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-category">${cat ? `${cat.icon} ${cat.name}` : p.categoryId}</div>
                    <div class="product-desc">${p.desc || ''}</div>
                    <div class="product-price">${p.price.toLocaleString()} Ks</div>
                    <button class="add-btn" onclick="addToCart(${p.id})"><i class="fas fa-cart-plus"></i> ထည့်မည်</button>
                </div>
            `;
        }).join('');
    }
    
    function addToCart(id) {
        const product = products.find(p => p.id === id);
        const existing = cart.find(i => i.id === id);
        if (existing) { existing.qty++; }
        else { cart.push({ ...product, qty: 1 }); }
        updateCartUI();
        showToast(`${product.name} ထည့်သွင်းပြီး`);
    }
    
    function updateCartUI() {
        const count = cart.reduce((s, i) => s + i.qty, 0);
        document.getElementById('cartCount').innerText = count;
        
        const container = document.getElementById('cartItems');
        if (cart.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px;">ဈေးခြင်းထဲတွင် ပစ္စည်းမရှိပါ</div>';
            document.getElementById('cartTotal').innerHTML = 'Total: 0 Ks';
            return;
        }
        
        let total = 0;
        container.innerHTML = cart.map(item => {
            total += item.price * item.qty;
            return `
                <div class="cart-item">
                    <div><strong>${item.name}</strong><br><small>${item.price.toLocaleString()} Ks</small><br><small class="product-type-badge" style="background:rgba(0,212,255,0.15);">${getProductTypeName(item.type)}</small></div>
                    <div>
                        <button onclick="updateQty(${item.id}, -1)" style="background:#334155; border:none; width:28px; border-radius:50%; cursor:pointer;">-</button>
                        <span style="margin:0 10px;">${item.qty}</span>
                        <button onclick="updateQty(${item.id}, 1)" style="background:#334155; border:none; width:28px; border-radius:50%; cursor:pointer;">+</button>
                        <button onclick="removeFromCart(${item.id})" style="background:#f43f5e; border:none; width:28px; border-radius:50%; cursor:pointer; margin-left:8px;">🗑</button>
                    </div>
                </div>
            `;
        }).join('');
        document.getElementById('cartTotal').innerHTML = `Total: ${total.toLocaleString()} Ks`;
    }
    
    function updateQty(id, delta) {
        const item = cart.find(i => i.id === id);
        if (item) {
            item.qty += delta;
            if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            updateCartUI();
        }
    }
    
    function removeFromCart(id) {
        cart = cart.filter(i => i.id !== id);
        updateCartUI();
    }
    
    async function placeOrder(phone, file) {
        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        const items = cart.map(i => `${i.name} x${i.qty} (${getProductTypeName(i.type)})`).join(', ');
        const fd = new FormData();
        fd.append('phone', phone);
        fd.append('plan', items);
        fd.append('price', total);
        fd.append('slip', file);
        const res = await fetch('/api/orders', { method: 'POST', body: fd });
        return await res.json();
    }
    
    document.getElementById('orderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const phone = document.getElementById('phone').value.trim();
        const file = document.getElementById('slip').files[0];
        if (!phone) { showToast('ဖုန်းနံပါတ်ထည့်ပါ', true); return; }
        if (!file) { showToast('ငွေလွှဲပြေစာထည့်ပါ', true); return; }
        if (cart.length === 0) { showToast('ဈေးခြင်းထဲတွင် ပစ္စည်းမရှိပါ', true); return; }
        
        const result = await placeOrder(phone, file);
        if (result.success) {
            showToast(`အော်ဒါအောင်မြင်ပါပြီ။ Order ID: ${result.orderId}`);
            cart = [];
            updateCartUI();
            document.getElementById('paymentModal').classList.remove('active');
            document.getElementById('orderForm').reset();
        } else {
            showToast(`အော်ဒါတင်ရာတွင် အမှား: ${result.error}`, true);
        }
    });
    
    document.getElementById('cartBtn').addEventListener('click', () => document.getElementById('cartSidebar').classList.add('open'));
    document.getElementById('closeCartBtn').addEventListener('click', () => document.getElementById('cartSidebar').classList.remove('open'));
    document.getElementById('checkoutBtn').addEventListener('click', () => {
        if (cart.length === 0) { showToast('ဈေးခြင်းထဲတွင် ပစ္စည်းမရှိပါ', true); return; }
        document.getElementById('paymentModal').classList.add('active');
    });
    document.getElementById('copyPhone')?.addEventListener('click', () => {
        navigator.clipboard.writeText("09789999368");
        showToast('ဖုန်းနံပါတ် ကူးယူပြီး');
    });
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.style.backgroundColor = isError ? '#f43f5e' : '#10b981';
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
    
    renderCategories();
    renderProducts();
    
    window.setCategory = setCategory;
    window.addToCart = addToCart;
    window.updateQty = updateQty;
    window.removeFromCart = removeFromCart;
</script>
</body>
</html>
