<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ATH DIGITAL HUB - Multi-Product Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0c15;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
        
        /* Header */
        .header {
            background: rgba(10,12,21,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 20px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo img {
            width: 45px;
            height: 45px;
            border-radius: 12px;
        }
        .logo h1 {
            font-size: 1.2rem;
            background: linear-gradient(135deg, #fff, #00d4ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .cart-btn {
            background: rgba(0,212,255,0.15);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cart-count {
            background: #f43f5e;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Categories */
        .categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            justify-content: center;
        }
        .cat-btn {
            background: rgba(18,22,35,0.8);
            border: 1px solid rgba(0,212,255,0.2);
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .cat-btn.active {
            background: #00d4ff;
            color: #030712;
        }
        
        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .product-card {
            background: linear-gradient(145deg, #11131e, #0c0e16);
            border: 1px solid rgba(0,212,255,0.15);
            border-radius: 20px;
            padding: 18px;
            transition: all 0.3s;
        }
        .product-card:hover {
            transform: translateY(-5px);
            border-color: #00d4ff;
        }
        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            background: #1a1c2a;
        }
        .product-icon { font-size: 2rem; margin-bottom: 10px; }
        .product-name { font-size: 1rem; font-weight: 700; margin-bottom: 5px; }
        .product-category { font-size: 0.6rem; color: #00d4ff; margin-bottom: 8px; }
        .product-desc { font-size: 0.7rem; color: #94a3b8; margin-bottom: 12px; }
        .product-price { font-size: 1.2rem; font-weight: 700; color: #10b981; margin-bottom: 12px; }
        .add-btn {
            width: 100%;
            padding: 8px;
            background: rgba(0,212,255,0.15);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 40px;
            color: #00d4ff;
            cursor: pointer;
        }
        .add-btn:hover { background: #00d4ff; color: #030712; }
        
        /* Cart Sidebar */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 90%;
            max-width: 450px;
            height: 100%;
            background: rgba(8,12,22,0.98);
            backdrop-filter: blur(24px);
            border-left: 1px solid #00d4ff;
            z-index: 1000;
            transition: right 0.3s;
            padding: 20px;
            overflow-y: auto;
        }
        .cart-sidebar.open { right: 0; }
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 15px;
        }
        .close-cart {
            font-size: 1.5rem;
            cursor: pointer;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .cart-total {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 1.1rem;
            font-weight: 700;
        }
        .checkout-btn {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #10b981;
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        
        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s;
        }
        .modal.active { visibility: visible; opacity: 1; }
        .modal-content {
            background: linear-gradient(145deg, #11131e, #0c0e16);
            border: 1px solid #00d4ff;
            border-radius: 24px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
        }
        .modal input, .modal input[type="file"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 40px;
            color: white;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: #030712;
            padding: 12px 20px;
            border-radius: 40px;
            z-index: 3000;
            display: none;
        }
        .toast.show { display: block; }
        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 20px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="container">
    <div class="header">
        <div class="logo">
            <img src="https://i.postimg.cc/GpR4ctR1/photo-2026-05-31-22-35-50.jpg" alt="Logo">
            <h1>ATH DIGITAL HUB</h1>
        </div>
        <div class="cart-btn" id="cartBtn">
            <i class="fas fa-shopping-cart"></i>
            <span id="cartCount">0</span>
        </div>
    </div>
    
    <div class="categories" id="categories"></div>
    <div class="products-grid" id="productsGrid"></div>
</div>

<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <h3><i class="fas fa-shopping-cart"></i> ဈေးခြင်း</h3>
        <span class="close-cart" id="closeCartBtn">&times;</span>
    </div>
    <div id="cartItems"></div>
    <div class="cart-total" id="cartTotal">Total: 0 Ks</div>
    <button class="checkout-btn" id="checkoutBtn"><i class="fas fa-credit-card"></i> မှာယူမည်</button>
</div>

<div class="modal" id="paymentModal">
    <div class="modal-content">
        <h3 style="margin-bottom:20px; text-align:center;">ငွေပေးချေမှု</h3>
        <div style="background:rgba(0,212,255,0.1); border-radius:16px; padding:15px; margin-bottom:20px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>ငွေလွှဲနည်းလမ်း</span><span style="color:#00d4ff;">K-Pay / WavePay</span></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>အကောင့်အမည်</span><span style="color:#00d4ff;">AUNG THU HTWE</span></div>
            <div style="display:flex; justify-content:space-between;"><span>ဖုန်းနံပါတ်</span><span style="color:#00d4ff; cursor:pointer;" id="copyPhone">09789999368 📋</span></div>
        </div>
        <form id="orderForm" enctype="multipart/form-data">
            <input type="tel" id="phone" placeholder="📱 ဖုန်းနံပါတ် (09xxxxxxxxx)" required>
            <input type="file" id="slip" accept="image/*" required>
            <button type="submit" style="width:100%; padding:12px; background:#10b981; border:none; border-radius:40px; color:white; font-weight:700; cursor:pointer;">အော်ဒါတင်မည်</button>
        </form>
    </div>
</div>

<footer>
    <p>© 2026 ATH DIGITAL HUB | Multi-Product Store</p>
</footer>

<script>
    // ============ PRODUCTS DATABASE (အဝတ်အထည်၊ ဒေတာ၊ သင်တန်း၊ စာအုပ်၊ အခြား) ============
    let products = [
        // Data Plans (ဒေတာ)
        { id: 1, name: "VIP LEVEL - 1", category: "data", price: 15000, icon: "📱", image: "", desc: "22GB + 8,000 မိနစ်" },
        { id: 2, name: "VIP LEVEL - 2", category: "data", price: 20000, icon: "📡", image: "", desc: "40GB + 250 မိနစ်" },
        { id: 3, name: "VIP LEVEL - 3", category: "data", price: 25000, icon: "⚡", image: "", desc: "40GB + 1,400 မိနစ်" },
        { id: 4, name: "VIP LEVEL - 4 ULTRA", category: "data", price: 30000, icon: "👑", image: "", desc: "120GB + Unlimited" },
        
        // Clothing (အဝတ်အထည်)
        { id: 5, name: "Men's T-Shirt", category: "clothing", price: 15000, icon: "👕", image: "https://via.placeholder.com/300x200?text=T-Shirt", desc: "Cotton T-Shirt, Size S-XXL" },
        { id: 6, name: "Women's Dress", category: "clothing", price: 35000, icon: "👗", image: "https://via.placeholder.com/300x200?text=Dress", desc: "Summer Dress, Size S-L" },
        { id: 7, name: "Jacket", category: "clothing", price: 45000, icon: "🧥", image: "https://via.placeholder.com/300x200?text=Jacket", desc: "Winter Jacket, Waterproof" },
        { id: 8, name: "Jeans", category: "clothing", price: 25000, icon: "👖", image: "https://via.placeholder.com/300x200?text=Jeans", desc: "Denim Jeans, Size 28-36" },
        
        // Courses (သင်တန်း)
        { id: 9, name: "Web Development Bootcamp", category: "course", price: 150000, icon: "💻", image: "https://via.placeholder.com/300x200?text=Web+Dev", desc: "Full Stack, 3 months" },
        { id: 10, name: "Digital Marketing Course", category: "course", price: 80000, icon: "📈", image: "https://via.placeholder.com/300x200?text=Marketing", desc: "SEO, Social Media, Ads" },
        { id: 11, name: "English Speaking Course", category: "course", price: 50000, icon: "🇬🇧", image: "https://via.placeholder.com/300x200?text=English", desc: "Beginner to Advanced" },
        { id: 12, name: "Python Programming", category: "course", price: 120000, icon: "🐍", image: "https://via.placeholder.com/300x200?text=Python", desc: "From Zero to Hero" },
        
        // Books (စာအုပ်)
        { id: 13, name: "Rich Dad Poor Dad", category: "book", price: 8000, icon: "📚", image: "https://via.placeholder.com/300x200?text=Rich+Dad", desc: "Robert Kiyosaki" },
        { id: 14, name: "Atomic Habits", category: "book", price: 12000, icon: "📖", image: "https://via.placeholder.com/300x200?text=Atomic+Habits", desc: "James Clear" },
        { id: 15, name: "Think and Grow Rich", category: "book", price: 10000, icon: "📕", image: "https://via.placeholder.com/300x200?text=Think+Grow", desc: "Napoleon Hill" },
        { id: 16, name: "The Psychology of Money", category: "book", price: 15000, icon: "💰", image: "https://via.placeholder.com/300x200?text=Psychology+Money", desc: "Morgan Housel" },
        
        // Others (အခြား)
        { id: 17, name: "Smartphone", category: "other", price: 250000, icon: "📱", image: "https://via.placeholder.com/300x200?text=Phone", desc: "6GB RAM, 128GB Storage" },
        { id: 18, name: "Headphone", category: "other", price: 25000, icon: "🎧", image: "https://via.placeholder.com/300x200?text=Headphone", desc: "Wireless Bluetooth" },
        { id: 19, name: "Watch", category: "other", price: 35000, icon: "⌚", image: "https://via.placeholder.com/300x200?text=Watch", desc: "Smart Watch" },
        { id: 20, name: "Backpack", category: "other", price: 20000, icon: "🎒", image: "https://via.placeholder.com/300x200?text=Backpack", desc: "Waterproof, 20L" }
    ];
    
    let cart = [];
    let currentCategory = 'all';
    
    // Category Names
    const categoryNames = {
        all: 'အားလုံး',
        data: '📡 Data Plans',
        clothing: '👕 အဝတ်အထည်',
        course: '💻 သင်တန်း',
        book: '📚 စာအုပ်',
        other: '🎁 အခြား'
    };
    
    function renderCategories() {
        const categories = ['all', 'data', 'clothing', 'course', 'book', 'other'];
        const container = document.getElementById('categories');
        container.innerHTML = categories.map(cat => `
            <button class="cat-btn ${currentCategory === cat ? 'active' : ''}" onclick="setCategory('${cat}')">${categoryNames[cat]}</button>
        `).join('');
    }
    
    function setCategory(cat) {
        currentCategory = cat;
        renderCategories();
        renderProducts();
    }
    
    function renderProducts() {
        let filtered = products;
        if (currentCategory !== 'all') {
            filtered = products.filter(p => p.category === currentCategory);
        }
        const container = document.getElementById('productsGrid');
        container.innerHTML = filtered.map(p => `
            <div class="product-card">
                ${p.image ? `<img src="${p.image}" class="product-image" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">` : `<div class="product-icon">${p.icon}</div>`}
                <div class="product-name">${p.name}</div>
                <div class="product-category">${categoryNames[p.category] || p.category}</div>
                <div class="product-desc">${p.desc}</div>
                <div class="product-price">${p.price.toLocaleString()} Ks</div>
                <button class="add-btn" onclick="addToCart(${p.id})"><i class="fas fa-cart-plus"></i> ထည့်မည်</button>
            </div>
        `).join('');
    }
    
    function addToCart(id) {
        const product = products.find(p => p.id === id);
        const existing = cart.find(i => i.id === id);
        if (existing) {
            existing.qty++;
        } else {
            cart.push({ ...product, qty: 1 });
        }
        updateCartUI();
        showToast(`${product.name} ထည့်သွင်းပြီး`);
    }
    
    function updateCartUI() {
        const count = cart.reduce((s, i) => s + i.qty, 0);
        document.getElementById('cartCount').innerText = count;
        
        const container = document.getElementById('cartItems');
        if (cart.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px;">ဈေးခြင်းထဲတွင် ပစ္စည်းမရှိပါ</div>';
            document.getElementById('cartTotal').innerHTML = 'Total: 0 Ks';
            return;
        }
        
        let total = 0;
        container.innerHTML = cart.map(item => {
            total += item.price * item.qty;
            return `
                <div class="cart-item">
                    <div><strong>${item.name}</strong><br><small>${item.price.toLocaleString()} Ks</small></div>
                    <div>
                        <button onclick="updateQty(${item.id}, -1)" style="background:#334155; border:none; width:28px; border-radius:50%; cursor:pointer;">-</button>
                        <span style="margin:0 10px;">${item.qty}</span>
                        <button onclick="updateQty(${item.id}, 1)" style="background:#334155; border:none; width:28px; border-radius:50%; cursor:pointer;">+</button>
                        <button onclick="removeFromCart(${item.id})" style="background:#f43f5e; border:none; width:28px; border-radius:50%; cursor:pointer; margin-left:8px;">🗑</button>
                    </div>
                </div>
            `;
        }).join('');
        document.getElementById('cartTotal').innerHTML = `Total: ${total.toLocaleString()} Ks`;
    }
    
    function updateQty(id, delta) {
        const item = cart.find(i => i.id === id);
        if (item) {
            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
        }
    }
    
    function removeFromCart(id) {
        cart = cart.filter(i => i.id !== id);
        updateCartUI();
    }
    
    async function placeOrder(phone, file) {
        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        const items = cart.map(i => `${i.name} x${i.qty}`).join(', ');
        
        const fd = new FormData();
        fd.append('phone', phone);
        fd.append('plan', items);
        fd.append('price', total);
        fd.append('slip', file);
        
        const res = await fetch('/api/orders', { method: 'POST', body: fd });
        return await res.json();
    }
    
    document.getElementById('orderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const phone = document.getElementById('phone').value.trim();
        const file = document.getElementById('slip').files[0];
        
        if (!phone) { showToast('ဖုန်းနံပါတ်ထည့်ပါ', true); return; }
        if (!file) { showToast('ငွေလွှဲပြေစာထည့်ပါ', true); return; }
        if (cart.length === 0) { showToast('ဈေးခြင်းထဲတွင် ပစ္စည်းမရှိပါ', true); return; }
        
        const result = await placeOrder(phone, file);
        if (result.success) {
            showToast(`အော်ဒါအောင်မြင်ပါပြီ။ Order ID: ${result.orderId}`);
            cart = [];
            updateCartUI();
            document.getElementById('paymentModal').classList.remove('active');
            document.getElementById('orderForm').reset();
        } else {
            showToast(`အော်ဒါတင်ရာတွင် အမှား: ${result.error}`, true);
        }
    });
    
    document.getElementById('cartBtn').addEventListener('click', () => {
        document.getElementById('cartSidebar').classList.add('open');
    });
    document.getElementById('closeCartBtn').addEventListener('click', () => {
        document.getElementById('cartSidebar').classList.remove('open');
    });
    document.getElementById('checkoutBtn').addEventListener('click', () => {
        if (cart.length === 0) {
            showToast('ဈေးခြင်းထဲတွင် ပစ္စည်းမရှိပါ', true);
            return;
        }
        document.getElementById('paymentModal').classList.add('active');
    });
    document.getElementById('copyPhone')?.addEventListener('click', () => {
        navigator.clipboard.writeText("09789999368");
        showToast('ဖုန်းနံပါတ် ကူးယူပြီး');
    });
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.style.backgroundColor = isError ? '#f43f5e' : '#10b981';
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
    
    renderCategories();
    renderProducts();
    
    window.setCategory = setCategory;
    window.addToCart = addToCart;
    window.updateQty = updateQty;
    window.removeFromCart = removeFromCart;
</script>
</body>
</html>
