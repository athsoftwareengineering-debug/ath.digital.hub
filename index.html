<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login | ATH DIGITAL HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0c15 0%, #1a1f2e 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(18,22,35,0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 28px;
            padding: 40px 32px;
            max-width: 450px;
            width: 100%;
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo h1 { background: linear-gradient(135deg, #fff, #00d4ff); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .step { display: none; animation: fadeIn 0.3s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .form-group { margin-bottom: 20px; }
        label { font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; display: block; }
        input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 14px;
            padding: 14px 16px;
            color: white;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: #00d4ff; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff, #0891b2);
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { transform: translateY(-2px); filter: brightness(1.05); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .timer { text-align: center; font-size: 0.7rem; color: #64748b; margin-top: 16px; }
        .message { font-size: 0.7rem; text-align: center; margin-top: 12px; padding: 8px; border-radius: 10px; }
        .message.error { color: #f43f5e; background: rgba(244,63,94,0.1); }
        .message.success { color: #10b981; background: rgba(16,185,129,0.1); }
        .spinner { width: 18px; height: 18px; border: 2px solid rgba(3,7,18,0.3); border-top-color: #030712; border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer { text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); }
        .footer a { color: #64748b; font-size: 0.7rem; text-decoration: none; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo"><h1><i class="fas fa-bolt"></i> ATH DIGITAL HUB</h1><p style="color:#94a3b8; font-size:0.7rem">MyTel VIP Store</p></div>
    
    <div id="stepPhone" class="step active">
        <div class="form-group"><label>📱 ဖုန်းနံပါတ်</label><input type="tel" id="phoneInput" placeholder="09xxxxxxxxx" autocomplete="off"></div>
        <button id="sendOtpBtn">📨 OTP ကုဒ်ရယူမည်</button>
        <div id="phoneMessage" class="message"></div>
    </div>
    
    <div id="stepOtp" class="step">
        <div class="form-group"><label>🔑 OTP ကုဒ် (၆လုံး)</label><input type="text" id="otpInput" placeholder="000000" maxlength="6" autocomplete="off"></div>
        <button id="verifyBtn">✅ အတည်ပြုမည်</button>
        <div id="timer" class="timer"></div>
        <button id="resendBtn" style="margin-top:12px; background:transparent; color:#00d4ff">⟳ OTP ပြန်ပို့မည်</button>
        <div id="otpMessage" class="message"></div>
    </div>
    
    <div class="footer"><a href="/">← စတိုးသို့ ပြန်သွားရန်</a></div>
</div>

<script>
    const API_BASE = window.location.origin;
    let currentPhone = '';
    let otpTimer = null;
    let timeLeft = 60;
    
    const stepPhone = document.getElementById('stepPhone');
    const stepOtp = document.getElementById('stepOtp');
    const phoneInput = document.getElementById('phoneInput');
    const otpInput = document.getElementById('otpInput');
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    const verifyBtn = document.getElementById('verifyBtn');
    const resendBtn = document.getElementById('resendBtn');
    const timerEl = document.getElementById('timer');
    const phoneMessage = document.getElementById('phoneMessage');
    const otpMessage = document.getElementById('otpMessage');
    
    function showMessage(element, msg, type) {
        element.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${msg}`;
        element.className = `message ${type}`;
        setTimeout(() => { if (element.innerHTML === msg || element.innerHTML.includes(msg)) element.innerHTML = ''; }, 5000);
    }
    
    function startTimer() {
        timeLeft = 60;
        if (otpTimer) clearInterval(otpTimer);
        otpTimer = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(otpTimer);
                timerEl.innerHTML = '⏰ OTP သက်တမ်းကုန်ပါပြီ။ OTP အသစ် ရယူပါ။';
                resendBtn.style.display = 'block';
            } else {
                timerEl.innerHTML = `⏱️ OTP သက်တမ်းကုန်ရန်: ${timeLeft} စက္ကန့်`;
                timeLeft--;
            }
        }, 1000);
    }
    
    function resetTimer() {
        if (otpTimer) clearInterval(otpTimer);
        resendBtn.style.display = 'none';
        startTimer();
    }
    
    sendOtpBtn.addEventListener('click', async () => {
        const phone = phoneInput.value.trim();
        if (!phone || phone.length < 9) {
            showMessage(phoneMessage, '⚠️ ဖုန်းနံပါတ် မှန်ကန်စွာ ထည့်ပါ (09xxxxxxxxx)', 'error');
            return;
        }
        
        sendOtpBtn.disabled = true;
        sendOtpBtn.innerHTML = '<div class="spinner"></div> ပို့နေပါသည်...';
        
        try {
            const res = await fetch(`${API_BASE}/api/auth/send-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone }),
                credentials: 'include'
            });
            const data = await res.json();
            
            if (data.success) {
                currentPhone = phone;
                stepPhone.classList.remove('active');
                stepOtp.classList.add('active');
                otpInput.value = '';
                resetTimer();
                showMessage(otpMessage, '✅ OTP ကုဒ် ပို့ပြီးပါပြီ။ သင့် SMS ကို စစ်ဆေးပါ။', 'success');
            } else {
                showMessage(phoneMessage, '❌ ' + (data.error || 'OTP ပို့ရာတွင် အမှားရှိပါသည်။'), 'error');
            }
        } catch (err) {
            showMessage(phoneMessage, '❌ ဆာဗာအမှား၊ ထပ်မံကြိုးစားပါ။', 'error');
        } finally {
            sendOtpBtn.disabled = false;
            sendOtpBtn.innerHTML = '📨 OTP ကုဒ်ရယူမည်';
        }
    });
    
    verifyBtn.addEventListener('click', async () => {
        const otp = otpInput.value.trim();
        if (!otp || otp.length !== 6) {
            showMessage(otpMessage, '⚠️ OTP ကုဒ် ၆ လုံး ထည့်ပါ', 'error');
            return;
        }
        
        verifyBtn.disabled = true;
        verifyBtn.innerHTML = '<div class="spinner"></div> စစ်ဆေးနေပါသည်...';
        
        try {
            const res = await fetch(`${API_BASE}/api/auth/verify-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: currentPhone, otp }),
                credentials: 'include'
            });
            const data = await res.json();
            
            if (data.success) {
                showMessage(otpMessage, '✅ အကောင့်ဝင်ရောက်မှု အောင်မြင်ပါသည်။ စတိုးသို့ ပြန်ညွှန်းနေပါသည်...', 'success');
                setTimeout(() => { window.location.href = '/'; }, 1500);
            } else {
                showMessage(otpMessage, '❌ ' + (data.error || 'OTP ကုဒ် မှားယွင်းနေပါသည်။'), 'error');
                otpInput.value = '';
            }
        } catch (err) {
            showMessage(otpMessage, '❌ ဆာဗာအမှား၊ ထပ်မံကြိုးစားပါ။', 'error');
        } finally {
            verifyBtn.disabled = false;
            verifyBtn.innerHTML = '✅ အတည်ပြုမည်';
        }
    });
    
    resendBtn.addEventListener('click', async () => {
        resendBtn.disabled = true;
        resendBtn.innerHTML = '<div class="spinner"></div> ပို့နေပါသည်...';
        
        try {
            const res = await fetch(`${API_BASE}/api/auth/send-otp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: currentPhone }),
                credentials: 'include'
            });
            const data = await res.json();
            
            if (data.success) {
                resetTimer();
                otpInput.value = '';
                showMessage(otpMessage, '✅ OTP ကုဒ်အသစ် ပို့ပြီးပါပြီ။', 'success');
            } else {
                showMessage(otpMessage, '❌ ' + (data.error || 'OTP ပြန်ပို့ရာတွင် အမှားရှိပါသည်။'), 'error');
            }
        } catch (err) {
            showMessage(otpMessage, '❌ ဆာဗာအမှား', 'error');
        } finally {
            resendBtn.disabled = false;
            resendBtn.innerHTML = '⟳ OTP ပြန်ပို့မည်';
        }
    });
    
    phoneInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendOtpBtn.click(); });
    otpInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyBtn.click(); });
</script>
</body>
</html>
