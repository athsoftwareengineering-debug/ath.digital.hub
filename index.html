<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATH Digital Hub - Live Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f0f0; }
        .container { max-width: 600px; margin: 0 auto; background: white; height: 100vh; display: flex; flex-direction: column; }
        .chat-header { background: #007bff; color: white; padding: 15px; text-align: center; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; }
        .message { margin-bottom: 12px; display: flex; }
        .message.customer { justify-content: flex-end; }
        .message.admin { justify-content: flex-start; }
        .message-content { max-width: 70%; padding: 10px 14px; border-radius: 18px; }
        .message.customer .message-content { background: #007bff; color: white; }
        .message.admin .message-content { background: #e9ecef; color: black; }
        .message-time { font-size: 10px; margin-top: 5px; opacity: 0.7; }
        .chat-input { display: flex; padding: 12px; border-top: 1px solid #ddd; background: white; gap: 10px; }
        .chat-input input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; font-size: 16px; }
        .chat-input button { padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 25px; cursor: pointer; }
        .user-id { padding: 8px; background: #f8f9fa; font-size: 11px; text-align: center; border-bottom: 1px solid #eee; }
        .status { font-size: 11px; color: #28a745; margin-left: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-header">
            <h3>💬 ATH Digital Hub Support</h3>
        </div>
        <div class="user-id">
            🆔 Your ID: <span id="userId"></span>
            <span class="status" id="status">● Connected</span>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message admin">
                <div class="message-content">
                    Welcome to ATH Digital Hub! 👋<br>
                    How can we help you today?
                </div>
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send 📤</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://yubbfbmfoycvdxfaecbh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1YmJmYm1mb3ljdmR4ZmFlY2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNDQyODIsImV4cCI6MjA5NTcyMDI4Mn0.hYNmdWDour1ZF9if37h8uoOR_ejZjoyqY9qjs7pHEoY';
        
        const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let userId = localStorage.getItem('ath_chat_user_id');
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 8);
            localStorage.setItem('ath_chat_user_id', userId);
        }
        document.getElementById('userId').innerText = userId;
        
        async function loadMessages() {
            const { data, error } = await supabase
                .from('chat_messages')
                .select('*')
                .order('created_at', { ascending: true });
            
            if (error) {
                console.error('Load error:', error);
                return;
            }
            
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.innerHTML = '';
            
            if (!data || data.length === 0) {
                messagesDiv.innerHTML = `<div class="message admin"><div class="message-content">Welcome! 👋 How can we help?</div></div>`;
                return;
            }
            
            data.forEach(msg => {
                const isCurrentUser = msg.user_id === userId;
                const div = document.createElement('div');
                div.className = `message ${isCurrentUser ? 'customer' : 'admin'}`;
                const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                div.innerHTML = `<div class="message-content"><div>${escapeHtml(msg.message)}</div><div class="message-time">${time}</div></div>`;
                messagesDiv.appendChild(div);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;
            
            const { error } = await supabase
                .from('chat_messages')
                .insert([{ message, user_id: userId, role: 'customer', created_at: new Date().toISOString() }]);
            
            if (error) {
                alert('Error: ' + error.message);
                return;
            }
            input.value = '';
        }
        
        function setupRealtime() {
            supabase
                .channel('chat_messages_channel')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, () => loadMessages())
                .subscribe((status) => {
                    const statusEl = document.getElementById('status');
                    if (status === 'SUBSCRIBED') {
                        statusEl.textContent = '● Connected';
                        statusEl.style.color = '#28a745';
                    }
                });
        }
        
        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        
        loadMessages();
        setupRealtime();
    </script>
</body>
</html>
