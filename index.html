<!DOCTYPE html>
<html>
<head>
  <title>MYTEL DATA SERVICE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family: Arial;
      background:#0f172a;
      color:white;
      text-align:center;
      padding:15px;
    }

    .card{
      background:#1e293b;
      margin:10px;
      padding:15px;
      border-radius:10px;
    }

    input{
      padding:10px;
      width:80%;
      border-radius:8px;
      border:none;
      margin-bottom:15px;
    }

    button{
      padding:10px;
      width:80%;
      border:none;
      border-radius:8px;
      background:#22c55e;
      color:white;
      font-size:16px;
      margin-top:10px;
    }

    .price{
      color:#facc15;
      font-weight:bold;
    }
  </style>
</head>

<body>

<h2>✨ MYTEL VIP SERVICE ✨</h2>

<input id="phone" placeholder="Enter phone number">

<div class="card">
  <h3>VIP 1</h3>
  <p>22GB / 8000 Mins / 5000 SMS</p>
  <p class="price">15,000 KS</p>
  <button onclick="order('VIP 1')">BUY NOW</button>
</div>

<div class="card">
  <h3>VIP 2</h3>
  <p>40GB / 250 Mins / Any Net</p>
  <p class="price">20,000 KS</p>
  <button onclick="order('VIP 2')">BUY NOW</button>
</div>

<div class="card">
  <h3>VIP 3</h3>
  <p>40GB / 1400 Mins / SMS</p>
  <p class="price">25,000 KS</p>
  <button onclick="order('VIP 3')">BUY NOW</button>
</div>

<div class="card">
  <h3>VIP 4 ULTRA</h3>
  <p>120GB High-Speed Data</p>
  <p class="price">30,000 KS</p>
  <button onclick="order('VIP 4')">BUY NOW</button>
</div>

<script>
const API = "https://ath-digital-hub.onrender.com/order";

async function order(pkg){
  const phone = document.getElementById("phone").value;

  if(!phone){
    alert("Phone number ထည့်ပါ");
    return;
  }

  try{
    await fetch(API, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        packageName: pkg,
        phone: phone
      })
    });

    alert("Order Sent ✔");
  }catch(e){
    alert("Error ❌");
  }
}
</script>

</body>
</html>
