<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mytel VIP Store</title>
    <style>
        :root {
            --primary-color: #007aff;
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-color: #1d1d1f;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"], select, input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fafafa;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #fff;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .admin-btn {
            background-color: #34c759;
            margin-top: 15px;
        }

        .admin-btn:hover {
            background-color: #28a745;
        }

        /* Admin Section Styling */
        .admin-section {
            display: none;
            margin-top: 25px;
            border-top: 2px dashed #d2d2d7;
            padding-top: 20px;
        }

        .order-card {
            background: #f5f5f7;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 5px solid var(--primary-color);
        }

        .order-card img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div id="user-view">
        <h2>Mytel VIP Data Store</h2>
        <form id="orderForm">
            <div class="form-group">
                <label for="phone">Mytel ဖုန်းနံပါတ်</label>
                <input type="text" id="phone" placeholder="0996xxxxxxx" required>
            </div>

            <div class="form-group">
                <label for="plan">Data Plan ရွေးချယ်ရန်</label>
                <select id="plan" required>
                    <option value="5GB - 1500 Ks">5GB (7 Days) - 1500 Ks</option>
                    <option value="10GB - 2500 Ks">10GB (30 Days) - 2500 Ks</option>
                    <option value="20GB - 4500 Ks">20GB (30 Days) - 4500 Ks</option>
                </select>
            </div>

            <div class="form-group">
                <label for="slip">KPay / Wave Slip ဓာတ်ပုံတင်ရန်</label>
                <input type="file" id="slip" accept="image/*" required>
            </div>

            <button type="submit">ဝယ်ယူမည် (Submit Order)</button>
        </form>
    </div>

    <div id="admin-view" class="admin-section">
        <h2>Admin Dashboard (အော်ဒါများ)</h2>
        <div id="order-list">
            <p style="text-align:center; color:#86868b;">ဝင်လာသော အော်ဒါမရှိသေးပါ</p>
        </div>
    </div>
</div>

<script>
    // LocalStorage သုံးပြီး ဒေတာများကို ဖုန်းထဲမှာပဲ ခဏသိမ်းထားမယ့် Logic
    const orderForm = document.getElementById('orderForm');
    const orderList = document.getElementById('order-list');

    // လမ်းကြောင်း (URL) ကို စစ်ဆေးပြီး Admin App ဆိုရင် Admin Dashboard တန်းပြပေးရန်
    if (window.location.pathname.endsWith('/admin') || window.location.hash === '#admin') {
        document.getElementById('user-view').style.display = 'none';
        document.getElementById('admin-view').style.display = 'block';
        displayOrders();
    }

    // အော်ဒါတင်ခြင်း စနစ်
    orderForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const phone = document.getElementById('phone').value;
        const plan = document.getElementById('plan').value;
        const slipFile = document.getElementById('slip').files[0];

        if (slipFile) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const slipBase64 = event.target.result;

                const newOrder = {
                    id: Date.now(),
                    phone: phone,
                    plan: plan,
                    slip: slipBase64,
                    time: new Date().toLocaleString()
                };

                // အဟောင်းထဲကို အသစ်ထည့်ခြင်း
                let orders = JSON.parse(localStorage.getItem('mytel_orders')) || [];
                orders.unshift(newOrder);
                localStorage.setItem('mytel_orders', JSON.stringify(orders));

                alert('အော်ဒါတင်ခြင်း အောင်မြင်ပါသည်။ Admin မှ မကြာမီ ထည့်သွင်းပေးပါလိမ့်မည်။');
                orderForm.reset();
            };
            reader.readAsDataURL(slipFile);
        }
    });

    // Admin ဘက်မှာ အော်ဒါများ ပြသပေးခြင်း စနစ်
    function displayOrders() {
        let orders = JSON.parse(localStorage.getItem('mytel_orders')) || [];
        if (orders.length === 0) {
            orderList.innerHTML = '<p style="text-align:center; color:#86868b;">ဝင်လာသော အော်ဒါမရှိသေးပါ</p>';
            return;
        }

        orderList.innerHTML = '';
        orders.forEach(order => {
            const card = document.createElement('div');
            card.className = 'order-card';
            card.innerHTML = `
                <div><strong>ဖုန်းနံပါတ်:</strong> ${order.phone}</div>
                <div><strong>ဝယ်ယူသည့် Plan:</strong> ${order.plan}</div>
                <div><strong>အချိန်:</strong> ${order.time}</div>
                <div><strong>ငွေလွှဲပြေစာ (Slip):</strong></div>
                <img src="${order.slip}" alt="KPay Slip">
                <button onclick="deleteOrder(${order.id})" style="background-color:#ff3b30; padding:6px; margin-top:10px; font-size:12px; width:auto; border-radius:6px;">အော်ဒါဖျက်မည်</button>
            `;
            orderList.appendChild(card);
        });
    }

    // အော်ဒါများ လုပ်ဆောင်ပြီးရင် ဖျက်ပစ်နိုင်ရန်
    window.deleteOrder = function(id) {
        if(confirm('ဒီအော်ဒါကို ဖြည့်သွင်းပြီးလို့ ဖျက်ပစ်မှာ သေချာပါသလား?')) {
            let orders = JSON.parse(localStorage.getItem('mytel_orders')) || [];
            orders = orders.filter(order => order.id !== id);
            localStorage.setItem('mytel_orders', JSON.stringify(orders));
            displayOrders();
        }
    }
</script>

</body>
</html>
