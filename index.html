<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Live Dashboard | ATH DIGITAL HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0c15;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: rgba(18,22,35,0.9);
            border-radius: 1rem;
            border: 1px solid rgba(0,212,255,0.2);
        }
        .live-badge {
            background: rgba(244,63,94,0.2);
            color: #f43f5e;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%,100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: linear-gradient(145deg, #0f111a, #0a0c15);
            border-radius: 1rem;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(0,212,255,0.1);
        }
        .stat-number {
            font-size: 1.5rem;
            font-weight: 800;
            color: #00d4ff;
        }
        .order-card {
            background: linear-gradient(145deg, #0f111a, #0a0c15);
            border-radius: 1rem;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(0,212,255,0.1);
            transition: all 0.3s ease;
        }
        .order-card.new {
            animation: slideIn 0.5s ease-out;
            border-color: #f59e0b;
            background: rgba(245,158,11,0.1);
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .order-plan {
            font-weight: 700;
            color: #00d4ff;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.6rem;
        }
        .status-pending { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .status-approved { background: rgba(16,185,129,0.2); color: #34d399; }
        .order-details {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 1.5s infinite;
        }
        .dot.disconnected {
            background: #f43f5e;
            animation: none;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .empty {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        .footer {
            text-align: center;
            font-size: 0.6rem;
            color: #475569;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        button {
            background: rgba(0,212,255,0.15);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 8px 16px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #00d4ff;
            color: #030712;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2><i class="fas fa-broadcast-tower"></i> LIVE Orders</h2>
        <div class="live-badge"><i class="fas fa-circle"></i> LIVE</div>
    </div>
    
    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalCount">0</div>
            <div>Total Orders</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="pendingCount">0</div>
            <div>Pending</div>
        </div>
    </div>
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <div class="connection-status">
            <span id="statusDot" class="dot"></span>
            <span id="statusText">Connecting...</span>
        </div>
        <button onclick="loadOrders()"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>
    
    <div id="ordersContainer">
        <div class="empty"><i class="fas fa-spinner fa-pulse"></i> Loading orders...</div>
    </div>
    
    <div class="footer">
        ⚡ Auto-refreshes every 30 seconds • New orders appear instantly
    </div>
</div>

<script>
    const API_BASE = window.location.origin;
    let eventSource = null;
    let allOrders = [];
    
    // Connect to SSE for live updates
    function connectLiveEvents() {
        if (eventSource) {
            eventSource.close();
        }
        
        try {
            eventSource = new EventSource(`${API_BASE}/api/live/events`);
            
            eventSource.onopen = () => {
                console.log('🔴 Connected to live events');
                document.getElementById('statusDot').className = 'dot';
                document.getElementById('statusText').innerText = 'Connected (Live)';
            };
            
            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'new_order') {
                    console.log('🆕 New order received:', data.order);
                    addNewOrder(data.order);
                }
            };
            
            eventSource.onerror = (error) => {
                console.error('EventSource error:', error);
                document.getElementById('statusDot').className = 'dot disconnected';
                document.getElementById('statusText').innerText = 'Disconnected - Auto refresh only';
                eventSource.close();
                eventSource = null;
            };
        } catch(e) {
            console.error('Failed to connect to live events:', e);
            document.getElementById('statusDot').className = 'dot disconnected';
            document.getElementById('statusText').innerText = 'Not supported - Auto refresh only';
        }
    }
    
    function maskPhone(phone) {
        if (!phone || phone.length < 8) return phone || '';
        return phone.substring(0,5) + '***' + phone.substring(phone.length-3);
    }
    
    function formatDate(dateStr) {
        const date = new Date(dateStr);
        return date.toLocaleTimeString();
    }
    
    function addNewOrder(order) {
        // Check if order already exists
        if (allOrders.some(o => o.id === order.id)) return;
        
        // Add to beginning
        allOrders.unshift(order);
        
        // Keep only last 50 orders
        if (allOrders.length > 50) allOrders.pop();
        
        renderOrders();
        updateStats();
        
        // Highlight new order
        const newCard = document.querySelector(`.order-card[data-id="${order.id}"]`);
        if (newCard) {
            newCard.classList.add('new');
            setTimeout(() => newCard.classList.remove('new'), 3000);
        }
    }
    
    async function loadOrders() {
        try {
            const res = await fetch(`${API_BASE}/api/admin/orders`);
            const data = await res.json();
            if (data.orders) {
                allOrders = data.orders.slice(0, 50);
                renderOrders();
                updateStats();
            }
        } catch(e) {
            console.error('Error loading orders:', e);
            document.getElementById('ordersContainer').innerHTML = '<div class="empty"><i class="fas fa-exclamation-triangle"></i> Connection error</div>';
        }
    }
    
    function renderOrders() {
        const container = document.getElementById('ordersContainer');
        if (!allOrders.length) {
            container.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i> No orders yet</div>';
            return;
        }
        
        let html = '';
        for (const order of allOrders) {
            let statusClass = order.status === 'Pending' ? 'status-pending' : 'status-approved';
            let statusText = order.status === 'Pending' ? '⏳ Pending' : '✅ Approved';
            let paymentIcon = '';
            if (order.payment_method === 'kpay') paymentIcon = '🏦 KBZ';
            else if (order.payment_method === 'wavepay') paymentIcon = '📱 Wave';
            else if (order.payment_method === 'ayapay') paymentIcon = '💳 AYA';
            
            html += `
                <div class="order-card" data-id="${order.id}">
                    <div class="order-header">
                        <span class="order-plan"><i class="fas fa-gem"></i> ${order.plan}</span>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                    <div class="order-details">
                        <span><i class="fas fa-phone"></i> ${maskPhone(order.phone)}</span>
                        <span><i class="fas fa-coins"></i> ${order.price.toLocaleString()} MMK</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.65rem; color: #64748b;">
                        <span><i class="fas fa-credit-card"></i> ${paymentIcon}</span>
                        <span><i class="fas fa-clock"></i> ${formatDate(order.created_at)}</span>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }
    
    function updateStats() {
        const total = allOrders.length;
        const pending = allOrders.filter(o => o.status === 'Pending').length;
        document.getElementById('totalCount').innerText = total;
        document.getElementById('pendingCount').innerText = pending;
    }
    
    // Auto refresh every 30 seconds (fallback)
    setInterval(() => {
        loadOrders();
    }, 30000);
    
    // Initialize
    connectLiveEvents();
    loadOrders();
</script>
</body>
</html>
