<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>LIVE Orders | ATH DIGITAL HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #0a0c15;
            --bg-card: #0f111a;
            --cyan: #00d4ff;
            --emerald: #10b981;
            --rose: #f43f5e;
            --amber: #f59e0b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
        }
        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', 'Noto Sans Myanmar', sans-serif;
            min-height: 100vh;
            background-image: radial-gradient(ellipse at 20% 30%, rgba(139,92,246,0.1) 0%, transparent 50%);
            padding: 16px;
            padding-bottom: 80px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0,212,255,0.2);
        }
        .logo {
            font-family: 'Space Grotesk', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--cyan));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .live-badge {
            background: rgba(244,63,94,0.2);
            color: #f43f5e;
            font-size: 0.6rem;
            padding: 4px 10px;
            border-radius: 40px;
            animation: blinkRed 0.8s step-end infinite;
        }
        @keyframes blinkRed {
            0%,100% { background: rgba(244,63,94,0.2); }
            50% { background: rgba(244,63,94,0.8); color: white; }
        }
        
        /* Search Section */
        .search-section {
            background: rgba(0,212,255,0.05);
            border-radius: 1rem;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid rgba(0,212,255,0.15);
        }
        .search-title {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .search-box {
            display: flex;
            gap: 8px;
        }
        .search-box input {
            flex: 1;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 60px;
            padding: 10px 16px;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }
        .search-box input:focus { border-color: var(--cyan); }
        .search-box button {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            border: none;
            padding: 8px 18px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
        }
        .search-box button.clear { background: #334155; color: white; }
        .search-message {
            font-size: 0.65rem;
            margin-top: 10px;
            text-align: center;
            padding: 8px;
            border-radius: 40px;
        }
        .search-message.success { background: rgba(16,185,129,0.15); color: #34d399; }
        .search-message.error { background: rgba(244,63,94,0.15); color: #fb7185; }
        
        /* Stack Container (LIVE Orders) */
        .stack-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }
        .stack-item {
            background: linear-gradient(135deg, rgba(18,22,35,0.95), rgba(10,12,21,0.98));
            border-radius: 12px;
            padding: 14px;
            border-left: 3px solid var(--violet);
            transition: all 0.3s ease;
        }
        .stack-item:hover { transform: translateX(4px); border-left-color: var(--cyan); }
        .stack-item.new-order { 
            border-left-color: var(--cyan); 
            background: rgba(0,212,255,0.08);
            animation: blinkCyan 2s ease-in-out;
        }
        .stack-item.search-highlight {
            border: 2px solid #fbbf24;
            background: rgba(251,191,36,0.15);
            box-shadow: 0 0 20px rgba(251,191,36,0.5);
            animation: orangeGlow 0.8s ease-in-out 3;
        }
        @keyframes orangeGlow {
            0% { border-color: rgba(245,158,11,0); box-shadow: 0 0 0px rgba(245,158,11,0); background: rgba(245,158,11,0); }
            50% { border-color: #f59e0b; box-shadow: 0 0 20px #f59e0b; background: rgba(245,158,11,0.25); }
            100% { border-color: rgba(245,158,11,0); box-shadow: 0 0 0px rgba(245,158,11,0); background: rgba(245,158,11,0); }
        }
        @keyframes blinkCyan {
            0% { background: rgba(0,212,255,0); border-left-color: var(--violet); }
            25% { background: rgba(0,212,255,0.3); border-left-color: var(--cyan); box-shadow: 0 0 15px var(--cyan); }
            50% { background: rgba(0,212,255,0.1); border-left-color: var(--violet); }
            75% { background: rgba(0,212,255,0.3); border-left-color: var(--cyan); box-shadow: 0 0 15px var(--cyan); }
            100% { background: rgba(0,212,255,0); border-left-color: var(--violet); }
        }
        
        .new-badge {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            color: white;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 40px;
            display: inline-block;
            margin-bottom: 8px;
        }
        .stack-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }
        .stack-plan {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--cyan);
        }
        .stack-status {
            padding: 3px 10px;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 600;
        }
        .stack-status.pending { background: rgba(245,158,11,0.2); color: #fbbf24; }
        .stack-status.approved { background: rgba(16,185,129,0.2); color: #34d399; }
        .stack-status.rejected { background: rgba(244,63,94,0.2); color: #fb7185; }
        .stack-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }
        .stack-phone {
            font-size: 0.7rem;
            font-family: monospace;
            color: var(--amber);
        }
        .stack-price {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--emerald);
        }
        .feed-countdown {
            font-size: 0.6rem;
            color: var(--cyan);
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: monospace;
        }
        .feed-countdown.expired { color: var(--rose); }
        
        .status-bar {
            display: flex;
            justify-content: flex-start;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.6rem;
            color: #64748b;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 1.5s infinite;
            display: inline-block;
            margin-right: 4px;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        .empty-msg {
            text-align: center;
            padding: 32px;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--emerald);
            color: #030712;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 0.8rem;
            z-index: 1000;
            display: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">⚡ ATH DIGITAL HUB</div>
        <div><span class="live-badge"><i class="fas fa-circle"></i> LIVE</span></div>
    </div>
    
    <!-- Search Section -->
    <div class="search-section">
        <div class="search-title"><i class="fas fa-search"></i> သက်တမ်းစစ်ရန်</div>
        <div class="search-box">
            <input type="tel" id="searchPhone" placeholder="📱 ဖုန်းနံပါတ်ရိုက်ထည့်ပါ">
            <button id="searchBtn"><i class="fas fa-search"></i> ရှာ</button>
            <button id="clearSearchBtn" class="clear"><i class="fas fa-times"></i> ရှင်း</button>
        </div>
        <div id="searchMessage" class="search-message" style="display: none;"></div>
    </div>
    
    <!-- LIVE Orders Title -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 style="font-size: 1rem;"><i class="fas fa-broadcast-tower"></i> LIVE အော်ဒါများ</h2>
        <span id="liveTimer" style="background: #1e293b; padding: 4px 12px; border-radius: 40px; font-size: 0.6rem;">auto 30s</span>
    </div>
    
    <!-- Stack Container -->
    <div id="stackContainer" class="stack-container">
        <div class="empty-msg"><i class="fas fa-spinner fa-pulse"></i> စောင့်နေသည်...</div>
    </div>
    
    <div class="status-bar">
        <span class="status-dot"></span>
        <span id="liveUpdateText">အလိုအလျောက်: 30s</span>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    const API_BASE = window.location.origin;
    let stackOrders = [];
    let autoRefreshInterval = null, timerInterval = null, rotateInterval = null;
    let refreshSec = 30;
    let currentSearchPhone = "";
    let liveCountdownIntervals = {};
    let lastHash = '';
    const ROTATE_MS = 10000;
    const NEW_TIMEOUT = 120000;
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#f43f5e' : '#10b981';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }
    
    function maskPhone(phone) {
        if (!phone || phone.length < 8) return phone || '';
        return phone.substring(0,5) + '***' + phone.substring(phone.length-3);
    }
    
    function formatDate(d) {
        if (!d) return '';
        let date = new Date(d);
        return `${date.getDate()}/${date.getMonth()+1}/${date.getFullYear()}`;
    }
    
    function getRemainingTime(activatedAt) {
        if (!activatedAt) return null;
        let end = new Date(activatedAt).getTime() + (30 * 24 * 60 * 60 * 1000);
        let remain = end - Date.now();
        if (remain <= 0) return 'Expired';
        let days = Math.floor(remain / 86400000);
        let hours = Math.floor((remain % 86400000) / 3600000);
        let minutes = Math.floor((remain % 3600000) / 60000);
        let seconds = Math.floor((remain % 60000) / 1000);
        return `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }
    
    const isNewOrder = (o) => Date.now() - new Date(o.created_at).getTime() < NEW_TIMEOUT;
    
    function addGlowEffect(element) {
        if (!element) return;
        element.classList.add('glow');
        setTimeout(() => { element.classList.remove('glow'); }, 500);
    }
    
    function startLiveCountdown(orderId, activatedAt) {
        if (liveCountdownIntervals[orderId]) clearInterval(liveCountdownIntervals[orderId]);
        const fn = () => {
            const el = document.getElementById(`live-cd-${orderId}`);
            if (!el) {
                clearInterval(liveCountdownIntervals[orderId]);
                return;
            }
            const remain = getRemainingTime(activatedAt);
            if (remain === "Expired") {
                el.innerHTML = `<i class="fas fa-calendar-times"></i> <span style="color:#f43f5e;">Expired</span>`;
                el.classList.add('expired');
                clearInterval(liveCountdownIntervals[orderId]);
            } else {
                el.innerHTML = `<i class="fas fa-hourglass-half"></i> <span style="color:var(--cyan);">${remain}</span>`;
            }
        };
        fn();
        liveCountdownIntervals[orderId] = setInterval(fn, 1000);
    }
    
    function renderStack() {
        const container = document.getElementById('stackContainer');
        if (!stackOrders.length) {
            container.innerHTML = '<div class="empty-msg">📭 အော်ဒါမရှိသေးပါ။<br>စောင့်ဆိုင်းနေပါသည်...</div>';
            return;
        }
        
        let html = '<div class="stack-container">';
        for (const order of stackOrders) {
            let isNew = isNewOrder(order);
            let isHighlight = currentSearchPhone && order.phone === currentSearchPhone;
            let statClass = "pending", statText = "⏳ စောင့်ဆိုင်းဆဲ";
            if (order.status === "Approved") { statClass = "approved"; statText = "✅ အတည်ပြုပြီး"; }
            if (order.status === "Rejected") { statClass = "rejected"; statText = "❌ ပယ်ဖျက်ခံရ"; }
            
            let countdownHtml = '';
            if (order.status === 'Approved' && order.activated_at) {
                let remain = getRemainingTime(order.activated_at);
                countdownHtml = `<div class="feed-countdown" id="live-cd-${order.id}"><i class="fas fa-hourglass-half"></i> ကျန်ရှိ: ${remain}</div>`;
            }
            
            html += `
                <div class="stack-item ${isNew ? 'new-order' : ''} ${isHighlight ? 'search-highlight' : ''}" data-order-id="${order.id}">
                    ${isNew ? `<div class="new-badge"><i class="fas fa-fire"></i> NEW</div>` : ''}
                    <div class="stack-header">
                        <span class="stack-plan"><i class="fas fa-sim-card"></i> ${order.plan}</span>
                        <span class="stack-status ${statClass}">${statText}</span>
                    </div>
                    <div class="stack-details">
                        <span class="stack-phone"><i class="fas fa-mobile-alt"></i> ${maskPhone(order.phone)}</span>
                        <span class="stack-price"><i class="fas fa-coins"></i> ${order.price.toLocaleString()} KS</span>
                    </div>
                    ${countdownHtml}
                </div>
            `;
        }
        html += '</div>';
        container.innerHTML = html;
        
        for (const order of stackOrders) {
            if (order.status === 'Approved' && order.activated_at) {
                startLiveCountdown(order.id, order.activated_at);
            }
        }
    }
    
    function rotateStack() {
        if (stackOrders.length > 1) {
            const lastItem = stackOrders.pop();
            stackOrders.unshift(lastItem);
            renderStack();
            setTimeout(() => {
                const topCard = document.querySelector('.stack-item');
                if (topCard) addGlowEffect(topCard);
            }, 50);
        }
    }
    
    async function loadLiveOrders() {
        try {
            const res = await fetch(`${API_BASE}/api/admin/orders`);
            const data = await res.json();
            if (data.orders) {
                let filtered = data.orders;
                if (currentSearchPhone) {
                    filtered = filtered.filter(o => o.phone === currentSearchPhone);
                }
                let sorted = [...filtered].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
                let hash = JSON.stringify(sorted.map(o => ({ id: o.id, status: o.status })));
                
                if (hash !== lastHash) {
                    lastHash = hash;
                    let currIds = stackOrders.map(o => o.id);
                    let newOnes = sorted.filter(o => !currIds.includes(o.id));
                    if (newOnes.length) {
                        stackOrders = [...newOnes, ...stackOrders].slice(0, 30);
                        renderStack();
                        setTimeout(() => {
                            const newCards = document.querySelectorAll('.stack-item');
                            for (let i = 0; i < newOnes.length && i < newCards.length; i++) {
                                addGlowEffect(newCards[i]);
                            }
                        }, 50);
                    } else {
                        let upd = [];
                        sorted.forEach(o => { if (currIds.includes(o.id)) upd.push(o); });
                        stackOrders.forEach(o => { if (!upd.find(x => x.id === o.id)) upd.push(o); });
                        stackOrders = upd.slice(0, 30);
                        renderStack();
                    }
                }
            }
        } catch(e) {
            console.error('Error loading live orders:', e);
            document.getElementById('stackContainer').innerHTML = '<div class="empty-msg">🔴 Connection error</div>';
        }
    }
    
    async function searchByPhone() {
        const phone = document.getElementById('searchPhone').value.trim();
        const msgDiv = document.getElementById('searchMessage');
        
        if (!phone || phone.length < 9) {
            if (msgDiv) {
                msgDiv.style.display = 'block';
                msgDiv.className = 'search-message error';
                msgDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> ဖုန်းနံပါတ် မှန်ကန်စွာ ထည့်ပါ (09xxxxxxxxx)';
            }
            return;
        }
        
        if (msgDiv) {
            msgDiv.style.display = 'block';
            msgDiv.className = 'search-message';
            msgDiv.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> ရှာဖွေနေသည်...';
        }
        
        try {
            const res = await fetch(`${API_BASE}/api/orders/${encodeURIComponent(phone)}`);
            const data = await res.json();
            const orders = data.orders || [];
            
            if (orders.length === 0) {
                if (msgDiv) {
                    msgDiv.className = 'search-message error';
                    msgDiv.innerHTML = '<i class="fas fa-times-circle"></i> ဤဖုန်းနံပါတ်အတွက် ဝယ်ယူထားခြင်းမရှိသေးပါ။';
                }
                currentSearchPhone = '';
                await loadLiveOrders();
            } else {
                if (msgDiv) {
                    msgDiv.className = 'search-message success';
                    msgDiv.innerHTML = '<i class="fas fa-check-circle"></i> တွေ့ရှိပါသည်။ 🟠 လိမ္မော်ရောင် မှိတ်တုတ်ပြသပါမည်။';
                }
                currentSearchPhone = phone;
                stackOrders = orders.slice(0, 30);
                renderStack();
            }
            
            setTimeout(() => {
                const highlighted = document.querySelector('.search-highlight');
                if (highlighted) highlighted.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        } catch(e) {
            if (msgDiv) {
                msgDiv.className = 'search-message error';
                msgDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> ရှာဖွေရာတွင် အမှားရှိပါသည်။';
            }
        }
    }
    
    function clearSearch() {
        currentSearchPhone = '';
        document.getElementById('searchPhone').value = '';
        document.getElementById('searchMessage').style.display = 'none';
        loadLiveOrders();
    }
    
    function startAutoRefresh() {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        if (timerInterval) clearInterval(timerInterval);
        
        refreshSec = 30;
        const timerSpan = document.getElementById('liveTimer');
        const updateTimer = () => {
            if (timerSpan) timerSpan.innerText = `auto ${refreshSec}s`;
            refreshSec--;
            if (refreshSec < 0) refreshSec = 30;
        };
        timerInterval = setInterval(updateTimer, 1000);
        
        autoRefreshInterval = setInterval(async () => {
            await loadLiveOrders();
            refreshSec = 30;
            if (timerSpan) timerSpan.innerText = 'auto 30s';
        }, 30000);
    }
    
    function startRotate() {
        if (rotateInterval) clearInterval(rotateInterval);
        rotateInterval = setInterval(() => {
            if (stackOrders.length > 1 && !currentSearchPhone) {
                rotateStack();
            }
        }, ROTATE_MS);
    }
    
    // Initialize
    document.getElementById('searchBtn').addEventListener('click', searchByPhone);
    document.getElementById('clearSearchBtn').addEventListener('click', clearSearch);
    document.getElementById('searchPhone').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchByPhone();
    });
    
    startAutoRefresh();
    startRotate();
    loadLiveOrders();
</script>
</body>
</html>
