<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ATH DIGITAL HUB | Mytel VIP Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0c15 0%, #0f1222 100%);
            font-family: 'Noto Sans Myanmar', 'Inter', sans-serif;
            color: #f1f5f9;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding: 15px 25px;
            background: rgba(10,12,21,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 20px;
        }
        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #00d4ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .logout-btn, .orders-btn {
            background: rgba(0,212,255,0.1);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            color: #00d4ff;
            font-family: inherit;
        }
        .logout-btn:hover, .orders-btn:hover { background: #00d4ff; color: #030712; }
        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .login-card {
            background: linear-gradient(145deg, #1a1d2e, #0f1222);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .login-card h2 {
            font-size: 1.5rem;
            margin: 20px 0 10px;
            background: linear-gradient(135deg, #fff, #00d4ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .login-card .subtitle {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-bottom: 30px;
        }
        .login-input {
            width: 100%;
            padding: 14px 20px;
            margin: 10px 0;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            text-align: center;
        }
        .login-input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d4ff, #0891b2);
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            color: #030712;
        }
        .login-btn-secondary {
            background: linear-gradient(135deg, #10b981, #059669);
            margin-top: 5px;
        }
        .otp-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .error-msg {
            color: #f43f5e;
            font-size: 0.8rem;
            margin-top: 12px;
        }
        .success-msg {
            color: #10b981;
            font-size: 0.8rem;
            margin-top: 12px;
        }
        .info-msg {
            color: #f59e0b;
            font-size: 0.7rem;
            margin-top: 12px;
        }
        .hidden { display: none; }
        
        .dashboard { margin-bottom: 30px; }
        .balance-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 24px;
            padding: 25px;
        }
        .balance-title {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .balance-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .balance-item {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
        }
        .balance-icon { font-size: 2rem; margin-bottom: 10px; }
        .balance-value { font-size: 1.6rem; font-weight: 800; }
        .balance-label { font-size: 0.65rem; color: #94a3b8; margin-top: 5px; }
        .balance-value.ks { color: #10b981; }
        .balance-value.min { color: #f59e0b; }
        .balance-value.data { color: #00d4ff; }
        .refresh-btn {
            background: rgba(0,212,255,0.1);
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
            color: #00d4ff;
            margin-top: 15px;
        }
        
        .pack-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 20px;
        }
        .pack-card {
            background: linear-gradient(145deg, #11131e, #0c0e16);
            border: 1px solid rgba(34,197,94,0.2);
            border-radius: 24px;
            padding: 1.2rem;
            transition: all 0.3s;
        }
        .pack-card:hover { transform: translateY(-6px); border-color: #00d4ff; }
        .pack-price { font-size: 1.4rem; font-weight: 800; margin: 10px 0; }
        .feature-list { list-style: none; margin: 15px 0; }
        .feature-list li { margin-bottom: 8px; font-size: 0.7rem; display: flex; align-items: center; gap: 8px; }
        .feature-list li i { color: #10b981; }
        .buy-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #0891b2);
            color: #030712;
            cursor: pointer;
        }
        
        .orders-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 90%;
            max-width: 500px;
            height: 100%;
            background: rgba(8,12,22,0.98);
            backdrop-filter: blur(24px);
            border-left: 1px solid #00d4ff;
            z-index: 1500;
            transition: right 0.35s ease;
            padding: 20px;
            overflow-y: auto;
        }
        .orders-panel.open { right: 0; }
        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0,212,255,0.3);
        }
        .close-orders { font-size: 1.5rem; cursor: pointer; }
        .order-card {
            background: rgba(18,22,35,0.9);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid rgba(0,212,255,0.1);
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: #030712;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            z-index: 3000;
            display: none;
        }
        .toast.show { display: block; animation: fadeInOut 2.5s ease; }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateY(20px); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header" id="mainHeader" style="display: none;">
        <div class="logo"><i class="fas fa-bolt"></i> ATH DIGITAL HUB</div>
        <div style="display: flex; gap: 10px;">
            <button class="orders-btn" id="myOrdersBtn"><i class="fas fa-list-ul"></i> အော်ဒါများ</button>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> ထွက်မည်</button>
        </div>
    </div>
    
    <div id="loginSection" class="login-container">
        <div class="login-card">
            <i class="fas fa-mobile-alt" style="font-size: 3rem; color: #00d4ff;"></i>
            <h2>OTP ဖြင့် ဝင်ရောက်ပါ</h2>
            <div class="subtitle">OTP ကုဒ်အား သင့်ဖုန်းနံပါတ်သို့ ပို့ပေးပါမည်</div>
            
            <input type="tel" id="phoneInput" class="login-input" placeholder="📱 09xxxxxxxxx">
            <button class="login-btn" id="sendOtpBtn" onclick="sendOTP()">
                <i class="fas fa-paper-plane"></i> OTP ပို့ရန်
            </button>
            
            <div class="otp-section" id="otpSection">
                <div class="info-msg" id="otpInfoMsg">
                    <i class="fas fa-info-circle"></i> OTP ကုဒ်ကို အင်္ဂလိပ်ဂဏန်းများဖြင့် ထည့်ပါ (ဥပမာ - 123456)
                </div>
                <input type="text" id="otpInput" class="login-input" placeholder="6 လုံးပါ OTP ကုဒ် (အင်္ဂလိပ်ဂဏန်း)">
                <button class="login-btn login-btn-secondary" onclick="verifyOTP()" id="verifyBtn">
                    <i class="fas fa-check-circle"></i> အတည်ပြုပြီး ဝင်ရောက်မည်
                </button>
            </div>
            
            <div id="loginMessage"></div>
        </div>
    </div>
    
    <div id="dashboardSection" style="display: none;">
        <div class="dashboard">
            <div class="balance-card">
                <div class="balance-title"><i class="fas fa-chart-line"></i> ကျွန်ုပ်၏ Mytel လက်ကျန်</div>
                <div class="balance-grid">
                    <div class="balance-item">
                        <div class="balance-icon">💰</div>
                        <div class="balance-value ks" id="balanceAmount">0</div>
                        <div class="balance-label">လက်ကျန်ငွေ (Ks)</div>
                    </div>
                    <div class="balance-item">
                        <div class="balance-icon">📞</div>
                        <div class="balance-value min" id="minutesAmount">0</div>
                        <div class="balance-label">မိနစ်လက်ကျန်</div>
                    </div>
                    <div class="balance-item">
                        <div class="balance-icon">📶</div>
                        <div class="balance-value data" id="dataAmount">0</div>
                        <div class="balance-label">ဒေတာလက်ကျန် (MB)</div>
                    </div>
                </div>
                <div style="text-align: right;">
                    <button class="refresh-btn" onclick="fetchBalance()"><i class="fas fa-sync-alt"></i> ပြန်လည်စစ်ဆေးရန်</button>
                </div>
            </div>
        </div>
        
        <div class="pack-grid" id="plansGrid"></div>
    </div>
</div>

<div id="ordersPanel" class="orders-panel">
    <div class="orders-header">
        <h3><i class="fas fa-list-ul"></i> ကျွန်ုပ်၏ အော်ဒါများ</h3>
        <span class="close-orders" id="closeOrdersBtn">&times;</span>
    </div>
    <div id="ordersList"></div>
</div>

<div id="toast" class="toast"></div>

<script>
    let isLoggedIn = false;
    let currentPhone = '';
    
    const plans = [
        { name: "VIP LEVEL - 1", price: 15000, features: ["22GB အမြန်နှုန်းမြင့်", "8,000 မိနစ် (ကွန်ရက်တွင်း)", "5,000 SMS"] },
        { name: "VIP LEVEL - 2", price: 20000, features: ["40GB အာထရာဒေတာ", "250 မိနစ် (ကွန်ရက်တွင်း)", "25 မိနစ် (အခြားကွန်ရက်)"] },
        { name: "VIP LEVEL - 3", price: 25000, features: ["40GB အမြန်နှုန်း + အပို", "1,400 မိနစ် (ကွန်ရက်တွင်း)", "SMS အကန့်အသတ်မရှိ"] },
        { name: "VIP LEVEL - 4 (ULTRA)", price: 30000, features: ["120GB ဂိမ်းဒေတာ", "အကန့်အသတ်မရှိ Streaming", "ဦးစားပေး ပံ့ပိုးမှု"] }
    ];
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.style.background = isError ? '#f43f5e' : '#10b981';
        toast.innerHTML = isError ? `⚠️ ${msg}` : `✅ ${msg}`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    function renderPlans() {
        const container = document.getElementById('plansGrid');
        let html = '';
        for (const plan of plans) {
            html += `
                <div class="pack-card">
                    <h3>${plan.name}</h3>
                    <div class="pack-price">${plan.price.toLocaleString()} Ks</div>
                    <ul class="feature-list">
                        ${plan.features.map(f => `<li><i class="fas fa-check-circle"></i> ${f}</li>`).join('')}
                    </ul>
                    <button class="buy-btn" onclick="buyPlan('${plan.name}', ${plan.price})">ဝယ်ယူမည်</button>
                </div>
            `;
        }
        container.innerHTML = html;
    }
    
    async function sendOTP() {
        const phone = document.getElementById('phoneInput').value.trim();
        if (!phone || phone.length < 9) {
            showToast('ဖုန်းနံပါတ် မှန်ကန်စွာ ထည့်ပါ', true);
            return;
        }
        
        const sendBtn = document.getElementById('sendOtpBtn');
        const originalText = sendBtn.innerHTML;
        sendBtn.innerHTML = '<span class="spinner"></span> ပို့နေပါသည်...';
        sendBtn.disabled = true;
        
        try {
            const res = await fetch('/api/auth/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone })
            });
            const data = await res.json();
            
            if (data.success) {
                currentPhone = phone;
                showToast('OTP ကုဒ် ပို့ပြီးပါပြီ။ သင့် SMS ကို စစ်ဆေးပါ။');
                document.getElementById('loginMessage').innerHTML = '<div class="success-msg">✓ OTP ကုဒ် ပို့ပြီးပါပြီ။ သင့် SMS ကို စစ်ဆေးပါ။</div>';
                document.getElementById('otpInput').focus();
            } else {
                showToast(data.error || 'OTP ပို့ရန် မအောင်မြင်ပါ', true);
                document.getElementById('loginMessage').innerHTML = `<div class="error-msg">✗ ${data.error || 'OTP ပို့ရန် မအောင်မြင်ပါ'}</div>`;
            }
        } catch (error) {
            showToast('Network error', true);
        } finally {
            sendBtn.innerHTML = originalText;
            sendBtn.disabled = false;
        }
    }
    
    async function verifyOTP() {
        const otp = document.getElementById('otpInput').value.trim();
        const phone = document.getElementById('phoneInput').value.trim();
        
        if (!phone || phone.length < 9) {
            showToast('ဖုန်းနံပါတ် ထည့်ပါ', true);
            return;
        }
        
        if (!otp || otp.length !== 6) {
            showToast('6 လုံးပါ OTP ကုဒ် ထည့်ပါ', true);
            return;
        }
        
        const verifyBtn = document.getElementById('verifyBtn');
        const originalText = verifyBtn.innerHTML;
        verifyBtn.innerHTML = '<span class="spinner"></span> အတည်ပြုနေပါသည်...';
        verifyBtn.disabled = true;
        
        try {
            const res = await fetch('/api/auth/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, otp: otp })
            });
            const data = await res.json();
            
            if (data.success) {
                isLoggedIn = true;
                currentPhone = phone;
                
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                document.getElementById('mainHeader').style.display = 'flex';
                
                showToast('အကောင့်ဝင်ရောက်မှု အောင်မြင်ပါသည်');
                fetchBalance();
                fetchOrders();
            } else {
                showToast(data.error || 'OTP ကုဒ် မှားယွင်းနေပါသည်', true);
                document.getElementById('loginMessage').innerHTML = `<div class="error-msg">✗ ${data.error || 'OTP ကုဒ် မှားယွင်းနေပါသည်'}</div>`;
                document.getElementById('otpInput').value = '';
                document.getElementById('otpInput').focus();
            }
        } catch (error) {
            showToast('Network error', true);
        } finally {
            verifyBtn.innerHTML = originalText;
            verifyBtn.disabled = false;
        }
    }
    
    async function fetchBalance() {
        try {
            const res = await fetch('/api/user/balance');
            const data = await res.json();
            if (data.success) {
                document.getElementById('balanceAmount').innerHTML = data.balance?.toLocaleString() || '0';
                document.getElementById('minutesAmount').innerHTML = data.minutes?.toLocaleString() || '0';
                const dataValue = data.data || 26245;
                document.getElementById('dataAmount').innerHTML = dataValue.toLocaleString();
            }
        } catch (error) {
            console.error('Balance fetch error:', error);
        }
    }
    
    async function fetchOrders() {
        try {
            const res = await fetch('/api/user/orders');
            const data = await res.json();
            if (data.success && data.orders) {
                const container = document.getElementById('ordersList');
                if (data.orders.length === 0) {
                    container.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b;">📭 အော်ဒါမရှိသေးပါ</div>';
                    return;
                }
                
                let html = '';
                for (const order of data.orders) {
                    let statusHtml = '';
                    if (order.status === 'Pending') {
                        statusHtml = '<span style="background:rgba(245,158,11,0.2);color:#fbbf24;padding:3px 12px;border-radius:40px;font-size:0.7rem;">⏳ စောင့်ဆိုင်းဆဲ</span>';
                    } else if (order.status === 'Approved') {
                        statusHtml = '<span style="background:rgba(16,185,129,0.2);color:#34d399;padding:3px 12px;border-radius:40px;font-size:0.7rem;">✅ အတည်ပြုပြီး</span>';
                    } else {
                        statusHtml = '<span style="background:rgba(244,63,94,0.2);color:#fb7185;padding:3px 12px;border-radius:40px;font-size:0.7rem;">❌ ပယ်ဖျက်ခံရ</span>';
                    }
                    
                    html += `
                        <div class="order-card">
                            <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
                                <span style="font-weight:700;">${order.plan}</span>
                                ${statusHtml}
                            </div>
                            <div style="display:flex;justify-content:space-between;font-size:0.8rem;">
                                <span>💰 ${order.price.toLocaleString()} Ks</span>
                                <span>📅 ${new Date(order.created_at).toLocaleDateString()}</span>
                            </div>
                            ${order.status === 'Approved' && order.activated_at ? 
                                `<div style="margin-top:10px;font-size:0.7rem;color:#00d4ff;"><i class="fas fa-hourglass-half"></i> သက်တမ်းကုန်ဆုံးမည်: ${new Date(new Date(order.activated_at).getTime() + 30*24*60*60*1000).toLocaleDateString()}</div>` : ''}
                        </div>
                    `;
                }
                container.innerHTML = html;
            }
        } catch (error) {
            console.error('Orders fetch error:', error);
        }
    }
    
    async function buyPlan(plan, price) {
        if (!isLoggedIn) {
            showToast('ကျေးဇူးပြု၍ အကောင့်ဝင်ပါ', true);
            return;
        }
        
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/*';
        fileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('plan', plan);
            formData.append('price', price);
            formData.append('slip', file);
            
            showToast('အော်ဒါတင်နေပါသည်...');
            
            try {
                const res = await fetch('/api/orders', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    showToast(`အော်ဒါအောင်မြင်ပါသည်။ Order ID: ${data.orderId}`);
                    fetchOrders();
                } else {
                    showToast(data.error || 'အော်ဒါတင်ရာတွင် အမှားရှိပါသည်', true);
                }
            } catch (error) {
                showToast('Network error', true);
            }
        };
        fileInput.click();
    }
    
    async function logout() {
        await fetch('/api/auth/logout', { method: 'POST' });
        isLoggedIn = false;
        document.getElementById('loginSection').style.display = 'flex';
        document.getElementById('dashboardSection').style.display = 'none';
        document.getElementById('mainHeader').style.display = 'none';
        document.getElementById('phoneInput').value = '';
        document.getElementById('otpInput').value = '';
        document.getElementById('loginMessage').innerHTML = '';
        showToast('ထွက်ရန် အောင်မြင်ပါသည်');
    }
    
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('myOrdersBtn').addEventListener('click', () => {
        if (isLoggedIn) {
            fetchOrders();
            document.getElementById('ordersPanel').classList.add('open');
        } else {
            showToast('ကျေးဇူးပြု၍ အကောင့်ဝင်ပါ', true);
        }
    });
    document.getElementById('closeOrdersBtn').addEventListener('click', () => {
        document.getElementById('ordersPanel').classList.remove('open');
    });
    document.getElementById('phoneInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendOTP();
    });
    document.getElementById('otpInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') verifyOTP();
    });
    
    async function checkSession() {
        try {
            const res = await fetch('/api/auth/status');
            const data = await res.json();
            if (data.authenticated) {
                isLoggedIn = true;
                currentPhone = data.phone;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                document.getElementById('mainHeader').style.display = 'flex';
                fetchBalance();
                fetchOrders();
            }
        } catch (error) {
            console.error('Session check error:', error);
        }
    }
    
    renderPlans();
    checkSession();
</script>
</body>
</html>
