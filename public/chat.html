<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Support - ATH DIGITAL HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans Myanmar', sans-serif;
        }
        
        /* ============ MAIN CHAT CONTAINER ============ */
        .chat-widget-container {
            position: fixed;
            bottom: 70px;
            right: 16px;
            width: 520px;          /* ← အကျယ်ကြီးအောင် 520 */
            height: 680px;         /* ← အမြင့်ကြီးအောင် 680 */
            background: linear-gradient(145deg, #0f111a, #0a0c15);
            border-radius: 1.2rem;
            border: 1px solid rgba(0,212,255,0.25);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .chat-widget-container.minimized {
            height: 55px;
        }
        
        .chat-widget-container.minimized .chat-body {
            display: none;
        }
        
        /* ============ CHAT HEADER ============ */
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(0,212,255,0.05));
            border-bottom: 1px solid rgba(0,212,255,0.15);
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }
        
        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .chat-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #00d4ff, #0891b2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .chat-avatar i {
            font-size: 1.2rem;
            color: white;
        }
        
        .chat-header-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #f1f5f9;
        }
        
        .chat-header-status {
            font-size: 0.65rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .online-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        .chat-actions {
            display: flex;
            gap: 5px;
        }
        
        .chat-actions button {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            transition: all 0.2s;
            font-size: 1rem;
        }
        
        .chat-actions button:hover {
            background: rgba(0,212,255,0.15);
            color: #00d4ff;
        }
        
        /* ============ UNREAD BADGE ============ */
        .unread-badge {
            position: absolute;
            top: 5px;
            right: 60px;
            background: #f43f5e;
            color: white;
            font-size: 0.6rem;
            font-weight: bold;
            min-width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            z-index: 10;
            animation: badgePulse 0.5s ease-in-out;
        }
        
        @keyframes badgePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        /* ============ CHAT BODY ============ */
        .chat-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* ============ MODE TOGGLE ============ */
        .mode-toggle {
            display: flex;
            gap: 0;
            padding: 8px 12px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(0,212,255,0.1);
            flex-shrink: 0;
        }
        
        .mode-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 40px;
            margin: 0 4px;
            font-family: inherit;
        }
        
        .mode-btn.private {
            background: rgba(0,212,255,0.15);
            color: #00d4ff;
            border: 1px solid rgba(0,212,255,0.3);
        }
        
        .mode-btn.private.active {
            background: linear-gradient(135deg, #00d4ff, #0891b2);
            color: white;
            border: none;
        }
        
        .mode-btn.global {
            background: rgba(16,185,129,0.15);
            color: #10b981;
            border: 1px solid rgba(16,185,129,0.3);
        }
        
        .mode-btn.global.active {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
        }
        
        /* ============ MESSAGES CONTAINER ============ */
        .chat-messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .chat-messages-container::-webkit-scrollbar {
            width: 4px;
        }
        
        .chat-messages-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.03);
        }
        
        .chat-messages-container::-webkit-scrollbar-thumb {
            background: rgba(0,212,255,0.3);
            border-radius: 4px;
        }
        
        /* ============ MESSAGE BUBBLES ============ */
        .chat-message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .chat-message.user {
            align-items: flex-end;
            margin-left: auto;
        }
        
        .chat-message.admin {
            align-items: flex-start;
            margin-right: auto;
        }
        
        .message-bubble {
            padding: 10px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            font-size: 0.85rem;
            line-height: 1.5;
            max-width: 100%;
        }
        
        .chat-message.user .message-bubble {
            background: linear-gradient(135deg, #00d4ff, #0891b2);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .chat-message.admin .message-bubble {
            background: rgba(255,255,255,0.08);
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        
        .message-sender {
            font-size: 0.55rem;
            color: #94a3b8;
            margin-bottom: 4px;
            padding: 0 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .message-time {
            font-size: 0.5rem;
            color: #64748b;
            margin-top: 4px;
            padding: 0 6px;
        }
        
        /* ============ BADGE ============ */
        .badge {
            font-size: 0.45rem;
            border-radius: 20px;
            padding: 2px 8px;
            margin-left: 6px;
        }
        
        .badge.private {
            background: rgba(0,212,255,0.2);
            color: #00d4ff;
        }
        
        .badge.global {
            background: rgba(16,185,129,0.2);
            color: #10b981;
        }
        
        /* ============ EMPTY STATE ============ */
        .chat-empty {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
            font-size: 0.85rem;
        }
        .chat-empty i {
            font-size: 3rem;
            color: #334155;
            margin-bottom: 16px;
            display: block;
        }
        .chat-empty .sub-text {
            font-size: 0.7rem;
            color: #475569;
            margin-top: 8px;
        }
        
        .chat-loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        
        /* ============ INPUT AREA ============ */
        .chat-input-container {
            padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid rgba(0,212,255,0.1);
            flex-shrink: 0;
        }
        
        .chat-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        .chat-input {
            flex: 1;
            padding: 10px 16px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #2d3a5e;
            border-radius: 24px;
            color: white;
            font-size: 0.85rem;
            resize: none;
            font-family: inherit;
            max-height: 80px;
            transition: all 0.2s;
            line-height: 1.4;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 2px rgba(0,212,255,0.1);
        }
        
        .chat-input::placeholder {
            color: #64748b;
        }
        
        .chat-send-btn {
            background: linear-gradient(135deg, #00d4ff, #0891b2);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        
        .chat-send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 10px rgba(0,212,255,0.4);
        }
        
        .chat-send-btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }
        
        .chat-note {
            font-size: 0.55rem;
            color: #64748b;
            text-align: center;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        /* ============ MOBILE RESPONSIVE ============ */
        @media (max-width: 480px) {
            .chat-widget-container {
                width: calc(100vw - 20px);
                right: 10px;
                left: 10px;
                height: 75vh;
                bottom: 70px;
            }
            
            .chat-message {
                max-width: 90%;
            }
            
            .message-bubble {
                font-size: 0.8rem;
                padding: 8px 14px;
            }
            
            .chat-input {
                font-size: 0.8rem;
                padding: 8px 14px;
            }
            
            .chat-send-btn {
                width: 38px;
                height: 38px;
                font-size: 1rem;
            }
            
            .chat-header {
                padding: 10px 14px;
            }
            
            .chat-header-title {
                font-size: 0.8rem;
            }
            
            .chat-messages-container {
                padding: 12px;
            }
        }
        
        @media (min-width: 481px) and (max-width: 768px) {
            .chat-widget-container {
                width: 420px;
                right: 16px;
                height: 70vh;
            }
        }
    </style>
</head>
<body>
    <div class="chat-widget-container" id="chatContainer">
        <!-- ============ HEADER ============ -->
        <div class="chat-header" onclick="toggleMinimize()">
            <div class="chat-header-info">
                <div class="chat-avatar">
                    <i class="fas fa-headset"></i>
                </div>
                <div>
                    <div class="chat-header-title">Customer Support</div>
                    <div class="chat-header-status">
                        <span class="online-dot"></span>
                        <span>Online</span>
                    </div>
                </div>
            </div>
            <div class="chat-actions">
                <button onclick="event.stopPropagation(); toggleMinimize()" title="Minimize">
                    <i class="fas fa-minus"></i>
                </button>
                <button onclick="event.stopPropagation(); closeUserChat()" title="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="headerUnreadBadge" class="unread-badge" style="display: none;">0</div>
        </div>
        
        <!-- ============ BODY ============ -->
        <div class="chat-body">
            <!-- Mode Toggle -->
            <div class="mode-toggle">
                <button id="privateModeBtn" class="mode-btn private active" onclick="setChatMode('private')">
                    <i class="fas fa-lock"></i> Private Chat (Admin)
                </button>
                <button id="globalModeBtn" class="mode-btn global" onclick="setChatMode('global')">
                    <i class="fas fa-globe"></i> Global Chat (Everyone)
                </button>
            </div>
            
            <!-- Messages -->
            <div class="chat-messages-container" id="chatMessages">
                <div class="chat-loading"><i class="fas fa-spinner fa-pulse"></i> စာများ ဖွင့်နေသည်...</div>
            </div>
            
            <!-- Input -->
            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <textarea id="chatInput" class="chat-input" placeholder="စာရိုက်ရန် ဤနေရာတွင် နှိပ်ပါ..." rows="1" maxlength="500"></textarea>
                    <button class="chat-send-btn" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="chat-note" id="chatModeNote">
                    <i class="fas fa-lock"></i> Private message - Only you and Admin can see
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentUser = null;
        let currentUsername = null;
        let currentUserId = null;
        let refreshInterval = null;
        let isMinimized = false;
        let currentMode = 'private';
        let lastMessageCount = 0;
        
        // ============ UTILITY FUNCTIONS ============
        function getMyanmarTime(timestamp) {
            const date = new Date(timestamp);
            const utcTime = date.getTime();
            const myanmarOffset = 6.5 * 60 * 60 * 1000;
            const myanmarDate = new Date(utcTime + myanmarOffset);
            let hours = myanmarDate.getUTCHours();
            const minutes = myanmarDate.getUTCMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const minutesStr = minutes < 10 ? '0' + minutes : minutes;
            return `${hours}:${minutesStr} ${ampm}`;
        }
        
        function getMyanmarDate(timestamp) {
            const date = new Date(timestamp);
            const utcTime = date.getTime();
            const myanmarOffset = 6.5 * 60 * 60 * 1000;
            const myanmarDate = new Date(utcTime + myanmarOffset);
            const months = ['ဇန်နဝါရီ', 'ဖေဖော်ဝါရီ', 'မတ်', 'ဧပြီ', 'မေ', 'ဇွန်', 'ဇူလိုင်', 'သြဂုတ်', 'စက်တင်ဘာ', 'အောက်တိုဘာ', 'နိုဝင်ဘာ', 'ဒီဇင်ဘာ'];
            return `${months[myanmarDate.getUTCMonth()]} ${myanmarDate.getUTCDate()}`;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function showNotification(message, isError = false) {
            console.log(`🔔 Notification: ${message} (${isError ? 'error' : 'success'})`);
            try {
                if (window.parent && window.parent.showToast) {
                    window.parent.showToast(message, isError);
                } else {
                    const toast = document.createElement('div');
                    toast.textContent = message;
                    toast.style.cssText = `
                        position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
                        background: ${isError ? '#f43f5e' : '#10b981'}; color: white;
                        padding: 8px 16px; border-radius: 40px; font-size: 0.75rem;
                        z-index: 2000; white-space: nowrap;
                        font-family: inherit;
                    `;
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 2500);
                }
            } catch(e) {
                console.log('Toast error:', e);
            }
        }
        
        // ============ USER INFO ============
        function getCurrentUserInfo() {
            currentUser = localStorage.getItem('userPhone');
            currentUsername = localStorage.getItem('userName');
            currentUserId = localStorage.getItem('userId');
            
            try {
                if (window.parent && window.parent.getCurrentUserPhone) currentUser = window.parent.getCurrentUserPhone();
                if (window.parent && window.parent.getCurrentUsername) currentUsername = window.parent.getCurrentUsername();
                if (window.parent && window.parent.getCurrentUserId) currentUserId = window.parent.getCurrentUserId();
            } catch(e) {
                console.log('Cannot access parent window');
            }
            
            if (!currentUser) {
                currentUser = 'guest';
                currentUsername = 'Guest User';
                currentUserId = 'guest_' + Date.now();
            }
            console.log('========== USER INFO ==========');
            console.log('📱 Phone:', currentUser);
            console.log('👤 Username:', currentUsername);
            console.log('🆔 User ID:', currentUserId);
            console.log('🔘 Mode:', currentMode);
            console.log('================================');
        }
        
        // ============ UNREAD COUNT ============
        async function updateUnreadCount() {
            try {
                const response = await fetch(`${API_BASE}/api/chat/private/unread/${currentUserId}`);
                const data = await response.json();
                const badge = document.getElementById('headerUnreadBadge');
                if (badge) {
                    if (data.unreadCount > 0) {
                        badge.style.display = 'flex';
                        badge.innerText = data.unreadCount > 99 ? '99+' : data.unreadCount;
                    } else {
                        badge.style.display = 'none';
                    }
                }
            } catch(e) {
                console.error('Error getting unread count:', e);
            }
        }
        
        // ============ MODE SWITCHING ============
        function setChatMode(mode) {
            currentMode = mode;
            const privateBtn = document.getElementById('privateModeBtn');
            const globalBtn = document.getElementById('globalModeBtn');
            const modeNote = document.getElementById('chatModeNote');
            
            if (mode === 'private') {
                privateBtn.classList.add('active');
                globalBtn.classList.remove('active');
                modeNote.innerHTML = '<i class="fas fa-lock"></i> Private message - Only you and Admin can see';
                console.log('🔒 Switched to PRIVATE CHAT mode');
            } else {
                privateBtn.classList.remove('active');
                globalBtn.classList.add('active');
                modeNote.innerHTML = '<i class="fas fa-globe"></i> Global message - Everyone can see';
                console.log('🌍 Switched to GLOBAL CHAT mode');
            }
            loadMessages();
        }
        
        // ============ LOAD MESSAGES ============
        async function loadMessages() {
            const container = document.getElementById('chatMessages');
            if (!container) return;
            
            if (!currentUserId || currentUserId === 'guest_' + Date.now()) {
                container.innerHTML = '<div class="chat-loading">ကျေးဇူးပြု၍ အကောင့်ဝင်ပါ</div>';
                return;
            }
            
            try {
                let messages = [];
                
                if (currentMode === 'private') {
                    console.log('🔍 Loading PRIVATE messages for user:', currentUserId);
                    
                    const url1 = `${API_BASE}/api/chat/private/${currentUserId}?currentUserId=${currentUserId}`;
                    const response1 = await fetch(url1);
                    const data1 = await response1.json();
                    
                    const url2 = `${API_BASE}/api/chat/private/${currentUserId}?currentUserId=admin`;
                    const response2 = await fetch(url2);
                    const data2 = await response2.json();
                    
                    let allMessages = [];
                    if (data1.success && data1.messages) {
                        allMessages.push(...data1.messages);
                    }
                    if (data2.success && data2.messages) {
                        allMessages.push(...data2.messages);
                    }
                    
                    const uniqueMessages = [];
                    const seenIds = new Set();
                    for (const msg of allMessages) {
                        if (!seenIds.has(msg.id)) {
                            seenIds.add(msg.id);
                            uniqueMessages.push(msg);
                        }
                    }
                    
                    uniqueMessages.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                    messages = uniqueMessages;
                    
                    if (messages.length > lastMessageCount && lastMessageCount > 0) {
                        const newCount = messages.length - lastMessageCount;
                        console.log(`🔔 ${newCount} new message(s) from Admin!`);
                        updateUnreadCount();
                    }
                    lastMessageCount = messages.length;
                    
                    console.log(`✅ Loaded ${messages.length} total private messages`);
                } else {
                    console.log('🌍 Loading GLOBAL messages');
                    const response = await fetch(`${API_BASE}/api/chat/messages`);
                    const data = await response.json();
                    if (data.success && data.messages) {
                        messages = data.messages;
                        console.log(`✅ Loaded ${messages.length} global messages`);
                    }
                }
                
                if (messages.length > 0) {
                    renderMessages(messages);
                } else {
                    // ============ မြန်မာလို ပြင်ဆင်ထားတဲ့ နေရာ ============
                    const emptyText = currentMode === 'private' 
                        ? '💬 သင့်စာကို အောက်တွင် ရိုက်ထည့်ပါ။ Admin ပြန်ဖြေပေးပါမည်။'
                        : '🌍 လူတိုင်းမြင်ရမည့် စာကို ရိုက်ထည့်ပါ။';
                    container.innerHTML = `<div class="chat-empty"><i class="fas fa-comment-dots"></i>${emptyText}<div class="sub-text">စာရိုက်ရန် အောက်ပါအကွက်တွင် ရိုက်ထည့်ပါ။</div></div>`;
                }
            } catch (error) {
                console.error('❌ Error loading messages:', error);
                container.innerHTML = '<div class="chat-loading">ဆာဗာသို့ ချိတ်ဆက်မရပါ</div>';
            }
        }
        
        // ============ RENDER MESSAGES ============
        function renderMessages(messages) {
            const container = document.getElementById('chatMessages');
            if (!container) return;
            
            let html = '';
            let lastDate = null;
            
            for (const msg of messages) {
                const myanmarTime = getMyanmarTime(msg.created_at);
                const myanmarDate = getMyanmarDate(msg.created_at);
                
                let isUser = false;
                let senderName = '';
                let modeBadge = '';
                
                if (currentMode === 'private') {
                    isUser = (msg.sender_id === currentUserId);
                    senderName = isUser ? (currentUsername || 'You') : '👑 Admin';
                    modeBadge = '<span class="badge private"><i class="fas fa-lock"></i> Private</span>';
                } else {
                    isUser = !msg.is_admin && msg.user_id === currentUserId;
                    senderName = msg.is_admin ? '👑 Admin' : (msg.username || 'User');
                    modeBadge = '<span class="badge global"><i class="fas fa-globe"></i> Global</span>';
                }
                
                if (lastDate !== myanmarDate) {
                    html += `<div style="text-align:center; margin:8px 0;"><span style="background:rgba(0,212,255,0.1); padding:2px 10px; border-radius:40px; font-size:0.55rem; color:#64748b;">📅 ${myanmarDate}</span></div>`;
                    lastDate = myanmarDate;
                }
                
                html += `
                    <div class="chat-message ${isUser ? 'user' : 'admin'}">
                        <div class="message-sender">
                            ${isUser ? '<i class="fas fa-user"></i>' : '<i class="fas fa-shield-alt"></i>'} 
                            ${escapeHtml(senderName)} ${modeBadge}
                        </div>
                        <div class="message-bubble">${escapeHtml(msg.message)}</div>
                        <div class="message-time">🕐 ${myanmarTime}</div>
                    </div>
                `;
            }
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }
        
        // ============ SEND MESSAGE ============
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            const sendBtn = document.querySelector('.chat-send-btn');
            
            if (!message) return;
            
            if (currentUser === 'guest' || !currentUserId || currentUserId.startsWith('guest_')) {
                showNotification("ကျေးဇူးပြု၍ အကောင့်ဝင်ပါ", true);
                return;
            }
            
            input.disabled = true;
            sendBtn.disabled = true;
            
            console.log(`📤 Sending ${currentMode} message...`);
            console.log('Message:', message);
            console.log('From User ID:', currentUserId);
            
            try {
                let response;
                let data;
                
                if (currentMode === 'private') {
                    console.log('🔒 Sending PRIVATE message to admin');
                    response = await fetch(`${API_BASE}/api/chat/private/send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sender_id: currentUserId,
                            receiver_id: 'admin',
                            sender_name: currentUsername || 'User',
                            receiver_name: 'Admin',
                            message: message
                        })
                    });
                    
                    data = await response.json();
                    console.log('📨 Private send response:', data);
                    
                    if (data.success) {
                        console.log('✅ Private message sent successfully!');
                        input.value = '';
                        input.style.height = 'auto';
                        addMessageToUI(message, true);
                        setTimeout(() => loadMessages(), 500);
                        showNotification('✅ Admin ထံ စာပို့ပြီးပါပြီ');
                    } else {
                        console.error('❌ Private send failed:', data.error);
                        showNotification(data.error || "Failed to send", true);
                    }
                } else {
                    console.log('🌍 Sending GLOBAL message');
                    response = await fetch(`${API_BASE}/api/chat/send`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: currentUserId,
                            username: currentUsername || 'User',
                            message: message
                        })
                    });
                    
                    data = await response.json();
                    console.log('📨 Global send response:', data);
                    
                    if (data.success) {
                        console.log('✅ Global message sent successfully!');
                        input.value = '';
                        input.style.height = 'auto';
                        addMessageToUI(message, true);
                        setTimeout(() => loadMessages(), 500);
                        showNotification('✅ Global message sent');
                    } else {
                        console.error('❌ Global send failed:', data.error);
                        showNotification(data.error || "Failed to send", true);
                    }
                }
            } catch (error) {
                console.error('❌ Send error:', error);
                showNotification("Connection error: " + error.message, true);
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }
        
        // ============ ADD MESSAGE TO UI ============
        function addMessageToUI(message, isUser) {
            const container = document.getElementById('chatMessages');
            if (!container) return;
            
            const now = new Date();
            const myanmarTime = getMyanmarTime(now.toISOString());
            const modeBadge = currentMode === 'private' 
                ? '<span class="badge private"><i class="fas fa-lock"></i> Private</span>'
                : '<span class="badge global"><i class="fas fa-globe"></i> Global</span>';
            
            const messageHtml = `
                <div class="chat-message user">
                    <div class="message-sender">
                        <i class="fas fa-user"></i> 
                        ${escapeHtml(currentUsername || 'You')} ${modeBadge}
                    </div>
                    <div class="message-bubble">${escapeHtml(message)}</div>
                    <div class="message-time">🕐 ${myanmarTime}</div>
                </div>
            `;
            
            const today = getMyanmarDate(now.toISOString());
            const existingDivider = Array.from(container.querySelectorAll('div[style*="text-align:center"]')).some(
                div => div.innerText.includes(today)
            );
            
            if (!existingDivider && container.children.length > 0) {
                const divider = `<div style="text-align:center; margin:8px 0;"><span style="background:rgba(0,212,255,0.1); padding:2px 10px; border-radius:40px; font-size:0.55rem; color:#64748b;">📅 ${today}</span></div>`;
                container.insertAdjacentHTML('beforeend', divider);
            }
            
            container.insertAdjacentHTML('beforeend', messageHtml);
            container.scrollTop = container.scrollHeight;
        }
        
        // ============ AUTO RESIZE TEXTAREA ============
        function autoResizeTextarea() {
            const textarea = document.getElementById('chatInput');
            if (textarea) {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 60) + 'px';
            }
        }
        
        // ============ KEYBOARD SHORTCUTS ============
        function setupKeyboardShortcuts() {
            const input = document.getElementById('chatInput');
            if (input) {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                });
                input.addEventListener('input', autoResizeTextarea);
            }
        }
        
        // ============ TOGGLE MINIMIZE ============
        function toggleMinimize() {
            const container = document.getElementById('chatContainer');
            if (container) {
                container.classList.toggle('minimized');
                isMinimized = container.classList.contains('minimized');
            }
        }
        
        // ============ CLOSE CHAT ============
        function closeUserChat() {
            if (window.parent && window.parent.closeUserChatWidget) {
                window.parent.closeUserChatWidget();
            }
        }
        
        // ============ INIT ============
        async function init() {
            console.log('🚀 Chat widget initializing...');
            getCurrentUserInfo();
            await loadMessages();
            await updateUnreadCount();
            setupKeyboardShortcuts();
            refreshInterval = setInterval(() => {
                const container = document.getElementById('chatContainer');
                if (container && !container.classList.contains('minimized')) {
                    console.log('🔄 Auto-refreshing messages...');
                    loadMessages();
                    if (currentMode === 'private') {
                        updateUnreadCount();
                    }
                }
            }, 5000);
            console.log('✅ Chat widget initialized');
        }
        
        function cleanup() { 
            if (refreshInterval) clearInterval(refreshInterval);
            console.log('🧹 Chat widget cleaned up');
        }
        
        // ============ START ============
        init();
        window.addEventListener('beforeunload', cleanup);
        
        // ============ EXPOSE GLOBAL FUNCTIONS ============
        window.sendMessage = sendMessage;
        window.toggleMinimize = toggleMinimize;
        window.closeUserChat = closeUserChat;
        window.setChatMode = setChatMode;
        window.loadMessages = loadMessages;
    </script>
</body>
</html>
