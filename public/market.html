<!-- market.html -->
<!DOCTYPE html>
<div id="marketApp">
    <style>
        .market-container {
            padding: 16px 0;
        }
        .market-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .market-header h2 {
            font-size: 1.1rem;
            background: linear-gradient(135deg, var(--cyan), #7dd3fc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .market-header h2 i {
            color: var(--cyan);
            background: none;
            -webkit-background-clip: unset;
            color: var(--cyan);
        }
        .market-refresh-btn {
            background: rgba(0,212,255,0.15);
            border: 1px solid rgba(0,212,255,0.3);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
            color: var(--cyan);
            transition: all 0.2s;
        }
        .market-refresh-btn:hover {
            background: var(--cyan);
            color: #030712;
        }
        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
        }
        .category-tab {
            background: rgba(18,22,35,0.6);
            border: 1px solid rgba(0,212,255,0.15);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }
        .category-tab:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }
        .category-tab.active {
            background: linear-gradient(135deg, var(--cyan), #0891b2);
            border: none;
            color: white;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .product-card {
            background: linear-gradient(145deg, #0f111a, #0a0c15);
            border-radius: 1rem;
            padding: 14px;
            border: 1px solid rgba(0,212,255,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }
        .product-card:hover {
            border-color: var(--cyan);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .product-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .product-name {
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .product-price {
            font-weight: 800;
            color: var(--emerald);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
        .product-discount {
            font-size: 0.6rem;
            color: var(--amber);
            background: rgba(245,158,11,0.15);
            display: inline-block;
            padding: 2px 8px;
            border-radius: 40px;
            margin-bottom: 8px;
        }
        .product-buy-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--cyan), #0891b2);
            border: none;
            padding: 8px;
            border-radius: 60px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
            color: #030712;
        }
        .product-buy-btn:hover {
            transform: scale(0.98);
            filter: brightness(1.1);
        }
        .product-buy-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .market-loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        .market-empty {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        .market-error {
            text-align: center;
            padding: 40px;
            color: var(--rose);
        }
        .featured-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            font-size: 0.55rem;
            padding: 2px 8px;
            border-radius: 40px;
            color: white;
        }
        .product-card {
            position: relative;
        }
    </style>

    <div class="market-container">
        <div class="market-header">
            <h2><i class="fas fa-store"></i> ATH Market</h2>
            <button class="market-refresh-btn" onclick="refreshMarket()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>

        <!-- Category Tabs -->
        <div class="category-tabs" id="categoryTabs">
            <button class="category-tab active" data-category="all">All</button>
        </div>

        <!-- Products Grid -->
        <div id="productsGrid" class="product-grid">
            <div class="market-loading">
                <i class="fas fa-spinner fa-pulse"></i> Loading products...
            </div>
        </div>
    </div>
</div>

<script>
    // Market Component JavaScript
    const MARKET_API = window.location.origin;
    let marketProducts = [];
    let currentCategory = 'all';
    let isLoading = false;

    // Load products from API
    async function loadMarketProducts() {
        if (isLoading) return;
        isLoading = true;
        
        const grid = document.getElementById('productsGrid');
        if (grid) {
            grid.innerHTML = '<div class="market-loading"><i class="fas fa-spinner fa-pulse"></i> Loading products...</div>';
        }
        
        try {
            const res = await fetch(`${MARKET_API}/api/market/products`);
            const data = await res.json();
            
            if (data.products && data.products.length > 0) {
                marketProducts = data.products;
                updateCategories();
                renderProducts();
            } else {
                renderFallbackProducts();
            }
        } catch(e) {
            console.error('Error loading products:', e);
            renderFallbackProducts();
        } finally {
            isLoading = false;
        }
    }

    // Update category tabs based on products
    function updateCategories() {
        const categories = ['all'];
        for (const product of marketProducts) {
            const cat = product.category || 'Uncategorized';
            if (!categories.includes(cat)) {
                categories.push(cat);
            }
        }
        
        const tabsContainer = document.getElementById('categoryTabs');
        if (tabsContainer) {
            let html = '';
            for (const cat of categories) {
                const activeClass = (currentCategory === cat) ? 'active' : '';
                const displayName = cat === 'all' ? 'All' : cat;
                html += `<button class="category-tab ${activeClass}" data-category="${cat}" onclick="filterByCategory('${cat}')">${displayName}</button>`;
            }
            tabsContainer.innerHTML = html;
        }
    }

    // Filter products by category
    function filterByCategory(category) {
        currentCategory = category;
        updateCategories();
        renderProducts();
    }

    // Render products to grid
    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        if (!grid) return;
        
        let filteredProducts = marketProducts;
        if (currentCategory !== 'all') {
            filteredProducts = marketProducts.filter(p => (p.category || 'Uncategorized') === currentCategory);
        }
        
        if (filteredProducts.length === 0) {
            grid.innerHTML = '<div class="market-empty"><i class="fas fa-box-open"></i> No products in this category</div>';
            return;
        }
        
        let html = '';
        for (const product of filteredProducts) {
            const discountHtml = product.discount ? `<div class="product-discount">-${product.discount}% OFF</div>` : '';
            const isFeatured = product.discount && product.discount >= 20;
            
            html += `
                <div class="product-card">
                    ${isFeatured ? '<div class="featured-badge"><i class="fas fa-fire"></i> HOT</div>' : ''}
                    <div class="product-icon">
                        <i class="${product.icon || 'fas fa-box'}"></i>
                    </div>
                    <div class="product-name" title="${escapeHtml(product.name)}">${escapeHtml(product.name)}</div>
                    <div class="product-price">${product.price.toLocaleString()} MMK</div>
                    ${discountHtml}
                    <button class="product-buy-btn" onclick="buyProduct('${product.id}', '${escapeHtml(product.name)}', ${product.price})">
                        <i class="fas fa-shopping-cart"></i> ဝယ်မည်
                    </button>
                </div>
            `;
        }
        grid.innerHTML = html;
    }

    // Fallback products when API fails
    function renderFallbackProducts() {
        const grid = document.getElementById('productsGrid');
        if (!grid) return;
        
        const fallbackProducts = [
            { id: 1, name: "Premium T-Shirt", price: 25000, icon: "fas fa-tshirt", category: "Men", discount: 20 },
            { id: 2, name: "Casual Bag", price: 35000, icon: "fas fa-shopping-bag", category: "Accessories", discount: 15 },
            { id: 3, name: "Sports Shoes", price: 45000, icon: "fas fa-shoe-prints", category: "Men", discount: 10 },
            { id: 4, name: "Formal Shirt", price: 55000, icon: "fas fa-user-tie", category: "Men", discount: 0 },
            { id: 5, name: "Summer Dress", price: 49000, icon: "fas fa-female", category: "Women", discount: 0 },
            { id: 6, name: "Leather Bag", price: 39000, icon: "fas fa-bag-shopping", category: "Women", discount: 0 }
        ];
        
        marketProducts = fallbackProducts;
        updateCategories();
        
        let html = '';
        for (const product of fallbackProducts) {
            const discountHtml = product.discount ? `<div class="product-discount">-${product.discount}% OFF</div>` : '';
            const isFeatured = product.discount && product.discount >= 20;
            
            html += `
                <div class="product-card">
                    ${isFeatured ? '<div class="featured-badge"><i class="fas fa-fire"></i> HOT</div>' : ''}
                    <div class="product-icon">
                        <i class="${product.icon}"></i>
                    </div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">${product.price.toLocaleString()} MMK</div>
                    ${discountHtml}
                    <button class="product-buy-btn" onclick="buyProduct('${product.id}', '${product.name}', ${product.price})">
                        <i class="fas fa-shopping-cart"></i> ဝယ်မည်
                    </button>
                </div>
            `;
        }
        grid.innerHTML = html;
    }

    // Buy product function
    function buyProduct(productId, productName, price) {
        // Show toast message (will use parent's showToast if available)
        if (typeof window.showToast === 'function') {
            window.showToast(`🛍️ ${productName} - ${price.toLocaleString()} MMK`, false);
        } else {
            alert(`🛍️ ${productName} - ${price.toLocaleString()} MMK\n\nဤထုတ်ကုန်ကို မကြာမီ ဝယ်ယူနိုင်ပါမည်။`);
        }
        
        // Optional: You can open the payment modal with product details
        // if (typeof window.openRenewModal === 'function') {
        //     window.openRenewModal('other');
        //     // Set product name and price to the order plan select
        // }
    }

    // Refresh market
    function refreshMarket() {
        loadMarketProducts();
    }

    // Escape HTML
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Initialize market when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            loadMarketProducts();
        });
    } else {
        loadMarketProducts();
    }
</script>
