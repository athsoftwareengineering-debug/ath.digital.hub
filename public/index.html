<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ATH Ultra Weather System | Myanmar Real-time</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  background: #020617;
  color: white;
}

#weather-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.glass {
  position: fixed;
  inset: 0;
  background: linear-gradient(rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  backdrop-filter: blur(3px);
  z-index: 1;
}

/* Weather Bar */
.weather-bar {
  position: fixed;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 14px 28px;
  border-radius: 80px;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

.weather-icon { font-size: 32px; }
.weather-temp { font-size: 26px; font-weight: 900; }
.weather-desc { font-size: 13px; opacity: 0.8; }
.weather-location { font-size: 12px; color: #7dd3fc; }

/* Hero */
.hero {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 10;
  text-align: center;
  padding: 20px;
}

.logo {
  font-size: clamp(70px, 10vw, 140px);
  font-weight: 900;
  background: linear-gradient(45deg, #FFD700, #00FFFF, #FF69B4);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: glow 6s linear infinite;
}

@keyframes glow {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}

.subtitle {
  margin-top: -10px;
  font-size: clamp(14px, 3vw, 24px);
  letter-spacing: 3px;
  color: #cbd5e1;
}

.status {
  margin-top: 20px;
  font-size: 14px;
  color: #7dd3fc;
  background: rgba(0,0,0,0.4);
  padding: 8px 20px;
  border-radius: 40px;
  backdrop-filter: blur(4px);
}

.refresh-btn {
  margin-top: 20px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,215,0,0.3);
  padding: 8px 20px;
  border-radius: 40px;
  font-size: 12px;
  cursor: pointer;
  transition: 0.2s;
  color: #ffd966;
}

.refresh-btn:hover {
  background: rgba(255,215,0,0.2);
  transform: scale(1.02);
}

.light {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.25;
  animation: moveLight 12s ease-in-out infinite alternate;
  z-index: 0;
}

.light1 { background: #00ccff; top: -100px; left: -100px; }
.light2 { background: #ff69b4; bottom: -100px; right: -100px; }

@keyframes moveLight {
  from { transform: translate(0,0) scale(1); }
  to { transform: translate(80px,40px) scale(1.2); }
}

/* Loading state */
.loading {
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}
</style>
</head>
<body>

<canvas id="weather-canvas"></canvas>
<div class="glass"></div>
<div class="light light1"></div>
<div class="light light2"></div>

<!-- Weather Bar -->
<div class="weather-bar">
  <div id="weatherIcon" class="weather-icon">☀️</div>
  <div>
    <div id="weatherTemp" class="weather-temp">--°C</div>
    <div id="weatherDesc" class="weather-desc">ရာသီဥတု ဖတ်နေသည်...</div>
    <div id="weatherLocation" class="weather-location">မြန်မာ</div>
  </div>
</div>

<!-- Hero -->
<div class="hero">
  <div class="logo">ATH</div>
  <div class="subtitle">ULTRA WEATHER ENGINE</div>
  <div class="status" id="weatherStatus">🌦️ LIVE MYANMAR WEATHER</div>
  <button class="refresh-btn" onclick="manualRefresh()"><i>⟳</i> ပြန်လည်စစ်ဆေးမည်</button>
</div>

<script>
// =======================
// CANVAS SETUP
// =======================
const canvas = document.getElementById("weather-canvas");
const ctx = canvas.getContext("2d");
let w, h;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// =======================
// WEATHER STATE
// =======================
let currentWeather = "clear";
let rain = [];
let clouds = [];
let fogs = [];
let stars = [];
let flash = 0;

// =======================
// RAIN
// =======================
class Rain {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * w;
    this.y = Math.random() * -h;
    this.len = 10 + Math.random() * 25;
    this.speed = 10 + Math.random() * 18;
    this.wind = -2 + Math.random() * 4;
    this.opacity = 0.2 + Math.random() * 0.5;
  }
  update() {
    this.x += this.wind;
    this.y += this.speed;
    if (this.y > h) { this.reset(); this.y = -50; }
  }
  draw() {
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x + this.wind, this.y + this.len);
    ctx.strokeStyle = `rgba(180,220,255,${this.opacity})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

// =======================
// CLOUD
// =======================
class Cloud {
  constructor() {
    this.x = Math.random() * w;
    this.y = Math.random() * 250;
    this.size = 180 + Math.random() * 300;
    this.speed = 0.05 + Math.random() * 0.2;
    this.opacity = 0.03 + Math.random() * 0.12;
  }
  update() {
    this.x += this.speed;
    if (this.x > w + 500) this.x = -500;
  }
  draw() {
    const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    grd.addColorStop(0, `rgba(255,255,255,${this.opacity})`);
    grd.addColorStop(1, `rgba(255,255,255,0)`);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// =======================
// FOG
// =======================
class Fog {
  constructor() {
    this.x = Math.random() * w;
    this.y = h - 100 + Math.random() * 120;
    this.size = 200 + Math.random() * 200;
    this.speed = 0.1 + Math.random() * 0.2;
    this.opacity = 0.02 + Math.random() * 0.05;
  }
  update() {
    this.x += this.speed;
    if (this.x > w + 300) this.x = -300;
  }
  draw() {
    const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    grd.addColorStop(0, `rgba(255,255,255,${this.opacity})`);
    grd.addColorStop(1, `rgba(255,255,255,0)`);
    ctx.fillStyle = grd;
    ctx.fillRect(this.x - this.size, this.y - this.size, this.size * 2, this.size * 2);
  }
}

// =======================
// STAR
// =======================
class Star {
  constructor() {
    this.x = Math.random() * w;
    this.y = Math.random() * h;
    this.size = Math.random() * 2;
    this.opacity = Math.random();
  }
  draw() {
    ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Initialize particles
for (let i = 0; i < 600; i++) rain.push(new Rain());
for (let i = 0; i < 12; i++) clouds.push(new Cloud());
for (let i = 0; i < 8; i++) fogs.push(new Fog());
for (let i = 0; i < 250; i++) stars.push(new Star());

function isNight() {
  let h = new Date().getHours();
  return (h >= 18 || h <= 5);
}

function drawSun() {
  let x = w - 150;
  let y = 120;
  const grd = ctx.createRadialGradient(x, y, 10, x, y, 140);
  grd.addColorStop(0, "rgba(255,220,100,0.9)");
  grd.addColorStop(1, "rgba(255,220,100,0)");
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(x, y, 140, 0, Math.PI * 2);
  ctx.fill();
}

function lightningFlash() { flash = 1; }

// =======================
// ANIMATION LOOP
// =======================
function animate() {
  requestAnimationFrame(animate);
  ctx.clearRect(0, 0, w, h);
  
  // Background gradient
  let bg = ctx.createLinearGradient(0, 0, 0, h);
  if (isNight()) {
    bg.addColorStop(0, "#020617");
    bg.addColorStop(1, "#000000");
  } else {
    if (currentWeather === "clear") {
      bg.addColorStop(0, "#1e3a8a");
      bg.addColorStop(1, "#0f172a");
    } else {
      bg.addColorStop(0, "#1e293b");
      bg.addColorStop(1, "#020617");
    }
  }
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  
  // Stars at night
  if (isNight()) stars.forEach(s => s.draw());
  
  // Sun
  if (currentWeather === "clear" && !isNight()) drawSun();
  
  // Clouds
  clouds.forEach(c => { c.update(); c.draw(); });
  
  // Fog
  if (currentWeather === "mist" || currentWeather === "clouds") {
    fogs.forEach(f => { f.update(); f.draw(); });
  }
  
  // Rain
  if (currentWeather === "rain" || currentWeather === "thunderstorm") {
    rain.forEach(r => { r.update(); r.draw(); });
  }
  
  // Lightning
  if (currentWeather === "thunderstorm") {
    if (Math.random() < 0.01) lightningFlash();
    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash})`;
      ctx.fillRect(0, 0, w, h);
      flash -= 0.05;
    }
  }
  
  // Dark overlay
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.fillRect(0, 0, w, h);
}
animate();

// =======================
// WEATHER API (Myanmar အတွက် အထူးပြုပြင်)
// =======================
const API_KEY = "07a9874048fa713d2fdcef25a482e06d";

// မြန်မာဘာသာပြန်
const myanmarWeatherMap = {
  "clear": "ကြည်လင်နေသည် ☀️",
  "clouds": "တိမ်အနည်းငယ်ဖုံးနေသည် ☁️",
  "rain": "မိုးရွာနေသည် 🌧️",
  "drizzle": "မိုးဖွဲဖွဲရွာနေသည် 🌦️",
  "thunderstorm": "မိုးကြိုးပစ်နေသည် ⛈️",
  "mist": "မြူကျနေသည် 🌫️",
  "fog": "မြူထူထပ်နေသည် 🌫️",
  "haze": "အမှုန်အမွှားများနေသည် 🌁",
  "snow": "နှင်းကျနေသည် ❄️"
};

function translateWeather(desc, weatherMain) {
  const key = weatherMain.toLowerCase();
  if (myanmarWeatherMap[key]) return myanmarWeatherMap[key];
  if (desc.includes("rain")) return "မိုးရွာနေသည် 🌧️";
  if (desc.includes("cloud")) return "တိမ်ဖုံးနေသည် ☁️";
  if (desc.includes("clear")) return "ကြည်လင်နေသည် ☀️";
  return desc + " 🌤️";
}

async function getWeather(lat, lon) {
  try {
    const statusDiv = document.getElementById("weatherStatus");
    statusDiv.innerHTML = "🔄 ရာသီဥတု စစ်ဆေးနေသည်...";
    
    const res = await fetch(
      `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`
    );
    
    if (!res.ok) throw new Error(`API Error: ${res.status}`);
    
    const data = await res.json();
    const temp = Math.round(data.main.temp);
    const desc = data.weather[0].description.toLowerCase();
    const weatherMain = data.weather[0].main.toLowerCase();
    const city = data.name;
    
    // Update UI
    document.getElementById("weatherTemp").innerHTML = `${temp}°C`;
    document.getElementById("weatherDesc").innerHTML = translateWeather(desc, weatherMain);
    document.getElementById("weatherLocation").innerHTML = city;
    
    // Set weather type for effects
    if (weatherMain.includes("thunder")) {
      currentWeather = "thunderstorm";
      document.getElementById("weatherIcon").innerHTML = "⛈️";
    } else if (weatherMain.includes("rain") || weatherMain.includes("drizzle")) {
      currentWeather = "rain";
      document.getElementById("weatherIcon").innerHTML = "🌧️";
    } else if (weatherMain.includes("cloud")) {
      currentWeather = "clouds";
      document.getElementById("weatherIcon").innerHTML = "☁️";
    } else if (weatherMain.includes("mist") || weatherMain.includes("fog") || weatherMain.includes("haze")) {
      currentWeather = "mist";
      document.getElementById("weatherIcon").innerHTML = "🌫️";
    } else {
      currentWeather = "clear";
      document.getElementById("weatherIcon").innerHTML = isNight() ? "🌙" : "☀️";
    }
    
    statusDiv.innerHTML = `🌍 လက်ရှိ ${city} ရာသီဥတု • အချိန်နှင့်တပြေးညီ`;
    
  } catch (error) {
    console.error("Weather API Error:", error);
    document.getElementById("weatherDesc").innerHTML = "အင်တာနက် ချိတ်ဆက်မှု စစ်ဆေးပါ 🌐";
    document.getElementById("weatherStatus").innerHTML = "⚠️ API ချိတ်ဆက်မှု အမှား • Yangon ပုံသေပြထားသည်";
    // Fallback to Yangon
    if (lat !== 16.8661) getWeather(16.8661, 96.1951);
  }
}

// Manual refresh
function manualRefresh() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => getWeather(pos.coords.latitude, pos.coords.longitude),
      err => getWeather(16.8661, 96.1951)
    );
  } else {
    getWeather(16.8661, 96.1951);
  }
}

// Get location and weather
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => getWeather(pos.coords.latitude, pos.coords.longitude),
    err => getWeather(16.8661, 96.1951)
  );
} else {
  getWeather(16.8661, 96.1951);
}

// Auto refresh every 10 minutes
setInterval(() => {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => getWeather(pos.coords.latitude, pos.coords.longitude),
      err => console.log("Auto refresh failed")
    );
  }
}, 600000);
</script>
</body>
</html>
