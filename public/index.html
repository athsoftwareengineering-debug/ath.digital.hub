<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>MYTEL DATA SERVICE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0a0f1e, #050814);
      color: white;
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 20px; color: #facc15; }
    
    .phone-card {
      background: rgba(15,23,42,0.6);
      backdrop-filter: blur(10px);
      border-radius: 60px;
      padding: 12px 20px;
      max-width: 400px;
      margin: 20px auto;
      display: flex;
      gap: 10px;
      border: 1px solid #facc15;
    }
    .phone-card input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px;
      color: white;
      font-size: 16px;
      outline: none;
    }
    .phone-card input::placeholder { color: #64748b; }
    
    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }
    .plan-card {
      background: rgba(10,20,35,0.65);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(250,204,21,0.3);
      transition: 0.3s;
      cursor: pointer;
    }
    .plan-card:hover { transform: translateY(-5px); border-color: #facc15; }
    .plan-card h3 { color: #facc15; margin-bottom: 15px; font-size: 1.5rem; }
    .plan-card ul { list-style: none; margin: 15px 0; }
    .plan-card li { padding: 5px 0; color: #cbd5e1; }
    .price { font-size: 1.8rem; color: #facc15; font-weight: bold; margin: 15px 0; }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(95deg, #facc15, #eab308);
      border: none;
      border-radius: 40px;
      font-weight: bold;
      font-size: 16px;
      color: #0f172a;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { transform: scale(1.02); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1e293b;
      border-radius: 20px;
      padding: 25px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      border: 1px solid #facc15;
    }
    .modal-content h2 { color: #facc15; margin-bottom: 15px; }
    .modal-content .detail { margin: 10px 0; padding: 8px; background: #0f172a; border-radius: 10px; }
    .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .modal-buttons button { flex: 1; }
    .close-modal { background: #475569; }
    
    .payment-section {
      display: none;
      background: rgba(10,20,35,0.8);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px;
      margin-top: 30px;
      border: 1px solid #22c55e;
    }
    .payment-section h3 { color: #22c55e; margin-bottom: 15px; }
    .order-info {
      background: #0f172a;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.6;
    }
    .file-upload-area {
      border: 2px dashed #facc15;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      margin: 15px 0;
      cursor: pointer;
      transition: 0.3s;
    }
    .file-upload-area:hover { background: rgba(250,204,21,0.1); }
    .file-upload-area input { display: none; }
    .preview-img {
      max-width: 100%;
      max-height: 200px;
      margin-top: 10px;
      border-radius: 10px;
      display: none;
    }
    textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-family: inherit;
    }
    textarea::placeholder { color: #64748b; }
    .submit-payment {
      background: #22c55e;
      margin-top: 15px;
    }
    .submit-payment:hover { background: #16a34a; }
    
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      z-index: 1100;
      display: none;
      font-size: 14px;
      white-space: nowrap;
    }
    footer { text-align: center; margin-top: 40px; color: #64748b; font-size: 12px; }
    
    @media (max-width: 600px) {
      body { padding: 15px; }
      .plan-card h3 { font-size: 1.2rem; }
      .price { font-size: 1.4rem; }
      .toast { white-space: normal; text-align: center; max-width: 90%; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>✨ MYTEL DATA SERVICE ✨</h1>
  
  <div class="phone-card">
    <span>📞</span>
    <input type="tel" id="phone" placeholder="Enter phone number (09xxxxxxxxx)">
  </div>
  
  <div class="plans-grid" id="plans-container"></div>
  
  <div id="paymentSection" class="payment-section">
    <h3>💰 Complete Your Payment</h3>
    <div class="order-info" id="orderInfo"></div>
    <p>🏧 Pay to: <strong>KPay/WavePay 09789999368 (AUNG THU HTWE)</strong></p>
    
    <div class="file-upload-area" onclick="document.getElementById('screenshotInput').click()">
      <input type="file" id="screenshotInput" accept="image/*">
      <span>📸 Click or tap to select payment screenshot</span>
      <img id="previewImg" class="preview-img">
    </div>
    
    <textarea id="paymentNote" rows="2" placeholder="Notes (optional)"></textarea>
    <button class="submit-payment" id="submitPaymentBtn">✅ Submit Payment Screenshot</button>
  </div>
  
  <footer>
    <p>🏧 KPay / WavePay: 09789999368 (AUNG THU HTWE)</p>
    <p>✅ 100% Trusted Service</p>
  </footer>
</div>

<div id="orderModal" class="modal">
  <div class="modal-content">
    <h2>📋 Confirm Your Order</h2>
    <div class="detail">📦 Package: <span id="modalPackage"></span></div>
    <div class="detail">💰 Price: <span id="modalPrice"></span> KS</div>
    <div class="detail">📞 Phone: <span id="modalPhone"></span></div>
    <div class="modal-buttons">
      <button class="close-modal" onclick="closeModal()">Cancel</button>
      <button id="confirmOrderBtn">Confirm Order</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  const packages = {
    "VIP LEVEL - 1": { price: 15000, features: ["22 GB (Data)", "8000 On-Net Mins", "5000 SMS"] },
    "VIP LEVEL - 2": { price: 20000, features: ["40 GB (Data)", "250 On-Net Mins", "25 Any Net Mins"] },
    "VIP LEVEL - 3": { price: 25000, features: ["40 GB (Data)", "1400 On-Net Mins", "8000 SMS"] },
    "VIP LEVEL - 4 (ULTRA)": { price: 30000, features: ["120 GB (High-Speed Data)"] }
  };
  
  let currentOrder = null;
  let selectedImageFile = null;
  
  function renderPlans() {
    const container = document.getElementById('plans-container');
    container.innerHTML = '';
    for (const [name, data] of Object.entries(packages)) {
      const card = document.createElement('div');
      card.className = 'plan-card';
      card.innerHTML = `
        <h3>${name}</h3>
        <ul>${data.features.map(f => `<li>🔹 ${f}</li>`).join('')}</ul>
        <div class="price">${data.price.toLocaleString()} KS</div>
        <button onclick="showOrderModal('${name}', ${data.price})">ORDER NOW</button>
      `;
      container.appendChild(card);
    }
  }
  
  function showOrderModal(pkg, price) {
    const phone = document.getElementById('phone').value.trim();
    if (!phone || phone.length < 9) {
      showToast("⚠️ Please enter valid phone number!", "#f97316");
      return;
    }
    
    document.getElementById('modalPackage').innerText = pkg;
    document.getElementById('modalPrice').innerText = price.toLocaleString();
    document.getElementById('modalPhone').innerText = phone;
    
    currentOrder = { packageName: pkg, price: price, phone: phone };
    document.getElementById('orderModal').style.display = 'flex';
  }
  
  function closeModal() {
    document.getElementById('orderModal').style.display = 'none';
  }
  
  async function confirmOrder() {
    if (!currentOrder) return;
    
    const confirmBtn = document.getElementById('confirmOrderBtn');
    confirmBtn.innerText = "Processing...";
    confirmBtn.disabled = true;
    
    try {
      const response = await fetch('/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          packageName: currentOrder.packageName,
          phone: currentOrder.phone
        })
      });
      
      const data = await response.json();
      
      if (data.success) {
        closeModal();
        
        document.getElementById('orderInfo').innerHTML = `
          ✅ <strong>Order ID:</strong> ${data.orderId}<br>
          📦 <strong>Package:</strong> ${currentOrder.packageName}<br>
          📞 <strong>Phone:</strong> ${currentOrder.phone}<br>
          💰 <strong>Amount:</strong> ${currentOrder.price.toLocaleString()} KS
        `;
        document.getElementById('paymentSection').style.display = 'block';
        currentOrder.orderId = data.orderId;
        
        showToast(`✅ Order created! Please send payment screenshot.`, "#22c55e");
        document.getElementById('phone').value = '';
      } else {
        showToast(`❌ ${data.message}`, "#ef4444");
      }
    } catch (err) {
      console.error(err);
      showToast("❌ Network error. Please try again.", "#ef4444");
    } finally {
      confirmBtn.innerText = "Confirm Order";
      confirmBtn.disabled = false;
    }
  }
  
  const fileInput = document.getElementById('screenshotInput');
  const previewImg = document.getElementById('previewImg');
  
  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file && file.type.startsWith('image/')) {
      selectedImageFile = file;
      const reader = new FileReader();
      reader.onload = function(event) {
        previewImg.src = event.target.result;
        previewImg.style.display = 'block';
      };
      reader.readAsDataURL(file);
    } else {
      showToast("Please select an image file", "#f97316");
    }
  });
  
  async function submitPayment() {
    if (!currentOrder || !currentOrder.orderId) {
      showToast("Please create an order first", "#f97316");
      return;
    }
    
    if (!selectedImageFile) {
      showToast("Please select a payment screenshot", "#f97316");
      return;
    }
    
    const submitBtn = document.getElementById('submitPaymentBtn');
    const originalText = submitBtn.innerText;
    submitBtn.innerText = "Submitting...";
    submitBtn.disabled = true;
    
    const formData = new FormData();
    formData.append('orderId', currentOrder.orderId);
    formData.append('packageName', currentOrder.packageName);
    formData.append('phone', currentOrder.phone);
    formData.append('screenshot', selectedImageFile);
    formData.append('note', document.getElementById('paymentNote').value || '');
    
    try {
      const response = await fetch('/submit-payment', {
        method: 'POST',
        body: formData
      });
      
      const result = await response.json();
      
      if (result.success) {
        showToast("✅ Payment screenshot submitted! Admin will verify.", "#22c55e");
        document.getElementById('paymentSection').style.display = 'none';
        document.getElementById('paymentNote').value = '';
        previewImg.style.display = 'none';
        previewImg.src = '';
        selectedImageFile = null;
        fileInput.value = '';
        currentOrder = null;
      } else {
        showToast(`❌ ${result.message}`, "#ef4444");
      }
    } catch (err) {
      console.error(err);
      showToast("❌ Failed to submit. Please try again.", "#ef4444");
    } finally {
      submitBtn.innerText = originalText;
      submitBtn.disabled = false;
    }
  }
  
  function showToast(msg, bgColor) {
    const toast = document.getElementById('toast');
    toast.style.background = bgColor;
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(() => {
      toast.style.display = 'none';
    }, 5000);
  }
  
  document.getElementById('confirmOrderBtn').onclick = confirmOrder;
  document.getElementById('submitPaymentBtn').onclick = submitPayment;
  
  renderPlans();
</script>
</body>
</html>
