<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ATH DIGITAL HUB | MYTEL DATA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* Same beautiful CSS as before – kept for brevity, but include all original styles */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b); color: white; overflow-x: hidden; }
    #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .content { position: relative; z-index: 10; max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    /* ... (keep all previous styles from original index.html) ... */
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #22c55e; padding: 10px 20px; border-radius: 50px; z-index: 1100; display: none; }
    @media (max-width: 768px) { /* responsive styles */ }
  </style>
</head>
<body>
<div id="canvas-container"></div>
<div class="content">
  <!-- same header, plans, order form, tracking section as before but with updated JS -->
  <div class="ath-logo">...</div>
  <div class="hero">...</div>
  <div id="selectionAlert" class="selection-alert">Please fill in your details below</div>
  <div id="orderFormCard" class="order-form-card">...</div>
  <div class="plans-container" id="plans-container"></div>
  <div class="tracking-section">
    <div class="tracking-title"><h3>Track Your Orders</h3></div>
    <div class="tracking-form">
      <input type="tel" id="trackPhone" placeholder="09xxxxxxxxx">
      <button id="trackBtn">Check Status</button>
    </div>
    <div id="trackResult" class="track-result"></div>
  </div>
  <div class="footer">...</div>
</div>
<div id="toast" class="toast"></div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js" } }</script>
<script type="module">
  import * as THREE from 'three';
  // 3D scene same as original (keep)
  // ... (copy the Three.js animation code from your original index.html)
</script>
<script>
  // ========== CONFIG ==========
  const plans = [
    { name: "VIP LEVEL - 1", icon: "🏆", features: ["22 GB Data", "8000 On-Net Mins", "5000 SMS"], price: 15000 },
    { name: "VIP LEVEL - 2", icon: "🏆", features: ["40 GB Data", "250 On-Net Mins", "25 Any Net Mins"], price: 20000 },
    { name: "VIP LEVEL - 3", icon: "🏆", features: ["40 GB Data", "1400 On-Net Mins", "8000 SMS"], price: 25000 },
    { name: "VIP LEVEL - 4", icon: "💎", features: ["120 GB High-Speed Data", "Priority Support"], price: 30000 }
  ];
  let selectedPlan = null;
  let selectedImageFile = null;

  function showToast(msg, bg = "#22c55e") {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.background = bg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 3000);
  }

  function renderPlans() { /* same as original but using data-plan buttons */ }
  function selectPlan(planName) { /* store selectedPlan, show form */ }
  async function createOrder() {
    const phone = document.getElementById('orderPhone').value.trim();
    if (!/^09\d{9}$/.test(phone)) throw new Error("Invalid Myanmar phone number");
    const res = await fetch('/api/order', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ packageName: selectedPlan.name, phone })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message);
    return data.orderId;
  }
  async function submitPayment(orderId, phone, note) {
    const formData = new FormData();
    formData.append('orderId', orderId);
    formData.append('packageName', selectedPlan.name);
    formData.append('phone', phone);
    formData.append('note', note);
    formData.append('screenshot', selectedImageFile);
    const res = await fetch('/api/submit-payment', { method: 'POST', body: formData });
    const data = await res.json();
    if (!data.success) throw new Error(data.message);
    return true;
  }
  async function submitOrder() {
    if (!selectedPlan) return showToast("Select a plan first", "#f97316");
    const phone = document.getElementById('orderPhone').value.trim();
    const note = document.getElementById('orderNote').value;
    if (!/^09\d{9}$/.test(phone)) return showToast("Valid Myanmar phone required", "#f97316");
    if (!selectedImageFile) return showToast("Upload screenshot", "#f97316");
    try {
      showToast("Creating order...", "#3b82f6");
      const orderId = await createOrder();
      await submitPayment(orderId, phone, note);
      showToast(`Order #${orderId} submitted!`, "#22c55e");
      cancelOrder();
      document.getElementById('trackPhone').value = phone;
      trackOrders();
    } catch (err) { showToast(err.message, "#ef4444"); }
  }

  async function trackOrders() {
    const phone = document.getElementById('trackPhone').value.trim();
    if (!/^09\d{9}$/.test(phone)) return showToast("Enter valid phone", "#f97316");
    try {
      const res = await fetch(`/api/track-order?phone=${encodeURIComponent(phone)}`);
      const data = await res.json();
      if (data.success) renderOrders(data.orders);
      else showToast(data.message, "#ef4444");
    } catch (err) { showToast("Network error", "#ef4444"); }
  }

  function renderOrders(orders) {
    const container = document.getElementById('trackResult');
    if (!orders.length) { container.innerHTML = "<p>No orders found</p>"; return; }
    let html = `<h3>${orders.length} order(s) found</h3>`;
    for (const o of orders) {
      const statusClass = o.status === 'approved' ? 'active' : '';
      let statusText = o.status;
      if (o.status === 'approved') statusText = '✅ Active';
      else if (o.status === 'payment_received') statusText = '💰 Paid';
      else if (o.status === 'pending_payment') statusText = '⏳ Pending';
      else if (o.status === 'rejected') statusText = '❌ Rejected';
      else if (o.status === 'expired') statusText = '⏰ Expired';
      let countdownHtml = '';
      if (o.status === 'approved' && o.endDate) {
        const remaining = Math.ceil((new Date(o.endDate) - new Date()) / 86400000);
        const percent = Math.max(0, (remaining / 30) * 100);
        countdownHtml = `<div class="countdown-progress"><div class="progress-bar-container"><div class="progress-bar-active" style="width:${percent}%"></div></div><div>${remaining} days left</div></div>`;
      }
      html += `<div class="order-card ${statusClass}"><div class="order-header"><h3>Order #${o.id}</h3><span class="status-badge">${statusText}</span></div><div>📦 ${o.packageName}</div><div>📞 ${o.phone}</div><div>💰 ${o.price.toLocaleString()} KS</div>${countdownHtml}</div>`;
    }
    container.innerHTML = html;
  }

  document.getElementById('trackBtn').onclick = trackOrders;
  document.getElementById('submitOrderBtn').onclick = submitOrder;
  document.getElementById('cancelOrderBtn').onclick = cancelOrder;
  document.getElementById('screenshotInput').onchange = (e) => { selectedImageFile = e.target.files[0]; /* preview */ };
  renderPlans();
</script>
</body>
</html>
