<!-- Order Tracking Section - Website မှာ ထည့်ရန် -->
<div class="track-order-section" style="margin-top: 3rem; padding: 1.5rem; background: rgba(15,23,42,0.6); border-radius: 20px;">
  <h3 style="color: #facc15; margin-bottom: 1rem;">
    <i class="fas fa-search"></i> အော်ဒါအခြေအနေ စစ်ဆေးရန်
  </h3>
  <p style="color: #94a3b8; margin-bottom: 1rem;">သင့်အော်ဒါရဲ့ ကျန်ရက်များကို စစ်ဆေးနိုင်ပါသည်။</p>
  
  <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
    <input type="text" id="trackOrderId" placeholder="အော်ဒါနံပါတ် (ဥပမာ - 1001)" 
           style="flex:1; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: white;">
    <input type="tel" id="trackPhone" placeholder="ဖုန်းနံပါတ် (09xxxxxxxxx)" 
           style="flex:1; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: white;">
    <button onclick="trackOrder()" style="padding: 12px 24px; background: #facc15; border: none; border-radius: 10px; font-weight: 600;">
      <i class="fas fa-search"></i> စစ်ဆေးမည်
    </button>
  </div>
  
  <div id="trackResult" style="margin-top: 1.5rem; display: none;">
    <!-- Result will show here -->
  </div>
</div>

<script>
async function trackOrder() {
  const orderId = document.getElementById('trackOrderId').value;
  const phone = document.getElementById('trackPhone').value;
  
  if (!orderId || !phone) {
    alert("အော်ဒါနံပါတ်နှင့် ဖုန်းနံပါတ် နှစ်ခုလုံးထည့်ပါ။");
    return;
  }
  
  const resultDiv = document.getElementById('trackResult');
  resultDiv.style.display = 'block';
  resultDiv.innerHTML = '<div style="text-align: center; padding: 2rem;"><i class="fas fa-spinner fa-spin"></i> စစ်ဆေးနေပါသည်...</div>';
  
  try {
    const res = await fetch(`/api/track-order?orderId=${orderId}&phone=${phone}`);
    const data = await res.json();
    
    if (!data.success) {
      resultDiv.innerHTML = `
        <div style="background: #ef444420; border: 1px solid #ef4444; border-radius: 12px; padding: 1rem; text-align: center;">
          <i class="fas fa-exclamation-circle" style="color: #ef4444; font-size: 2rem;"></i>
          <p style="margin-top: 0.5rem;">${data.message}</p>
        </div>
      `;
      return;
    }
    
    const order = data.order;
    const countdown = order.countdown;
    
    let statusHtml = '';
    let countdownHtml = '';
    
    // Status badge
    const statusMap = {
      'pending_payment': { text: '⏳ ဆိုင်းငံ့ (ငွေလွှဲရန်)', color: '#f97316' },
      'payment_received': { text: '💰 ငွေလွှဲပြီး (စစ်ဆေးနေပါသည်)', color: '#3b82f6' },
      'approved': { text: '✅ ဒေတာသွင်းပြီး (အသုံးပြုနိုင်ပါပြီ)', color: '#22c55e' },
      'expired': { text: '⏰ သက်တမ်းကုန်ဆုံးပါပြီ', color: '#ef4444' },
      'rejected': { text: '❌ ပယ်ဖျက်ပြီး', color: '#ef4444' }
    };
    const statusInfo = statusMap[order.status] || { text: order.status, color: '#94a3b8' };
    
    statusHtml = `<span style="display: inline-block; padding: 4px 12px; background: ${statusInfo.color}20; border: 1px solid ${statusInfo.color}; border-radius: 20px; font-size: 0.8rem;">${statusInfo.text}</span>`;
    
    // Countdown display
    if (countdown) {
      const remaining = countdown.daysRemaining;
      let progressPercent = (remaining / 30) * 100;
      let barColor = '#22c55e';
      if (remaining <= 5) barColor = '#ef4444';
      else if (remaining <= 10) barColor = '#f97316';
      
      countdownHtml = `
        <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #334155;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
            <span><i class="fas fa-calendar-check"></i> စတင်ရက်: ${new Date(countdown.startDate).toLocaleDateString('my-MM')}</span>
            <span><i class="fas fa-calendar-times"></i> ကုန်ဆုံးရက်: ${new Date(countdown.endDate).toLocaleDateString('my-MM')}</span>
          </div>
          <div style="background: #0f172a; border-radius: 10px; height: 20px; overflow: hidden;">
            <div style="width: ${progressPercent}%; background: ${barColor}; height: 100%; transition: width 0.5s;"></div>
          </div>
          <div style="text-align: center; margin-top: 0.5rem;">
            <span style="font-size: 1.5rem; font-weight: bold; color: ${barColor};">${remaining > 0 ? remaining : 0}</span>
            <span> ရက် ကျန်ပါသေးသည်</span>
            ${remaining <= 5 && remaining > 0 ? '<p style="color: #ef4444; margin-top: 0.5rem;"><i class="fas fa-bell"></i> သက်တမ်းကုန်ခါနီးပါပြီ။ ပြန်လည်မှာယူနိုင်ပါသည်။</p>' : ''}
            ${remaining <= 0 ? '<p style="color: #ef4444; margin-top: 0.5rem;"><i class="fas fa-hourglass-end"></i> ဒေတာသက်တမ်း ကုန်ဆုံးသွားပါပြီ။ အသစ်မှာယူနိုင်ပါသည်။</p>' : ''}
          </div>
        </div>
      `;
    } else if (order.status === 'approved' && !countdown) {
      countdownHtml = '<div style="margin-top: 1rem; padding: 1rem; background: #facc1520; border-radius: 10px; text-align: center;">⏳ ဒေတာ Countdown စတင်ရန် စောင့်ဆိုင်းနေပါသည်...</div>';
    }
    
    resultDiv.innerHTML = `
      <div style="background: #0f172a; border-radius: 16px; padding: 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
          <h4><i class="fas fa-box"></i> အော်ဒါ #${order.id}</h4>
          ${statusHtml}
        </div>
        <div style="margin-top: 1rem;">
          <p><i class="fas fa-tag"></i> Package: <strong>${order.packageName}</strong></p>
          <p><i class="fas fa-phone"></i> ဖုန်းနံပါတ်: ${order.phone}</p>
          <p><i class="fas fa-calendar"></i> မှာယူသည့်ရက်: ${new Date(order.createdAt).toLocaleDateString('my-MM')}</p>
        </div>
        ${countdownHtml}
      </div>
    `;
    
  } catch (error) {
    resultDiv.innerHTML = `
      <div style="background: #ef444420; border-radius: 12px; padding: 1rem; text-align: center;">
        <p>❌ ဆာဗာအမှား။ နောက်မှပြန်စမ်းပါ။</p>
      </div>
    `;
  }
}
</script>
