<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>MYTEL DATA SERVICE | VIP Data Plans Myanmar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #0B1120, #030614);
      color: #F1F5F9;
      padding: 1.5rem;
      min-height: 100vh;
    }

    /* smooth container */
    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* header */
    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand-header h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #FACC15, #FFD966);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .brand-header p {
      color: #94A3B8;
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }

    /* phone input card */
    .phone-glass {
      background: rgba(15, 25, 45, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 100px;
      border: 1px solid rgba(250, 204, 21, 0.35);
      max-width: 480px;
      margin: 0 auto 2rem auto;
      display: flex;
      align-items: center;
      padding: 0.2rem 0.2rem 0.2rem 1.2rem;
      transition: all 0.2s;
    }
    .phone-glass:focus-within {
      border-color: #FACC15;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.3);
    }
    .phone-glass span {
      font-size: 1.4rem;
      margin-right: 0.5rem;
    }
    .phone-glass input {
      background: transparent;
      border: none;
      flex: 1;
      padding: 1rem 0.5rem;
      font-size: 1rem;
      color: white;
      outline: none;
      font-weight: 500;
    }
    .phone-glass input::placeholder {
      color: #5B6D8F;
      font-weight: 400;
    }

    /* plan cards grid */
    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.8rem;
      margin: 2rem 0 1.5rem;
    }

    .plan-card {
      background: rgba(12, 22, 40, 0.75);
      backdrop-filter: blur(10px);
      border-radius: 2rem;
      padding: 1.6rem;
      border: 1px solid rgba(250, 204, 21, 0.25);
      transition: transform 0.25s ease, border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
    .plan-card:hover {
      transform: translateY(-6px);
      border-color: #FACC15;
      box-shadow: 0 20px 28px -12px rgba(0, 0, 0, 0.5);
    }
    .plan-card h3 {
      font-size: 1.7rem;
      font-weight: 700;
      background: linear-gradient(115deg, #FFE484, #FACC15);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
      letter-spacing: -0.3px;
    }
    .feature-list {
      list-style: none;
      margin: 1rem 0;
    }
    .feature-list li {
      padding: 0.4rem 0;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.92rem;
      color: #CBD5E1;
      border-bottom: 1px dashed rgba(250, 204, 21, 0.15);
    }
    .feature-list li:last-child {
      border-bottom: none;
    }
    .feature-list li::before {
      content: "⚡";
      font-size: 0.9rem;
      filter: drop-shadow(0 0 2px gold);
    }
    .price {
      font-size: 1.9rem;
      font-weight: 800;
      color: #FACC15;
      margin: 1rem 0 1.2rem;
      display: flex;
      align-items: baseline;
      gap: 0.3rem;
    }
    .price small {
      font-size: 0.9rem;
      font-weight: 500;
      color: #94A3B8;
    }
    .order-btn {
      width: 100%;
      background: linear-gradient(105deg, #FACC15, #EAB308);
      border: none;
      padding: 0.85rem;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      color: #0F172A;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .order-btn:hover {
      transform: scale(0.98);
      background: #FFD966;
      box-shadow: 0 6px 14px rgba(250, 204, 21, 0.4);
    }

    /* payment section (modern) */
    .payment-panel {
      background: rgba(10, 20, 38, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 1.8rem;
      margin-top: 2rem;
      border: 1px solid #2DD4BF;
      transition: all 0.2s;
      display: none;
    }
    .payment-panel h3 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #2DD4BF;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .order-summary {
      background: #0B1222;
      padding: 1rem 1.2rem;
      border-radius: 1.2rem;
      margin: 1rem 0;
      font-size: 0.95rem;
      border-left: 4px solid #FACC15;
      line-height: 1.5;
    }
    .upload-area {
      border: 2px dashed #FACC15;
      border-radius: 1.5rem;
      padding: 1.5rem;
      text-align: center;
      margin: 1.2rem 0;
      cursor: pointer;
      transition: background 0.2s;
    }
    .upload-area:hover {
      background: rgba(250, 204, 21, 0.1);
    }
    .preview-img {
      max-width: 100%;
      max-height: 170px;
      margin-top: 0.8rem;
      border-radius: 1rem;
      display: none;
      object-fit: cover;
      border: 1px solid #475569;
    }
    textarea {
      width: 100%;
      background: #0E1625;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 0.9rem;
      color: white;
      font-size: 0.9rem;
      margin: 0.8rem 0;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: #FACC15;
    }
    .submit-payment-btn {
      background: linear-gradient(95deg, #10B981, #059669);
      color: white;
      border: none;
      padding: 0.9rem;
      width: 100%;
      border-radius: 3rem;
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: 0.2s;
    }
    .submit-payment-btn:hover {
      background: #059669;
      transform: translateY(-2px);
    }

    /* modal modern */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-card {
      background: #1E293B;
      max-width: 400px;
      width: 90%;
      border-radius: 2rem;
      padding: 1.6rem;
      border-top: 4px solid #FACC15;
      text-align: center;
      box-shadow: 0 30px 40px rgba(0,0,0,0.5);
    }
    .modal-card h2 {
      color: #FACC15;
      margin-bottom: 1rem;
    }
    .modal-detail {
      background: #0F172A;
      margin: 0.6rem 0;
      padding: 0.7rem;
      border-radius: 1rem;
      text-align: left;
    }
    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 1.5rem;
    }
    .modal-buttons button {
      flex: 1;
      padding: 0.7rem;
      border-radius: 2rem;
      font-weight: bold;
      border: none;
    }
    .cancel-modal {
      background: #475569;
      color: white;
    }
    .confirm-modal-btn {
      background: #FACC15;
      color: #0F172A;
    }

    /* toast */
    .toast-message {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: #1E293B;
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 80px;
      color: white;
      font-weight: 500;
      z-index: 1200;
      display: none;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      border-left: 5px solid #FACC15;
      max-width: 85vw;
      text-align: center;
      font-size: 0.9rem;
    }
    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.75rem;
      color: #5B6D8F;
      border-top: 1px solid rgba(250,204,21,0.2);
      padding-top: 1.5rem;
    }

    @media (max-width: 640px) {
      body { padding: 1rem; }
      .plan-card
