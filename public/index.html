<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>MYTEL VIP DATA | ATH DIGITAL HUB</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b);
      color: #f1f5f9;
      padding: 1rem;
    }
    .container { max-width: 1300px; margin: 0 auto; }
    .logo {
      text-align: center;
      margin: 1rem 0;
    }
    .logo span {
      background: linear-gradient(135deg, #facc15, #eab308);
      display: inline-block;
      padding: 0.6rem 2rem;
      border-radius: 60px;
      font-weight: 800;
      color: #0f172a;
    }
    h1 {
      text-align: center;
      font-size: 2rem;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 1rem 0;
    }
    .plans {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      margin: 2rem 0;
    }
    .plan-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 1.5rem;
      width: 280px;
      border: 1px solid rgba(250,204,21,0.3);
      transition: 0.3s;
      cursor: pointer;
    }
    .plan-card:hover { transform: translateY(-8px); border-color: #facc15; }
    .plan-card.selected { border: 2px solid #facc15; background: rgba(250,204,21,0.1); }
    .plan-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .plan-title { font-size: 1.3rem; font-weight: 800; color: #facc15; }
    .features { margin: 1rem 0; }
    .features li { list-style: none; margin: 0.4rem 0; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
    .price { font-size: 1.5rem; font-weight: 800; color: #facc15; margin: 0.8rem 0; }
    button {
      background: #facc15;
      border: none;
      padding: 0.6rem;
      width: 100%;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
    }
    .form-card {
      background: rgba(15,23,42,0.9);
      border-radius: 2rem;
      padding: 1.5rem;
      max-width: 500px;
      margin: 2rem auto;
      display: none;
    }
    .form-card.show { display: block; }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 0.5rem 0;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: white;
    }
    .pay-methods {
      display: flex;
      gap: 1rem;
      margin: 1rem 0;
      flex-wrap: wrap;
    }
    .pay-method {
      background: #0f172a;
      padding: 0.5rem;
      border-radius: 12px;
      text-align: center;
      flex: 1;
    }
    .copy-btn {
      background: #facc15;
      font-size: 0.7rem;
      padding: 4px 8px;
      width: auto;
      margin-top: 5px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      padding: 10px 20px;
      border-radius: 40px;
      display: none;
    }
    @media (max-width: 700px) {
      .plan-card { width: 100%; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="logo"><span>ATH DIGITAL HUB</span></div>
  <h1>✨ MYTEL VIP DATA ✨</h1>
  <p style="text-align:center">📅 30 days validity · Auto activation after screenshot</p>

  <div class="plans" id="plansContainer"></div>

  <div id="orderForm" class="form-card">
    <h3 id="selectedPlanName" style="color:#facc15"></h3>
    <input type="tel" id="phone" placeholder="📞 Phone number (09xxxxxxxxx)">
    <textarea id="note" rows="2" placeholder="Note (optional)"></textarea>
    
    <div class="pay-methods">
      <div class="pay-method">🏧 KPay<br>09789999368<br><button class="copy-btn" onclick="copyNumber('09789999368')">Copy</button></div>
      <div class="pay-method">📱 WavePay<br>09789999368<br><button class="copy-btn" onclick="copyNumber('09789999368')">Copy</button></div>
    </div>
    <p style="text-align:center; font-size:0.7rem">👤 Account: AUNG THU HTWE</p>
    
    <div style="border:2px dashed #facc15; border-radius:1rem; padding:1rem; text-align:center; margin:1rem 0; cursor:pointer" onclick="document.getElementById('screenshot').click()">
      📸 Upload payment screenshot
      <input type="file" id="screenshot" accept="image/*" style="display:none">
      <img id="preview" style="max-width:100%; margin-top:8px; display:none">
    </div>
    
    <button onclick="submitOrder()">✅ Submit Order & Activate</button>
    <button onclick="cancelOrder()" style="background:#ef4444; margin-top:0.5rem">❌ Cancel</button>
  </div>

  <div style="margin-top:2rem; text-align:center">
    <h3>🔍 Track your order</h3>
    <input type="tel" id="trackPhone" placeholder="Enter phone number" style="max-width:300px; margin:auto">
    <button onclick="trackOrder()">Check Status</button>
    <div id="trackResult" style="margin-top:1rem"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  // Plans Data (သေချာပေါက် ပြသမည်)
  const plans = [
    { name: "VIP LEVEL - 1", icon: "🏆", features: ["22 GB Data", "8000 On-Net Mins", "5000 SMS"], price: 15000 },
    { name: "VIP LEVEL - 2", icon: "🏆", features: ["40 GB Data", "250 On-Net Mins", "25 Any Net Mins"], price: 20000 },
    { name: "VIP LEVEL - 3", icon: "🏆", features: ["40 GB Data", "1400 On-Net Mins", "8000 SMS"], price: 25000 },
    { name: "VIP LEVEL - 4", icon: "💎", features: ["120 GB High-Speed Data", "Priority Support"], price: 30000 }
  ];

  let selectedPlan = null;
  let screenshotFile = null;

  // Render plans dynamically
  function renderPlans() {
    const container = document.getElementById('plansContainer');
    if (!container) return;
    container.innerHTML = '';
    plans.forEach(plan => {
      const card = document.createElement('div');
      card.className = 'plan-card';
      card.setAttribute('data-plan', plan.name);
      card.innerHTML = `
        <div class="plan-icon">${plan.icon}</div>
        <div class="plan-title">${plan.name}</div>
        <ul class="features">
          ${plan.features.map(f => `<li><i class="fas fa-check-circle"></i> ${f}</li>`).join('')}
        </ul>
        <div class="price">${plan.price.toLocaleString()} KS</div>
        <button onclick="selectPlan('${plan.name}')">Select Plan</button>
      `;
      container.appendChild(card);
    });
  }

  function selectPlan(planName) {
    selectedPlan = plans.find(p => p.name === planName);
    // Highlight selected card
    document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('selected'));
    document.querySelector(`.plan-card[data-plan="${planName}"]`).classList.add('selected');
    document.getElementById('selectedPlanName').innerHTML = `${selectedPlan.icon} ${selectedPlan.name} — ${selectedPlan.price.toLocaleString()} KS`;
    document.getElementById('orderForm').classList.add('show');
    document.getElementById('orderForm').scrollIntoView({ behavior: 'smooth' });
  }

  function cancelOrder() {
    selectedPlan = null;
    screenshotFile = null;
    document.getElementById('orderForm').classList.remove('show');
    document.getElementById('preview').style.display = 'none';
    document.getElementById('screenshot').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('note').value = '';
    showToast("Order cancelled");
  }

  document.getElementById('screenshot').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      screenshotFile = file;
      const reader = new FileReader();
      reader.onload = ev => {
        const preview = document.getElementById('preview');
        preview.src = ev.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
      showToast("Screenshot loaded");
    }
  });

  function submitOrder() {
    if (!selectedPlan) { showToast("Please select a plan first!"); return; }
    const phone = document.getElementById('phone').value.trim();
    if (!/^(09|\+959)[0-9]{7,9}$/.test(phone)) { showToast("Invalid phone number (09xxxxxxxxx)"); return; }
    if (!screenshotFile) { showToast("Please upload payment screenshot"); return; }

    // Save order to localStorage
    const orders = JSON.parse(localStorage.getItem('mytel_orders') || '[]');
    const newOrder = {
      id: 'MYT' + Date.now(),
      packageName: selectedPlan.name,
      price: selectedPlan.price,
      phone: phone,
      note: document.getElementById('note').value,
      status: 'approved', // auto approve for demo
      createdAt: new Date().toISOString(),
      startDate: new Date().toISOString(),
      endDate: new Date(Date.now() + 30*86400000).toISOString(),
      screenshotData: URL.createObjectURL(screenshotFile)
    };
    orders.push(newOrder);
    localStorage.setItem('mytel_orders', JSON.stringify(orders));
    showToast(`✅ Order #${newOrder.id} activated! 30 days valid.`);
    cancelOrder();
    document.getElementById('trackPhone').value = phone;
    trackOrder();
  }

  function trackOrder() {
    const phone = document.getElementById('trackPhone').value.trim();
    if (!phone) { showToast("Enter phone number"); return; }
    const orders = JSON.parse(localStorage.getItem('mytel_orders') || '[]');
    const userOrders = orders.filter(o => o.phone === phone);
    const resultDiv = document.getElementById('trackResult');
    if (userOrders.length === 0) {
      resultDiv.innerHTML = '<p>No orders found for this number.</p>';
      return;
    }
    let html = '<div style="background:#1e293b; border-radius:1rem; padding:1rem;">';
    userOrders.forEach(order => {
      const remaining = Math.max(0, Math.ceil((new Date(order.endDate) - new Date()) / (1000*60*60*24)));
      html += `
        <div style="border-bottom:1px solid #334155; margin-bottom:1rem; padding-bottom:0.5rem">
          <strong>#${order.id}</strong> - ${order.packageName}<br>
          Status: <span style="color:#22c55e">✅ Active</span><br>
          Expires in: ${remaining} days<br>
          Ordered: ${new Date(order.createdAt).toLocaleDateString()}
        </div>
      `;
    });
    html += '</div>';
    resultDiv.innerHTML = html;
  }

  function copyNumber(num) {
    navigator.clipboard.writeText(num);
    showToast(`Copied: ${num}`);
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 2000);
  }

  renderPlans();
  // Expose functions globally
  window.selectPlan = selectPlan;
  window.submitOrder = submitOrder;
  window.cancelOrder = cancelOrder;
  window.trackOrder = trackOrder;
  window.copyNumber = copyNumber;
</script>
</body>
</html>
