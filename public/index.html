<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | MYTEL</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-card {
      background: rgba(15,23,42,0.9);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(250,204,21,0.3);
      animation: slideUp 0.5s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo { text-align: center; margin-bottom: 2rem; }
    .logo-icon {
      width: 70px; height: 70px;
      background: linear-gradient(135deg, #facc15, #eab308);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
    }
    .logo-icon i { font-size: 2rem; color: #0f172a; }
    .logo h1 { font-size: 1.5rem; color: #facc15; }
    .input-group { margin-bottom: 1.5rem; }
    .input-group label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.8rem; }
    .input-field { position: relative; }
    .input-field i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; }
    .input-field input {
      width: 100%; padding: 14px 16px 14px 45px;
      background: #1e293b; border: 1px solid #334155;
      border-radius: 14px; font-size: 1rem; color: white;
    }
    .input-field input:focus { outline: none; border-color: #facc15; }
    .login-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(95deg, #facc15, #eab308);
      border: none; border-radius: 14px;
      font-weight: 700; font-size: 1rem; cursor: pointer;
    }
    .error-message {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 12px; padding: 12px;
      margin-bottom: 1rem; color: #f87171;
      font-size: 0.8rem; text-align: center;
      display: none;
    }
  </style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
    <h1>Admin Access</h1>
    <p style="color:#64748b; font-size:0.8rem; margin-top:0.5rem;">MYTEL Data Service</p>
  </div>
  <div class="error-message" id="errorMessage"></div>
  <form id="loginForm">
    <div class="input-group">
      <label>Username</label>
      <div class="input-field">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Enter username" autocomplete="off">
      </div>
    </div>
    <div class="input-group">
      <label>Password</label>
      <div class="input-field">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Enter password">
      </div>
    </div>
    <button type="submit" class="login-btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
  </form>
</div>
<script>
  if (sessionStorage.getItem('adminLoggedIn') === 'true') window.location.href = '/admin';
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
    btn.disabled = true;
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        sessionStorage.setItem('adminLoggedIn', 'true');
        window.location.href = '/admin';
      } else {
        document.getElementById('errorMessage').innerText = 'Invalid username or password';
        document.getElementById('errorMessage').style.display = 'block';
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
        btn.disabled = false;
      }
    } catch (err) {
      document.getElementById('errorMessage').innerText = 'Network error';
      document.getElementById('errorMessage').style.display = 'block';
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
