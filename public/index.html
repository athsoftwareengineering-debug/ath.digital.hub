<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>MYTEL VIP DATA | ATH DIGITAL HUB</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b);
      color: #f1f5f9;
      padding: 1rem;
    }
    .container { max-width: 1300px; margin: 0 auto; }
    .logo { text-align: center; margin: 1rem 0; }
    .logo span {
      background: linear-gradient(135deg, #facc15, #eab308);
      display: inline-block;
      padding: 0.6rem 2rem;
      border-radius: 60px;
      font-weight: 800;
      color: #0f172a;
    }
    h1 {
      text-align: center;
      font-size: 2rem;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 1rem 0;
    }
    .plans {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      margin: 2rem 0;
    }
    .plan-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 1.5rem;
      width: 280px;
      border: 1px solid rgba(250,204,21,0.3);
      transition: 0.3s;
      cursor: pointer;
    }
    .plan-card:hover { transform: translateY(-8px); border-color: #facc15; }
    .plan-card.selected { border: 2px solid #facc15; background: rgba(250,204,21,0.1); }
    .plan-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .plan-title { font-size: 1.3rem; font-weight: 800; color: #facc15; }
    .features { margin: 1rem 0; }
    .features li { list-style: none; margin: 0.4rem 0; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
    .price { font-size: 1.5rem; font-weight: 800; color: #facc15; margin: 0.8rem 0; }
    button {
      background: #facc15;
      border: none;
      padding: 0.6rem;
      width: 100%;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
    }
    .form-card {
      background: rgba(15,23,42,0.9);
      border-radius: 2rem;
      padding: 1.5rem;
      max-width: 500px;
      margin: 2rem auto;
      display: none;
    }
    .form-card.show { display: block; }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 0.5rem 0;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: white;
    }
    .pay-methods {
      display: flex;
      gap: 1rem;
      margin: 1rem 0;
      flex-wrap: wrap;
    }
    .pay-method {
      background: #0f172a;
      padding: 0.5rem;
      border-radius: 12px;
      text-align: center;
      flex: 1;
    }
    .copy-btn {
      background: #facc15;
      font-size: 0.7rem;
      padding: 4px 8px;
      width: auto;
      margin-top: 5px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      padding: 10px 20px;
      border-radius: 40px;
      display: none;
      z-index: 1000;
    }
    @media (max-width: 700px) { .plan-card { width: 100%; } }
  </style>
</head>
<body>
<div class="container">
  <div class="logo"><span>ATH DIGITAL HUB</span></div>
  <h1>✨ MYTEL VIP DATA ✨</h1>
  <p style="text-align:center">📅 30 days validity · Admin will approve after screenshot</p>

  <div class="plans" id="plansContainer"></div>

  <div id="orderForm" class="form-card">
    <h3 id="selectedPlanName" style="color:#facc15"></h3>
    <input type="tel" id="phone" placeholder="📞 Phone number (09xxxxxxxxx)">
    <textarea id="note" rows="2" placeholder="Note (optional)"></textarea>
    
    <div class="pay-methods">
      <div class="pay-method">🏧 KPay<br>09789999368<br><button class="copy-btn" onclick="copyNumber('09789999368')">Copy</button></div>
      <div class="pay-method">📱 WavePay<br>09789999368<br><button class="copy-btn" onclick="copyNumber('09789999368')">Copy</button></div>
    </div>
    <p style="text-align:center; font-size:0.7rem">👤 Account: AUNG THU HTWE</p>
    
    <div style="border:2px dashed #facc15; border-radius:1rem; padding:1rem; text-align:center; margin:1rem 0; cursor:pointer" onclick="document.getElementById('screenshot').click()">
      📸 Upload payment screenshot
      <input type="file" id="screenshot" accept="image/jpeg,image/png" style="display:none">
      <img id="preview" style="max-width:100%; margin-top:8px; border-radius:12px; display:none">
    </div>
    
    <button onclick="submitOrder()">✅ Submit Order & Activate</button>
    <button onclick="cancelOrder()" style="background:#ef4444; margin-top:0.5rem">❌ Cancel</button>
  </div>

  <div style="margin-top:2rem; text-align:center">
    <h3>🔍 Track your order</h3>
    <input type="tel" id="trackPhone" placeholder="Enter phone number" style="max-width:300px; margin:auto">
    <button onclick="trackOrder()">Check Status</button>
    <div id="trackResult" style="margin-top:1rem"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, query, where, getDocs, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCN7GMpY6dqGzVlMevMZPG76guq3DvQPd8",
    authDomain: "mytelordersystem.firebaseapp.com",
    projectId: "mytelordersystem",
    storageBucket: "mytelordersystem.firebasestorage.app",
    messagingSenderId: "366519284419",
    appId: "1:366519284419:web:0044583e2ef8aa7260a876",
    measurementId: "G-GEJ93W2RTY"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  // Plans Data
  const plans = [
    { name: "VIP LEVEL - 1", icon: "🏆", features: ["22 GB Data", "8000 On-Net Mins", "5000 SMS"], price: 15000 },
    { name: "VIP LEVEL - 2", icon: "🏆", features: ["40 GB Data", "250 On-Net Mins", "25 Any Net Mins"], price: 20000 },
    { name: "VIP LEVEL - 3", icon: "🏆", features: ["40 GB Data", "1400 On-Net Mins", "8000 SMS"], price: 25000 },
    { name: "VIP LEVEL - 4", icon: "💎", features: ["120 GB High-Speed Data", "Priority Support"], price: 30000 }
  ];

  let selectedPlan = null;
  let screenshotFile = null;

  function renderPlans() {
    const container = document.getElementById('plansContainer');
    container.innerHTML = '';
    plans.forEach(plan => {
      const card = document.createElement('div');
      card.className = 'plan-card';
      card.setAttribute('data-plan', plan.name);
      card.innerHTML = `
        <div class="plan-icon">${plan.icon}</div>
        <div class="plan-title">${plan.name}</div>
        <ul class="features">${plan.features.map(f => `<li><i class="fas fa-check-circle"></i> ${f}</li>`).join('')}</ul>
        <div class="price">${plan.price.toLocaleString()} KS</div>
        <button onclick="window.selectPlan('${plan.name}')">Select Plan</button>
      `;
      container.appendChild(card);
    });
  }

  window.selectPlan = function(planName) {
    selectedPlan = plans.find(p => p.name === planName);
    document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('selected'));
    document.querySelector(`.plan-card[data-plan="${planName}"]`).classList.add('selected');
    document.getElementById('selectedPlanName').innerHTML = `${selectedPlan.icon} ${selectedPlan.name} — ${selectedPlan.price.toLocaleString()} KS`;
    document.getElementById('orderForm').classList.add('show');
    document.getElementById('orderForm').scrollIntoView({ behavior: 'smooth' });
  };

  window.cancelOrder = function() {
    selectedPlan = null;
    screenshotFile = null;
    document.getElementById('orderForm').classList.remove('show');
    document.getElementById('preview').style.display = 'none';
    document.getElementById('screenshot').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('note').value = '';
    showToast("Order cancelled");
  };

  document.getElementById('screenshot').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      if (!file.type.startsWith('image/')) {
        showToast("Only image files allowed");
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        showToast("Max 5MB");
        return;
      }
      screenshotFile = file;
      const reader = new FileReader();
      reader.onload = ev => {
        const preview = document.getElementById('preview');
        preview.src = ev.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
      showToast("Screenshot loaded");
    }
  });

  window.submitOrder = async function() {
    if (!selectedPlan) { showToast("Please select a plan first!"); return; }
    const phone = document.getElementById('phone').value.trim();
    if (!/^(09|\+959)[0-9]{7,9}$/.test(phone)) { showToast("Invalid phone number (09xxxxxxxxx)"); return; }
    if (!screenshotFile) { showToast("Please upload payment screenshot"); return; }

    const submitBtn = event.target;
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

    try {
      // 1. Upload screenshot to Firebase Storage
      const timestamp = Date.now();
      const storageRef = ref(storage, `screenshots/${timestamp}.jpg`);
      await uploadBytes(storageRef, screenshotFile);
      const screenshotURL = await getDownloadURL(storageRef);

      // 2. Save order to Firestore
      const orderData = {
        packageName: selectedPlan.name,
        price: selectedPlan.price,
        phone: phone,
        note: document.getElementById('note').value || '',
        status: 'pending_payment',
        createdAt: serverTimestamp(),
        screenshotURL: screenshotURL
      };
      const docRef = await addDoc(collection(db, "orders"), orderData);
      
      showToast(`✅ Order #${docRef.id} submitted! Admin will approve soon.`);
      cancelOrder();
      document.getElementById('trackPhone').value = phone;
      trackOrder();
    } catch (error) {
      console.error(error);
      showToast("Submission failed: " + error.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = "✅ Submit Order & Activate";
    }
  };

  window.trackOrder = async function() {
    const phone = document.getElementById('trackPhone').value.trim();
    if (!phone) { showToast("Enter phone number"); return; }
    const resultDiv = document.getElementById('trackResult');
    resultDiv.innerHTML = '<p><i class="fas fa-spinner fa-pulse"></i> Searching...</p>';
    try {
      const q = query(collection(db, "orders"), where("phone", "==", phone), orderBy("createdAt", "desc"));
      const querySnapshot = await getDocs(q);
      if (querySnapshot.empty) {
        resultDiv.innerHTML = '<p>No orders found for this number.</p>';
        return;
      }
      let html = '<div style="background:#1e293b; border-radius:1rem; padding:1rem;">';
      querySnapshot.forEach(doc => {
        const order = doc.data();
        let statusText = "", statusColor = "";
        switch(order.status) {
          case 'pending_payment': statusText = "⏳ Pending"; statusColor = "#f97316"; break;
          case 'payment_received': statusText = "💰 Paid (waiting approval)"; statusColor = "#3b82f6"; break;
          case 'approved': statusText = "✅ Active"; statusColor = "#22c55e"; break;
          case 'rejected': statusText = "❌ Rejected"; statusColor = "#ef4444"; break;
          case 'expired': statusText = "⏰ Expired"; statusColor = "#64748b"; break;
          default: statusText = order.status;
        }
        let expiryInfo = "";
        if (order.status === 'approved' && order.endDate) {
          const end = order.endDate.toDate();
          const remaining = Math.ceil((end - new Date()) / (1000*60*60*24));
          expiryInfo = `<br>Expires in: ${remaining} days`;
        }
        html += `
          <div style="border-bottom:1px solid #334155; margin-bottom:1rem; padding-bottom:0.5rem">
            <strong>#${doc.id}</strong> - ${order.packageName}<br>
            Status: <span style="color:${statusColor}">${statusText}</span>${expiryInfo}<br>
            Ordered: ${order.createdAt ? order.createdAt.toDate().toLocaleString() : 'N/A'}
          </div>
        `;
      });
      html += '</div>';
      resultDiv.innerHTML = html;
    } catch (err) {
      resultDiv.innerHTML = '<p>Error fetching orders.</p>';
      console.error(err);
    }
  };

  window.copyNumber = function(num) {
    navigator.clipboard.writeText(num);
    showToast(`Copied: ${num}`);
  };

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 3000);
  }

  renderPlans();
</script>
</body>
</html>
