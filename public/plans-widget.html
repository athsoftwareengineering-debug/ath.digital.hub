<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Plans Widget - ATH DIGITAL HUB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== ALL STYLES REMAIN THE SAME ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans Myanmar', sans-serif;
            padding: 0;
            margin: 0;
        }
        #plansContainer {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .operator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
        }
        .operator-item {
            background: linear-gradient(145deg, #13162a, #0d0f1e);
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            border: 1px solid rgba(0,212,255,0.12);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .operator-item:hover {
            border-color: rgba(0,212,255,0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .operator-item .op-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            display: block;
            margin: 0 auto 4px auto;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            padding: 4px;
        }
        .operator-item .op-name {
            font-size: 0.7rem;
            font-weight: 700;
            color: #e2e8f0;
            letter-spacing: 0.3px;
        }
        .operator-item .op-badge {
            font-size: 0.5rem;
            color: #94a3b8;
            margin-top: 2px;
            display: block;
        }
        .operator-item.active {
            border-color: #00d4ff;
            background: linear-gradient(145deg, #1a1f3a, #0f1225);
            box-shadow: 0 0 20px rgba(0,212,255,0.08);
        }
        .operator-item.active .op-name {
            color: #00d4ff;
        }

        .plan-card {
            background: linear-gradient(145deg, #0f111a, #0a0c15);
            border-radius: 1.5rem;
            padding: 1.2rem;
            border: 1px solid rgba(0,212,255,0.15);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .plan-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0,212,255,0.5);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        .plan-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .plan-title {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .plan-icon { font-size: 1.8rem; }
        .plan-name {
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #00d4ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .badge {
            padding: 3px 10px;
            border-radius: 40px;
            font-size: 0.6rem;
            font-weight: 600;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .badge-best-seller { background: linear-gradient(135deg, #f59e0b, #ea580c); animation: pulse 2s infinite; }
        .badge-popular { background: linear-gradient(135deg, #10b981, #059669); }
        .badge-hot { background: linear-gradient(135deg, #ef4444, #dc2626); }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .plan-price-box { text-align: right; }
        .plan-price { font-size: 1.3rem; font-weight: 800; color: #10b981; display: flex; align-items: baseline; gap: 3px; }
        .plan-price small { font-size: 0.65rem; color: #94a3b8; font-weight: normal; }
        .price-note { font-size: 0.55rem; color: #94a3b8; margin-top: 2px; }
        .feature-list { list-style: none; margin: 16px 0; padding: 0; }
        .feature-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            font-size: 0.75rem;
            color: #e2e8f0;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }
        .feature-list li:last-child { border-bottom: none; }
        .feature-list li i { width: 22px; font-size: 0.85rem; }
        .feature-data i { color: #00d4ff !important; }
        .feature-data span { color: #00d4ff; font-weight: 600; }
        .feature-voice i { color: #f59e0b !important; }
        .feature-voice span { color: #f59e0b; font-weight: 600; }
        .feature-sms i { color: #10b981 !important; }
        .feature-sms span { color: #10b981; font-weight: 600; }
        .product-buy-btn {
            width: 100%;
            background: linear-gradient(135deg, #00d4ff, #0891b2);
            border: none;
            padding: 12px;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.85rem;
            margin-top: 8px;
        }
        .product-buy-btn.disabled, .product-buy-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        .product-buy-btn:hover:not(:disabled) {
            transform: scale(0.98);
            background: linear-gradient(135deg, #00e5ff, #0a7e9e);
            gap: 15px;
            box-shadow: 0 5px 15px rgba(0,212,255,0.3);
        }
        .ranking-bar {
            margin-top: 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 60px;
            height: 6px;
            overflow: hidden;
        }
        .ranking-fill { height: 100%; border-radius: 60px; transition: width 0.5s ease; }
        .ranking-fill.rank-1 { background: linear-gradient(90deg, #f59e0b, #ea580c); }
        .ranking-fill.rank-2 { background: linear-gradient(90deg, #00d4ff, #0891b2); }
        .ranking-fill.rank-3 { background: linear-gradient(90deg, #10b981, #059669); }
        .ranking-fill.rank-4 { background: linear-gradient(90deg, #8b5cf6, #6d28d9); }
        .ranking-text {
            margin-top: 8px;
            font-size: 0.6rem;
            color: #94a3b8;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
        }
        .loading-text {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        .loading-text i {
            margin-right: 8px;
        }

        .operator-selector {
            display: flex;
            gap: 8px;
            padding: 6px 0 12px 0;
            flex-wrap: wrap;
        }
        .op-chip {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 0.7rem;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .op-chip:hover {
            background: rgba(0,212,255,0.1);
            border-color: rgba(0,212,255,0.3);
            color: #e2e8f0;
        }
        .op-chip.active {
            background: rgba(0,212,255,0.15);
            border-color: #00d4ff;
            color: #00d4ff;
            box-shadow: 0 0 20px rgba(0,212,255,0.05);
        }
        .op-chip .chip-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
            border-radius: 4px;
        }

        /* ===== RETRY BUTTON ===== */
        .retry-btn {
            background: var(--cyan, #00d4ff);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            margin-top: 12px;
            cursor: pointer;
            color: #030712;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,212,255,0.25);
        }
        .error-container {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }
        .error-container i {
            font-size: 2rem;
            color: #f43f5e;
            display: block;
            margin-bottom: 12px;
        }

        @media (max-width: 480px) {
            .plan-card { padding: 1rem; }
            .plan-icon { font-size: 1.5rem; }
            .plan-name { font-size: 0.85rem; }
            .plan-price { font-size: 1.1rem; }
            .feature-list li { font-size: 0.7rem; padding: 6px 0; }
            .product-buy-btn { padding: 10px; font-size: 0.75rem; }
            .badge { padding: 2px 8px; font-size: 0.55rem; }
            .operator-item .op-logo { width: 36px; height: 36px; }
            .operator-item .op-name { font-size: 0.6rem; }
            .op-chip { padding: 4px 12px; font-size: 0.6rem; }
            .op-chip .chip-icon { width: 16px; height: 16px; }
        }
    </style>
</head>
<body>
    <div id="plansContainer">
        <div class="operator-grid">
            <div class="operator-item active" data-op="atom">
                <img class="op-logo" src="https://i.imgur.com/I5iRYm8.png" alt="Atom" onerror="this.style.display='none'">
                <span class="op-name">Atom</span>
                <span class="op-badge">● အွန်လိုင်း</span>
            </div>
            <div class="operator-item" data-op="mytel">
                <img class="op-logo" src="https://i.imgur.com/Xl3B5xF.jpeg" alt="Mytel" onerror="this.style.display='none'">
                <span class="op-name">Mytel</span>
                <span class="op-badge">● အွန်လိုင်း</span>
            </div>
            <div class="operator-item" data-op="ooredoo">
                <img class="op-logo" src="https://i.imgur.com/eNdLhsk.png" alt="Ooredoo" onerror="this.style.display='none'">
                <span class="op-name">Ooredoo</span>
                <span class="op-badge">● အွန်လိုင်း</span>
            </div>
            <div class="operator-item" data-op="mpt">
                <img class="op-logo" src="https://i.imgur.com/BNUZimj.png" alt="MPT" onerror="this.style.display='none'">
                <span class="op-name">MPT</span>
                <span class="op-badge">● အွန်လိုင်း</span>
            </div>
        </div>

        <div class="operator-selector">
            <span class="op-chip active" data-op="all"><span class="chip-icon">🔷</span> အားလုံး</span>
            <span class="op-chip" data-op="atom"><img class="chip-icon" src="https://i.imgur.com/I5iRYm8.png" alt="Atom" onerror="this.style.display='none'"> Atom</span>
            <span class="op-chip" data-op="mytel"><img class="chip-icon" src="https://i.imgur.com/Xl3B5xF.jpeg" alt="Mytel" onerror="this.style.display='none'"> Mytel</span>
            <span class="op-chip" data-op="ooredoo"><img class="chip-icon" src="https://i.imgur.com/eNdLhsk.png" alt="Ooredoo" onerror="this.style.display='none'"> Ooredoo</span>
            <span class="op-chip" data-op="mpt"><img class="chip-icon" src="https://i.imgur.com/BNUZimj.png" alt="MPT" onerror="this.style.display='none'"> MPT</span>
        </div>

        <div class="loading-text" id="loadingIndicator">
            <i class="fas fa-spinner fa-pulse"></i> Loading plans...
        </div>
    </div>

    <script>
        // ================================================================
        //  PLANS WIDGET - USING SERVER API (NO SUPABASE DIRECT)
        // ================================================================

        (function() {
            'use strict';

            const API_BASE = window.location.origin;
            let plansData = [];
            let planSales = {};
            let isShopOpen = true;
            let shopStatusInterval = null;
            let currentOperator = 'all';
            let isLoading = false;
            let retryCount = 0;
            const MAX_RETRIES = 3;

            // ===== FEATURE CONFIG =====
            const featureConfig = {
                data: { icon: "fa-database", class: "feature-data" },
                voice: { icon: "fa-phone-volume", class: "feature-voice" },
                sms: { icon: "fa-envelope", class: "feature-sms" },
                streaming: { icon: "fa-film", class: "feature-data" },
                support: { icon: "fa-headset", class: "feature-data" }
            };

            const operatorColors = {
                atom: '#f59e0b',
                mytel: '#00d4ff',
                ooredoo: '#ef4444',
                mpt: '#10b981'
            };

            const operatorNames = {
                atom: 'Atom',
                mytel: 'Mytel',
                ooredoo: 'Ooredoo',
                mpt: 'MPT'
            };

            // ================================================================
            //  DEFAULT PLANS (FALLBACK)
            // ================================================================

            function getDefaultPlans() {
                return [
                    { id: 1, name: "Atom Basic", price: 6000, icon: "📱", operator: "atom", features: [{ text: "6 GB ဒေတာ", type: "data" }, { text: "150 မိနစ်", type: "voice" }, { text: "600 SMS", type: "sms" }] },
                    { id: 2, name: "Atom Standard", price: 12000, icon: "📱", operator: "atom", features: [{ text: "20 GB ဒေတာ", type: "data" }, { text: "600 မိနစ်", type: "voice" }, { text: "2,500 SMS", type: "sms" }] },
                    { id: 3, name: "Atom Premium", price: 22000, icon: "📱", operator: "atom", features: [{ text: "50 GB ဒေတာ", type: "data" }, { text: "2,000 မိနစ်", type: "voice" }, { text: "6,000 SMS", type: "sms" }] },
                    { id: 4, name: "Atom Ultra", price: 38000, icon: "📱", operator: "atom", features: [{ text: "120 GB ဒေတာ", type: "data" }, { text: "အကန့်အသတ်မရှိ ခေါ်ဆိုမှု", type: "voice" }, { text: "12,000 SMS", type: "sms" }] },
                    { id: 5, name: "Mytel Basic", price: 5000, icon: "📶", operator: "mytel", features: [{ text: "5 GB ဒေတာ", type: "data" }, { text: "100 မိနစ်", type: "voice" }, { text: "500 SMS", type: "sms" }] },
                    { id: 6, name: "Mytel Standard", price: 10000, icon: "📶", operator: "mytel", features: [{ text: "15 GB ဒေတာ", type: "data" }, { text: "500 မိနစ်", type: "voice" }, { text: "2,000 SMS", type: "sms" }] },
                    { id: 7, name: "Mytel Premium", price: 20000, icon: "📶", operator: "mytel", features: [{ text: "40 GB ဒေတာ", type: "data" }, { text: "1,500 မိနစ်", type: "voice" }, { text: "5,000 SMS", type: "sms" }] },
                    { id: 8, name: "Mytel Ultra", price: 35000, icon: "📶", operator: "mytel", features: [{ text: "100 GB ဒေတာ", type: "data" }, { text: "အကန့်အသတ်မရှိ ခေါ်ဆိုမှု", type: "voice" }, { text: "10,000 SMS", type: "sms" }] },
                    { id: 9, name: "Ooredoo Basic", price: 5500, icon: "📳", operator: "ooredoo", features: [{ text: "5 GB ဒေတာ", type: "data" }, { text: "120 မိနစ်", type: "voice" }, { text: "550 SMS", type: "sms" }] },
                    { id: 10, name: "Ooredoo Standard", price: 11000, icon: "📳", operator: "ooredoo", features: [{ text: "18 GB ဒေတာ", type: "data" }, { text: "550 မိနစ်", type: "voice" }, { text: "2,200 SMS", type: "sms" }] },
                    { id: 11, name: "Ooredoo Premium", price: 21000, icon: "📳", operator: "ooredoo", features: [{ text: "45 GB ဒေတာ", type: "data" }, { text: "1,800 မိနစ်", type: "voice" }, { text: "5,500 SMS", type: "sms" }] },
                    { id: 12, name: "Ooredoo Ultra", price: 36000, icon: "📳", operator: "ooredoo", features: [{ text: "110 GB ဒေတာ", type: "data" }, { text: "အကန့်အသတ်မရှိ ခေါ်ဆိုမှု", type: "voice" }, { text: "10,000 SMS", type: "sms" }] },
                    { id: 13, name: "MPT Basic", price: 4500, icon: "📞", operator: "mpt", features: [{ text: "4 GB ဒေတာ", type: "data" }, { text: "80 မိနစ်", type: "voice" }, { text: "400 SMS", type: "sms" }] },
                    { id: 14, name: "MPT Standard", price: 9000, icon: "📞", operator: "mpt", features: [{ text: "12 GB ဒေတာ", type: "data" }, { text: "400 မိနစ်", type: "voice" }, { text: "1,800 SMS", type: "sms" }] },
                    { id: 15, name: "MPT Premium", price: 18000, icon: "📞", operator: "mpt", features: [{ text: "35 GB ဒေတာ", type: "data" }, { text: "1,200 မိနစ်", type: "voice" }, { text: "4,500 SMS", type: "sms" }] },
                    { id: 16, name: "MPT Ultra", price: 32000, icon: "📞", operator: "mpt", features: [{ text: "90 GB ဒေတာ", type: "data" }, { text: "အကန့်အသတ်မရှိ ခေါ်ဆိုမှု", type: "voice" }, { text: "8,000 SMS", type: "sms" }] }
                ];
            }

            // ================================================================
            //  API CALLS (USING SERVER, NOT DIRECT SUPABASE)
            // ================================================================

            async function getPlansFromAPI() {
                try {
                    const response = await fetch(`${API_BASE}/api/plans`, {
                        credentials: 'include',
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    if (data.success && data.plans && data.plans.length > 0) {
                        return data.plans;
                    }
                    return null;
                } catch (error) {
                    console.error('Error fetching plans from API:', error);
                    return null;
                }
            }

            async function getSalesData() {
                try {
                    const response = await fetch(`${API_BASE}/api/orders/approved-counts`, {
                        credentials: 'include'
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    if (data.success && data.counts) {
                        return data.counts;
                    }
                    return null;
                } catch (error) {
                    console.error('Error fetching sales data:', error);
                    return null;
                }
            }

            // ================================================================
            //  LOAD PLANS
            // ================================================================

            async function loadPlans() {
                if (isLoading) return;
                isLoading = true;

                const loadingEl = document.getElementById('loadingIndicator');
                if (loadingEl) {
                    loadingEl.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Loading plans...';
                    loadingEl.style.display = 'block';
                }

                try {
                    // Try to get plans from API
                    const apiPlans = await getPlansFromAPI();
                    
                    if (apiPlans && apiPlans.length > 0) {
                        plansData = apiPlans;
                        console.log('✅ Plans loaded from API:', plansData.length);
                    } else {
                        // Use default plans as fallback
                        plansData = getDefaultPlans();
                        console.log('📦 Using default plans (API returned empty)');
                    }

                    // Load sales data
                    const sales = await getSalesData();
                    if (sales) {
                        const counts = {};
                        for (const [planName, count] of Object.entries(sales)) {
                            const plan = plansData.find(p => p.name === planName);
                            if (plan) counts[plan.id] = count;
                        }
                        planSales = counts;
                        localStorage.setItem('planSales', JSON.stringify(planSales));
                    } else {
                        // Try localStorage
                        const saved = localStorage.getItem('planSales');
                        if (saved) {
                            try {
                                const parsed = JSON.parse(saved);
                                planSales = { ...planSales, ...parsed };
                            } catch(e) {}
                        }
                    }

                    renderPlans();

                } catch (error) {
                    console.error('Error loading plans:', error);
                    // Show error with retry
                    const container = document.getElementById('plansContainer');
                    const errorHtml = `
                        <div class="error-container">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>Failed to load plans. Please try again.</p>
                            <button class="retry-btn" onclick="window.loadPlans()">
                                <i class="fas fa-sync-alt"></i> Retry
                            </button>
                        </div>
                    `;
                    // Keep operator grid and selector
                    const grid = container.querySelector('.operator-grid');
                    const selector = container.querySelector('.operator-selector');
                    container.innerHTML = '';
                    if (grid) container.appendChild(grid.cloneNode(true));
                    if (selector) container.appendChild(selector.cloneNode(true));
                    container.innerHTML += errorHtml;
                } finally {
                    isLoading = false;
                    if (loadingEl) loadingEl.style.display = 'none';
                }
            }

            // ================================================================
            //  RENDER PLANS
            // ================================================================

            function renderPlans() {
                const container = document.getElementById('plansContainer');
                
                let filtered = plansData;
                if (currentOperator !== 'all') {
                    filtered = plansData.filter(p => p.operator === currentOperator);
                }
                
                const hasData = Object.values(planSales).some(v => v > 0);
                const maxSales = Math.max(...Object.values(planSales), 1);
                
                const plansWithRank = filtered.map(plan => {
                    const sales = planSales[plan.id] || 0;
                    const rank = getRanking(sales, planSales);
                    return { ...plan, sales, rank };
                });
                plansWithRank.sort((a, b) => b.sales - a.sales);
                
                // Preserve operator grid and selector
                const grid = container.querySelector('.operator-grid');
                const selector = container.querySelector('.operator-selector');
                
                let html = '';
                if (grid) html += grid.outerHTML;
                if (selector) html += selector.outerHTML;
                
                if (plansWithRank.length === 0) {
                    html += `<div style="text-align:center;padding:30px;color:#94a3b8;font-size:0.85rem;">
                        <i class="fas fa-search" style="font-size:1.5rem;display:block;margin-bottom:10px;"></i>
                        ဤအော်ပရေတာအတွက် ပက်ကေ့ချ်မရှိသေးပါ
                    </div>`;
                } else {
                    for (const p of plansWithRank) {
                        const priceFormatted = p.price.toLocaleString();
                        const shortName = getShortName(p.name);
                        const rank = p.rank;
                        const sales = p.sales;
                        const badgeHtml = getBadgeHtml(p.id, sales, rank, hasData);
                        const dynamicWidth = getDynamicWidth(sales, maxSales);
                        const rankingText = getRankingText(rank, sales, maxSales, hasData);
                        const fillClass = getRankFillClass(rank);
                        const opName = operatorNames[p.operator] || p.operator;
                        const opColor = operatorColors[p.operator] || '#00d4ff';
                        
                        let featuresHtml = '';
                        if (p.features && Array.isArray(p.features)) {
                            for (const f of p.features) {
                                const config = featureConfig[f.type] || featureConfig.data;
                                const highlightedText = highlightNumbers(f.text);
                                featuresHtml += `<li class="${config.class}"><i class="fas ${config.icon}"></i> ${highlightedText}</li>`;
                            }
                        }
                        
                        html += `
                            <div class="plan-card">
                                <div class="plan-header">
                                    <div class="plan-title">
                                        <span class="plan-icon">${p.icon || '📦'}</span>
                                        <span class="plan-name">${shortName}</span>
                                        ${badgeHtml}
                                        <span style="font-size:0.55rem;background:rgba(255,255,255,0.06);padding:2px 10px;border-radius:20px;color:${opColor};border:1px solid ${opColor}33;">
                                            ${opName}
                                        </span>
                                    </div>
                                    <div class="plan-price-box">
                                        <div class="plan-price">${priceFormatted} <small>MMK</small></div>
                                        <div class="price-note">/ 30 days</div>
                                    </div>
                                </div>
                                <ul class="feature-list">${featuresHtml}</ul>
                                <div class="ranking-bar"><div class="ranking-fill ${fillClass}" style="width: ${dynamicWidth}%;"></div></div>
                                <div class="ranking-text"><span><i class="fas fa-chart-simple"></i> ${rankingText}</span></div>
                                <button class="product-buy-btn" onclick="window.handleBuy('${p.name}', ${p.price})" ${!isShopOpen ? 'disabled' : ''}>
                                    <i class="fas fa-shopping-cart"></i> ဝယ်ယူမည် <i class="fas fa-arrow-right"></i>
                                </button>
                            </div>
                        `;
                    }
                }
                
                container.innerHTML = html;
                updateButtonsStatus();
                attachOperatorEvents();
                // Re-attach loading indicator
                const loadingEl = document.getElementById('loadingIndicator');
                if (loadingEl) loadingEl.style.display = 'none';
            }

            // ================================================================
            //  HELPER FUNCTIONS
            // ================================================================

            function highlightNumbers(text) {
                if (!text) return '';
                text = text.replace(/(\d+\.?\d*\s*GB)/gi, '<span>$1</span>');
                text = text.replace(/(\d+[\d,]*\s*မိနစ်)/g, '<span>$1</span>');
                text = text.replace(/(\d+[\d,]*\s*SMS)/g, '<span>$1</span>');
                return text;
            }

            function getShortName(name) {
                if (!name) return '';
                if (name.length > 20) return name.substring(0, 18) + '...';
                return name;
            }

            function getBestSellerId() {
                let bestId = null, maxSales = 0;
                for (const [id, sales] of Object.entries(planSales)) {
                    if (sales > maxSales) { maxSales = sales; bestId = parseInt(id); }
                }
                return { bestId, maxSales };
            }

            function getRanking(sales, allSales) {
                const sorted = Object.values(allSales).sort((a,b) => b - a);
                return sorted.indexOf(sales) + 1;
            }

            function getBadgeHtml(planId, sales, rank, hasData) {
                if (!hasData || sales === 0) return '';
                const { bestId } = getBestSellerId();
                if (planId === bestId) return '<span class="badge badge-best-seller"><i class="fas fa-crown"></i> Best Seller</span>';
                if (rank === 2) return '<span class="badge badge-popular"><i class="fas fa-chart-line"></i> Popular</span>';
                if (rank === 3) return '<span class="badge badge-hot"><i class="fas fa-fire"></i> Hot</span>';
                return '';
            }

            function getDynamicWidth(sales, maxSales) {
                if (maxSales === 0 || sales === 0) return 0;
                const percentage = (sales / maxSales) * 100;
                return Math.max(8, Math.min(100, percentage));
            }

            function getRankingText(rank, sales, maxSales, hasData) {
                if (!hasData || sales === 0) {
                    return '📊 စာရင်းမရှိသေးပါ';
                }
                const percentage = ((sales / maxSales) * 100).toFixed(0);
                switch(rank) {
                    case 1: return `🏆 အရောင်းရဆုံး (${percentage}%)`;
                    case 2: return `⭐ ဒုတိယအရောင်းရဆုံး (${percentage}%)`;
                    case 3: return `🔥 တတိယအရောင်းရဆုံး (${percentage}%)`;
                    default: return `📦 ဝယ်ယူမှုရှိ (${percentage}%)`;
                }
            }

            function getRankFillClass(rank) { return `rank-${Math.min(rank, 4)}`; }

            // ================================================================
            //  OPERATOR EVENTS
            // ================================================================

            function attachOperatorEvents() {
                document.querySelectorAll('.operator-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const op = this.dataset.op;
                        currentOperator = op;
                        document.querySelectorAll('.operator-item').forEach(i => i.classList.remove('active'));
                        this.classList.add('active');
                        document.querySelectorAll('.op-chip').forEach(c => c.classList.remove('active'));
                        document.querySelector(`.op-chip[data-op="${op}"]`)?.classList.add('active');
                        renderPlans();
                    });
                });
                
                document.querySelectorAll('.op-chip').forEach(el => {
                    el.addEventListener('click', function() {
                        const op = this.dataset.op;
                        currentOperator = op;
                        document.querySelectorAll('.op-chip').forEach(c => c.classList.remove('active'));
                        this.classList.add('active');
                        document.querySelectorAll('.operator-item').forEach(i => i.classList.remove('active'));
                        if (op !== 'all') {
                            document.querySelector(`.operator-item[data-op="${op}"]`)?.classList.add('active');
                        } else {
                            document.querySelector('.operator-item[data-op="atom"]')?.classList.add('active');
                        }
                        renderPlans();
                    });
                });
            }

            // ================================================================
            //  BUTTONS
            // ================================================================

            function updateButtonsStatus() {
                const buyButtons = document.querySelectorAll('.product-buy-btn');
                buyButtons.forEach(btn => {
                    if (isShopOpen) {
                        btn.disabled = false;
                        btn.style.opacity = '1';
                        btn.style.cursor = 'pointer';
                        btn.style.pointerEvents = 'auto';
                    } else {
                        btn.disabled = true;
                        btn.style.opacity = '0.5';
                        btn.style.cursor = 'not-allowed';
                        btn.style.pointerEvents = 'none';
                    }
                });
            }

            // ================================================================
            //  HANDLE BUY
            // ================================================================

            window.handleBuy = function(planName, planPrice) {
                if (!isShopOpen) {
                    showNotification("ဆိုင်ပိတ်ချိန်ဖြစ်ပါသည်။ ကျေးဇူးပြု၍ နံနက် ၉ နာရီမှ ညနေ ၇ နာရီအတွင်းမှသာ ဝယ်ယူနိုင်ပါသည်။", true);
                    return;
                }
                
                if (window.parent && window.parent.openPaymentModalFromPlan) {
                    window.parent.openPaymentModalFromPlan(planName, planPrice);
                } else {
                    alert(`🛒 ${planName} - ${planPrice.toLocaleString()} MMK ဝယ်ယူရန်`);
                }
            };

            function showNotification(message, isError = false) {
                if (window.parent && window.parent.showToast) {
                    window.parent.showToast(message, isError);
                } else {
                    alert(message);
                }
            }

            // ================================================================
            //  SHOP STATUS
            // ================================================================

            async function checkShopStatus() {
                try {
                    const response = await fetch('/api/sales/status');
                    const data = await response.json();
                    isShopOpen = data.isOpen;
                    updateButtonsStatus();
                } catch(e) {
                    console.error('Error checking shop status:', e);
                }
            }

            function startShopStatusPolling() {
                if (shopStatusInterval) {
                    clearInterval(shopStatusInterval);
                    shopStatusInterval = null;
                }
                checkShopStatus();
                shopStatusInterval = setInterval(checkShopStatus, 5000);
                console.log('🔄 Shop status polling started (every 5 seconds)');
            }

            // ================================================================
            //  LISTEN FOR PARENT MESSAGES
            // ================================================================

            window.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'shopStatus') {
                    isShopOpen = event.data.isOpen;
                    updateButtonsStatus();
                }
                if (event.data && event.data.type === 'reloadPlans') {
                    console.log('🔄 Reloading plans from admin...');
                    loadPlans();
                }
            });

            // ================================================================
            //  INIT
            // ================================================================

            // Expose loadPlans to window for retry
            window.loadPlans = loadPlans;

            async function init() {
                console.log('📡 Plans Widget initializing...');
                await loadPlans();
                startShopStatusPolling();
                
                // Auto-refresh sales data every 30 seconds
                setInterval(async () => {
                    const sales = await getSalesData();
                    if (sales) {
                        const counts = {};
                        for (const [planName, count] of Object.entries(sales)) {
                            const plan = plansData.find(p => p.name === planName);
                            if (plan) counts[plan.id] = count;
                        }
                        planSales = counts;
                        renderPlans();
                    }
                }, 30000);

                console.log('📡 Plans Widget initialized successfully');
            }

            // Auto-initialize
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
