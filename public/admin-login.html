<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | MYTEL</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-card {
      background: rgba(15,23,42,0.9);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(250,204,21,0.3);
    }
    .logo { text-align: center; margin-bottom: 2rem; }
    .logo-icon {
      width: 70px; height: 70px;
      background: linear-gradient(135deg, #facc15, #eab308);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
    }
    .logo-icon i { font-size: 2rem; color: #0f172a; }
    .logo h1 { font-size: 1.5rem; color: #facc15; }
    .logo p { color: #64748b; font-size: 0.8rem; margin-top: 0.5rem; }
    .input-group { margin-bottom: 1.5rem; }
    .input-group label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.8rem; }
    .input-field { position: relative; }
    .input-field i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; }
    .input-field input {
      width: 100%; padding: 14px 16px 14px 45px;
      background: #1e293b; border: 1px solid #334155;
      border-radius: 14px; font-size: 1rem; color: white;
    }
    .input-field input:focus { outline: none; border-color: #facc15; }
    .login-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(95deg, #facc15, #eab308);
      border: none; border-radius: 14px;
      font-weight: 700; font-size: 1rem; cursor: pointer;
    }
    .error-message {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 12px; padding: 12px;
      margin-bottom: 1rem; color: #f87171;
      font-size: 0.8rem; text-align: center;
      display: none;
    }
    .back-link { text-align: center; margin-top: 1rem; }
    .back-link a { color: #64748b; text-decoration: none; font-size: 0.8rem; }
    .back-link a:hover { color: #facc15; }
    .login-footer { text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.05); font-size: 0.7rem; color: #475569; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
    <h1>Admin Access</h1>
    <p>MYTEL Data Service Management</p>
  </div>
  
  <div class="error-message" id="errorMessage"></div>
  
  <form id="loginForm">
    <div class="input-group">
      <label>Username</label>
      <div class="input-field">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Enter admin username" autocomplete="off">
      </div>
    </div>
    <div class="input-group">
      <label>Password</label>
      <div class="input-field">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Enter password">
      </div>
    </div>
    <button type="submit" class="login-btn" id="loginBtn">
      <i class="fas fa-sign-in-alt"></i> Login to Dashboard
    </button>
  </form>
  
  <div class="back-link">
    <a href="/"><i class="fas fa-arrow-left"></i> Back to Customer Site</a>
  </div>
  <div class="login-footer">
    <i class="fas fa-lock"></i> Secure Admin Area
  </div>
</div>

<script>
  // Clear any old session
  sessionStorage.removeItem('adminLoggedIn');
  
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('errorMessage');
    const loginBtn = document.getElementById('loginBtn');
    
    // Validate
    if (!username || !password) {
      errorDiv.innerText = 'Please enter both username and password';
      errorDiv.style.display = 'block';
      return;
    }
    
    // Show loading
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
    errorDiv.style.display = 'none';
    
    try {
      console.log('Sending login request...');
      
      const response = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      });
      
      const data = await response.json();
      console.log('Response:', data);
      
      if (data.success) {
        sessionStorage.setItem('adminLoggedIn', 'true');
        window.location.href = '/admin';
      } else {
        errorDiv.innerText = data.message || 'Invalid username or password';
        errorDiv.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login to Dashboard';
      }
    } catch (error) {
      console.error('Login error:', error);
      errorDiv.innerText = 'Network error. Please try again.';
      errorDiv.style.display = 'block';
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login to Dashboard';
    }
  });
</script>
</body>
</html>
