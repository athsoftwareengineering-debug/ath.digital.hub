<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | MYTEL</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(250,204,21,0.1);
      animation: float 20s infinite ease-in-out;
    }
    .circle-1 { width: 300px; height: 300px; top: -100px; left: -100px; }
    .circle-2 { width: 500px; height: 500px; bottom: -200px; right: -200px; animation-delay: 5s; }
    @keyframes float {
      0%,100% { transform: translate(0,0) rotate(0deg); }
      33% { transform: translate(30px,-30px) rotate(120deg); }
      66% { transform: translate(-20px,20px) rotate(240deg); }
    }
    .login-card {
      position: relative;
      z-index: 10;
      background: rgba(15,23,42,0.9);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(250,204,21,0.3);
      animation: slideUp 0.5s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo { text-align: center; margin-bottom: 2rem; }
    .logo-icon {
      width: 70px; height: 70px;
      background: linear-gradient(135deg, #facc15, #eab308);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(250,204,21,0.4); }
      50% { box-shadow: 0 0 0 15px rgba(250,204,21,0); }
    }
    .logo-icon i { font-size: 2rem; color: #0f172a; }
    .logo h1 { font-size: 1.5rem; background: linear-gradient(135deg, #FFD700, #FFA500); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .logo p { color: #64748b; font-size: 0.8rem; margin-top: 0.5rem; }
    .input-group { margin-bottom: 1.5rem; }
    .input-group label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.8rem; }
    .input-field { position: relative; }
    .input-field i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; }
    .input-field input {
      width: 100%; padding: 14px 16px 14px 45px;
      background: #1e293b; border: 1px solid #334155;
      border-radius: 14px; font-size: 1rem; color: white;
      transition: all 0.3s;
    }
    .input-field input:focus { outline: none; border-color: #facc15; box-shadow: 0 0 0 3px rgba(250,204,21,0.1); }
    .login-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(95deg, #facc15, #eab308);
      border: none; border-radius: 14px;
      font-weight: 700; font-size: 1rem; cursor: pointer;
      transition: all 0.3s;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(250,204,21,0.4); }
    .error-message {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 12px; padding: 12px;
      margin-bottom: 1rem; color: #f87171;
      font-size: 0.8rem; text-align: center;
      display: none;
    }
    .login-footer {
      text-align: center; margin-top: 1.5rem;
      padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 0.7rem; color: #475569;
    }
    .back-link {
      text-align: center; margin-top: 1rem;
    }
    .back-link a {
      color: #64748b; text-decoration: none; font-size: 0.8rem;
    }
    .back-link a:hover { color: #facc15; }
  </style>
</head>
<body>
<div class="bg-animation">
  <div class="circle circle-1"></div>
  <div class="circle circle-2"></div>
</div>
<div class="login-card">
  <div class="logo">
    <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
    <h1>Admin Access</h1>
    <p>MYTEL Data Service Management</p>
  </div>
  <div class="error-message" id="errorMessage"></div>
  <form id="loginForm">
    <div class="input-group">
      <label><i class="fas fa-user"></i> Username</label>
      <div class="input-field">
        <i class="fas fa-envelope"></i>
        <input type="text" id="username" placeholder="Enter admin username" autocomplete="off">
      </div>
    </div>
    <div class="input-group">
      <label><i class="fas fa-lock"></i> Password</label>
      <div class="input-field">
        <i class="fas fa-key"></i>
        <input type="password" id="password" placeholder="Enter password">
      </div>
    </div>
    <button type="submit" class="login-btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login to Dashboard</button>
  </form>
  <div class="back-link">
    <a href="/"><i class="fas fa-arrow-left"></i> Back to Customer Site</a>
  </div>
  <div class="login-footer">
    <i class="fas fa-lock"></i> Secure Admin Area
  </div>
</div>
<script>
  if (sessionStorage.getItem('adminLoggedIn') === 'true') window.location.href = '/admin';
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
    btn.disabled = true;
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        sessionStorage.setItem('adminLoggedIn', 'true');
        window.location.href = '/admin';
      } else {
        document.getElementById('errorMessage').innerText = data.message || 'Invalid username or password';
        document.getElementById('errorMessage').style.display = 'block';
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login to Dashboard';
        btn.disabled = false;
      }
    } catch (err) {
      document.getElementById('errorMessage').innerText = 'Network error. Please try again.';
      document.getElementById('errorMessage').style.display = 'block';
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login to Dashboard';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
