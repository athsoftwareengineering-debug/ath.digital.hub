<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYTEL Admin Dashboard | Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      transition: all 0.3s;
    }
    
    body.light-mode {
      background: #f1f5f9;
      color: #0f172a;
    }
    
    body.light-mode .sidebar,
    body.light-mode .stat-card,
    body.light-mode .orders-table,
    body.light-mode .login-card,
    body.light-mode .modal-content {
      background: #ffffff;
      border-color: #e2e8f0;
    }
    
    /* Login Section */
    .login-container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    }
    
    .login-card {
      background: rgba(15,23,42,0.95);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(250,204,21,0.3);
    }
    
    .logo-icon {
      width: 70px; height: 70px;
      background: linear-gradient(135deg, #facc15, #eab308);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
    }
    
    .logo-icon i { font-size: 2rem; color: #0f172a; }
    .login-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(95deg, #facc15, #eab308);
      border: none; border-radius: 14px;
      font-weight: 700; cursor: pointer;
    }
    
    /* Dashboard Sidebar */
    .sidebar {
      position: fixed;
      left: 0; top: 0;
      width: 260px; height: 100%;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      border-right: 1px solid #334155;
      padding: 1.5rem;
      transition: all 0.3s;
      z-index: 100;
    }
    
    .logo {
      font-size: 1.3rem; font-weight: 800;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 2rem;
      text-align: center;
    }
    
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; margin: 8px 0;
      border-radius: 12px; cursor: pointer;
      color: #94a3b8;
      transition: all 0.3s;
    }
    
    .nav-item:hover, .nav-item.active {
      background: #facc1520;
      color: #facc15;
    }
    
    /* Main Content */
    .main-content {
      margin-left: 260px;
      padding: 1.5rem;
      transition: all 0.3s;
    }
    
    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    
    .theme-toggle {
      background: #1e293b;
      border: none;
      padding: 10px 15px;
      border-radius: 12px;
      color: white;
      cursor: pointer;
    }
    
    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    .stat-card {
      background: #1e293b;
      border-radius: 1rem;
      padding: 1rem;
      border: 1px solid #334155;
      transition: all 0.3s;
    }
    
    .stat-card:hover { transform: translateY(-3px); border-color: #facc15; }
    .stat-card .value { font-size: 1.8rem; font-weight: 800; color: #facc15; }
    .stat-card .label { font-size: 0.7rem; color: #64748b; margin-top: 0.3rem; }
    
    /* Charts */
    .charts-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .chart-card {
      background: #1e293b;
      border-radius: 1rem;
      padding: 1.5rem;
      border: 1px solid #334155;
    }
    
    .chart-card h3 { margin-bottom: 1rem; font-size: 1rem; }
    canvas { max-height: 250px; }
    
    /* Filters */
    .filters-bar {
      background: #1e293b;
      border-radius: 1rem;
      padding: 1rem;
      margin-bottom: 1rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    
    .filters-bar input, .filters-bar select {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 8px;
      color: white;
    }
    
    .search-box {
      flex: 1;
      min-width: 200px;
    }
    
    .search-box input {
      width: 100%;
    }
    
    /* Bulk Actions */
    .bulk-actions {
      background: #1e293b;
      border-radius: 1rem;
      padding: 0.8rem 1rem;
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    
    .bulk-actions.show { display: flex; }
    
    .bulk-actions button {
      background: #facc15;
      color: #0f172a;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    
    /* Expiring Soon Alert */
    .expiring-alert {
      background: rgba(239,68,68,0.2);
      border: 1px solid #ef4444;
      border-radius: 12px;
      padding: 0.8rem 1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
    }
    
    .expiring-alert i { color: #ef4444; font-size: 1.2rem; }
    
    /* Orders Table */
    .orders-table {
      background: #1e293b;
      border-radius: 1rem;
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #334155;
    }
    
    th { background: #0f172a; color: #facc15; }
    
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
    }
    
    .status-pending { background: #f9731620; color: #f97316; }
    .status-paid { background: #3b82f620; color: #3b82f6; }
    .status-approved { background: #22c55e20; color: #22c55e; }
    .status-rejected { background: #ef444420; color: #ef4444; }
    .status-expired { background: #64748b20; color: #64748b; }
    
    .action-btn {
      background: none; border: none;
      cursor: pointer; padding: 4px 8px;
      border-radius: 6px;
    }
    
    .action-approve { color: #22c55e; }
    .action-reject { color: #ef4444; }
    .action-view { color: #3b82f6; }
    
    .checkbox-col { width: 40px; }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    
    .modal-content {
      background: #1e293b;
      border-radius: 20px;
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    .modal-content img { max-width: 100%; border-radius: 12px; }
    
    /* Notification */
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #22c55e;
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      z-index: 1100;
      display: none;
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from { right: -300px; opacity: 0; }
      to { right: 20px; opacity: 1; }
    }
    
    .logout-btn {
      position: fixed; bottom: 20px; left: 20px;
      background: #ef4444; border: none;
      padding: 10px 20px; border-radius: 12px;
      color: white; cursor: pointer;
      z-index: 100;
    }
    
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; }
      .logout-btn { left: auto; right: 20px; bottom: 20px; }
    }
  </style>
</head>
<body>

<!-- Login Section -->
<div id="loginSection" class="login-container">
  <div class="login-card">
    <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
    <h1 style="text-align:center; color:#facc15; margin-bottom:1.5rem;">Admin Access</h1>
    <div id="loginError" style="color:#f87171; text-align:center; margin-bottom:1rem; display:none;"></div>
    <div class="input-field" style="margin-bottom:1rem;">
      <i class="fas fa-lock" style="position:absolute; left:16px; top:50%; transform:translateY(-50%);"></i>
      <input type="password" id="adminPassword" placeholder="Enter password" style="width:100%; padding:14px 16px 14px 45px; background:#1e293b; border:1px solid #334155; border-radius:14px; color:white;">
    </div>
    <button class="login-btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Access Dashboard</button>
  </div>
</div>

<!-- Dashboard Section -->
<div id="dashboardSection" style="display:none">
  <div class="sidebar">
    <div class="logo">✨ MYTEL ADMIN</div>
    <div class="nav-item active" data-page="dashboard"><i class="fas fa-chart-line"></i> Dashboard</div>
    <div class="nav-item" data-page="orders"><i class="fas fa-box"></i> Orders</div>
    <div class="nav-item" data-page="expiring"><i class="fas fa-clock"></i> Expiring Soon</div>
    <div class="nav-item" data-page="analytics"><i class="fas fa-chart-bar"></i> Analytics</div>
  </div>
  
  <div class="main-content">
    <div class="top-bar">
      <h1><i class="fas fa-chart-line"></i> <span id="pageTitle">Dashboard</span></h1>
      <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i> Dark/Light</button>
    </div>
    
    <!-- Stats Grid -->
    <div class="stats-grid" id="statsGrid">Loading...</div>
    
    <!-- Expiring Soon Alert -->
    <div id="expiringAlert" class="expiring-alert" style="display:none" onclick="showExpiringPage()">
      <i class="fas fa-exclamation-triangle"></i>
      <span id="expiringText">သက်တမ်းကုန်ခါနီး အော်ဒါများ ရှိပါသည်။</span>
    </div>
    
    <!-- Charts -->
    <div class="charts-container" id="chartsContainer">
      <div class="chart-card"><h3>📊 Daily Orders (Last 7 Days)</h3><canvas id="dailyChart"></canvas></div>
      <div class="chart-card"><h3>💰 Revenue by Package</h3><canvas id="packageChart"></canvas></div>
    </div>
    
    <!-- Filters -->
    <div class="filters-bar">
      <div class="search-box">
        <input type="text" id="searchPhone" placeholder="🔍 Search by phone number...">
      </div>
      <input type="date" id="startDate" placeholder="Start Date">
      <input type="date" id="endDate" placeholder="End Date">
      <select id="statusFilter">
        <option value="all">All Status</option>
        <option value="pending_payment">Pending</option>
        <option value="payment_received">Paid</option>
        <option value="approved">Active</option>
        <option value="rejected">Rejected</option>
        <option value="expired">Expired</option>
      </select>
      <button onclick="applyFilters()" style="background:#facc15; color:#0f172a; border:none; padding:8px 16px; border-radius:8px;">Apply</button>
      <button onclick="exportToCSV()" style="background:#22c55e; color:white; border:none; padding:8px 16px; border-radius:8px;"><i class="fas fa-download"></i> Export</button>
    </div>
    
    <!-- Bulk Actions -->
    <div class="bulk-actions" id="bulkActions">
      <span id="selectedCount">0 selected</span>
      <button onclick="bulkApprove()"><i class="fas fa-check"></i> Approve Selected</button>
      <button onclick="bulkReject()" style="background:#ef4444; color:white;"><i class="fas fa-times"></i> Reject Selected</button>
      <button onclick="clearSelection()">Cancel</button>
    </div>
    
    <!-- Orders Table -->
    <div class="orders-table" id="ordersTable">Loading orders...</div>
  </div>
  
  <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
</div>

<!-- Screenshot Modal -->
<div id="screenshotModal" class="modal">
  <div class="modal-content">
    <h3>📸 Payment Screenshot</h3>
    <img id="screenshotImg" src="">
    <button onclick="closeModal()" style="margin-top:1rem; padding:10px; background:#334155; border:none; border-radius:8px; color:white; width:100%;">Close</button>
  </div>
</div>

<script>
  const ADMIN_PASSWORD = "mytel2024";
  let allOrders = [];
  let selectedOrders = new Set();
  let dailyChart, packageChart;
  
  // Check login
  if (sessionStorage.getItem('adminLoggedIn') === 'true') {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('dashboardSection').style.display = 'block';
    loadAllData();
  }
  
  // Login
  document.getElementById('loginBtn').onclick = function() {
    const password = document.getElementById('adminPassword').value;
    if (password === ADMIN_PASSWORD) {
      sessionStorage.setItem('adminLoggedIn', 'true');
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboardSection').style.display = 'block';
      loadAllData();
    } else {
      const err = document.getElementById('loginError');
      err.innerText = 'Wrong password!';
      err.style.display = 'block';
      setTimeout(() => err.style.display = 'none', 2000);
    }
  };
  
  document.getElementById('adminPassword').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });
  
  // Load all data
  async function loadAllData() {
    await loadOrders();
    loadCharts();
    checkExpiringSoon();
    startNotificationCheck();
  }
  
  // Load orders with filters
  async function loadOrders() {
    try {
      const res = await fetch('/api/admin/orders?status=all', {
        headers: { 'x-admin-auth': ADMIN_PASSWORD }
      });
      const data = await res.json();
      if (data.success) {
        allOrders = data.orders;
        renderStats(data.stats);
        applyFilters();
      }
    } catch(err) { console.error(err); }
  }
  
  function renderStats(stats) {
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><div class="value">${stats.total}</div><div class="label">Total Orders</div></div>
      <div class="stat-card"><div class="value">${stats.pending}</div><div class="label">Pending</div></div>
      <div class="stat-card"><div class="value">${stats.paid}</div><div class="label">Paid</div></div>
      <div class="stat-card"><div class="value">${stats.approved}</div><div class="label">Active</div></div>
      <div class="stat-card"><div class="value">${stats.expired}</div><div class="label">Expired</div></div>
      <div class="stat-card"><div class="value">${(stats.revenue/1000).toFixed(0)}K</div><div class="label">Revenue (KS)</div></div>
    `;
  }
  
  // Apply filters (search, date range, status)
  function applyFilters() {
    const searchPhone = document.getElementById('searchPhone').value.toLowerCase();
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    const status = document.getElementById('statusFilter').value;
    
    let filtered = [...allOrders];
    
    if (searchPhone) {
      filtered = filtered.filter(o => o.phone.includes(searchPhone));
    }
    
    if (status !== 'all') {
      filtered = filtered.filter(o => o.status === status);
    }
    
    if (startDate) {
      filtered = filtered.filter(o => new Date(o.createdAt) >= new Date(startDate));
    }
    
    if (endDate) {
      filtered = filtered.filter(o => new Date(o.createdAt) <= new Date(endDate));
    }
    
    renderOrders(filtered);
  }
  
  function renderOrders(orders) {
    if (!orders.length) {
      document.getElementById('ordersTable').innerHTML = '<div style="padding:2rem;text-align:center">📭 No orders found</div>';
      return;
    }
    
    let html = `<table><thead><tr>
      <th class="checkbox-col"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
      <th>ID</th><th>Package</th><th>Phone</th><th>Price</th><th>Status</th><th>Date</th><th>Screenshot</th><th>Action</th>
    </tr></thead><tbody>`;
    
    orders.forEach(order => {
      let statusClass = '', statusText = '';
      switch(order.status) {
        case 'pending_payment': statusClass = 'status-pending'; statusText = '⏳ Pending'; break;
        case 'payment_received': statusClass = 'status-paid'; statusText = '💰 Paid'; break;
        case 'approved': statusClass = 'status-approved'; statusText = '✅ Active'; break;
        case 'rejected': statusClass = 'status-rejected'; statusText = '❌ Rejected'; break;
        case 'expired': statusClass = 'status-expired'; statusText = '⏰ Expired'; break;
      }
      
      html += `<tr>
        <td><input type="checkbox" class="order-checkbox" value="${order.id}" onchange="updateSelectedCount()"></td>
        <td><strong>#${order.id}</strong></td>
        <td>${order.packageName}</td>
        <td>${order.phone}</td>
        <td>${order.price.toLocaleString()} KS</td>
        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
        <td>${order.createdAtMyanmar || order.createdAt}</td>
        <td><button class="action-btn action-view" onclick="viewScreenshot(${order.id})"><i class="fas fa-image"></i></button></td>
        <td>${order.status === 'payment_received' ? 
          `<button class="action-btn action-approve" onclick="updateOrder(${order.id}, 'approved')">✅</button>
           <button class="action-btn action-reject" onclick="updateOrder(${order.id}, 'rejected')">❌</button>` : 
          `<span style="color:#64748b;">-</span>`}
        </td>
      </tr>`;
    });
    
    html += `</tbody></table>`;
    document.getElementById('ordersTable').innerHTML = html;
  }
  
  function toggleSelectAll() {
    const selectAll = document.getElementById('selectAll');
    const checkboxes = document.querySelectorAll('.order-checkbox');
    checkboxes.forEach(cb => cb.checked = selectAll.checked);
    updateSelectedCount();
  }
  
  function updateSelectedCount() {
    const checkboxes = document.querySelectorAll('.order-checkbox:checked');
    selectedOrders.clear();
    checkboxes.forEach(cb => selectedOrders.add(parseInt(cb.value)));
    const bulkDiv = document.getElementById('bulkActions');
    if (selectedOrders.size > 0) {
      bulkDiv.classList.add('show');
      document.getElementById('selectedCount').innerText = `${selectedOrders.size} selected`;
    } else {
      bulkDiv.classList.remove('show');
    }
  }
  
  function clearSelection() {
    document.querySelectorAll('.order-checkbox').forEach(cb => cb.checked = false);
    updateSelectedCount();
  }
  
  async function bulkApprove() {
    if (!confirm(`Approve ${selectedOrders.size} orders? 30 days countdown will start.`)) return;
    for (let id of selectedOrders) {
      await updateOrder(id, 'approved', false);
    }
    showNotification(`✅ ${selectedOrders.size} orders approved!`);
    loadOrders();
    clearSelection();
  }
  
  async function bulkReject() {
    if (!confirm(`Reject ${selectedOrders.size} orders?`)) return;
    for (let id of selectedOrders) {
      await updateOrder(id, 'rejected', false);
    }
    showNotification(`❌ ${selectedOrders.size} orders rejected!`);
    loadOrders();
    clearSelection();
  }
  
  async function updateOrder(orderId, status, showMsg = true) {
    try {
      const res = await fetch('/api/admin/update-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-auth': ADMIN_PASSWORD },
        body: JSON.stringify({ orderId, status })
      });
      const data = await res.json();
      if (data.success && showMsg) {
        showNotification(`Order #${orderId} ${status === 'approved' ? 'approved! 30 days started.' : 'rejected.'}`);
        loadOrders();
      }
      return data.success;
    } catch(err) { return false; }
  }
  
  function viewScreenshot(orderId) {
    const order = allOrders.find(o => o.id === orderId);
    if (order && order.screenshotUrl) {
      document.getElementById('screenshotImg').src = order.screenshotUrl;
      document.getElementById('screenshotModal').style.display = 'flex';
    } else {
      showNotification('No screenshot available for this order', 'error');
    }
  }
  
  function closeModal() {
    document.getElementById('screenshotModal').style.display = 'none';
  }
  
  // Export to CSV
  function exportToCSV() {
    const searchPhone = document.getElementById('searchPhone').value;
    const status = document.getElementById('statusFilter').value;
    
    let filtered = [...allOrders];
    if (searchPhone) filtered = filtered.filter(o => o.phone.includes(searchPhone));
    if (status !== 'all') filtered = filtered.filter(o => o.status === status);
    
    const headers = ['Order ID', 'Package', 'Phone', 'Price', 'Status', 'Date', 'Start Date', 'End Date'];
    const rows = filtered.map(o => [
      o.id, o.packageName, o.phone, o.price, o.status, o.createdAtMyanmar,
      o.startDateMyanmar || '', o.endDateMyanmar || ''
    ]);
    
    const csvContent = [headers, ...rows].map(row => row.join(',')).join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `orders_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showNotification('CSV exported successfully!');
  }
  
  // Load Charts
  async function loadCharts() {
    const res = await fetch('/api/admin/orders?status=all', {
      headers: { 'x-admin-auth': ADMIN_PASSWORD }
    });
    const data = await res.json();
    if (data.success) {
      const orders = data.orders;
      
      // Daily orders (last 7 days)
      const last7Days = [];
      const dailyCounts = [];
      for (let i = 6; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        const dateStr = date.toISOString().split('T')[0];
        last7Days.push(dateStr);
        const count = orders.filter(o => o.createdAt.startsWith(dateStr)).length;
        dailyCounts.push(count);
      }
      
      if (dailyChart) dailyChart.destroy();
      const ctx1 = document.getElementById('dailyChart').getContext('2d');
      dailyChart = new Chart(ctx1, {
        type: 'line',
        data: { labels: last7Days, datasets: [{ label: 'Orders', data: dailyCounts, borderColor: '#facc15', fill: true }] },
        options: { responsive: true }
      });
      
      // Package revenue
      const packageRevenue = {};
      orders.forEach(o => {
        if (o.status === 'approved') {
          packageRevenue[o.packageName] = (packageRevenue[o.packageName] || 0) + o.price;
        }
      });
      
      if (packageChart) packageChart.destroy();
      const ctx2 = document.getElementById('packageChart').getContext('2d');
      packageChart = new Chart(ctx2, {
        type: 'bar',
        data: { labels: Object.keys(packageRevenue), datasets: [{ label: 'Revenue (KS)', data: Object.values(packageRevenue), backgroundColor: '#facc15' }] },
        options: { responsive: true }
      });
    }
  }
  
  // Check expiring soon orders
  function checkExpiringSoon() {
    const expiringOrders = allOrders.filter(o => o.status === 'approved' && o.daysRemaining <= 5 && o.daysRemaining > 0);
    if (expiringOrders.length > 0) {
      document.getElementById('expiringAlert').style.display = 'flex';
      document.getElementById('expiringText').innerHTML = `⚠️ ${expiringOrders.length} orders expiring within ${Math.min(...expiringOrders.map(o => o.daysRemaining))} days!`;
    } else {
      document.getElementById('expiringAlert').style.display = 'none';
    }
  }
  
  function showExpiringPage() {
    const expiringOrders = allOrders.filter(o => o.status === 'approved' && o.daysRemaining <= 5 && o.daysRemaining > 0);
    renderOrders(expiringOrders);
    document.getElementById('pageTitle').innerText = 'Expiring Soon';
    showNotification(`Found ${expiringOrders.length} orders expiring soon`, 'info');
  }
  
  // Notification system
  let lastOrderCount = 0;
  function startNotificationCheck() {
    setInterval(async () => {
      const res = await fetch('/api/admin/orders?status=all', {
        headers: { 'x-admin-auth': ADMIN_PASSWORD }
      });
      const data = await res.json();
      if (data.success && data.orders.length > lastOrderCount && lastOrderCount > 0) {
        showNotification(`🆕 New order received! Total: ${data.orders.length} orders`, 'success');
      }
      lastOrderCount = data.orders.length;
    }, 30000);
  }
  
  function showNotification(msg, type = 'success') {
    const notif = document.createElement('div');
    notif.className = 'notification';
    notif.style.background = type === 'error' ? '#ef4444' : '#22c55e';
    notif.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i> ${msg}`;
    document.body.appendChild(notif);
    notif.style.display = 'block';
    setTimeout(() => notif.remove(), 3000);
  }
  
  // Theme toggle
  function toggleTheme() {
    document.body.classList.toggle('light-mode');
    showNotification('Theme changed!');
  }
  
  // Navigation
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      const page = item.getAttribute('data-page');
      document.getElementById('pageTitle').innerText = page === 'dashboard' ? 'Dashboard' : page === 'orders' ? 'Orders' : page === 'expiring' ? 'Expiring Soon' : 'Analytics';
      if (page === 'dashboard') {
        document.getElementById('chartsContainer').style.display = 'grid';
        loadAllData();
      } else if (page === 'expiring') {
        document.getElementById('chartsContainer').style.display = 'none';
        showExpiringPage();
      } else {
        document.getElementById('chartsContainer').style.display = 'none';
        applyFilters();
      }
    });
  });
  
  function logout() {
    sessionStorage.removeItem('adminLoggedIn');
    location.reload();
  }
  
  window.updateOrder = updateOrder;
  window.viewScreenshot = viewScreenshot;
  window.closeModal = closeModal;
  window.applyFilters = applyFilters;
  window.exportToCSV = exportToCSV;
  window.toggleSelectAll = toggleSelectAll;
  window.updateSelectedCount = updateSelectedCount;
  window.clearSelection = clearSelection;
  window.bulkApprove = bulkApprove;
  window.bulkReject = bulkReject;
  window.showExpiringPage = showExpiringPage;
  window.toggleTheme = toggleTheme;
  window.logout = logout;
</script>
</body>
</html>
