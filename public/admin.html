<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYTEL Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .login-container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    }
    .login-card {
      background: rgba(15,23,42,0.9);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(250,204,21,0.3);
    }
    .logo { text-align: center; margin-bottom: 2rem; }
    .logo-icon {
      width: 70px; height: 70px;
      background: linear-gradient(135deg, #facc15, #eab308);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
    }
    .logo-icon i { font-size: 2rem; color: #0f172a; }
    .logo h1 { font-size: 1.5rem; color: #facc15; }
    .input-group { margin-bottom: 1.5rem; }
    .input-field {
      position: relative;
    }
    .input-field i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
    }
    .input-field input {
      width: 100%;
      padding: 14px 16px 14px 45px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      font-size: 1rem;
      color: white;
    }
    .input-field input:focus { outline: none; border-color: #facc15; }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(95deg, #facc15, #eab308);
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    .error-message {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 1rem;
      color: #f87171;
      font-size: 0.8rem;
      text-align: center;
      display: none;
    }
    .dashboard {
      display: none;
    }
    .sidebar {
      position: fixed;
      left: 0; top: 0;
      width: 260px; height: 100%;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      border-right: 1px solid #334155;
      padding: 1.5rem;
    }
    .main-content {
      margin-left: 260px;
      padding: 1.5rem;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #1e293b;
      border-radius: 1rem;
      padding: 1rem;
      border: 1px solid #334155;
    }
    .stat-card .value {
      font-size: 1.8rem;
      font-weight: 800;
      color: #facc15;
    }
    .filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .filters select {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 8px;
      color: white;
    }
    .refresh-btn {
      background: #facc15;
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .orders-table {
      background: #1e293b;
      border-radius: 1rem;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #334155;
    }
    th { background: #0f172a; color: #facc15; }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
    }
    .status-pending { background: #f9731620; color: #f97316; }
    .status-paid { background: #3b82f620; color: #3b82f6; }
    .status-approved { background: #22c55e20; color: #22c55e; }
    .status-rejected { background: #ef444420; color: #ef4444; }
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      margin: 0 2px;
    }
    .action-approve { background: #22c55e20; color: #22c55e; }
    .action-reject { background: #ef444420; color: #ef4444; }
    .logout-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #ef4444;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      font-weight: 600;
      z-index: 1000;
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; }
    }
  </style>
</head>
<body>
  <!-- Login Section -->
  <div id="loginSection" class="login-container">
    <div class="login-card">
      <div class="logo">
        <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
        <h1>Admin Access</h1>
        <p style="color:#64748b; margin-top:0.5rem;">Enter Password to Continue</p>
      </div>
      <div class="error-message" id="errorMessage"></div>
      <div class="input-group">
        <div class="input-field">
          <i class="fas fa-lock"></i>
          <input type="password" id="adminPassword" placeholder="Enter password">
        </div>
      </div>
      <button class="login-btn" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Access Dashboard
      </button>
    </div>
  </div>

  <!-- Dashboard Section (hidden until login) -->
  <div id="dashboardSection" class="dashboard" style="display:none">
    <div class="sidebar">
      <div class="logo">✨ MYTEL ADMIN</div>
      <div class="nav-item active"><i class="fas fa-chart-line"></i> Dashboard</div>
    </div>
    <div class="main-content">
      <h1><i class="fas fa-chart-line"></i> Dashboard</h1>
      <div class="stats-grid" id="statsGrid">Loading...</div>
      <div class="filters">
        <select id="statusFilter" onchange="loadOrders()">
          <option value="all">All Orders</option>
          <option value="payment_received">💰 Paid (Approve)</option>
          <option value="approved">✅ Active</option>
          <option value="pending_payment">⏳ Pending</option>
          <option value="rejected">❌ Rejected</option>
        </select>
        <button class="refresh-btn" onclick="loadOrders()">Refresh</button>
      </div>
      <div class="orders-table" id="ordersTable">Loading orders...</div>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <script>
    const ADMIN_PASSWORD = "mytel2024";
    
    // Check if already logged in
    if (sessionStorage.getItem('adminLoggedIn') === 'true') {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboardSection').style.display = 'block';
      loadOrders();
    }
    
    // Login function
    document.getElementById('loginBtn').onclick = function() {
      const password = document.getElementById('adminPassword').value;
      const errorDiv = document.getElementById('errorMessage');
      
      if (password === ADMIN_PASSWORD) {
        sessionStorage.setItem('adminLoggedIn', 'true');
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        loadOrders();
      } else {
        errorDiv.innerText = 'Wrong password!';
        errorDiv.style.display = 'block';
        setTimeout(() => { errorDiv.style.display = 'none'; }, 2000);
      }
    };
    
    // Enter key support
    document.getElementById('adminPassword').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('loginBtn').click();
      }
    });
    
    // Dashboard functions
    async function loadOrders() {
      const status = document.getElementById('statusFilter').value;
      try {
        const res = await fetch(`/api/admin/orders?status=${status}`);
        const data = await res.json();
        if (data.success) {
          renderStats(data.stats);
          renderOrders(data.orders);
        }
      } catch(err) {
        console.error(err);
      }
    }
    
    function renderStats(stats) {
      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="value">${stats.total}</div><div>Total</div></div>
        <div class="stat-card"><div class="value">${stats.pending}</div><div>Pending</div></div>
        <div class="stat-card"><div class="value">${stats.paid}</div><div>Paid</div></div>
        <div class="stat-card"><div class="value">${stats.approved}</div><div>Active</div></div>
        <div class="stat-card"><div class="value">${(stats.revenue/1000).toFixed(0)}K</div><div>Revenue</div></div>
      `;
    }
    
    function renderOrders(orders) {
      if (!orders.length) {
        document.getElementById('ordersTable').innerHTML = '<div style="padding:2rem;text-align:center">No orders</div>';
        return;
      }
      let html = `<table><thead><tr><th>ID</th><th>Package</th><th>Phone</th><th>Price</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>`;
      orders.forEach(order => {
        let statusClass = '', statusText = '';
        if (order.status === 'pending_payment') { statusClass = 'status-pending'; statusText = 'Pending'; }
        else if (order.status === 'payment_received') { statusClass = 'status-paid'; statusText = 'Paid'; }
        else if (order.status === 'approved') { statusClass = 'status-approved'; statusText = 'Active'; }
        else if (order.status === 'rejected') { statusClass = 'status-rejected'; statusText = 'Rejected'; }
        
        html += `<tr>
          <td>#${order.id}</td>
          <td>${order.packageName}</td>
          <td>${order.phone}</td>
          <td>${order.price.toLocaleString()} KS</td>
          <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          <td>${new Date(order.createdAt).toLocaleDateString()}</td>
          <td>${order.status === 'payment_received' ? `<button class="action-btn action-approve" onclick="updateOrder(${order.id}, 'approved')">✅ Approve</button> <button class="action-btn action-reject" onclick="updateOrder(${order.id}, 'rejected')">❌ Reject</button>` : '-'}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
      document.getElementById('ordersTable').innerHTML = html;
    }
    
    async function updateOrder(orderId, status) {
      if (!confirm(`Order #${orderId} ကို ${status === 'approved' ? 'အတည်ပြုမလား' : 'ပယ်ဖျက်မလား'}`)) return;
      const res = await fetch('/api/admin/update-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId, status })
      });
      const data = await res.json();
      if (data.success) {
        alert(`Order #${orderId} ${status === 'approved' ? 'approved!' : 'rejected!'}`);
        loadOrders();
      }
    }
    
    function logout() {
      sessionStorage.removeItem('adminLoggedIn');
      location.reload();
    }
    
    setInterval(loadOrders, 30000);
  </script>
</body>
</html>
