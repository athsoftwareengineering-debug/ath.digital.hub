<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | ATH VIP DATA</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #0f172a; font-family: 'Inter', sans-serif; }
        .order-card { transition: all 0.3s ease; }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-paid { background: #dbeafe; color: #2563eb; }
        .status-approved { background: #d1fae5; color: #059669; }
        .status-rejected { background: #fee2e2; color: #dc2626; }
        .status-expired { background: #f3f4f6; color: #6b7280; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; }
        .modal.show { display: flex; }
    </style>
</head>
<body class="bg-slate-900 text-white">

<div id="loginContainer" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 rounded-2xl p-8 w-full max-w-md shadow-2xl border border-slate-700">
        <h2 class="text-2xl font-bold text-center mb-6">Admin Login</h2>
        <input type="password" id="adminPassword" placeholder="Enter Admin Password" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-yellow-500 mb-4">
        <button onclick="login()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-slate-900 font-bold py-3 rounded-xl transition">Login</button>
        <div id="loginError" class="text-red-500 text-center mt-4 hidden"></div>
    </div>
</div>

<div id="dashboardContainer" style="display:none;">
    <div class="container mx-auto p-4">
        <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
            <h1 class="text-2xl font-bold"><i class="fas fa-crown text-yellow-500"></i> ATH Admin Panel</h1>
            <div class="flex gap-3">
                <button onclick="fetchOrders()" class="bg-blue-600 hover:bg-blue-700 px-5 py-2 rounded-xl transition"><i class="fas fa-sync-alt"></i> Refresh</button>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-5 py-2 rounded-xl transition"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div id="statsBar" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8"></div>

        <div class="bg-slate-800 rounded-xl p-4 mb-6 flex flex-wrap gap-4">
            <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Search by phone or ID" class="flex-1 px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white">
            <select id="statusFilter" onchange="applyFilters()" class="px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white">
                <option value="all">All Status</option>
                <option value="pending_payment">Pending</option>
                <option value="payment_received">Paid (To Approve)</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
                <option value="expired">Expired</option>
            </select>
        </div>

        <div id="ordersContainer" class="space-y-4"></div>
    </div>
</div>

<div id="imageModal" class="modal" onclick="closeModal()">
    <div class="relative max-w-3xl p-4">
        <img id="modalImage" src="" class="max-w-full max-h-[80vh] rounded-xl">
    </div>
</div>

<script>
    let isLoggedIn = false;
    let adminToken = "";
    let allOrders = [];

    async function login() {
        const pwd = document.getElementById('adminPassword').value;
        try {
            const response = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd })
            });
            if (response.ok) {
                isLoggedIn = true;
                adminToken = pwd;
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('dashboardContainer').style.display = 'block';
                fetchOrders();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
                document.getElementById('loginError').innerText = "Wrong Password!";
            }
        } catch { alert("Server connection error"); }
    }

    function logout() {
        isLoggedIn = false; adminToken = "";
        document.getElementById('dashboardContainer').style.display = 'none';
        document.getElementById('loginContainer').style.display = 'flex';
    }

    async function fetchOrders() {
        try {
            const response = await fetch('/api/admin/orders', { headers: { 'x-admin-auth': adminToken } });
            const data = await response.json();
            if (data.success) {
                allOrders = data.orders;
                renderStats(data.stats);
                applyFilters();
            }
        } catch (err) { console.error(err); }
    }

    function renderStats(stats) {
        if (!stats) return;
        document.getElementById('statsBar').innerHTML = `
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700"><p class="text-slate-400 text-sm">📊 Total Orders</p><h3 class="text-2xl font-bold">${stats.total}</h3></div>
            <div class="bg-slate-800 p-4 rounded-xl border border-yellow-500/30"><p class="text-slate-400 text-sm">⏳ Pending</p><h3 class="text-2xl font-bold text-yellow-500">${stats.pending}</h3></div>
            <div class="bg-slate-800 p-4 rounded-xl border border-blue-500/30"><p class="text-slate-400 text-sm">💰 Paid</p><h3 class="text-2xl font-bold text-blue-500">${stats.paid}</h3></div>
            <div class="bg-slate-800 p-4 rounded-xl border border-green-500/30"><p class="text-slate-400 text-sm">✅ Active</p><h3 class="text-2xl font-bold text-green-500">${stats.approved}</h3></div>
            <div class="bg-slate-800 p-4 rounded-xl border border-red-500/30"><p class="text-slate-400 text-sm">⏰ Expired</p><h3 class="text-2xl font-bold text-red-500">${stats.expired}</h3></div>
            <div class="bg-slate-800 p-4 rounded-xl border border-purple-500/30"><p class="text-slate-400 text-sm">💵 Revenue</p><h3 class="text-2xl font-bold text-purple-500">${stats.revenue.toLocaleString()} KS</h3></div>
        `;
    }

    function applyFilters() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const status = document.getElementById('statusFilter').value;
        let filtered = allOrders.filter(o => (o.phone.includes(search) || o.id.toString().includes(search)) && (status === 'all' || o.status === status));
        renderOrders(filtered);
    }

    function renderOrders(orders) {
        const container = document.getElementById('ordersContainer');
        if (!orders.length) { container.innerHTML = '<div class="text-center text-slate-400 py-10">No orders found</div>'; return; }
        
        let html = '';
        orders.forEach(order => {
            html += `
                <div class="order-card bg-slate-800 rounded-xl p-5 border-l-4 border-yellow-500">
                    <div class="flex justify-between items-start mb-3">
                        <div><span class="font-mono text-sm bg-slate-700 px-3 py-1 rounded-lg">#${order.id}</span><span class="ml-3 text-lg font-bold">${order.packageName}</span></div>
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-slate-700">${order.status}</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-sm text-slate-300">
                        <div>📞 ${order.phone}</div><div>💰 ${order.price.toLocaleString()} KS</div><div>📅 ${order.createdAtMyanmar || order.createdAt}</div>
                    </div>
                    ${order.screenshotPath ? `<div class="mt-3"><img src="${order.screenshotPath}" class="w-20 h-20 object-cover rounded-lg cursor-pointer" onclick="showImage('${order.screenshotPath}')"></div>` : ''}
                    <div class="flex gap-2 mt-4 pt-3 border-t border-slate-700">
                        ${order.status === 'payment_received' ? `
                            <button onclick="updateOrderStatus(${order.id}, 'approved')" class="bg-green-600 px-4 py-1.5 rounded-lg text-sm font-bold">Approve</button>
                            <button onclick="promptReject(${order.id})" class="bg-red-600 px-4 py-1.5 rounded-lg text-sm font-bold">Reject</button>
                        ` : ''}
                        <button onclick="deleteOrder(${order.id})" class="bg-red-900 px-4 py-1.5 rounded-lg text-sm font-bold ml-auto">Delete</button>
                    </div>
                </div>`;
        });
        container.innerHTML = html;
    }

    async function updateOrderStatus(orderId, newStatus, rejectReason = null) {
        const res = await fetch('/api/admin/update-order', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-auth': adminToken },
            body: JSON.stringify({ orderId, status: newStatus, rejectReason })
        });
        if ((await res.json()).success) { Swal.fire('Success', 'Order Updated', 'success'); fetchOrders(); }
    }

    async function promptReject(orderId) {
        const { value: reason } = await Swal.fire({
            title: 'Reject Reason', input: 'text', inputLabel: 'ပယ်ဖျက်ရသည့် အကြောင်းရင်းကို ထည့်ပါ',
            inputPlaceholder: 'ဥပမာ - ငွေလွှဲကုဒ် မှားယွင်းနေပါသည်', showCancelButton: true
        });
        if (reason !== undefined) updateOrderStatus(orderId, 'rejected', reason || 'ငွေလွှဲ မှန်ကန်မှုမရှိပါ။');
    }

    async function deleteOrder(orderId) {
        if ((await Swal.fire({ title: 'Are you sure?', text: "Delete permanent?", icon: 'warning', showCancelButton: true })).isConfirmed) {
            const res = await fetch('/api/admin/delete-order', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-auth': adminToken }, body: JSON.stringify({ orderId }) });
            if ((await res.json()).success) { Swal.fire('Deleted', '', 'success'); fetchOrders(); }
        }
    }

    function showImage(url) { document.getElementById('modalImage').src = url; document.getElementById('imageModal').classList.add('show'); }
    function closeModal() { document.getElementById('imageModal').classList.remove('show'); }
</script>
</body>
</html>
