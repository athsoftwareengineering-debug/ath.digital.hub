<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATH DIGITAL HUB | MYTEL Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      transition: all 0.3s;
    }
    
    body.light-mode {
      background: #f1f5f9;
      color: #0f172a;
    }
    
    body.light-mode .sidebar,
    body.light-mode .stat-card,
    body.light-mode .orders-table,
    body.light-mode .login-card,
    body.light-mode .modal-content,
    body.light-mode .filters-bar,
    body.light-mode .bulk-actions,
    body.light-mode .chart-card {
      background: #ffffff;
      border-color: #e2e8f0;
    }
    
    .login-container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    }
    
    .login-card {
      background: rgba(15,23,42,0.95);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(250,204,21,0.3);
    }
    
    .logo-icon {
      width: 70px; height: 70px;
      background: linear-gradient(135deg, #facc15, #eab308);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }
    
    .logo-icon i { font-size: 2rem; color: #0f172a; animation: spin 4s linear infinite; }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .login-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(95deg, #facc15, #eab308);
      border: none; border-radius: 14px;
      font-weight: 700; font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(250,204,21,0.4); }
    
    .sidebar {
      position: fixed;
      left: 0; top: 0;
      width: 280px; height: 100%;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      border-right: 1px solid #334155;
      padding: 1.8rem;
      transition: all 0.3s;
      z-index: 100;
    }
    
    .logo {
      font-size: 1.3rem; font-weight: 800;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 2rem;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .logo i { animation: spin 4s linear infinite; color: #facc15; background: none; }
    
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      margin: 8px 0;
      border-radius: 12px;
      cursor: pointer;
      color: #94a3b8;
      transition: all 0.3s;
      font-weight: 500;
    }
    
    .nav-item:hover, .nav-item.active {
      background: #facc1520;
      color: #facc15;
    }
    .nav-item i { width: 24px; font-size: 1.1rem; }
    
    .main-content {
      margin-left: 280px;
      padding: 1.8rem;
      transition: all 0.3s;
    }
    
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .top-bar h1 { font-size: 1.6rem; font-weight: 700; }
    .top-bar h1 i { color: #facc15; margin-right: 10px; }
    
    .theme-toggle {
      background: #1e293b;
      border: none;
      padding: 10px 18px;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
    }
    .theme-toggle:hover { background: #facc15; color: #0f172a; }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2rem;
    }
    
    .stat-card {
      background: #1e293b;
      border-radius: 20px;
      padding: 1.2rem;
      border: 1px solid #334155;
      transition: all 0.3s;
    }
    .stat-card:hover { transform: translateY(-3px); border-color: #facc15; }
    .stat-card .value { font-size: 2rem; font-weight: 800; color: #facc15; }
    .stat-card .label { font-size: 0.75rem; color: #64748b; margin-top: 0.3rem; letter-spacing: 0.5px; }
    
    .charts-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .chart-card {
      background: #1e293b;
      border-radius: 20px;
      padding: 1.5rem;
      border: 1px solid #334155;
    }
    .chart-card h3 { margin-bottom: 1rem; font-size: 0.95rem; font-weight: 600; color: #94a3b8; }
    canvas { max-height: 250px; width: 100% !important; }
    
    .filters-bar {
      background: #1e293b;
      border-radius: 16px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.2rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    
    .filters-bar input, .filters-bar select {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 10px;
      color: white;
      font-size: 0.85rem;
    }
    .search-box { flex: 1; min-width: 200px; }
    .search-box input { width: 100%; }
    
    .bulk-actions {
      background: #1e293b;
      border-radius: 16px;
      padding: 0.8rem 1.2rem;
      margin-bottom: 1.2rem;
      display: none;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .bulk-actions.show { display: flex; }
    .bulk-actions button {
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    
    .expiring-alert {
      background: rgba(239,68,68,0.15);
      border: 1px solid #ef4444;
      border-radius: 14px;
      padding: 0.8rem 1.2rem;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
    }
    .expiring-alert i { color: #ef4444; font-size: 1.2rem; }
    
    .orders-table {
      background: #1e293b;
      border-radius: 20px;
      overflow-x: auto;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    
    th {
      padding: 14px 16px;
      text-align: left;
      background: #0f172a;
      color: #facc15;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }
    
    td {
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
      vertical-align: middle;
    }
    
    tr:hover td { background: rgba(250,204,21,0.05); }
    
    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      text-align: center;
      min-width: 90px;
    }
    .status-pending { background: #f9731620; color: #f97316; border: 1px solid #f97316; }
    .status-paid { background: #3b82f620; color: #3b82f6; border: 1px solid #3b82f6; }
    .status-approved { background: #22c55e20; color: #22c55e; border: 1px solid #22c55e; }
    .status-rejected { background: #ef444420; color: #ef4444; border: 1px solid #ef4444; }
    .status-expired { background: #64748b20; color: #64748b; border: 1px solid #64748b; }
    
    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      align-items: center;
    }
    .action-btn {
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .action-approve { background: #22c55e20; color: #22c55e; border: 1px solid #22c55e; }
    .action-approve:hover { background: #22c55e; color: white; transform: scale(1.02); }
    .action-reject { background: #ef444420; color: #ef4444; border: 1px solid #ef4444; }
    .action-reject:hover { background: #ef4444; color: white; transform: scale(1.02); }
    .action-view { background: #3b82f620; color: #3b82f6; border: 1px solid #3b82f6; }
    .action-view:hover { background: #3b82f6; color: white; transform: scale(1.02); }
    .action-disabled {
      color: #64748b;
      font-size: 0.7rem;
      font-style: italic;
    }
    
    .checkbox-col { width: 35px; text-align: center; }
    .checkbox-col input { transform: scale(1.1); cursor: pointer; }
    
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1e293b;
      border-radius: 24px;
      padding: 2rem;
      max-width: 600px;
      width: 90%;
      text-align: center;
    }
    .modal-content h3 { margin-bottom: 1rem; color: #facc15; }
    .modal-content img { 
      max-width: 100%; 
      max-height: 70vh;
      border-radius: 16px; 
      margin: 1rem 0;
      border: 1px solid #334155;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 1rem;
    }
    .close-modal-btn {
      padding: 10px 20px;
      background: #334155;
      border: none;
      border-radius: 40px;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }
    .download-modal-btn {
      padding: 10px 20px;
      background: #facc15;
      border: none;
      border-radius: 40px;
      color: #0f172a;
      cursor: pointer;
      font-weight: 600;
    }
    
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 24px;
      border-radius: 50px;
      z-index: 1100;
      display: none;
      animation: slideIn 0.3s ease;
      font-size: 0.85rem;
      font-weight: 500;
    }
    @keyframes slideIn {
      from { right: -300px; opacity: 0; }
      to { right: 20px; opacity: 1; }
    }
    
    .logout-btn {
      position: fixed; bottom: 20px; left: 20px;
      background: #ef4444; border: none;
      padding: 10px 20px; border-radius: 40px;
      color: white; cursor: pointer;
      font-weight: 600; z-index: 100;
      transition: all 0.3s;
    }
    .logout-btn:hover { background: #dc2626; transform: scale(1.02); }
    
    .footer-brand {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 0.7rem;
      color: #475569;
      text-align: right;
      z-index: 100;
    }
    
    .screenshot-preview {
      width: 36px;
      height: 36px;
      background: #0f172a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .screenshot-preview:hover {
      background: #facc1520;
      transform: scale(1.05);
    }
    .screenshot-preview i { font-size: 1rem; color: #3b82f6; }
    
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { margin-left: 0; }
      .logout-btn { left: auto; right: 20px; bottom: 20px; }
      .footer-brand { bottom: 80px; }
      .action-buttons { flex-direction: row; flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<!-- Login Section -->
<div id="loginSection" class="login-container">
  <div class="login-card">
    <div class="logo-icon"><i class="fas fa-globe"></i></div>
    <h1 style="text-align:center; color:#facc15; margin-bottom:0.5rem;">ATH DIGITAL HUB</h1>
    <p style="text-align:center; color:#64748b; margin-bottom:1.5rem;">Admin Access</p>
    <div id="loginError" style="color:#f87171; text-align:center; margin-bottom:1rem; display:none;"></div>
    <div style="margin-bottom:1rem;">
      <input type="password" id="adminPassword" placeholder="Enter password" style="width:100%; padding:14px 16px; background:#1e293b; border:1px solid #334155; border-radius:14px; color:white; font-size:1rem;">
    </div>
    <button class="login-btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Access Dashboard</button>
  </div>
</div>

<!-- Dashboard Section -->
<div id="dashboardSection" style="display:none">
  <div class="sidebar">
    <div class="logo"><i class="fas fa-globe"></i> ATH DIGITAL HUB</div>
    <div class="nav-item active" data-page="dashboard"><i class="fas fa-chart-line"></i> Dashboard</div>
    <div class="nav-item" data-page="orders"><i class="fas fa-box"></i> Orders</div>
    <div class="nav-item" data-page="expiring"><i class="fas fa-clock"></i> Expiring Soon</div>
    <div class="nav-item" data-page="analytics"><i class="fas fa-chart-bar"></i> Analytics</div>
  </div>
  
  <div class="main-content">
    <div class="top-bar">
      <h1><i class="fas fa-chart-line"></i> <span id="pageTitle">Dashboard</span></h1>
      <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i> Dark / Light</button>
    </div>
    
    <div class="stats-grid" id="statsGrid">Loading...</div>
    
    <div id="expiringAlert" class="expiring-alert" style="display:none" onclick="showExpiringPage()">
      <i class="fas fa-exclamation-triangle"></i>
      <span id="expiringText">Orders expiring soon!</span>
    </div>
    
    <div class="charts-container" id="chartsContainer">
      <div class="chart-card"><h3>📊 Daily Orders (Last 7 Days)</h3><canvas id="dailyChart"></canvas></div>
      <div class="chart-card"><h3>💰 Revenue by Package</h3><canvas id="packageChart"></canvas></div>
    </div>
    
    <div class="filters-bar">
      <div class="search-box">
        <input type="text" id="searchPhone" placeholder="🔍 Search by phone number...">
      </div>
      <input type="date" id="startDate" placeholder="Start Date">
      <input type="date" id="endDate" placeholder="End Date">
      <select id="statusFilter">
        <option value="all">📋 All Status</option>
        <option value="pending_payment">⏳ Pending</option>
        <option value="payment_received">💰 Paid</option>
        <option value="approved">✅ Active</option>
        <option value="rejected">❌ Rejected</option>
        <option value="expired">⏰ Expired</option>
      </select>
      <button onclick="applyFilters()" style="background:#facc15; color:#0f172a; border:none; padding:8px 18px; border-radius:40px; cursor:pointer; font-weight:600;">Apply</button>
      <button onclick="exportToCSV()" style="background:#22c55e; color:white; border:none; padding:8px 18px; border-radius:40px; cursor:pointer; font-weight:600;"><i class="fas fa-download"></i> Export</button>
    </div>
    
    <div class="bulk-actions" id="bulkActions">
      <span id="selectedCount" style="font-size:0.85rem;">0 selected</span>
      <button onclick="bulkApprove()" style="background:#22c55e20; color:#22c55e; border:1px solid #22c55e;"><i class="fas fa-check"></i> Approve Selected</button>
      <button onclick="bulkReject()" style="background:#ef444420; color:#ef4444; border:1px solid #ef4444;"><i class="fas fa-times"></i> Reject Selected</button>
      <button onclick="clearSelection()" style="background:#64748b20; color:#64748b; border:1px solid #64748b;">Cancel</button>
    </div>
    
    <div class="orders-table" id="ordersTable">Loading orders...</div>
  </div>
  
  <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
  <div class="footer-brand">
    <i class="fas fa-globe"></i> ATH DIGITAL HUB<br>
    © Developed by AUNG THU HTWE
  </div>
</div>

<!-- Screenshot Modal -->
<div id="screenshotModal" class="modal">
  <div class="modal-content">
    <h3><i class="fas fa-image"></i> Payment Screenshot</h3>
    <img id="screenshotImg" src="" alt="Screenshot">
    <div class="modal-buttons">
      <button class="download-modal-btn" id="downloadScreenshotBtn"><i class="fas fa-download"></i> Download</button>
      <button class="close-modal-btn" onclick="closeModal()"><i class="fas fa-times"></i> Close</button>
    </div>
  </div>
</div>

<script>
  const ADMIN_PASSWORD = "mytel2024";
  let allOrders = [];
  let selectedOrders = new Set();
  let dailyChart, packageChart;
  let currentScreenshotUrl = null;
  
  function formatEnglishDate(dateString) {
    if (!dateString) return 'N/A';
    const date = new Date(dateString);
    if (isNaN(date.getTime())) return dateString;
    return date.toLocaleString('en-US', {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: true
    });
  }
  
  if (sessionStorage.getItem('adminLoggedIn') === 'true') {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('dashboardSection').style.display = 'block';
    loadAllData();
  }
  
  document.getElementById('loginBtn').onclick = function() {
    const password = document.getElementById('adminPassword').value;
    if (password === ADMIN_PASSWORD) {
      sessionStorage.setItem('adminLoggedIn', 'true');
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboardSection').style.display = 'block';
      loadAllData();
    } else {
      const err = document.getElementById('loginError');
      err.innerText = 'Wrong password!';
      err.style.display = 'block';
      setTimeout(() => err.style.display = 'none', 2000);
    }
  };
  
  async function loadAllData() {
    await loadOrders();
    loadCharts();
    checkExpiringSoon();
    startNotificationCheck();
  }
  
  async function loadOrders() {
    try {
      const res = await fetch('/api/admin/orders?status=all', {
        headers: { 'x-admin-auth': ADMIN_PASSWORD }
      });
      const data = await res.json();
      if (data.success) {
        allOrders = data.orders;
        renderStats(data.stats);
        applyFilters();
      }
    } catch(err) { console.error(err); }
  }
  
  function renderStats(stats) {
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><div class="value">${stats.total}</div><div class="label">Total Orders</div></div>
      <div class="stat-card"><div class="value">${stats.pending}</div><div class="label">Pending</div></div>
      <div class="stat-card"><div class="value">${stats.paid}</div><div class="label">Paid</div></div>
      <div class="stat-card"><div class="value">${stats.approved}</div><div class="label">Active</div></div>
      <div class="stat-card"><div class="value">${stats.expired}</div><div class="label">Expired</div></div>
      <div class="stat-card"><div class="value">${(stats.revenue/1000).toFixed(0)}K</div><div class="label">Revenue (KS)</div></div>
    `;
  }
  
  function applyFilters() {
    const searchPhone = document.getElementById('searchPhone').value.toLowerCase();
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    const status = document.getElementById('statusFilter').value;
    
    let filtered = [...allOrders];
    if (searchPhone) filtered = filtered.filter(o => o.phone.includes(searchPhone));
    if (status !== 'all') filtered = filtered.filter(o => o.status === status);
    if (startDate) filtered = filtered.filter(o => new Date(o.createdAt) >= new Date(startDate));
    if (endDate) filtered = filtered.filter(o => new Date(o.createdAt) <= new Date(endDate));
    
    renderOrders(filtered);
  }
  
  function renderOrders(orders) {
    if (!orders.length) {
      document.getElementById('ordersTable').innerHTML = '<div style="padding:3rem; text-align:center; color:#64748b;">📭 No orders found</div>';
      return;
    }
    
    let html = `<table><thead><tr>
      <th class="checkbox-col"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
      <th>ID</th>
      <th>Package</th>
      <th>Phone</th>
      <th>Price</th>
      <th>Status</th>
      <th>Date</th>
      <th>SS</th>
      <th>Action</th>
    </tr></thead><tbody>`;
    
    orders.forEach(order => {
      let statusClass = '', statusText = '';
      switch(order.status) {
        case 'pending_payment': statusClass = 'status-pending'; statusText = '⏳ Pending'; break;
        case 'payment_received': statusClass = 'status-paid'; statusText = '💰 Paid'; break;
        case 'approved': statusClass = 'status-approved'; statusText = '✅ Active'; break;
        case 'rejected': statusClass = 'status-rejected'; statusText = '❌ Rejected'; break;
        case 'expired': statusClass = 'status-expired'; statusText = '⏰ Expired'; break;
      }
      
      const formattedDate = formatEnglishDate(order.createdAt);
      
      html += `<tr>
        <td class="checkbox-col"><input type="checkbox" class="order-checkbox" value="${order.id}" onchange="updateSelectedCount()"></td>
        <td><strong>#${order.id}</strong></td>
        <td>${order.packageName}</td>
        <td>${order.phone}</td>
        <td>${order.price.toLocaleString()} KS</td>
        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
        <td style="font-size:0.8rem;">${formattedDate}</td>
        <td><div class="screenshot-preview" onclick="viewScreenshot(${order.id})" title="View Screenshot">
          <i class="fas fa-image"></i>
        </div></td>
        <td class="action-buttons">`;
      
      if (order.status === 'payment_received') {
        html += `<button class="action-btn action-approve" onclick="updateOrder(${order.id}, 'approved')"><i class="fas fa-check"></i> Approve</button>
                 <button class="action-btn action-reject" onclick="updateOrder(${order.id}, 'rejected')"><i class="fas fa-times"></i> Reject</button>`;
      } else {
        html += `<span class="action-disabled">-</span>`;
      }
      
      html += `</td></tr>`;
    });
    
    html += `</tbody></table>`;
    document.getElementById('ordersTable').innerHTML = html;
  }
  
  function toggleSelectAll() {
    const selectAll = document.getElementById('selectAll');
    const checkboxes = document.querySelectorAll('.order-checkbox');
    checkboxes.forEach(cb => cb.checked = selectAll.checked);
    updateSelectedCount();
  }
  
  function updateSelectedCount() {
    const checkboxes = document.querySelectorAll('.order-checkbox:checked');
    selectedOrders.clear();
    checkboxes.forEach(cb => selectedOrders.add(parseInt(cb.value)));
    const bulkDiv = document.getElementById('bulkActions');
    if (selectedOrders.size > 0) {
      bulkDiv.classList.add('show');
      document.getElementById('selectedCount').innerText = `${selectedOrders.size} selected`;
    } else {
      bulkDiv.classList.remove('show');
    }
  }
  
  function clearSelection() {
    document.querySelectorAll('.order-checkbox').forEach(cb => cb.checked = false);
    updateSelectedCount();
    if (document.getElementById('selectAll')) document.getElementById('selectAll').checked = false;
  }
  
  async function bulkApprove() {
    if (!confirm(`Approve ${selectedOrders.size} orders? 30 days countdown will start.`)) return;
    for (let id of selectedOrders) {
      await updateOrder(id, 'approved', false);
    }
    showNotification(`✅ ${selectedOrders.size} orders approved!`);
    loadOrders();
    clearSelection();
  }
  
  async function bulkReject() {
    if (!confirm(`Reject ${selectedOrders.size} orders?`)) return;
    for (let id of selectedOrders) {
      await updateOrder(id, 'rejected', false);
    }
    showNotification(`❌ ${selectedOrders.size} orders rejected!`);
    loadOrders();
    clearSelection();
  }
  
  async function updateOrder(orderId, status, showMsg = true) {
    try {
      const res = await fetch('/api/admin/update-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-auth': ADMIN_PASSWORD },
        body: JSON.stringify({ orderId, status })
      });
      const data = await res.json();
      if (data.success && showMsg) {
        showNotification(`Order #${orderId} ${status === 'approved' ? 'approved! 30 days started.' : 'rejected.'}`);
        loadOrders();
      }
      return data.success;
    } catch(err) { return false; }
  }
  
  async function viewScreenshot(orderId) {
    showNotification('Loading screenshot...', 'info');
    try {
      const res = await fetch(`/api/admin/order-screenshot?orderId=${orderId}`, {
        headers: { 'x-admin-auth': ADMIN_PASSWORD }
      });
      const data = await res.json();
      if (data.success && data.screenshotUrl) {
        currentScreenshotUrl = data.screenshotUrl;
        document.getElementById('screenshotImg').src = currentScreenshotUrl;
        document.getElementById('screenshotModal').style.display = 'flex';
      } else {
        showNotification('No screenshot available for this order', 'error');
      }
    } catch(err) {
      showNotification('Failed to load screenshot', 'error');
    }
  }
  
  function downloadScreenshot() {
    if (currentScreenshotUrl) {
      const a = document.createElement('a');
      a.href = currentScreenshotUrl;
      a.download = `screenshot_${new Date().getTime()}.jpg`;
      a.click();
      showNotification('Downloading screenshot...', 'success');
    } else {
      showNotification('No screenshot to download', 'error');
    }
  }
  
  function closeModal() {
    document.getElementById('screenshotModal').style.display = 'none';
    currentScreenshotUrl = null;
  }
  
  document.getElementById('downloadScreenshotBtn').onclick = downloadScreenshot;
  
  function exportToCSV() {
    const searchPhone = document.getElementById('searchPhone').value;
    const status = document.getElementById('statusFilter').value;
    
    let filtered = [...allOrders];
    if (searchPhone) filtered = filtered.filter(o => o.phone.includes(searchPhone));
    if (status !== 'all') filtered = filtered.filter(o => o.status === status);
    
    const headers = ['Order ID', 'Package', 'Phone', 'Price (KS)', 'Status', 'Order Date', 'Start Date', 'End Date'];
    const rows = filtered.map(o => [
      o.id, o.packageName, o.phone, o.price,
      o.status === 'pending_payment' ? 'Pending' : o.status === 'payment_received' ? 'Paid' : o.status === 'approved' ? 'Active' : o.status === 'rejected' ? 'Rejected' : 'Expired',
      formatEnglishDate(o.createdAt),
      o.startDate ? formatEnglishDate(o.startDate) : '',
      o.endDate ? formatEnglishDate(o.endDate) : ''
    ]);
    
    const csvContent = [headers, ...rows].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `orders_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showNotification('CSV exported successfully!');
  }
  
  async function loadCharts() {
    const res = await fetch('/api/admin/orders?status=all', {
      headers: { 'x-admin-auth': ADMIN_PASSWORD }
    });
    const data = await res.json();
    if (data.success) {
      const orders = data.orders;
      
      const last7Days = [];
      const dailyCounts = [];
      for (let i = 6; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        const dateStr = date.toISOString().split('T')[0];
        last7Days.push(dateStr);
        const count = orders.filter(o => o.createdAt.startsWith(dateStr)).length;
        dailyCounts.push(count);
      }
      
      if (dailyChart) dailyChart.destroy();
      const ctx1 = document.getElementById('dailyChart').getContext('2d');
      dailyChart = new Chart(ctx1, {
        type: 'line',
        data: { labels: last7Days, datasets: [{ label: 'Orders', data: dailyCounts, borderColor: '#facc15', backgroundColor: '#facc1520', fill: true, tension: 0.4 }] },
        options: { responsive: true, maintainAspectRatio: true }
      });
      
      const packageRevenue = {};
      orders.forEach(o => {
        if (o.status === 'approved') {
          packageRevenue[o.packageName] = (packageRevenue[o.packageName] || 0) + o.price;
        }
      });
      
      if (packageChart) packageChart.destroy();
      const ctx2 = document.getElementById('packageChart').getContext('2d');
      packageChart = new Chart(ctx2, {
        type: 'bar',
        data: { labels: Object.keys(packageRevenue), datasets: [{ label: 'Revenue (KS)', data: Object.values(packageRevenue), backgroundColor: '#facc15', borderRadius: 8 }] },
        options: { responsive: true, maintainAspectRatio: true }
      });
    }
  }
  
  function checkExpiringSoon() {
    const expiringOrders = allOrders.filter(o => o.status === 'approved' && o.daysRemaining <= 5 && o.daysRemaining > 0);
    if (expiringOrders.length > 0) {
      document.getElementById('expiringAlert').style.display = 'flex';
      document.getElementById('expiringText').innerHTML = `⚠️ ${expiringOrders.length} order(s) expiring within ${Math.min(...expiringOrders.map(o => o.daysRemaining))} days!`;
    } else {
      document.getElementById('expiringAlert').style.display = 'none';
    }
  }
  
  function showExpiringPage() {
    const expiringOrders = allOrders.filter(o => o.status === 'approved' && o.daysRemaining <= 5 && o.daysRemaining > 0);
    renderOrders(expiringOrders);
    document.getElementById('pageTitle').innerText = 'Expiring Soon';
    showNotification(`Found ${expiringOrders.length} orders expiring soon`, 'info');
  }
  
  let lastOrderCount = 0;
  function startNotificationCheck() {
    setInterval(async () => {
      const res = await fetch('/api/admin/orders?status=all', {
        headers: { 'x-admin-auth': ADMIN_PASSWORD }
      });
      const data = await res.json();
      if (data.success && data.orders.length > lastOrderCount && lastOrderCount > 0) {
        showNotification(`🆕 New order received! Total: ${data.orders.length} orders`, 'success');
      }
      lastOrderCount = data.orders.length;
    }, 30000);
  }
  
  function showNotification(msg, type = 'success') {
    const notif = document.createElement('div');
    notif.className = 'notification';
    notif.style.background = type === 'error' ? '#ef4444' : type === 'info' ? '#3b82f6' : '#22c55e';
    notif.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : type === 'info' ? 'info-circle' : 'check-circle'}"></i> ${msg}`;
    document.body.appendChild(notif);
    notif.style.display = 'block';
    setTimeout(() => notif.remove(), 3000);
  }
  
  function toggleTheme() {
    document.body.classList.toggle('light-mode');
    showNotification('Theme changed!');
  }
  
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      const page = item.getAttribute('data-page');
      document.getElementById('pageTitle').innerText = page === 'dashboard' ? 'Dashboard' : page === 'orders' ? 'Orders' : page === 'expiring' ? 'Expiring Soon' : 'Analytics';
      if (page === 'dashboard') {
        document.getElementById('chartsContainer').style.display = 'grid';
        loadAllData();
      } else if (page === 'expiring') {
        document.getElementById('chartsContainer').style.display = 'none';
        showExpiringPage();
      } else {
        document.getElementById('chartsContainer').style.display = 'none';
        applyFilters();
      }
    });
  });
  
  function logout() {
    sessionStorage.removeItem('adminLoggedIn');
    location.reload();
  }
  
  window.updateOrder = updateOrder;
  window.viewScreenshot = viewScreenshot;
  window.closeModal = closeModal;
  window.applyFilters = applyFilters;
  window.exportToCSV = exportToCSV;
  window.toggleSelectAll = toggleSelectAll;
  window.updateSelectedCount = updateSelectedCount;
  window.clearSelection = clearSelection;
  window.bulkApprove = bulkApprove;
  window.bulkReject = bulkReject;
  window.showExpiringPage = showExpiringPage;
  window.toggleTheme = toggleTheme;
  window.logout = logout;
</script>
</body>
</html>
