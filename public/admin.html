<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ATH VIP Admin | Premium Dashboard</title>
    <!-- Tailwind + Font Awesome + Google Fonts + Chart.js -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: radial-gradient(circle at 10% 20%, #0a0f1e, #030614); }
        .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 215, 0, 0.15); }
        .order-card { transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1); border-left: 4px solid #fbbf24; }
        .order-card:hover { transform: translateY(-3px); box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5); background: #1e293b; }
        .stat-card { transition: 0.2s; border-bottom: 2px solid transparent; }
        .stat-card:hover { border-bottom-color: #fbbf24; transform: translateY(-2px); }
        .badge { backdrop-filter: blur(4px); font-weight: 600; letter-spacing: 0.3px; }
        .modal-custom { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(8px); }
        .modal-custom.show { display: flex; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #fbbf24; border-radius: 8px; }
        .animate-pulse-gold { animation: pulseGold 1.8s infinite; }
        @keyframes pulseGold { 0% { border-color: #fbbf2440; } 50% { border-color: #fbbf24cc; } 100% { border-color: #fbbf2440; } }
    </style>
</head>
<body class="text-white antialiased">

<!-- LOGIN SCREEN - Premium -->
<div id="loginContainer" class="min-h-screen flex items-center justify-center p-5">
    <div class="relative w-full max-w-md">
        <div class="absolute -top-10 -left-10 w-40 h-40 bg-yellow-500/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-8 -right-8 w-48 h-48 bg-purple-600/20 rounded-full blur-3xl"></div>
        <div class="relative glass-card rounded-2xl p-8 shadow-2xl border border-yellow-500/30">
            <div class="text-center mb-6">
                <i class="fas fa-crown text-5xl text-yellow-500 mb-2"></i>
                <h2 class="text-3xl font-extrabold bg-gradient-to-r from-yellow-400 to-yellow-600 bg-clip-text text-transparent">ATH ADMIN</h2>
                <p class="text-slate-400 text-sm mt-1">VIP Data Management Portal</p>
            </div>
            <div class="space-y-4">
                <div class="relative">
                    <i class="fas fa-lock absolute left-4 top-4 text-slate-500"></i>
                    <input type="password" id="adminPassword" placeholder="Enter master password" class="w-full pl-11 pr-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-yellow-500 transition">
                </div>
                <button onclick="login()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-900 font-bold py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2"><i class="fas fa-key"></i> Authenticate</button>
                <div id="loginError" class="text-red-400 text-sm text-center hidden"></div>
            </div>
        </div>
    </div>
</div>

<!-- MAIN DASHBOARD -->
<div id="dashboardContainer" style="display:none;">
    <div class="container mx-auto px-4 py-5 max-w-7xl">
        <!-- header -->
        <div class="flex flex-wrap justify-between items-center mb-8 gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-yellow-500 to-amber-600 p-2 rounded-xl shadow-xl">
                    <i class="fas fa-chart-line text-2xl text-slate-900"></i>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight"><span class="text-yellow-400">ATH</span> Admin Panel</h1>
                    <div class="flex items-center gap-2 text-xs text-slate-400"><i class="fas fa-database"></i> Live DB | <span id="liveClock">--:--:--</span></div>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="fetchOrders()" class="bg-slate-800 hover:bg-slate-700 px-5 py-2 rounded-xl transition flex items-center gap-2 border border-slate-600"><i class="fas fa-sync-alt"></i> Refresh</button>
                <button onclick="logout()" class="bg-red-900/40 hover:bg-red-700 px-5 py-2 rounded-xl transition flex items-center gap-2 border border-red-700/50"><i class="fas fa-sign-out-alt"></i> Exit</button>
            </div>
        </div>

        <!-- stats cards + chart row -->
        <div class="grid lg:grid-cols-3 gap-6 mb-8">
            <div class="lg:col-span-2">
                <div id="statsBar" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
            </div>
            <div class="glass-card rounded-2xl p-4 border border-slate-700">
                <h3 class="text-sm font-semibold text-slate-300 flex items-center gap-2"><i class="fas fa-chart-pie text-yellow-500"></i> Order distribution</h3>
                <canvas id="statusChart" height="150" width="250" style="max-height: 160px; width:100%"></canvas>
            </div>
        </div>

        <!-- filters & search bar -->
        <div class="glass-card rounded-2xl p-5 mb-7 flex flex-wrap gap-4 items-center">
            <div class="relative flex-1 min-w-[200px]">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Search by phone or Order ID" class="w-full pl-11 pr-4 py-3 bg-slate-900/70 border border-slate-700 rounded-xl text-white focus:border-yellow-500 transition">
            </div>
            <div class="w-48">
                <select id="statusFilter" onchange="applyFilters()" class="w-full px-4 py-3 bg-slate-900/70 border border-slate-700 rounded-xl text-white cursor-pointer focus:border-yellow-500">
                    <option value="all">📋 All status</option>
                    <option value="pending_payment">⏳ Pending</option>
                    <option value="payment_received">💸 Paid (to approve)</option>
                    <option value="approved">✅ Approved / Active</option>
                    <option value="rejected">❌ Rejected</option>
                    <option value="expired">⌛ Expired</option>
                </select>
            </div>
            <div class="text-slate-400 text-sm bg-slate-800/50 px-4 py-2 rounded-xl"><i class="fas fa-chart-simple"></i> <span id="resultCount">0</span> entries</div>
        </div>

        <!-- orders container (dynamic cards) -->
        <div id="ordersContainer" class="space-y-4 pb-10"></div>
    </div>
</div>

<!-- modal for image preview -->
<div id="imageModal" class="modal-custom" onclick="closeModal()">
    <div class="relative max-w-3xl p-4" onclick="event.stopPropagation()">
        <img id="modalImage" src="" class="max-w-full max-h-[85vh] rounded-2xl shadow-2xl border-2 border-yellow-500/50">
        <button onclick="closeModal()" class="absolute -top-3 -right-3 bg-slate-800 rounded-full p-2 w-8 h-8 flex items-center justify-center text-white hover:bg-red-600"><i class="fas fa-times"></i></button>
    </div>
</div>

<script>
    // ======================== GLOBALS ========================
    let adminToken = "";
    let allOrders = [];
    let chartInstance = null;

    // clock update (myanmar time visual)
    function updateClock() {
        const now = new Date();
        const myanmarTime = new Date(now.getTime() + (6.5 * 60 * 60 * 1000));
        const formatted = myanmarTime.toISOString().slice(11,19);
        document.getElementById('liveClock') && (document.getElementById('liveClock').innerText = formatted);
    }
    setInterval(updateClock, 1000);

    // LOGIN with backend
    async function login() {
        const pwd = document.getElementById('adminPassword').value.trim();
        if (!pwd) {
            Swal.fire({ icon: 'warning', text: 'Enter admin password', background: '#1e293b', color: '#fff' });
            return;
        }
        try {
            const response = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd })
            });
            const data = await response.json();
            if (data.success) {
                adminToken = pwd;
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('dashboardContainer').style.display = 'block';
                fetchOrders();
                Swal.fire({ icon: 'success', title: 'Welcome back', text: 'VIP Admin access granted', background: '#1e293b', color: '#fff', toast: true, timer: 1800, showConfirmButton: false });
            } else {
                document.getElementById('loginError').classList.remove('hidden');
                document.getElementById('loginError').innerText = "❌ Access Denied: Invalid credentials";
            }
        } catch (err) {
            Swal.fire({ icon: 'error', title: 'Server error', text: 'Cannot connect to backend API', background: '#1e293b' });
        }
    }

    function logout() {
        adminToken = "";
        document.getElementById('dashboardContainer').style.display = 'none';
        document.getElementById('loginContainer').style.display = 'flex';
        document.getElementById('adminPassword').value = '';
    }

    // fetch orders & stats from real DB
    async function fetchOrders() {
        if (!adminToken) return;
        try {
            const response = await fetch('/api/admin/orders', {
                headers: { 'x-admin-auth': adminToken }
            });
            const data = await response.json();
            if (data.success) {
                allOrders = data.orders;
                renderStats(data.stats);
                updateChart(data.stats);
                applyFilters();
            } else {
                Swal.fire({ icon: 'error', text: data.message || 'Session expired?', background: '#1e293b' });
                if (data.message === 'Unauthorized') logout();
            }
        } catch (err) { console.error(err); Swal.fire({ icon: 'error', title: 'Network error', text: 'Check server connection', background: '#1e293b' }); }
    }

    function renderStats(stats) {
        if (!stats) return;
        document.getElementById('statsBar').innerHTML = `
            <div class="stat-card glass-card rounded-xl p-4 border-l-4 border-yellow-500"><div class="flex justify-between"><span class="text-slate-300 text-sm">📦 Total Orders</span><i class="fas fa-boxes text-slate-500"></i></div><h3 class="text-2xl font-bold mt-1">${stats.total}</h3></div>
            <div class="stat-card glass-card rounded-xl p-4 border-l-4 border-amber-500"><div class="flex justify-between"><span class="text-slate-300 text-sm">⏳ Pending</span><i class="fas fa-hourglass-half text-amber-400"></i></div><h3 class="text-2xl font-bold text-amber-400 mt-1">${stats.pending}</h3></div>
            <div class="stat-card glass-card rounded-xl p-4 border-l-4 border-blue-500"><div class="flex justify-between"><span class="text-slate-300 text-sm">💰 Paid (to verify)</span><i class="fas fa-hand-holding-usd text-blue-400"></i></div><h3 class="text-2xl font-bold text-blue-400 mt-1">${stats.paid}</h3></div>
            <div class="stat-card glass-card rounded-xl p-4 border-l-4 border-emerald-500"><div class="flex justify-between"><span class="text-slate-300 text-sm">✅ Active</span><i class="fas fa-check-circle text-emerald-400"></i></div><h3 class="text-2xl font-bold text-emerald-400 mt-1">${stats.approved}</h3></div>
            <div class="stat-card glass-card rounded-xl p-4 border-l-4 border-rose-500"><div class="flex justify-between"><span class="text-slate-300 text-sm">⌛ Expired</span><i class="fas fa-calendar-times text-rose-400"></i></div><h3 class="text-2xl font-bold text-rose-400 mt-1">${stats.expired}</h3></div>
            <div class="stat-card glass-card rounded-xl p-4 border-l-4 border-purple-500"><div class="flex justify-between"><span class="text-slate-300 text-sm">💵 Total Revenue</span><i class="fas fa-coins text-purple-400"></i></div><h3 class="text-2xl font-bold text-purple-300 mt-1">${stats.revenue.toLocaleString()} KS</h3></div>
        `;
    }

    function updateChart(stats) {
        const ctx = document.getElementById('statusChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['Pending', 'Paid', 'Approved', 'Rejected', 'Expired'], datasets: [{ data: [stats.pending, stats.paid, stats.approved, stats.rejected || 0, stats.expired], backgroundColor: ['#f59e0b', '#3b82f6', '#10b981', '#ef4444', '#6b7280'], borderWidth: 0, hoverOffset: 8 }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1', font: { size: 10 } } } } }
        });
    }

    function applyFilters() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const status = document.getElementById('statusFilter').value;
        let filtered = allOrders.filter(o => (o.phone.includes(search) || o.id.toString().includes(search)) && (status === 'all' || o.status === status));
        document.getElementById('resultCount').innerText = filtered.length;
        renderOrders(filtered);
    }

    function renderOrders(orders) {
        const container = document.getElementById('ordersContainer');
        if (!orders.length) {
            container.innerHTML = `<div class="glass-card rounded-2xl py-16 text-center text-slate-400"><i class="fas fa-inbox text-4xl mb-3 opacity-40"></i><p>No orders match criteria</p></div>`;
            return;
        }
        let html = '';
        orders.forEach(order => {
            const statusBadgeColor = {
                'pending_payment': 'bg-amber-900/50 text-amber-300 border-amber-600',
                'payment_received': 'bg-blue-900/50 text-blue-300 border-blue-600',
                'approved': 'bg-emerald-900/50 text-emerald-300 border-emerald-600',
                'rejected': 'bg-red-900/50 text-red-300 border-red-600',
                'expired': 'bg-slate-700/60 text-slate-300 border-slate-500'
            }[order.status] || 'bg-slate-700 text-slate-300';
            
            const statusDisplay = {
                'pending_payment': '⏳ Pending Payment',
                'payment_received': '💸 Paid / Review',
                'approved': '✅ Active',
                'rejected': '❌ Rejected',
                'expired': '⌛ Expired'
            }[order.status] || order.status;

            const rejectReasonHtml = order.rejectReason ? `<div class="mt-2 text-xs bg-red-950/40 p-2 rounded-lg text-red-300"><i class="fas fa-ban mr-1"></i> Reason: ${escapeHtml(order.rejectReason)}</div>` : '';
            const screenshotHtml = order.screenshotPath ? `<div class="cursor-pointer transition hover:scale-105" onclick="showImage('${order.screenshotPath}')"><img src="${order.screenshotPath}" class="w-14 h-14 object-cover rounded-lg border border-yellow-500/40 shadow-md"></div>` : `<div class="w-14 h-14 bg-slate-700/50 rounded-lg flex items-center justify-center text-slate-500"><i class="fas fa-receipt"></i></div>`;
            
            html += `
                <div class="order-card glass-card rounded-2xl p-5 transition-all bg-slate-800/60 border border-slate-700">
                    <div class="flex flex-wrap justify-between items-start gap-3">
                        <div class="flex items-center gap-3 flex-wrap">
                            <span class="font-mono text-sm bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-600"><i class="far fa-hashtag text-yellow-400"></i> ${order.id}</span>
                            <span class="text-lg font-bold tracking-wide">📦 ${escapeHtml(order.packageName)}</span>
                            <span class="px-3 py-1 rounded-full text-xs font-bold border ${statusBadgeColor} badge">${statusDisplay}</span>
                        </div>
                        <div class="text-slate-400 text-xs flex gap-3"><i class="far fa-clock"></i> ${order.createdAtMyanmar || order.createdAt}</div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-4 text-sm">
                        <div class="flex items-center gap-2"><i class="fas fa-phone-alt text-yellow-500 w-5"></i> <span class="font-mono">${order.phone}</span></div>
                        <div class="flex items-center gap-2"><i class="fas fa-money-bill-wave text-green-400 w-5"></i> <span class="font-bold text-green-300">${parseInt(order.price).toLocaleString()} KS</span></div>
                        <div class="flex items-center gap-2"><i class="fas fa-layer-group text-slate-400 w-5"></i> IP Level: ${order.ipLevel || 'VIP'}</div>
                    </div>
                    ${rejectReasonHtml}
                    <div class="flex justify-between items-center mt-4 pt-3 border-t border-slate-700/60">
                        <div class="flex gap-3 items-center">
                            ${screenshotHtml}
                            <span class="text-xs text-slate-400"><i class="far fa-image"></i> payment proof</span>
                        </div>
                        <div class="flex gap-2">
                            ${order.status === 'payment_received' ? `
                                <button onclick="updateOrderStatus(${order.id}, 'approved')" class="bg-emerald-600 hover:bg-emerald-500 px-5 py-2 rounded-xl text-sm font-bold shadow-md transition flex items-center gap-1"><i class="fas fa-check-circle"></i> Approve</button>
                                <button onclick="promptReject(${order.id})" class="bg-rose-600/80 hover:bg-rose-600 px-5 py-2 rounded-xl text-sm font-bold transition flex items-center gap-1"><i class="fas fa-times-circle"></i> Reject</button>
                            ` : ''}
                            <button onclick="deleteOrder(${order.id})" class="bg-slate-700 hover:bg-red-800 px-5 py-2 rounded-xl text-sm font-bold transition flex items-center gap-1"><i class="fas fa-trash-alt"></i> Delete</button>
                        </div>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    async function updateOrderStatus(orderId, newStatus, rejectReason = null) {
        try {
            const response = await fetch('/api/admin/update-order', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-auth': adminToken },
                body: JSON.stringify({ orderId, status: newStatus, rejectReason })
            });
            const data = await response.json();
            if (data.success) {
                Swal.fire({ icon: 'success', title: 'Updated', text: `Order #${orderId} status changed to ${newStatus}`, background: '#1e293b', toast: true, timer: 2000, showConfirmButton: false });
                fetchOrders();
            } else {
                Swal.fire({ icon: 'error', text: data.message || 'Operation failed', background: '#1e293b' });
            }
        } catch (err) { Swal.fire({ icon: 'error', text: 'Server error', background: '#1e293b' }); }
    }

    async function promptReject(orderId) {
        const { value: reason } = await Swal.fire({
            title: 'Rejection reason',
            input: 'text', inputLabel: 'Why reject this order? (will be shown to user)',
            inputPlaceholder: 'E.g., Payment proof mismatch or incorrect amount',
            showCancelButton: true, confirmButtonColor: '#e11d48',
            background: '#1e293b', color: '#fff'
        });
        if (reason !== undefined) {
            const finalReason = reason.trim() || 'Payment verification failed.';
            updateOrderStatus(orderId, 'rejected', finalReason);
        }
    }

    async function deleteOrder(orderId) {
        const confirm = await Swal.fire({ title: '⚠️ Permanent deletion', text: `Delete order #${orderId}? This action cannot be undone.`, icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc2626', background: '#1e293b' });
        if (confirm.isConfirmed) {
            try {
                const response = await fetch('/api/admin/delete-order', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-auth': adminToken }, body: JSON.stringify({ orderId }) });
                const data = await response.json();
                if (data.success) { Swal.fire('Deleted!', '', 'success'); fetchOrders(); } 
                else Swal.fire({ icon: 'error', text: data.message });
            } catch { Swal.fire('Error', 'Cannot connect', 'error'); }
        }
    }

    function showImage(url) { document.getElementById('modalImage').src = url; document.getElementById('imageModal').classList.add('show'); }
    function closeModal() { document.getElementById('imageModal').classList.remove('show'); }

    // Check session on load, but token empty at first
    window.onload = () => { updateClock(); };
</script>
</body>
</html>
