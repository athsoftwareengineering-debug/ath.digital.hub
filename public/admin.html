    <script>
        // ================================================================
        //  MAIN ADMIN SCRIPT
        // ================================================================

        (function() {
            'use strict';

            const API_BASE = window.location.origin;
            let token = localStorage.getItem('adminToken');
            let allOrders = [];
            let userStats = [];
            let products = [];
            let allAds = [];
            let autoSyncInterval = null;
            let activeCountdowns = {};
            let currentSearchPhone = '';
            let currentUserSearchPhone = '';
            let currentTab = 'menu';
            let editingProductId = null;
            let editingAdId = null;
            let selectedOrders = new Set();
            let sessionTimer = null;
            const SESSION_TIMEOUT = 30 * 60 * 1000;
            let currentLang = localStorage.getItem('adminLang') || 'en';

            const costPriceMap = {
                "VIP LEVEL - 1": 14500,
                "VIP LEVEL - 2": 19500,
                "VIP LEVEL - 3": 24500,
                "VIP LEVEL - 4 (ULTRA)": 29000

            // ================================================================
            //  LANGUAGE SWITCHER
            // ================================================================

            function applyLanguageToAllTexts() {
                const isEn = currentLang === 'en';

                // Logo
                const logo = document.querySelector('.logo');
                if (logo) {
                    logo.innerHTML = isEn ? '<i class="fas fa-crown"></i> ATH Admin' :
                        '<i class="fas fa-crown"></i> ATH အဒ်မင်';

                // Drawer Title
                const drawerTitle = document.querySelector('.drawer-title');
                if (drawerTitle) {
                    drawerTitle.textContent = isEn ? 'Admin Panel' : 'အဒ်မင် အကန့်';
                }

                // Drawer Stats Title
                const drawerStatsTitle = document.querySelector('.drawer-stats-title');
                if (drawerStatsTitle) {

                // Drawer Stat Labels

                    en: ['Total Orders', 'Total Users', 'Pending', 'Approved', 'Rejected', 'Total Revenue',

                    ],
                    my: ['စုစုပေါင်း အမိန့်စာ', 'စုစုပေါင်း အသုံးပြုသူ', 'ဆိုင်းငံ့ထားသော', 'အတည်ပြုပြီး', 'ပယ်ချထားသော',

                    ]

                });

                // Drawer Menu
                const menuItems = document.querySelectorAll('.drawer-menu a');
                const menuMap = {
                    en: ['Dashboard', 'Orders', 'Users', 'Store', 'Ads', 'Chat', 'Export Users CSV',
                        'Export Orders CSV', 'Clean Old Orders', 'System Reset', 'Logout'
                    ],
                    my: ['မီနူး', 'အမိန့်စာများ', 'အသုံးပြုသူများ', 'စတိုးဆိုင်', 'ကြော်ငြာများ', 'စကားဝိုင်း',
                        'အသုံးပြုသူများ CSV', 'အမိန့်စာများ CSV', 'အမိန့်စာဟောင်းများရှင်း', 'စနစ်ပြန်လည်သတ်မှတ်ခြင်း',
                        'ထွက်ရန်'
                    ]
                };
                menuItems.forEach((item, i) => {
                    if (i < menuMap.en.length) {
                        const icon = item.querySelector('i')?.outerHTML || '';
                        item.innerHTML = icon + ' ' + (isEn ? menuMap.en[i] : menuMap.my[i]);
                    }
                });

                // Bottom Nav
                const navItems = document.querySelectorAll('.nav-item');
                const navMap = {
                    en: ['Dashboard', 'Orders', 'Users', 'Store', 'Ads', 'Chat'],
                    my: ['မီနူး', 'အမိန့်စာ', 'အသုံးပြုသူ', 'စတိုး', 'ကြော်ငြာ', 'စကားဝိုင်း']
                };
                navItems.forEach((item, i) => {
                    if (i < navMap.en.length) {
                        const icon = item.querySelector('i')?.outerHTML || '';
                        item.innerHTML = icon + '<span>' + (isEn ? navMap.en[i] : navMap.my[i]) + '</span>';
                    }
                });

                // Stats Labels
                const statLabels = document.querySelectorAll('.stat-label');
                const statsMap = {
                    en: ['Total Orders', 'Pending', 'Approved', 'Rejected', 'Revenue', 'Cost', 'Profit',
                        'Avg Profit'
                    ],
                    my: ['စုစုပေါင်း အမိန့်စာ', 'ဆိုင်းငံ့ထားသော', 'အတည်ပြုပြီး', 'ပယ်ချထားသော', 'ဝင်ငွေ', 'ကုန်ကျစရိတ်',
                        'အမြတ်', 'ပျမ်းမျှအမြတ်'
                    ]
                };
                statLabels.forEach((label, i) => {
                    if (i < statsMap.en.length) {
                        const icon = label.querySelector('i')?.outerHTML || '';
                        label.innerHTML = icon + ' ' + (isEn ? statsMap.en[i] : statsMap.my[i]);
                    }
                });

                // Search Input
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.placeholder = isEn ?
                        '🔍 Search by phone, user ID or name' :
                        '🔍 ဖုန်းနံပါတ်၊ အသုံးပြုသူ ID သို့မဟုတ် အမည်ဖြင့် ရှာဖွေရန်';
                }

                // Search & Clear Buttons
                const searchBtn = document.querySelector('.search-btn');
                if (searchBtn) {
                    searchBtn.innerHTML = isEn ? '<i class="fas fa-search"></i> Search' :
                        '<i class="fas fa-search"></i> ရှာဖွေရန်';
                }
                const clearBtn = document.querySelector('.clear-search');
                if (clearBtn) {
                    clearBtn.innerHTML = isEn ? '<i class="fas fa-times"></i> Clear' :
                        '<i class="fas fa-times"></i> ရှင်းလင်းရန်';
                }

                // Filter Button
                const filterBtn = document.querySelector('.filter-btn');
                if (filterBtn) {
                    filterBtn.innerHTML = isEn ? '<i class="fas fa-filter"></i> Filter' :
                        '<i class="fas fa-filter"></i> စစ်ထုတ်ရန်';
                }

                // Status Filter
                const statusFilter = document.getElementById('statusFilter');
                if (statusFilter) {
                    const options = statusFilter.querySelectorAll('option');
                    const optMap = {
                        en: ['All', 'Pending', 'Approved', 'Rejected'],
                        my: ['အားလုံး', 'ဆိုင်းငံ့ထားသော', 'အတည်ပြုပြီး', 'ပယ်ချထားသော']
                    };
                    options.forEach((opt, i) => {
                        if (i < optMap.en.length) {
                            opt.textContent = isEn ? optMap.en[i] : optMap.my[i];
                        }
                    });
                }

                // Sales Hours Title
                const salesTitle = document.querySelector('.sales-hours-title');
                if (salesTitle) {
                    salesTitle.innerHTML = isEn ?
                        '<i class="fas fa-clock"></i> Sales Hours Settings' :
                        '<i class="fas fa-clock"></i> ရောင်းချချိန် သတ်မှတ်ချက်';
                }

                // Ad Settings Title
                const adTitle = document.querySelector('.sales-hours-card:last-child .sales-hours-title');
                if (adTitle) {
                    adTitle.innerHTML = isEn ?
                        '<i class="fas fa-ad"></i> Ad Display Settings' :
                        '<i class="fas fa-ad"></i> ကြော်ငြာ ပြပုံအပြင်အဆင်';
                }

                // Login Box
                const loginTitle = document.querySelector('.login-box h2');
                if (loginTitle) {
                    loginTitle.textContent = isEn ? 'Admin Login' : 'အဒ်မင် ဝင်ရောက်ရန်';
                }
                const loginSub = document.querySelector('.login-box p');
                if (loginSub) {
                    loginSub.textContent = isEn ? 'Access the management system' :
                        'စီမံခန့်ခွဲမှုစနစ်သို့ ဝင်ရောက်ပါ';
                }
                const loginInput = document.getElementById('adminPassword');
                if (loginInput) {
                    loginInput.placeholder = isEn ? 'Enter password' : 'စကားဝှက် ထည့်သွင်းပါ';
                }
                const loginBtn = document.querySelector('.login-btn');
                if (loginBtn) {
                    loginBtn.innerHTML = isEn ? '<i class="fas fa-unlock-alt"></i> Login' :
                        '<i class="fas fa-unlock-alt"></i> ဝင်ရောက်ရန်';
                }

                // Modal Buttons
                document.querySelectorAll('.modal-btn.save').forEach(btn => {
                    btn.textContent = isEn ? 'Save' : 'သိမ်းရန်';
                });
                document.querySelectorAll('.modal-btn.cancel').forEach(btn => {
                    btn.textContent = isEn ? 'Cancel' : 'မလုပ်တော့ပါ';
                });
                document.querySelectorAll('.modal-btn.danger').forEach(btn => {
                    btn.textContent = isEn ? 'Delete' : 'ဖျက်မယ်';
                });

                // Product/Ad Buttons
                const addProductBtn = document.querySelector('.add-product-btn');
                if (addProductBtn) {
                    addProductBtn.innerHTML = isEn ? '<i class="fas fa-plus"></i> Add Product' :
                        '<i class="fas fa-plus"></i> ထုတ်ကုန်ထည့်ရန်';
                }
                const addAdBtn = document.querySelector('.add-product-btn[onclick*="openAddAdModal"]');
                if (addAdBtn) {
                    addAdBtn.innerHTML = isEn ? '<i class="fas fa-plus"></i> New Ad' :
                        '<i class="fas fa-plus"></i> ကြော်ငြာအသစ်';
                }

                // Product Modal Title
                const productModalTitle = document.getElementById('productModalTitle');
                if (productModalTitle) {
                    productModalTitle.textContent = editingProductId ?
                        (isEn ? 'Edit Product' : 'ထုတ်ကုန်တည်းဖြတ်ရန်') :
                        (isEn ? 'Add Product' : 'ထုတ်ကုန်ထည့်ရန်');
                }

                // Ad Modal Title
                const adModalTitle = document.getElementById('adModalTitle');
                if (adModalTitle) {
                    adModalTitle.textContent = editingAdId ?
                        (isEn ? 'Edit Ad' : 'ကြော်ငြာတည်းဖြတ်ရန်') :
                        (isEn ? 'New Ad' : 'ကြော်ငြာအသစ်ထည့်ရန်');
                }

                // Alert Titles
                document.querySelectorAll('.alert-title.warning').forEach(el => {
                    if (el.textContent.includes('အမိန့်စာဟောင်း')) {
                        el.textContent = isEn ? '⚠️ Old Orders Cleanup' : '⚠️ အမိန့်စာဟောင်းများ ရှင်းလင်းခြင်း';
                    }
                });
                document.querySelectorAll('.alert-title.danger').forEach(el => {
                    if (el.textContent.includes('စနစ်ပြန်လည်')) {
                        el.textContent = isEn ? '⚠️ System Reset' : '⚠️ စနစ်ပြန်လည်သတ်မှတ်ခြင်း';
                    }
                });

                // Document Title
                document.title = isEn ? 'Admin Panel | ATH DIGITAL HUB' : 'အဒ်မင် အကန့် | ATH DIGITAL HUB';

                // Refresh orders list if visible
                if (currentTab === 'orders') {
                    applyFiltersAndSearch();
                }
                if (currentTab === 'users') {
                    renderUsersTab();
                }
                if (currentTab === 'market') {
                    renderProducts();
                }
                if (currentTab === 'ads') {
                    renderAds();
                }
            }

            function updateActiveLang() {
                document.querySelectorAll('.lang-option').forEach(btn => {
                    const lang = btn.getAttribute('data-lang');
                    btn.classList.toggle('active-lang', lang === currentLang);
                });
            }

            // ===== LANGUAGE TOGGLE =====
            document.addEventListener('DOMContentLoaded', function() {
                const toggleBtn = document.getElementById('langToggleBtn');
                const dropdown = document.getElementById('langDropdown');

                if (toggleBtn && dropdown) {
                    toggleBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        dropdown.classList.toggle('show');
                    });

                    document.addEventListener('click', function(e) {
                        if (!toggleBtn.contains(e.target) && !dropdown.contains(e.target)) {
                            dropdown.classList.remove('show');
                        }
                    });

                    document.querySelectorAll('.lang-option').forEach(function(btn) {
                        btn.addEventListener('click', function(e) {
                            const lang = this.getAttribute('data-lang');
                            if (lang && lang !== currentLang) {
                                currentLang = lang;
                                localStorage.setItem('adminLang', currentLang);
                                updateActiveLang();
                                applyLanguageToAllTexts();
                                showToast(currentLang === 'en' ?
                                    '✅ Language switched to English' :
                                    '✅ ဘာသာစကား မြန်မာသို့ ပြောင်းပြီးပါပြီ');
                            }
                            dropdown.classList.remove('show');
                        });
                    });
                }

                // Set initial language
                updateActiveLang();
                applyLanguageToAllTexts();
            });

            // ================================================================
            //  END LANGUAGE SWITCHER
            // ================================================================

            function getCostPrice(plan) { return costPriceMap[plan] || 0; }

            function getProfit(price, plan) { return price - getCostPrice(plan); }

            function maskPhone(phone) {
                if (!phone || phone.length < 8) return phone || '';
                return phone.substring(0, 5) + '***' + phone.substring(phone.length - 3);
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }

            function showToast(msg, isError) {
                const toast = document.getElementById('toast');
                if (!toast) return;
                toast.textContent = msg;
                toast.className = 'toast' + (isError ? ' error' : '');
                toast.style.display = 'block';
                clearTimeout(toast._hideTimeout);
                toast._hideTimeout = setTimeout(() => { toast.style.display = 'none'; }, 3000);
            }

            window.copyToClipboard = function(text) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('📋 ' + text + ' copied');
                }).catch(() => {
                    const input = document.createElement('input');
                    input.value = text;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    document.body.removeChild(input);
                    showToast('📋 Copied');
                });
            };

            async function fetchWithRetry(url, options = {}, retries = 3) {
                for (let i = 0; i < retries; i++) {
                    try {
                        const res = await fetch(url, {
                            ...options,
                            credentials: 'include'
                        });
                        if (res.status === 401 && url.includes('/api/admin/')) {
                            console.log('Session expired');
                            window.logout();
                            return null;
                        }
                        return res;
                    } catch (e) {
                        if (i === retries - 1) throw e;
                        await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
                    }
                }
            }

            function resetSessionTimer() {
                if (sessionTimer) clearTimeout(sessionTimer);
                if (token !== 'logged_in') return;
                sessionTimer = setTimeout(() => {
                    if (confirm(currentLang === 'en' ?
                            'Your session is about to expire. Continue?' :
                            'သင်၏ session သက်တမ်းကုန်ဆုံးတော့မည်။ ဆက်လက်လုပ်ဆောင်လိုပါသလား?')) {
                        fetch(`${API_BASE}/api/admin/refresh`, { method: 'POST', credentials: 'include' })
                            .then(() => resetSessionTimer())
                            .catch(() => window.logout());
                    } else {
                        window.logout();
                    }
                }, SESSION_TIMEOUT);
            }

            document.addEventListener('click', resetSessionTimer);
            document.addEventListener('keydown', resetSessionTimer);

            // ===== THEME TOGGLE =====
            window.toggleTheme = function() {
                const html = document.documentElement;
                const icon = document.getElementById('themeIcon');
                if (html.getAttribute('data-theme') === 'light') {
                    html.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'dark');
                    if (icon) icon.className = 'fas fa-moon';
                } else {
                    html.setAttribute('data-theme', 'light');
                    localStorage.setItem('theme', 'light');
                    if (icon) icon.className = 'fas fa-sun';
                }
            };

            (function() {
                const theme = localStorage.getItem('theme');
                if (theme === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    const icon = document.getElementById('themeIcon');
                    if (icon) icon.className = 'fas fa-sun';
                }
            })();

            // ===== UPDATE STATS =====
            function updateAllStats() {
                if (!allOrders || !Array.isArray(allOrders)) allOrders = [];
                const total = allOrders.length;
                const pendingOrders = allOrders.filter(o => o && o.status === 'Pending');
                const approvedOrders = allOrders.filter(o => o && o.status === 'Approved');
                const rejectedOrders = allOrders.filter(o => o && o.status === 'Rejected');
                const pending = pendingOrders.length;
                const approved = approvedOrders.length;
                const rejected = rejectedOrders.length;
                const revenue = approvedOrders.reduce((s, o) => s + (o.price || 0), 0);
                const cost = approvedOrders.reduce((s, o) => s + getCostPrice(o.plan || ''), 0);
                const profit = revenue - cost;

                const ids = ['totalOrders', 'pendingOrders', 'approvedOrders', 'rejectedOrders'];
                const vals = [total, pending, approved, rejected];
                ids.forEach((id, i) => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = vals[i];
                });

                const revenueEl = document.getElementById('totalRevenue');
                if (revenueEl) revenueEl.textContent = revenue.toLocaleString() + 'K';
                const costEl = document.getElementById('totalCost');
                if (costEl) costEl.textContent = cost.toLocaleString() + 'K';
                const profitEl = document.getElementById('totalProfit');
                if (profitEl) profitEl.textContent = profit.toLocaleString() + 'K';
                const avgEl = document.getElementById('avgProfit');
                if (avgEl) avgEl.textContent = (approved ? Math.round(profit / approved) : 0).toLocaleString() + 'K';

                const drawerMap = {
                    'drawerTotalOrders': total,
                    'drawerTotalUsers': userStats ? userStats.length : 0,
                    'drawerPendingOrders': pending,
                    'drawerApprovedOrders': approved,
                    'drawerRejectedOrders': rejected,
                    'drawerTotalRevenue': revenue.toLocaleString() + 'K',
                    'drawerTotalProfit': profit.toLocaleString() + 'K'
                };
                for (const [id, val] of Object.entries(drawerMap)) {
                    const el = document.getElementById(id);
                    if (el) el.textContent = val;
                }
            }

            // ===== DRAWER =====
            window.toggleDrawer = function() {
                document.getElementById('drawer').classList.toggle('open');
                document.getElementById('drawerOverlay').classList.toggle('open');
            };
            window.closeDrawer = function() {
                document.getElementById('drawer').classList.remove('open');
                document.getElementById('drawerOverlay').classList.remove('open');
            };

            // ===== SWITCH TAB =====
            window.switchTab = function(tab) {
                currentTab = tab;
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                const tabEl = document.getElementById(tab + 'Tab');
                if (tabEl) tabEl.classList.add('active');
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.toggle('active', item.dataset.tab === tab);
                });
                if (tab === 'orders') applyFiltersAndSearch();
                else if (tab === 'users') renderUsersTab();
                else if (tab === 'market') loadProducts();
                else if (tab === 'ads') loadAds();
                closeDrawer();
            };

            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (this.dataset.tab === 'chat') {
                        openAdminChatWidget();
                    } else {
                        window.switchTab(this.dataset.tab);
                    }
                });
            });

            // ===== LOGIN / LOGOUT =====
            window.login = async function() {
                const password = document.getElementById('adminPassword')?.value || '';
                if (!password) {
                    showToast(currentLang === 'en' ? 'Please enter password' : 'စကားဝှက် ထည့်သွင်းပါ', true);
                    return;
                }
                try {
                    const res = await fetch(`${API_BASE}/api/admin/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password }),
                        credentials: 'include'
                    });
                    const data = await res.json();
                    if (data.success) {
                        localStorage.setItem('adminToken', 'logged_in');
                        token = 'logged_in';
                        document.getElementById('loginBox').style.display = 'none';
                        document.getElementById('adminContent').style.display = 'block';
                        document.getElementById('bottomNav').style.display = 'flex';
                        loadAllData();
                        loadSalesHours();
                        loadAdSettings();
                        loadAds();
                        startAutoSync();
                        resetSessionTimer();
                        showToast(currentLang === 'en' ? '✅ Login successful' : '✅ ဝင်ရောက်မှု အောင်မြင်ပါပြီ');
                    } else {
                        showToast(currentLang === 'en' ? 'Invalid password' : 'စကားဝှက် မှားယွင်းနေသည်', true);
                    }
                } catch (e) {
                    showToast(currentLang === 'en' ? 'Connection error: ' + e.message : 'ချိတ်ဆက်မှု အမှား: ' + e.message,
                        true);
                }
            };

            window.logout = function() {
                stopAutoSync();
                clearAllCountdowns();
                closeAdminChatWidget();
                localStorage.removeItem('adminToken');
                token = null;
                if (sessionTimer) clearTimeout(sessionTimer);
                document.getElementById('loginBox').style.display = 'block';
                document.getElementById('adminContent').style.display = 'none';
                document.getElementById('bottomNav').style.display = 'none';
                showToast(currentLang === 'en' ? '👋 Logged out' : '👋 ထွက်ခွာသွားပါပြီ');
            };

            document.getElementById('adminPassword')?.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') window.login();
            });

            // ===== AUTO SYNC =====
            function startAutoSync() {
                if (autoSyncInterval) clearInterval(autoSyncInterval);
                autoSyncInterval = setInterval(() => {
                    if (token === 'logged_in') loadAllData();

                    const data = await res.json();
                    if (data.orders && Array.isArray(data.orders)) {
                        allOrders = data.orders;
                        if (currentTab === 'orders') applyFiltersAndSearch();
                        const el = document.getElementById('lastUpdate');
                        if (el) el.innerHTML =

                        updateAllStats();
                    } else {
                        allOrders = [];
                        updateAllStats();
                    }
                } catch (e) {
                    console.error('Error loading orders:', e);
                    document.getElementById('ordersList').innerHTML = '<div class="loading">Connection error</div>';

                    updateAllStats();
                }

            async function loadUserStats() {
                try {
                    const res = await fetchWithRetry(`${API_BASE}/api/admin/user-stats`);
                    if (!res) return;
                    const data = await res.json();
                    if (data.stats && Array.isArray(data.stats)) {
                        userStats = data.stats;
                        if (currentTab === 'users') renderUsersTab();

            window.saveProduct = async function() {
                const name = document.getElementById('productName').value.trim();
                const price = parseInt(document.getElementById('productPrice').value || '0');
                const image = document.getElementById('productImage').value.trim();
                const category = document.getElementById('productCategory').value.trim();
                const icon = document.getElementById('productIcon').value.trim();
                const discount = parseInt(document.getElementById('productDiscount').value || '0') || 0;
                const stock = parseInt(document.getElementById('productStock').value || '999') || 999;

                const isEn = currentLang === 'en';

                    showToast(isEn ? 'Please fill in name and price' :

                    const res = await fetchWithRetry(url, {
                        method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, price, image, category, icon, discount, stock })
                    });
                    if (res && res.ok) {
                        showToast(editingProductId ?
                            (isEn ? '✅ Product updated' : '✅ ထုတ်ကုန် အပ်ဒိတ်လုပ်ပြီးပါပြီ') :

                        closeProductModal();
                        loadProducts();

                    showToast(isEn ? 'Error deleting product' : 'ထုတ်ကုန်ဖျက်ရာတွင် အမှားရှိသည်', true);

                        statusBg = 'rgba(245,158,11,0.2)';

            window.searchUsers = function() {

            // ===== EXPORTS =====
            window.exportUsersToCSV = function() {
                const isEn = currentLang === 'en';
                if (!userStats.length) {
                    showToast(isEn ? 'No users to export' : 'တင်ပို့ရန် အသုံးပြုသူမရှိပါ', true);

                }
                let csv = isEn ?
                    "User ID,Phone,Username,Order Count,Reject Count,Reject Rate,Suspicious,Blocked,Registered\n" :
                    "အသုံးပြုသူ ID,ဖုန်းနံပါတ်,အသုံးပြုသူအမည်,အမိန့်စာအရေအတွက်,ပယ်ချခံရအရေအတွက်,ပယ်ချမှုနှုန်း,သံသယရှိ,ပိတ်ဆို့ထား,စာရင်းသွင်းရက်\n";
                userStats.forEach(u => {
                    const rejectRate = u.order_count > 0 ? ((u.reject_count / u.order_count) * 100).toFixed(1) :
                        0;
                    csv +=
                        `"${u.user_id || 'N/A'}","${u.phone}","${u.username || ''}",${u.order_count},${u.reject_count},${rejectRate}%,${u.suspect_flag ? (isEn ? 'Yes' : 'ဟုတ်ကဲ့') : (isEn ? 'No' : 'မဟုတ်ပါ')},${u.blocked ? (isEn ? 'Yes' : 'ဟုတ်ကဲ့') : (isEn ? 'No' : 'မဟုတ်ပါ')},"${new Date(u.created_at).toLocaleDateString()}"\n`;
                });
                downloadCSV(csv, `users_${new Date().toISOString().slice(0, 19)}.csv`);
                showToast(isEn ? '📁 Users exported to CSV' : '📁 အသုံးပြုသူများအား CSV သို့ တင်ပို့ပြီးပါပြီ');
            };

            window.exportOrdersToCSV = function() {
                const isEn = currentLang === 'en';
                if (!allOrders.length) {
                    showToast(isEn ? 'No orders to export' : 'တင်ပို့ရန် အမိန့်စာမရှိပါ', true);
                    return;
                }
                let csv = isEn ?
                    "Order ID,Phone,Plan,Price,Status,Payment Method,Sender Name,Last 5 Digits,Order Date,Activated Date\n" :
                    "အမိန့်စာ ID,ဖုန်းနံပါတ်,အစီအစဉ်,စျေးနှုန်း,အခြေအနေ,ငွေပေးချေမှုနည်းလမ်း,ပေးပို့သူအမည်,နောက်ဆုံးဂဏန်း ၅လုံး,အမိန့်စာရက်စွဲ,အသက်သွင်းရက်စွဲ\n";
                allOrders.forEach(o => {
                    csv +=
                        `"${o.id}","${o.phone}","${o.plan}",${o.price},"${o.status}","${o.payment_method || 'kpay'}","${o.sender_name || ''}","${o.last5_digits || ''}","${new Date(o.created_at).toLocaleString()}","${o.activated_at ? new Date(o.activated_at).toLocaleString() : ''}"\n`;

                downloadCSV(csv, `orders_${new Date().toISOString().slice(0, 19)}.csv`);
                showToast(isEn ? '📁 Orders exported to CSV' : '📁 အမိန့်စာများအား CSV သို့ တင်ပို့ပြီးပါပြီ');
            };

            function downloadCSV(csv, filename) {
                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            }

            // ===== ORDERS =====
            function applyFiltersAndSearch() {
                let filtered = [...allOrders];
                if (currentSearchPhone) filtered = filtered.filter(o => o.phone === currentSearchPhone);
                const status = document.getElementById('statusFilter')?.value;
                if (status && status !== 'all') filtered = filtered.filter(o => o.status === status);
                const startDate = document.getElementById('startDate')?.value;
                const endDate = document.getElementById('endDate')?.value;
                if (startDate) {
                    const start = new Date(startDate);
                    start.setHours(0, 0, 0, 0);
                    filtered = filtered.filter(o => new Date(o.created_at) >= start);
                }
                if (endDate) {
                    const end = new Date(endDate);
                    end.setHours(23, 59, 59, 999);
                    filtered = filtered.filter(o => new Date(o.created_at) <= end);
                }
                renderOrders(filtered);
                updateAllStats();
            }

            window.searchByPhoneOrId = function() {
                const val = document.getElementById('searchInput')?.value.trim();
                if (!val) return;
                currentSearchPhone = val;
                applyFiltersAndSearch();
            };

            window.clearSearch = function() {
                currentSearchPhone = '';
                document.getElementById('searchInput').value = '';
                applyFiltersAndSearch();
                showToast(currentLang === 'en' ? '🔍 Search cleared' : '🔍 ရှာဖွေမှု ရှင်းလင်းပြီးပါပြီ');
            };

            window.applyFilters = function() { applyFiltersAndSearch(); };

            window.clearFilters = function() {
                document.getElementById('startDate').value = '';
                document.getElementById('endDate').value = '';
                document.getElementById('statusFilter').value = 'all';
                applyFiltersAndSearch();
                showToast(currentLang === 'en' ? '✅ Filters cleared' : '✅ စစ်ထုတ်မှုများ ရှင်းလင်းပြီးပါပြီ');
            };

            // ===== FILTER PRESETS =====
            window.saveFilterPreset = function() {
                const preset = {
                    status: document.getElementById('statusFilter')?.value || 'all',
                    startDate: document.getElementById('startDate')?.value || '',
                    endDate: document.getElementById('endDate')?.value || ''
                };
                localStorage.setItem('orderFilterPreset', JSON.stringify(preset));
                showToast(currentLang === 'en' ? '✅ Filter saved' : '✅ Filter သိမ်းဆည်းပြီးပါပြီ');
            };

            window.loadFilterPreset = function() {
                const saved = localStorage.getItem('orderFilterPreset');
                const isEn = currentLang === 'en';
                if (!saved) {
                    showToast(isEn ? 'No saved filter found' : 'သိမ်းထားတဲ့ Filter မရှိပါ', true);
                    return;
                }
                try {
                    const preset = JSON.parse(saved);
                    if (document.getElementById('statusFilter')) document.getElementById('statusFilter').value = preset
                        .status || 'all';
                    if (document.getElementById('startDate')) document.getElementById('startDate').value = preset
                        .startDate || '';
                    if (document.getElementById('endDate')) document.getElementById('endDate').value = preset
                        .endDate || '';
                    applyFilters();
                    showToast(isEn ? '✅ Filter loaded' : '✅ Filter ပြန်ဖွင့်ပြီးပါပြီ');
                } catch (e) {
                    showToast(isEn ? 'Failed to load filter' : 'Filter ပြန်ဖွင့်ရန် မအောင်မြင်ပါ', true);
                }
            };

            // ===== RENDER ORDERS =====
            function renderOrders(orders) {
                const container = document.getElementById('ordersList');
                if (!container) return;
                const isEn = currentLang === 'en';
                if (!orders || !orders.length) {
                    container.innerHTML = `<div class="loading">${isEn ? 'No orders found' : 'အမိန့်စာ မတွေ့ပါ'}</div>`;
                    return;
                }

                const btnText = {
                    detail: isEn ? 'Details' : 'အသေးစိတ်',
                    screenshot: isEn ? 'Screenshot' : 'ဖန်သားပြင်',
                    approve: isEn ? 'Approve' : 'အတည်ပြု',
                    reject: isEn ? 'Reject' : 'ပယ်ချ',
                    delete: isEn ? 'Delete' : 'ဖျက်မယ်'
                };

                let html = '';
                for (const o of orders) {
                    let statusText = o.status === 'Pending' ? (isEn ? '⏳ Pending' : '⏳ ဆိုင်းငံ့') :
                        (o.status === 'Approved' ? (isEn ? '✅ Approved' : '✅ အတည်ပြု') :

                        (o.status === 'Approved' ? 'rgba(16,185,129,0.2)' : 'rgba(244,63,94,0.2)');

                                <div class="order-countdown" id="countdown-${o.id}">

                                </div>

                        proofItems +=
                            `<span class="order-proof-item"><span style="color:var(--text-secondary);">${isEn ? '👤 Sender:' : '👤 ပေးပို့သူ:'}</span> <strong class="sender-name">${escapeHtml(o.sender_name)}</strong></span>`;

                            `<span class="order-proof-item"><span style="color:var(--text-secondary);">${isEn ? '🧾 Last 5:' : '🧾 နောက်ဆုံး ၅လုံး:'}</span> <strong class="last5">${escapeHtml(o.last5_digits)}</strong></span>`;

                            `<span class="order-proof-item"><span style="color:var(--text-secondary);">${isEn ? '💳 Payment:' : '💳 ငွေပေးချေမှု:'}</span> <strong class="payment-method">${getPaymentIcon(o.payment_method)}</strong></span>`;
                    }

                    html += `
                            <div class="order-card" data-order-id="${o.id}">
                                <div class="order-left">
                                    <div class="order-header">
                                        <span class="order-id"><i class="fas fa-hashtag"></i> ${o.id}</span>
                                        <input type="checkbox" class="order-checkbox" onchange="window.toggleSelectOrder(${o.id})" style="accent-color:var(--cyan);">
                                        <span class="order-status" style="background:${statusBg}; color:${statusColor};">${statusText}</span>
                                    </div>
                                    <div class="order-plan"><i class="fas fa-tag"></i> ${escapeHtml(o.plan)}</div>
                                    <div class="order-phone" onclick="window.copyToClipboard('${escapeHtml(o.phone)}')">

                                </div>
                                
                                <div class="order-right">

                                        <div class="order-price">${o.price.toLocaleString()} <small>K</small></div>
                                        <div class="order-cost"><i class="fas fa-box"></i> ${getCostPrice(o.plan).toLocaleString()}K</div>
                                        <div class="order-profit"><i class="fas fa-chart-line"></i> ${getProfit(o.price, o.plan).toLocaleString()}K</div>
                                    </div>
                                </div>

                                            <i class="fas fa-image"></i> ${btnText.screenshot}
                                        </button>` : `<button class="btn-screenshot" style="opacity:0.3; cursor:default;" disabled>
                                            <i class="fas fa-image"></i> ${isEn ? 'No Image' : 'မရှိပါ'}
                                        </button>`}
                                    </div>
                                    
                                    ${o.status === 'Pending' ? `
                                    <div class="order-actions-row-2">
                                        <button class="btn-approve" onclick="window.approveOrder(${o.id})">
                                            <i class="fas fa-check"></i> ${btnText.approve}

                                        <button class="btn-reject" onclick="window.rejectOrder(${o.id})">
                                            <i class="fas fa-times"></i> ${btnText.reject}

            // ===== VIEW ORDER DETAIL =====
            window.viewOrderDetail = function(orderId) {

                if (!order) return;
                const isEn = currentLang === 'en';

                const modal = document.createElement('div');
                modal.className = 'modal active';
                modal.id = 'orderDetailModal';
                modal.innerHTML = `
                        <div class="modal-card" style="max-width: 480px;">

            // ===== COUNTDOWN =====
            function getRemainingTime(activatedAt) {
                if (!activatedAt) return null;
                const now = Date.now();
                const endDate = new Date(activatedAt).getTime() + (30 * 24 * 60 * 60 * 1000);
                const remaining = endDate - now;
                if (remaining <= 0) return 'Expired';
                const days = Math.floor(remaining / (24 * 60 * 60 * 1000));
                const hours = Math.floor((remaining % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000));
                const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
                return { days, hours, minutes };
            }

            function formatCountdown(activatedAt) {
                const time = getRemainingTime(activatedAt);
                const isEn = currentLang === 'en';
                if (!time) return null;
                if (time === 'Expired') return isEn ? 'Expired' : 'သက်တမ်းကုန်ဆုံးပြီ';
                return isEn ?
                    `${time.days}d ${time.hours}h ${time.minutes}m` :
                    `${time.days}ရက် ${time.hours}နာရီ ${time.minutes}မိနစ်`;
            }

            function startCountdownForOrder(orderId, activatedAt) {
                if (activeCountdowns[orderId]) {
                    clearInterval(activeCountdowns[orderId]);
                    delete activeCountdowns[orderId];
                }
                const interval = setInterval(() => {
                    const elem = document.getElementById(`countdown-${orderId}`);
                    if (!elem) {
                        clearInterval(interval);
                        delete activeCountdowns[orderId];
                        return;
                    }
                    const formatted = formatCountdown(activatedAt);
                    const isEn = currentLang === 'en';
                    if (formatted === 'Expired' || formatted === 'သက်တမ်းကုန်ဆုံးပြီ') {
                        elem.innerHTML =
                            `<i class="fas fa-calendar-times"></i> <span style="color:var(--rose);">${isEn ? 'Expired' : 'သက်တမ်းကုန်ဆုံးပြီ'}</span>`;
                        clearInterval(interval);
                        delete activeCountdowns[orderId];
                    } else {
                        elem.innerHTML =
                            `<i class="fas fa-hourglass-half"></i> <span class="countdown-timer">${formatted}</span>`;
                    }
                }, 1000);
                activeCountdowns[orderId] = interval;
            }

            function clearAllCountdowns() {
                for (const id in activeCountdowns) {
                    clearInterval(activeCountdowns[id]);
                }
                activeCountdowns = {};

                        z-index: 999;
                        background: transparent;
                        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
                    `;
                iframe.id = 'adminChatIframe';
                document.body.appendChild(iframe);
                adminChatWidgetOpen = true;
            };

            window.closeAdminChatWidget = function() {
                const iframe = document.getElementById('adminChatIframe');
                if (iframe) {
                    iframe.remove();
                    adminChatWidgetOpen = false;
                }
            };

            // ================================================================
            //  PAYMENT MODAL FROM PLANS WIDGET
            // ================================================================

            window.openPaymentModalFromPlan = function(planName, planPrice) {
                const isEn = currentLang === 'en';
                
                // Show toast notification
                showToast(
                    isEn ? 
                    `🛒 ${planName} - ${planPrice.toLocaleString()} MMK - Please go to Orders tab to purchase` :
                    `🛒 ${planName} - ${planPrice.toLocaleString()} MMK - ဝယ်ယူရန် Orders Tab ကိုသွားပါ`
                );
                
                // Switch to orders tab
                window.switchTab('orders');
                
                // Auto-fill search with plan name (optional)
                // const searchInput = document.getElementById('searchInput');
                // if (searchInput) {
                //     searchInput.value = planName;
                //     window.searchByPhoneOrId();
                // }
            };

            // ================================================================
            //  END PAYMENT MODAL FROM PLANS WIDGET
            // ================================================================

            // ===== KEYBOARD SHORTCUTS =====
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key >= '1' && e.key <= '5') {
                    e.preventDefault();
                    const tabs = ['menu', 'orders', 'users', 'market', 'ads'];
                    window.switchTab(tabs[parseInt(e.key) - 1]);
                }
                if (e.key === 'Escape') {
                    document.querySelectorAll('.modal.active, .custom-alert.active, .image-modal.active').forEach(
                    el => {
                        el.classList.remove('active');
                    });
                    window.closeDrawer();
                }
                if (e.ctrlKey && e.key === 'r') {
                    e.preventDefault();
                    window.manualRefresh();
                }
            });

            // ===== INIT =====
            if (token === 'logged_in') {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                document.getElementById('bottomNav').style.display = 'flex';
                loadAllData();
                loadSalesHours();
                loadAdSettings();
                startAutoSync();
                resetSessionTimer();
                setInterval(updateSalesStatusDisplay, 60000);
            }

        })();
    </script>
</body>
</html>
