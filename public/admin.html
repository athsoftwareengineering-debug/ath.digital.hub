<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | MYTEL Data</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 1rem;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    .login-box {
      max-width: 400px;
      margin: 100px auto;
      background: #1e293b;
      padding: 2rem;
      border-radius: 24px;
      text-align: center;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      color: white;
    }
    .login-box button {
      background: #facc15;
      color: #0f172a;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
    }
    .dashboard { display: none; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #1e293b;
      padding: 1rem;
      border-radius: 16px;
      text-align: center;
    }
    .stat-card .value { font-size: 1.8rem; font-weight: 800; color: #facc15; }
    .filters {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1rem 0;
    }
    .filters input, .filters select {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 12px;
      color: white;
    }
    .order-card {
      background: #1e293b;
      border-radius: 16px;
      padding: 1rem;
      margin-bottom: 1rem;
      border-left: 4px solid #facc15;
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }
    .status-badge {
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-pending { background: #f9731620; color: #f97316; border:1px solid #f97316; }
    .status-paid { background: #3b82f620; color: #3b82f6; border:1px solid #3b82f6; }
    .status-approved { background: #22c55e20; color: #22c55e; border:1px solid #22c55e; }
    .status-rejected { background: #ef444420; color: #ef4444; border:1px solid #ef4444; }
    .status-expired { background: #64748b20; color: #64748b; border:1px solid #64748b; }
    .btn-sm {
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.7rem;
      cursor: pointer;
      border: none;
      margin: 0 4px;
    }
    .btn-approve { background: #22c55e20; color: #22c55e; border:1px solid #22c55e; }
    .btn-reject { background: #ef444420; color: #ef4444; border:1px solid #ef4444; }
    .btn-delete { background: #ef444420; color: #ef4444; border:1px solid #ef4444; }
    img.screenshot-thumb {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
    }
    .modal {
      display: none;
      position: fixed;
      top:0;left:0;
      width:100%;height:100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      max-width: 90%;
      max-height: 90%;
    }
    .modal-content img { max-width:100%; max-height:90vh; }
    button { cursor: pointer; }
    .logout-btn {
      background: #ef4444;
      color: white;
      padding: 6px 16px;
      border: none;
      border-radius: 40px;
      margin-left: 1rem;
    }
  </style>
</head>
<body>
<div id="loginSection" class="login-box">
  <h2>Admin Login</h2>
  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Password">
  <button onclick="login()">Login</button>
  <div id="loginError" style="color:#ef4444; margin-top:1rem;"></div>
</div>

<div id="dashboard" class="dashboard container">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h1>🔥 MYTEL Admin Panel</h1>
    <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>
  <div class="stats-grid" id="statsGrid"></div>
  <div class="filters">
    <input type="text" id="searchPhone" placeholder="Search by phone">
    <select id="statusFilter">
      <option value="all">All Status</option>
      <option value="pending_payment">Pending</option>
      <option value="payment_received">Paid</option>
      <option value="approved">Active</option>
      <option value="rejected">Rejected</option>
      <option value="expired">Expired</option>
    </select>
    <button onclick="applyFilters()">Apply</button>
  </div>
  <div id="ordersList"></div>
</div>

<div id="imageModal" class="modal" onclick="closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <img id="modalImage" src="">
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, query, where, orderBy, onSnapshot, updateDoc, doc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCN7GMpY6dqGzVlMevMZPG76guq3DvQPd8",
    authDomain: "mytelordersystem.firebaseapp.com",
    projectId: "mytelordersystem",
    storageBucket: "mytelordersystem.firebasestorage.app",
    messagingSenderId: "366519284419",
    appId: "1:366519284419:web:0044583e2ef8aa7260a876"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let allOrders = [];
  let unsubscribeOrders = null;

  window.login = async () => {
    const email = document.getElementById('loginEmail').value;
    const pwd = document.getElementById('loginPassword').value;
    try {
      await signInWithEmailAndPassword(auth, email, pwd);
      document.getElementById('loginError').innerText = '';
    } catch (err) {
      document.getElementById('loginError').innerText = err.message;
    }
  };

  window.logout = async () => {
    await signOut(auth);
    location.reload();
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      startListening();
    } else {
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
      if (unsubscribeOrders) unsubscribeOrders();
    }
  });

  function startListening() {
    const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
    unsubscribeOrders = onSnapshot(q, (snapshot) => {
      allOrders = [];
      snapshot.forEach(doc => {
        allOrders.push({ id: doc.id, ...doc.data() });
      });
      updateStats();
      applyFilters();
    });
  }

  function updateStats() {
    const total = allOrders.length;
    const pending = allOrders.filter(o => o.status === 'pending_payment').length;
    const paid = allOrders.filter(o => o.status === 'payment_received').length;
    const approved = allOrders.filter(o => o.status === 'approved').length;
    const revenue = allOrders.filter(o => o.status === 'approved').reduce((sum,o) => sum + (o.price||0), 0);
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><div class="value">${total}</div><div>Total</div></div>
      <div class="stat-card"><div class="value">${pending}</div><div>Pending</div></div>
      <div class="stat-card"><div class="value">${paid}</div><div>Paid</div></div>
      <div class="stat-card"><div class="value">${approved}</div><div>Active</div></div>
      <div class="stat-card"><div class="value">${(revenue/1000).toFixed(0)}K</div><div>Revenue (KS)</div></div>
    `;
  }

  window.applyFilters = () => {
    const search = document.getElementById('searchPhone').value.toLowerCase();
    const statusFilter = document.getElementById('statusFilter').value;
    let filtered = allOrders.filter(o => {
      if (search && !o.phone.includes(search)) return false;
      if (statusFilter !== 'all' && o.status !== statusFilter) return false;
      return true;
    });
    renderOrders(filtered);
  };

  function renderOrders(orders) {
    const container = document.getElementById('ordersList');
    if (!orders.length) {
      container.innerHTML = '<p>No orders found.</p>';
      return;
    }
    let html = '';
    orders.forEach(order => {
      let statusClass = '';
      switch(order.status) {
        case 'pending_payment': statusClass = 'status-pending'; break;
        case 'payment_received': statusClass = 'status-paid'; break;
        case 'approved': statusClass = 'status-approved'; break;
        case 'rejected': statusClass = 'status-rejected'; break;
        case 'expired': statusClass = 'status-expired';
      }
      const createdAt = order.createdAt ? order.createdAt.toDate().toLocaleString() : 'N/A';
      html += `
        <div class="order-card">
          <div class="order-header">
            <strong>#${order.id}</strong>
            <span class="status-badge ${statusClass}">${order.status}</span>
          </div>
          <div><strong>Package:</strong> ${order.packageName}</div>
          <div><strong>Phone:</strong> ${order.phone}</div>
          <div><strong>Price:</strong> ${order.price?.toLocaleString()} KS</div>
          <div><strong>Date:</strong> ${createdAt}</div>
          ${order.note ? `<div><strong>Note:</strong> ${order.note}</div>` : ''}
          ${order.screenshotURL ? `<div><img src="${order.screenshotURL}" class="screenshot-thumb" onclick="showImage('${order.screenshotURL}')"></div>` : ''}
          <div style="margin-top:0.5rem;">
            ${order.status === 'payment_received' ? `
              <button class="btn-sm btn-approve" onclick="updateOrderStatus('${order.id}', 'approved')">✅ Approve (30 days)</button>
              <button class="btn-sm btn-reject" onclick="updateOrderStatus('${order.id}', 'rejected')">❌ Reject</button>
            ` : ''}
            ${order.status === 'pending_payment' ? `
              <button class="btn-sm btn-approve" onclick="updateOrderStatus('${order.id}', 'payment_received')">💰 Mark as Paid</button>
            ` : ''}
            <button class="btn-sm btn-delete" onclick="deleteOrder('${order.id}')">🗑️ Delete</button>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  window.updateOrderStatus = async (orderId, newStatus) => {
    try {
      const orderRef = doc(db, "orders", orderId);
      const updateData = { status: newStatus };
      if (newStatus === 'approved') {
        const startDate = new Date();
        const endDate = new Date();
        endDate.setDate(endDate.getDate() + 30);
        updateData.startDate = startDate;
        updateData.endDate = endDate;
      }
      await updateDoc(orderRef, updateData);
      alert(`Order #${orderId} updated to ${newStatus}`);
    } catch (err) {
      alert("Error: " + err.message);
    }
  };

  window.deleteOrder = async (orderId) => {
    if (!confirm(`Permanently delete order #${orderId}?`)) return;
    try {
      await deleteDoc(doc(db, "orders", orderId));
      alert("Deleted");
    } catch (err) {
      alert("Error: " + err.message);
    }
  };

  window.showImage = (url) => {
    const modal = document.getElementById('imageModal');
    document.getElementById('modalImage').src = url;
    modal.style.display = 'flex';
  };
  window.closeModal = () => {
    document.getElementById('imageModal').style.display = 'none';
  };
</script>
</body>
</html>
