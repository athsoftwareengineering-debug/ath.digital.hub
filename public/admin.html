<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ATH DIGITAL HUB | Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; }
    .login-container { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #0f172a, #1e1b4b); }
    .login-card { background: #1e293b; padding: 2rem; border-radius: 28px; width: 350px; text-align: center; }
    .login-card input { width: 100%; padding: 12px; margin: 1rem 0; background: #0f172a; border: 1px solid #334155; border-radius: 14px; color: white; }
    .login-card button { background: #facc15; color: #0f172a; padding: 12px; width: 100%; border: none; border-radius: 14px; font-weight: bold; cursor: pointer; }
    .app-wrapper { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: #0f172a; border-right: 1px solid #334155; padding: 1rem; position: fixed; height: 100%; overflow-y: auto; }
    .main-content { margin-left: 260px; padding: 1.5rem; width: 100%; }
    .nav-item { padding: 12px; margin: 4px 0; border-radius: 12px; cursor: pointer; color: #94a3b8; }
    .nav-item.active, .nav-item:hover { background: rgba(250,204,21,0.15); color: #facc15; }
    .top-bar { display: flex; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: #1e293b; border-radius: 16px; padding: 1rem; border: 1px solid #334155; }
    .stat-card .value { font-size: 1.8rem; font-weight: 800; color: #facc15; }
    .filters-bar { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 1rem; background: #1e293b; padding: 1rem; border-radius: 16px; }
    .orders-container { background: #1e293b; border-radius: 20px; padding: 1rem; }
    .order-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem; border-bottom: 1px solid #334155; flex-wrap: wrap; }
    .status-badge { padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; }
    .status-pending { background: #f9731620; color: #f97316; border:1px solid #f97316; }
    .status-paid { background: #3b82f620; color: #3b82f6; border:1px solid #3b82f6; }
    .status-approved { background: #22c55e20; color: #22c55e; border:1px solid #22c55e; }
    .action-btn { padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; cursor: pointer; background: none; border:1px solid; }
    .action-approve { color:#22c55e; border-color:#22c55e; }
    .action-reject { color:#ef4444; border-color:#ef4444; }
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 1100; justify-content: center; align-items: center; }
    .modal-content { background: #1e293b; padding: 1.5rem; border-radius: 20px; max-width: 500px; width: 90%; }
    .modal-content img { max-width: 100%; border-radius: 12px; }
    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } .sidebar.mobile-open { transform: translateX(0); } }
  </style>
</head>
<body>
<div id="loginSection" class="login-container">
  <div class="login-card">
    <h2><i class="fas fa-lock"></i> Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Enter password">
    <button id="loginBtn">Login</button>
    <div id="loginError" style="color:#ef4444; margin-top:0.5rem;"></div>
  </div>
</div>
<div id="dashboardSection" style="display:none">
  <div class="app-wrapper">
    <div class="sidebar" id="sidebar">
      <div class="logo" style="font-size:1.2rem; font-weight:800; margin-bottom:2rem;"><i class="fas fa-globe"></i> ATH DIGITAL HUB</div>
      <div class="nav-item active" data-page="dashboard"><i class="fas fa-chart-line"></i> Dashboard</div>
      <div class="nav-item" data-page="orders"><i class="fas fa-box"></i> Orders</div>
      <div class="nav-item" data-page="expiring"><i class="fas fa-clock"></i> Expiring Soon</div>
      <div class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</div>
    </div>
    <div class="main-content">
      <div class="top-bar"><h1><span id="pageTitle">Dashboard</span></h1><button onclick="logout()" style="background:#ef4444; border:none; padding:8px 16px; border-radius:40px; color:white;">Logout</button></div>
      <div class="stats-grid" id="statsGrid">Loading...</div>
      <div class="filters-bar"><input type="text" id="searchPhone" placeholder="Search phone"><select id="statusFilter"><option value="all">All Status</option><option value="pending_payment">Pending</option><option value="payment_received">Paid</option><option value="approved">Active</option><option value="rejected">Rejected</option><option value="expired">Expired</option></select><button id="applyFilters">Apply</button><button id="exportCSV">Export CSV</button></div>
      <div class="bulk-actions" id="bulkActions" style="display:none; margin-bottom:1rem;"><span id="selectedCount">0 selected</span><button id="bulkApprove">Approve Selected</button><button id="bulkReject">Reject Selected</button><button id="clearSelection">Clear</button></div>
      <div class="orders-container" id="ordersContainer">Loading orders...</div>
    </div>
  </div>
</div>
<div id="screenshotModal" class="modal"><div class="modal-content"><h3>Screenshot</h3><img id="screenshotImg" src=""><div style="margin-top:1rem;"><button onclick="closeModal()">Close</button></div></div></div>

<script>
  let token = null;
  let allOrders = [];
  let selectedOrders = new Set();
  let autoRefreshInterval = null;

  async function login() {
    const password = document.getElementById('adminPassword').value;
    try {
      const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
      const data = await res.json();
      if (data.success) {
        token = data.token;
        sessionStorage.setItem('adminToken', token);
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        await loadAllData();
        startAutoRefresh();
      } else { document.getElementById('loginError').innerText = data.message; }
    } catch (err) { document.getElementById('loginError').innerText = 'Network error'; }
  }

  function authHeaders() { return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }; }

  async function loadAllData() {
    try {
      const res = await fetch('/api/admin/orders', { headers: authHeaders() });
      const data = await res.json();
      if (data.success) {
        allOrders = data.orders;
        renderStats(data.stats);
        renderOrders(allOrders);
        loadCharts();
      } else if (data.message === 'Invalid or expired token') { logout(); }
    } catch (err) { console.error(err); }
  }

  function renderStats(stats) {
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><div class="value">${stats.total}</div><div>Total</div></div>
      <div class="stat-card"><div class="value">${stats.pending}</div><div>Pending</div></div>
      <div class="stat-card"><div class="value">${stats.paid}</div><div>Paid</div></div>
      <div class="stat-card"><div class="value">${stats.approved}</div><div>Active</div></div>
      <div class="stat-card"><div class="value">${stats.expired}</div><div>Expired</div></div>
      <div class="stat-card"><div class="value">${(stats.revenue/1000).toFixed(0)}K</div><div>Revenue</div></div>
    `;
  }

  function renderOrders(orders) {
    const container = document.getElementById('ordersContainer');
    if (!orders.length) { container.innerHTML = '<div>No orders found</div>'; return; }
    let html = `<div style="display:flex; align-items:center; padding:8px; background:#0f172a; border-radius:12px; margin-bottom:8px;"><div style="width:40px;"><input type="checkbox" id="selectAllCheckbox"></div><div style="width:80px;">ID</div><div style="width:150px;">Package</div><div style="width:150px;">Phone</div><div style="width:100px;">Price</div><div style="width:120px;">Status</div><div style="width:140px;">Date</div><div style="width:80px;">SS</div><div>Action</div></div>`;
    for (const o of orders) {
      let statusClass = '';
      if (o.status === 'pending_payment') statusClass = 'status-pending';
      else if (o.status === 'payment_received') statusClass = 'status-paid';
      else if (o.status === 'approved') statusClass = 'status-approved';
      else statusClass = 'status-pending';
      let statusText = o.status === 'pending_payment' ? 'Pending' : o.status === 'payment_received' ? 'Paid' : o.status === 'approved' ? 'Active' : o.status === 'rejected' ? 'Rejected' : 'Expired';
      const date = new Date(o.createdAt).toLocaleString();
      html += `<div class="order-row" data-id="${o.id}"><div style="width:40px;"><input type="checkbox" class="order-checkbox" value="${o.id}"></div><div style="width:80px;">#${o.id}</div><div style="width:150px;">${o.packageName}</div><div style="width:150px;">${o.phone}</div><div style="width:100px;">${o.price.toLocaleString()} KS</div><div style="width:120px;"><span class="status-badge ${statusClass}">${statusText}</span></div><div style="width:140px;">${date}</div><div style="width:80px;"><button onclick="viewScreenshot(${o.id})">View</button></div><div>${o.status === 'payment_received' ? `<button class="action-btn action-approve" onclick="updateOrder(${o.id},'approved')">Approve</button> <button class="action-btn action-reject" onclick="updateOrder(${o.id},'rejected')">Reject</button>` : '-'}</div></div>`;
    }
    container.innerHTML = html;
    document.getElementById('selectAllCheckbox').onchange = (e) => { document.querySelectorAll('.order-checkbox').forEach(cb => cb.checked = e.target.checked); updateSelectedCount(); };
    document.querySelectorAll('.order-checkbox').forEach(cb => cb.onchange = () => updateSelectedCount());
    updateSelectedCount();
  }

  function updateSelectedCount() {
    selectedOrders.clear();
    document.querySelectorAll('.order-checkbox:checked').forEach(cb => selectedOrders.add(parseInt(cb.value)));
    const bulkDiv = document.getElementById('bulkActions');
    if (selectedOrders.size > 0) { bulkDiv.style.display = 'flex'; document.getElementById('selectedCount').innerText = `${selectedOrders.size} selected`; }
    else { bulkDiv.style.display = 'none'; }
  }

  async function updateOrder(orderId, status) {
    try {
      await fetch('/api/admin/update-order', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ orderId, status }) });
      await loadAllData();
    } catch (err) { alert('Error'); }
  }

  async function bulkUpdate(status) {
    if (selectedOrders.size === 0) return;
    if (!confirm(`Are you sure you want to ${status} ${selectedOrders.size} orders?`)) return;
    const orderIds = Array.from(selectedOrders);
    await fetch('/api/admin/bulk-update', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ orderIds, status }) });
    await loadAllData();
    selectedOrders.clear();
    updateSelectedCount();
  }

  async function viewScreenshot(orderId) {
    try {
      const res = await fetch(`/api/admin/screenshot/${orderId}`, { headers: authHeaders() });
      const data = await res.json();
      if (data.success) {
        document.getElementById('screenshotImg').src = data.screenshotUrl;
        document.getElementById('screenshotModal').style.display = 'flex';
      } else alert('No screenshot');
    } catch (err) { alert('Error loading screenshot'); }
  }

  function closeModal() { document.getElementById('screenshotModal').style.display = 'none'; }

  async function loadCharts() {
    const ctxDaily = document.getElementById('dailyChart');
    const ctxPackage = document.getElementById('packageChart');
    if (!ctxDaily || !ctxPackage) return;
    const last7Days = [];
    const dailyCounts = [];
    for (let i=6; i>=0; i--) { let d = new Date(); d.setDate(d.getDate()-i); last7Days.push(d.toISOString().split('T')[0]); dailyCounts.push(allOrders.filter(o => o.createdAt.startsWith(last7Days[last7Days.length-1-i])).length); }
    new Chart(ctxDaily, { type: 'line', data: { labels: last7Days, datasets: [{ label: 'Orders', data: dailyCounts, borderColor: '#facc15' }] } });
    const packageRevenue = {};
    allOrders.filter(o => o.status === 'approved').forEach(o => packageRevenue[o.packageName] = (packageRevenue[o.packageName]||0)+o.price);
    new Chart(ctxPackage, { type: 'bar', data: { labels: Object.keys(packageRevenue), datasets: [{ label: 'Revenue (KS)', data: Object.values(packageRevenue), backgroundColor: '#facc15' }] } });
  }

  function applyFilters() {
    const search = document.getElementById('searchPhone').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    let filtered = allOrders;
    if (search) filtered = filtered.filter(o => o.phone.includes(search));
    if (status !== 'all') filtered = filtered.filter(o => o.status === status);
    renderOrders(filtered);
  }

  function exportCSV() {
    let filtered = allOrders;
    const search = document.getElementById('searchPhone').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    if (search) filtered = filtered.filter(o => o.phone.includes(search));
    if (status !== 'all') filtered = filtered.filter(o => o.status === status);
    const headers = ['ID','Package','Phone','Price','Status','Date'];
    const rows = filtered.map(o => [o.id, o.packageName, o.phone, o.price, o.status, new Date(o.createdAt).toLocaleString()]);
    const csv = [headers, ...rows].map(row => row.join(',')).join('\n');
    const blob = new Blob(["\uFEFF" + csv], {type: 'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'orders.csv'; a.click(); URL.revokeObjectURL(url);
  }

  function startAutoRefresh() { if (autoRefreshInterval) clearInterval(autoRefreshInterval); autoRefreshInterval = setInterval(() => { if (token) loadAllData(); }, 60000); }
  function logout() { sessionStorage.removeItem('adminToken'); token = null; location.reload(); }

  if (sessionStorage.getItem('adminToken')) { token = sessionStorage.getItem('adminToken'); document.getElementById('loginSection').style.display = 'none'; document.getElementById('dashboardSection').style.display = 'block'; loadAllData(); startAutoRefresh(); }
  document.getElementById('loginBtn').onclick = login;
  document.getElementById('applyFilters').onclick = applyFilters;
  document.getElementById('exportCSV').onclick = exportCSV;
  document.getElementById('bulkApprove').onclick = () => bulkUpdate('approved');
  document.getElementById('bulkReject').onclick = () => bulkUpdate('rejected');
  document.getElementById('clearSelection').onclick = () => { document.querySelectorAll('.order-checkbox').forEach(cb => cb.checked = false); updateSelectedCount(); };
  window.updateOrder = updateOrder;
  window.viewScreenshot = viewScreenshot;
  window.closeModal = closeModal;
</script>
</body>
</html>
