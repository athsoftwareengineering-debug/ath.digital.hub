<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATH DIGITAL HUB | Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; }
    
    /* Login Styles */
    .login-container { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #0f172a, #1e1b4b); }
    .login-card { background: #1e293b; padding: 2rem; border-radius: 28px; width: 350px; text-align: center; }
    .login-card h2 { color: #facc15; margin-bottom: 1rem; }
    .login-card input { width: 100%; padding: 12px; margin: 1rem 0; background: #0f172a; border: 1px solid #334155; border-radius: 14px; color: white; font-size: 1rem; }
    .login-card button { background: #facc15; color: #0f172a; padding: 12px; width: 100%; border: none; border-radius: 14px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .login-card button:hover { background: #eab308; }
    
    /* Dashboard Styles */
    .app-wrapper { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: #0f172a; border-right: 1px solid #334155; padding: 1rem; position: fixed; height: 100%; overflow-y: auto; }
    .main-content { margin-left: 260px; padding: 1.5rem; width: 100%; }
    .logo { font-size: 1.2rem; font-weight: 800; margin-bottom: 2rem; color: #facc15; text-align: center; }
    .nav-item { padding: 12px; margin: 4px 0; border-radius: 12px; cursor: pointer; color: #94a3b8; transition: all 0.3s; }
    .nav-item:hover, .nav-item.active { background: rgba(250,204,21,0.15); color: #facc15; }
    .top-bar { display: flex; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; align-items: center; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: #1e293b; border-radius: 16px; padding: 1rem; border: 1px solid #334155; text-align: center; }
    .stat-card .value { font-size: 1.8rem; font-weight: 800; color: #facc15; }
    .filters-bar { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 1rem; background: #1e293b; padding: 1rem; border-radius: 16px; align-items: center; }
    .filters-bar input, .filters-bar select { padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: white; }
    .filters-bar button { padding: 8px 16px; background: #facc15; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; color: #0f172a; }
    .orders-container { background: #1e293b; border-radius: 20px; padding: 1rem; overflow-x: auto; }
    .order-header { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem; background: #0f172a; border-radius: 12px; margin-bottom: 8px; font-weight: bold; color: #facc15; }
    .order-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem; border-bottom: 1px solid #334155; }
    .status-badge { padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; display: inline-block; }
    .status-pending { background: #f9731620; color: #f97316; border: 1px solid #f97316; }
    .status-paid { background: #3b82f620; color: #3b82f6; border: 1px solid #3b82f6; }
    .status-approved { background: #22c55e20; color: #22c55e; border: 1px solid #22c55e; }
    .action-btn { padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; cursor: pointer; background: none; margin: 2px; }
    .action-approve { color: #22c55e; border: 1px solid #22c55e; }
    .action-reject { color: #ef4444; border: 1px solid #ef4444; }
    .action-btn:hover { opacity: 0.7; }
    .bulk-actions { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; padding: 0.8rem; background: #1e293b; border-radius: 12px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1100; justify-content: center; align-items: center; }
    .modal-content { background: #1e293b; padding: 1.5rem; border-radius: 20px; max-width: 500px; width: 90%; }
    .modal-content img { max-width: 100%; border-radius: 12px; }
    .modal-content button { background: #facc15; padding: 8px 20px; border: none; border-radius: 10px; margin-top: 1rem; cursor: pointer; }
    .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 2rem; }
    .chart-card { background: #1e293b; border-radius: 20px; padding: 1rem; border: 1px solid #334155; }
    @media (max-width: 768px) { 
      .sidebar { transform: translateX(-100%); position: fixed; z-index: 1000; } 
      .main-content { margin-left: 0; } 
      .charts-row { grid-template-columns: 1fr; }
      .mobile-menu-btn { display: inline-block; }
    }
    .mobile-menu-btn { display: none; background: #facc15; padding: 8px 12px; border-radius: 8px; cursor: pointer; border: none; }
    .logout-btn { background: #ef4444; border: none; padding: 8px 16px; border-radius: 40px; color: white; cursor: pointer; }
    .logout-btn:hover { background: #dc2626; }
  </style>
</head>
<body>

<!-- Login Section -->
<div id="loginSection" class="login-container">
  <div class="login-card">
    <i class="fas fa-shield-alt" style="font-size: 3rem; color: #facc15; margin-bottom: 1rem;"></i>
    <h2>Admin Login</h2>
    <p style="color: #94a3b8; margin-bottom: 1rem;">ATH DIGITAL HUB Control Panel</p>
    <input type="password" id="adminPassword" placeholder="Enter password">
    <button id="loginBtn">Login</button>
    <div id="loginError" style="color: #ef4444; margin-top: 0.5rem;"></div>
  </div>
</div>

<!-- Dashboard Section -->
<div id="dashboardSection" style="display: none;">
  <div class="app-wrapper">
    <div class="sidebar" id="sidebar">
      <div class="logo"><i class="fas fa-globe"></i> ATH DIGITAL HUB</div>
      <div class="nav-item active" data-page="dashboard"><i class="fas fa-chart-line"></i> Dashboard</div>
      <div class="nav-item" data-page="orders"><i class="fas fa-box"></i> Orders</div>
      <div class="nav-item" data-page="expiring"><i class="fas fa-clock"></i> Expiring Soon</div>
      <div class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</div>
    </div>
    
    <div class="main-content">
      <div class="top-bar">
        <div>
          <button class="mobile-menu-btn" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i> Menu</button>
          <h1 style="display: inline-block; margin-left: 10px;"><span id="pageTitle">Dashboard</span></h1>
        </div>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
      
      <div class="stats-grid" id="statsGrid">Loading...</div>
      
      <div class="filters-bar">
        <input type="text" id="searchPhone" placeholder="Search by phone">
        <select id="statusFilter">
          <option value="all">All Status</option>
          <option value="pending_payment">Pending</option>
          <option value="payment_received">Paid</option>
          <option value="approved">Active</option>
          <option value="rejected">Rejected</option>
          <option value="expired">Expired</option>
        </select>
        <button id="applyFilters"><i class="fas fa-filter"></i> Apply</button>
        <button id="exportCSV"><i class="fas fa-download"></i> Export CSV</button>
      </div>
      
      <div id="bulkActions" class="bulk-actions" style="display: none;">
        <span id="selectedCount">0 selected</span>
        <button id="bulkApprove" style="background: #22c55e; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer;">Approve Selected</button>
        <button id="bulkReject" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer;">Reject Selected</button>
        <button id="clearSelection" style="background: #64748b; color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer;">Clear</button>
      </div>
      
      <div class="orders-container" id="ordersContainer">Loading orders...</div>
      
      <div class="charts-row">
        <div class="chart-card"><h3>Daily Orders (Last 7 Days)</h3><canvas id="dailyChart"></canvas></div>
        <div class="chart-card"><h3>Revenue by Package</h3><canvas id="packageChart"></canvas></div>
      </div>
    </div>
  </div>
</div>

<!-- Screenshot Modal -->
<div id="screenshotModal" class="modal">
  <div class="modal-content">
    <h3>Payment Screenshot</h3>
    <img id="screenshotImg" src="">
    <div><button onclick="closeModal()">Close</button></div>
  </div>
</div>

<script>
  let token = null;
  let allOrders = [];
  let selectedOrders = new Set();
  let autoRefreshInterval = null;
  let dailyChart = null;
  let packageChart = null;

  // Check for existing token
  const savedToken = sessionStorage.getItem('adminToken');
  if (savedToken) {
    token = savedToken;
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('dashboardSection').style.display = 'block';
    loadAllData();
    startAutoRefresh();
  }

  // Login function
  async function login() {
    const password = document.getElementById('adminPassword').value;
    const errorDiv = document.getElementById('loginError');
    
    if (!password) {
      errorDiv.innerText = 'Please enter password';
      return;
    }
    
    errorDiv.innerText = 'Logging in...';
    
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      
      const data = await res.json();
      
      if (data.success) {
        token = data.token;
        sessionStorage.setItem('adminToken', token);
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        await loadAllData();
        startAutoRefresh();
      } else {
        errorDiv.innerText = data.message || 'Invalid password';
      }
    } catch (err) {
      errorDiv.innerText = 'Network error. Please try again.';
    }
  }

  function authHeaders() {
    return {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json'
    };
  }

  async function loadAllData() {
    try {
      const res = await fetch('/api/admin/orders', { headers: authHeaders() });
      const data = await res.json();
      
      if (data.success) {
        allOrders = data.orders;
        renderStats(data.stats);
        renderOrders(allOrders);
        loadCharts();
      } else if (data.message === 'Invalid or expired token') {
        logout();
      }
    } catch (err) {
      console.error('Load data error:', err);
    }
  }

  function renderStats(stats) {
    const html = `
      <div class="stat-card"><div class="value">${stats.total}</div><div>Total Orders</div></div>
      <div class="stat-card"><div class="value">${stats.pending}</div><div>Pending</div></div>
      <div class="stat-card"><div class="value">${stats.paid}</div><div>Paid</div></div>
      <div class="stat-card"><div class="value">${stats.approved}</div><div>Active</div></div>
      <div class="stat-card"><div class="value">${stats.rejected}</div><div>Rejected</div></div>
      <div class="stat-card"><div class="value">${(stats.revenue / 1000).toFixed(0)}K</div><div>Revenue (KS)</div></div>
    `;
    document.getElementById('statsGrid').innerHTML = html;
  }

  function renderOrders(orders) {
    const container = document.getElementById('ordersContainer');
    
    if (!orders.length) {
      container.innerHTML = '<div style="padding: 20px; text-align: center;">No orders found</div>';
      return;
    }
    
    let html = `
      <div class="order-header">
        <div style="width: 40px;"><input type="checkbox" id="selectAllCheckbox"></div>
        <div style="width: 70px;">ID</div>
        <div style="width: 140px;">Package</div>
        <div style="width: 140px;">Phone</div>
        <div style="width: 90px;">Price</div>
        <div style="width: 120px;">Status</div>
        <div style="width: 150px;">Date</div>
        <div style="width: 70px;">SS</div>
        <div>Actions</div>
      </div>
    `;
    
    for (const o of orders) {
      let statusClass = '';
      let statusText = '';
      
      switch (o.status) {
        case 'pending_payment':
          statusClass = 'status-pending';
          statusText = 'Pending';
          break;
        case 'payment_received':
          statusClass = 'status-paid';
          statusText = 'Paid';
          break;
        case 'approved':
          statusClass = 'status-approved';
          statusText = 'Active';
          break;
        case 'rejected':
          statusClass = 'status-pending';
          statusText = 'Rejected';
          break;
        default:
          statusClass = 'status-pending';
          statusText = 'Expired';
      }
      
      const date = new Date(o.createdAt).toLocaleString();
      const actions = o.status === 'payment_received' ? 
        `<button class="action-btn action-approve" onclick="updateOrder(${o.id}, 'approved')">Approve</button>
         <button class="action-btn action-reject" onclick="updateOrder(${o.id}, 'rejected')">Reject</button>` : 
        (o.status === 'pending_payment' ? '<span style="color: #64748b;">Awaiting Payment</span>' : '-');
      
      html += `
        <div class="order-row">
          <div style="width: 40px;"><input type="checkbox" class="order-checkbox" value="${o.id}"></div>
          <div style="width: 70px;">#${o.id}</div>
          <div style="width: 140px;">${o.packageName}</div>
          <div style="width: 140px;">${o.phone}</div>
          <div style="width: 90px;">${o.price.toLocaleString()} KS</div>
          <div style="width: 120px;"><span class="status-badge ${statusClass}">${statusText}</span></div>
          <div style="width: 150px; font-size: 12px;">${date}</div>
          <div style="width: 70px;"><button onclick="viewScreenshot(${o.id})" style="background: #3b82f6; border: none; padding: 4px 8px; border-radius: 8px; cursor: pointer; color: white;">View</button></div>
          <div>${actions}</div>
        </div>
      `;
    }
    
    container.innerHTML = html;
    
    document.getElementById('selectAllCheckbox').onchange = (e) => {
      document.querySelectorAll('.order-checkbox').forEach(cb => cb.checked = e.target.checked);
      updateSelectedCount();
    };
    
    document.querySelectorAll('.order-checkbox').forEach(cb => {
      cb.onchange = () => updateSelectedCount();
    });
    
    updateSelectedCount();
  }

  function updateSelectedCount() {
    selectedOrders.clear();
    document.querySelectorAll('.order-checkbox:checked').forEach(cb => {
      selectedOrders.add(parseInt(cb.value));
    });
    
    const bulkDiv = document.getElementById('bulkActions');
    if (selectedOrders.size > 0) {
      bulkDiv.style.display = 'flex';
      document.getElementById('selectedCount').innerText = `${selectedOrders.size} selected`;
    } else {
      bulkDiv.style.display = 'none';
    }
  }

  async function updateOrder(orderId, status) {
    try {
      const res = await fetch('/api/admin/update-order', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ orderId, status })
      });
      
      if (res.ok) {
        await loadAllData();
        showNotification(`Order #${orderId} ${status}ed!`, '#22c55e');
      }
    } catch (err) {
      showNotification('Error updating order', '#ef4444');
    }
  }

  async function bulkUpdate(status) {
    if (selectedOrders.size === 0) return;
    if (!confirm(`Are you sure you want to ${status} ${selectedOrders.size} orders?`)) return;
    
    const orderIds = Array.from(selectedOrders);
    
    try {
      const res = await fetch('/api/admin/bulk-update', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ orderIds, status })
      });
      
      if (res.ok) {
        await loadAllData();
        selectedOrders.clear();
        updateSelectedCount();
        showNotification(`${orderIds.length} orders ${status}ed!`, '#22c55e');
      }
    } catch (err) {
      showNotification('Error', '#ef4444');
    }
  }

  async function viewScreenshot(orderId) {
    try {
      const res = await fetch(`/api/admin/screenshot/${orderId}`, { headers: authHeaders() });
      const data = await res.json();
      
      if (data.success) {
        document.getElementById('screenshotImg').src = data.screenshotUrl;
        document.getElementById('screenshotModal').style.display = 'flex';
      } else {
        alert('No screenshot available');
      }
    } catch (err) {
      alert('Error loading screenshot');
    }
  }

  function closeModal() {
    document.getElementById('screenshotModal').style.display = 'none';
  }

  function loadCharts() {
    const dailyCanvas = document.getElementById('dailyChart');
    const packageCanvas = document.getElementById('packageChart');
    
    if (!dailyCanvas || !packageCanvas) return;
    
    if (dailyChart) dailyChart.destroy();
    if (packageChart) packageChart.destroy();
    
    // Last 7 days
    const last7Days = [];
    const dailyCounts = [];
    
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().split('T')[0];
      last7Days.push(dateStr);
      dailyCounts.push(allOrders.filter(o => o.createdAt && o.createdAt.startsWith(dateStr)).length);
    }
    
    dailyChart = new Chart(dailyCanvas, {
      type: 'line',
      data: {
        labels: last7Days,
        datasets: [{
          label: 'Orders',
          data: dailyCounts,
          borderColor: '#facc15',
          backgroundColor: '#facc1520',
          fill: true,
          tension: 0.3
        }]
      },
      options: { responsive: true, maintainAspectRatio: true }
    });
    
    // Revenue by package
    const packageRevenue = {};
    allOrders.filter(o => o.status === 'approved').forEach(o => {
      packageRevenue[o.packageName] = (packageRevenue[o.packageName] || 0) + o.price;
    });
    
    packageChart = new Chart(packageCanvas, {
      type: 'bar',
      data: {
        labels: Object.keys(packageRevenue),
        datasets: [{
          label: 'Revenue (KS)',
          data: Object.values(packageRevenue),
          backgroundColor: '#facc15',
          borderRadius: 8
        }]
      },
      options: { responsive: true, maintainAspectRatio: true }
    });
  }

  function applyFilters() {
    const search = document.getElementById('searchPhone').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    
    let filtered = allOrders;
    
    if (search) {
      filtered = filtered.filter(o => o.phone.includes(search));
    }
    if (status !== 'all') {
      filtered = filtered.filter(o => o.status === status);
    }
    
    renderOrders(filtered);
  }

  function exportCSV() {
    let filtered = allOrders;
    const search = document.getElementById('searchPhone').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    
    if (search) filtered = filtered.filter(o => o.phone.includes(search));
    if (status !== 'all') filtered = filtered.filter(o => o.status === status);
    
    const headers = ['ID', 'Package', 'Phone', 'Price', 'Status', 'Created Date', 'Start Date', 'End Date'];
    const rows = filtered.map(o => [
      o.id, o.packageName, o.phone, o.price, o.status, 
      o.createdAt, o.startDate || '', o.endDate || ''
    ]);
    
    const csv = [headers, ...rows].map(row => row.join(',')).join('\n');
    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `orders_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showNotification('CSV exported!', '#22c55e');
  }

  function showNotification(msg, color) {
    const notif = document.createElement('div');
    notif.textContent = msg;
    notif.style.cssText = `
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: ${color};
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      z-index: 2000;
      animation: fadeOut 3s forwards;
    `;
    document.body.appendChild(notif);
    setTimeout(() => notif.remove(), 3000);
  }

  function startAutoRefresh() {
    if (autoRefreshInterval) clearInterval(autoRefreshInterval);
    autoRefreshInterval = setInterval(() => {
      if (token) loadAllData();
    }, 60000);
  }

  function logout() {
    sessionStorage.removeItem('adminToken');
    token = null;
    location.reload();
  }

  function toggleMobileMenu() {
    const sidebar = document.getElementById('sidebar');
    const current = sidebar.style.transform;
    sidebar.style.transform = current === 'translateX(0px)' ? 'translateX(-100%)' : 'translateX(0px)';
  }

  // Navigation
  document.querySelectorAll('.nav-item[data-page]').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
      item.classList.add('active');
      document.getElementById('pageTitle').innerText = item.innerText.trim();
      
      if (item.dataset.page === 'expiring') {
        const today = new Date();
        const expiringOrders = allOrders.filter(o => 
          o.status === 'approved' && 
          o.endDate && 
          new Date(o.endDate) < new Date(today.setDate(today.getDate() + 3))
        );
        renderOrders(expiringOrders);
      } else {
        renderOrders(allOrders);
      }
    });
  });

  // Event listeners
  document.getElementById('loginBtn').onclick = login;
  document.getElementById('applyFilters').onclick = applyFilters;
  document.getElementById('exportCSV').onclick = exportCSV;
  document.getElementById('bulkApprove').onclick = () => bulkUpdate('approved');
  document.getElementById('bulkReject').onclick = () => bulkUpdate('rejected');
  document.getElementById('clearSelection').onclick = () => {
    document.querySelectorAll('.order-checkbox').forEach(cb => cb.checked = false);
    updateSelectedCount();
  };
  
  // Enter key for login
  document.getElementById('adminPassword').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') login();
  });

  // Global functions
  window.updateOrder = updateOrder;
  window.viewScreenshot = viewScreenshot;
  window.closeModal = closeModal;
  window.toggleMobileMenu = toggleMobileMenu;
  
  // CSS animation
  const style = document.createElement('style');
  style.textContent = `@keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }`;
  document.head.appendChild(style);
</script>
</body>
</html>
