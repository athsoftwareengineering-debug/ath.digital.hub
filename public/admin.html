<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATH DIGITAL HUB Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Same admin CSS as original – keep all styles */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; }
    /* ... (copy all styles from your original admin.html) ... */
  </style>
</head>
<body>
<div id="loginSection" class="login-container">
  <div class="login-card">
    <h2>Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Enter password">
    <button id="loginBtn">Login</button>
    <div id="loginError" style="color:red"></div>
  </div>
</div>
<div id="dashboardSection" style="display:none">
  <!-- same sidebar and layout as original admin.html -->
  <div class="app-wrapper">...</div>
</div>

<script>
  const API_BASE = '';
  let token = null;
  let allOrders = [];
  let selectedOrders = new Set();

  async function login() {
    const password = document.getElementById('adminPassword').value;
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const data = await res.json();
      if (data.success) {
        token = data.token;
        sessionStorage.setItem('adminToken', token);
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        loadAllData();
        startAutoRefresh();
      } else {
        document.getElementById('loginError').innerText = data.message;
      }
    } catch (err) { document.getElementById('loginError').innerText = 'Network error'; }
  }

  function authHeaders() {
    return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
  }

  async function loadAllData() {
    const res = await fetch('/api/admin/orders', { headers: authHeaders() });
    const data = await res.json();
    if (data.success) {
      allOrders = data.orders;
      renderStats(data.stats);
      applyFilters();
      loadCharts();
    }
  }

  async function updateOrder(orderId, status) {
    await fetch('/api/admin/update-order', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ orderId, status })
    });
    loadAllData();
  }

  async function bulkUpdate(orderIds, status) {
    await fetch('/api/admin/bulk-update', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ orderIds, status })
    });
    loadAllData();
    clearSelection();
  }

  async function viewScreenshot(orderId) {
    const res = await fetch(`/api/admin/screenshot/${orderId}`, { headers: authHeaders() });
    const data = await res.json();
    if (data.success) {
      const modal = document.getElementById('screenshotModal');
      const img = document.getElementById('screenshotImg');
      img.src = data.screenshotUrl;
      modal.style.display = 'flex';
    } else alert('No screenshot');
  }

  // ... all other functions (renderOrders, filters, export, charts) similar to original but using token
  // Remember to replace all fetch URLs with /api/... and add authHeaders()

  function startAutoRefresh() { setInterval(() => { if (autoRefresh) loadAllData(); }, 60000); }

  if (sessionStorage.getItem('adminToken')) {
    token = sessionStorage.getItem('adminToken');
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('dashboardSection').style.display = 'block';
    loadAllData();
    startAutoRefresh();
  }
  document.getElementById('loginBtn').onclick = login;
</script>
</body>
</html>
