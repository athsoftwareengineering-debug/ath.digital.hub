<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATH Admin | MYTEL Order Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0a0c15; color: #fff; overflow-x: hidden; }
    
    /* Animated BG */
    .admin-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at 20% 30%, #0f1119, #0a0c15);
      z-index: -2;
    }
    .admin-bg::before {
      content: '';
      position: absolute;
      width: 200%; height: 200%;
      top: -50%; left: -50%;
      background: radial-gradient(circle, rgba(0,200,255,0.05) 0%, transparent 60%);
      animation: rotateBg 30s linear infinite;
    }
    @keyframes rotateBg {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    /* Glass Card */
    .glass {
      background: rgba(15, 25, 45, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 200, 255, 0.2);
      border-radius: 1.5rem;
      transition: all 0.2s;
    }
    .glass:hover { border-color: rgba(0, 200, 255, 0.4); }
    
    .stat-card {
      background: linear-gradient(135deg, rgba(0,200,255,0.1), rgba(255,105,180,0.05));
      border-radius: 1.2rem;
      padding: 1rem;
      border-bottom: 3px solid #00ccff;
    }
    
    .btn-gold {
      background: linear-gradient(95deg, #eab308, #f59e0b);
      transition: 0.2s;
    }
    .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(245,158,11,0.4); }
    
    .order-row {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 1rem;
      padding: 1rem;
      margin-bottom: 0.8rem;
      border-left: 3px solid #00ccff;
      transition: all 0.2s;
    }
    .order-row:hover { transform: translateX(5px); background: rgba(0, 200, 255, 0.05); }
    
    .badge {
      padding: 0.2rem 0.7rem;
      border-radius: 2rem;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge-pending { background: #f9731620; color: #f97316; border: 1px solid #f97316; }
    .badge-paid { background: #3b82f620; color: #3b82f6; border: 1px solid #3b82f6; }
    .badge-approved { background: #22c55e20; color: #22c55e; border: 1px solid #22c55e; }
    .badge-rejected { background: #ef444420; color: #ef4444; border: 1px solid #ef4444; }
    .badge-expired { background: #6b728020; color: #9ca3af; border: 1px solid #6b7280; }
    
    input, select {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 200, 255, 0.3);
      border-radius: 2rem;
      padding: 0.7rem 1rem;
      color: white;
      outline: none;
    }
    input:focus, select:focus { border-color: #00ccff; box-shadow: 0 0 10px rgba(0,200,255,0.2); }
    
    .modal-img {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(12px);
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .modal-img.show { display: flex; }
    
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #00ccff; border-radius: 10px; }
  </style>
</head>
<body>
<div class="admin-bg"></div>

<!-- Login Container -->
<div id="loginContainer" class="flex items-center justify-center min-h-screen" style="display: flex;">
  <div class="glass p-8 max-w-md w-full mx-4" style="animation: fadeIn 0.4s ease;">
    <div class="text-center mb-6">
      <div class="w-20 h-20 mx-auto bg-gradient-to-br from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-2xl">
        <i class="fas fa-shield-alt text-4xl text-white"></i>
      </div>
      <h2 class="text-3xl font-black mt-4 bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">ADMIN LOGIN</h2>
      <p class="text-slate-400 text-sm">MYTEL Official Reseller Portal</p>
    </div>
    <div class="space-y-4">
      <input type="password" id="adminPassword" placeholder="Enter Master Password" class="w-full">
      <button onclick="login()" class="btn-gold w-full py-3 rounded-xl font-bold text-white">Access Dashboard</button>
      <div id="loginError" class="text-red-400 text-sm text-center hidden"></div>
    </div>
  </div>
</div>

<!-- Dashboard Container -->
<div id="dashboardContainer" style="display: none;" class="container mx-auto px-4 py-6 max-w-7xl">
  <!-- Header -->
  <div class="flex flex-wrap justify-between items-center mb-8 gap-4">
    <div class="flex items-center gap-4">
      <div class="bg-gradient-to-br from-cyan-500 to-blue-600 p-3 rounded-xl">
        <i class="fas fa-crown text-2xl text-white"></i>
      </div>
      <div>
        <h1 class="text-2xl md:text-3xl font-black"><span class="text-cyan-400">ATH</span> Admin Panel</h1>
        <p class="text-xs text-cyan-400/80"><i class="fas fa-check-circle"></i> Order Management System</p>
      </div>
    </div>
    <div class="flex gap-3">
      <button onclick="fetchOrders()" class="glass px-5 py-2.5 rounded-xl text-white"><i class="fas fa-sync-alt"></i> Refresh</button>
      <button onclick="logout()" class="glass px-5 py-2.5 rounded-xl text-white hover:bg-red-800/40"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8">
    <div class="stat-card text-center"><div class="text-slate-400 text-sm">📦 Total</div><h3 id="statTotal" class="text-2xl font-bold">0</h3></div>
    <div class="stat-card text-center"><div class="text-slate-400 text-sm">⏳ Pending</div><h3 id="statPending" class="text-2xl font-bold text-amber-400">0</h3></div>
    <div class="stat-card text-center"><div class="text-slate-400 text-sm">💰 Paid</div><h3 id="statPaid" class="text-2xl font-bold text-blue-400">0</h3></div>
    <div class="stat-card text-center"><div class="text-slate-400 text-sm">✅ Active</div><h3 id="statActive" class="text-2xl font-bold text-emerald-400">0</h3></div>
    <div class="stat-card text-center"><div class="text-slate-400 text-sm">⌛ Expired</div><h3 id="statExpired" class="text-2xl font-bold text-rose-400">0</h3></div>
    <div class="stat-card text-center"><div class="text-slate-400 text-sm">💰 Revenue</div><h3 id="statRevenue" class="text-2xl font-bold text-purple-400">0 KS</h3></div>
  </div>

  <!-- Chart -->
  <div class="grid lg:grid-cols-3 gap-6 mb-8">
    <div class="lg:col-span-2 glass p-5 rounded-2xl">
      <h3 class="font-bold text-cyan-400 mb-3"><i class="fas fa-chart-line"></i> Order Analytics</h3>
      <canvas id="statusChart" height="180"></canvas>
    </div>
    <div class="glass p-5 rounded-2xl">
      <h3 class="font-bold text-cyan-400 mb-3"><i class="fas fa-info-circle"></i> System Status</h3>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between"><span class="text-slate-400">API:</span><span class="text-green-400"><i class="fas fa-circle" style="font-size:8px;"></i> Connected</span></div>
        <div class="flex justify-between"><span class="text-slate-400">Session:</span><span class="text-cyan-400">Active</span></div>
        <div class="flex justify-between"><span class="text-slate-400">Last Sync:</span><span id="lastSync" class="text-white">--:--:--</span></div>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="glass p-5 mb-8 flex flex-wrap gap-4 items-center rounded-2xl">
    <div class="relative flex-1 min-w-[200px]">
      <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-cyan-400"></i>
      <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Search by phone or order ID..." class="w-full pl-11">
    </div>
    <div class="w-48">
      <select id="statusFilter" onchange="applyFilters()" class="w-full">
        <option value="all">📋 All Status</option>
        <option value="pending_payment">⏳ Pending</option>
        <option value="payment_received">💰 Paid</option>
        <option value="approved">✅ Active</option>
        <option value="rejected">❌ Rejected</option>
        <option value="expired">⌛ Expired</option>
      </select>
    </div>
    <div class="text-slate-400 text-sm"><i class="far fa-file-alt"></i> <span id="resultCount">0</span> results</div>
  </div>

  <!-- Orders List -->
  <h2 class="text-xl font-bold mb-4 text-cyan-400"><i class="fas fa-tasks"></i> Order Management</h2>
  <div id="ordersContainer" class="space-y-3 pb-12"></div>
</div>

<!-- Image Modal -->
<div id="imageModal" class="modal-img" onclick="closeModal()">
  <div class="relative max-w-3xl p-4" onclick="event.stopPropagation()">
    <img id="modalImage" src="" class="max-w-full max-h-[80vh] rounded-2xl border-4 border-cyan-500 shadow-2xl">
    <button onclick="closeModal()" class="absolute -top-3 -right-3 bg-black/80 rounded-full p-2 w-8 h-8 flex items-center justify-center text-white hover:bg-red-600"><i class="fas fa-times"></i></button>
  </div>
</div>

<script>
  let adminToken = "";
  let allOrders = [];
  let chartInstance = null;
  const ADMIN_PASSWORD = "admin123"; // Simple password for demo

  function showToast(msg, isError = false) {
    Swal.fire({ icon: isError ? 'error' : 'success', title: msg, toast: true, timer: 2000, showConfirmButton: false, position: 'top-end', background: '#1e293b', color: '#fff' });
  }

  async function login() {
    const pwd = document.getElementById('adminPassword').value;
    if (pwd !== ADMIN_PASSWORD) {
      document.getElementById('loginError').classList.remove('hidden');
      document.getElementById('loginError').innerText = '❌ Invalid Password';
      return;
    }
    adminToken = pwd;
    document.getElementById('loginContainer').style.display = 'none';
    document.getElementById('dashboardContainer').style.display = 'block';
    await fetchOrders();
    showToast("Welcome Admin!");
  }

  async function fetchOrders() {
    try {
      const res = await fetch('/api/admin/orders', {
        headers: { 'x-admin-auth': adminToken }
      });
      const data = await res.json();
      if (data.success) {
        allOrders = data.orders;
        updateStats(data.stats);
        updateChart(data.stats);
        applyFilters();
        document.getElementById('lastSync').innerText = new Date().toLocaleTimeString();
      } else if (data.message === 'Unauthorized') {
        logout();
      }
    } catch(err) { console.error(err); }
  }

  function updateStats(stats) {
    if (!stats) return;
    document.getElementById('statTotal').innerText = stats.total || 0;
    document.getElementById('statPending').innerText = stats.pending || 0;
    document.getElementById('statPaid').innerText = stats.paid || 0;
    document.getElementById('statActive').innerText = stats.approved || 0;
    document.getElementById('statExpired').innerText = stats.expired || 0;
    document.getElementById('statRevenue').innerHTML = (stats.revenue || 0).toLocaleString() + ' KS';
  }

  function updateChart(stats) {
    const ctx = document.getElementById('statusChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Pending', 'Paid', 'Active', 'Rejected', 'Expired'],
        datasets: [{
          label: 'Orders',
          data: [stats.pending || 0, stats.paid || 0, stats.approved || 0, stats.rejected || 0, stats.expired || 0],
          backgroundColor: ['#f59e0b', '#3b82f6', '#10b981', '#ef4444', '#6b7280'],
          borderRadius: 8
        }]
      },
      options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#cbd5e1' } } } }
    });
  }

  function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    let filtered = allOrders.filter(o => 
      (o.phone && o.phone.includes(search)) || (o.orderId && o.orderId.toLowerCase().includes(search))
    );
    if (status !== 'all') filtered = filtered.filter(o => o.status === status);
    document.getElementById('resultCount').innerText = filtered.length;
    renderOrders(filtered);
  }

  function getStatusBadge(status) {
    const map = {
      'pending_payment': '<span class="badge badge-pending">⏳ Pending</span>',
      'payment_received': '<span class="badge badge-paid">💰 Paid</span>',
      'approved': '<span class="badge badge-approved">✅ Active</span>',
      'rejected': '<span class="badge badge-rejected">❌ Rejected</span>',
      'expired': '<span class="badge badge-expired">⌛ Expired</span>'
    };
    return map[status] || '<span class="badge">📌 Unknown</span>';
  }

  function renderOrders(orders) {
    const container = document.getElementById('ordersContainer');
    if (!orders.length) {
      container.innerHTML = '<div class="glass text-center py-16 text-slate-400">No orders found</div>';
      return;
    }
    let html = '';
    orders.forEach(o => {
      const screenshotHtml = o.screenshotPath ? `<img src="${o.screenshotPath}" class="w-12 h-12 object-cover rounded-lg border border-cyan-500 cursor-pointer hover:scale-105" onclick="showImage('${o.screenshotPath}')">` : '<div class="w-12 h-12 bg-slate-700 rounded-lg flex items-center justify-center"><i class="fas fa-receipt text-slate-400"></i></div>';
      html += `
        <div class="order-row">
          <div class="flex flex-wrap justify-between items-start gap-2">
            <div class="flex items-center gap-3 flex-wrap">
              <span class="text-xs bg-black/50 px-3 py-1 rounded-full font-mono">#${o.orderId || o.id}</span>
              <span class="font-bold">📦 ${o.packageName}</span>
              ${getStatusBadge(o.status)}
            </div>
            <span class="text-xs text-slate-400">📅 ${o.createdAtMyanmar || o.createdAt || 'N/A'}</span>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-3 gap-2 mt-3 text-sm">
            <div><i class="fas fa-phone text-cyan-400 w-5"></i> ${o.phone}</div>
            <div><i class="fas fa-money-bill-wave text-green-400"></i> ${Number(o.price).toLocaleString()} KS</div>
            <div><i class="fas fa-user text-slate-400"></i> ${o.userEmail || 'Guest'}</div>
          </div>
          ${o.note ? `<div class="text-xs text-slate-400 mt-2"><i class="fas fa-pencil-alt"></i> ${o.note}</div>` : ''}
          <div class="flex justify-between items-center mt-4 pt-3 border-t border-white/10">
            <div class="flex gap-2 items-center">${screenshotHtml}<span class="text-xs text-slate-400">proof</span></div>
            <div class="flex gap-2">
              ${o.status === 'payment_received' ? `
                <button onclick="updateOrderStatus(${o.id}, 'approved')" class="bg-emerald-700 hover:bg-emerald-600 px-4 py-1.5 rounded-lg text-sm"><i class="fas fa-check"></i> Approve</button>
                <button onclick="promptReject(${o.id})" class="bg-rose-700 hover:bg-rose-600 px-4 py-1.5 rounded-lg text-sm"><i class="fas fa-times"></i> Reject</button>
              ` : ''}
              <button onclick="deleteOrder(${o.id})" class="bg-slate-700 hover:bg-red-800 px-4 py-1.5 rounded-lg text-sm"><i class="fas fa-trash"></i> Delete</button>
            </div>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  async function updateOrderStatus(orderId, newStatus) {
    try {
      const res = await fetch('/api/admin/update-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-auth': adminToken },
        body: JSON.stringify({ orderId, status: newStatus })
      });
      const data = await res.json();
      if (data.success) {
        showToast(`Order #${orderId} ${newStatus}!`);
        await fetchOrders();
      } else showToast("Update failed", true);
    } catch(err) { showToast(err.message, true); }
  }

  async function promptReject(orderId) {
    const { value: reason } = await Swal.fire({
      title: 'Rejection Reason',
      input: 'text',
      inputPlaceholder: 'Enter reason...',
      background: '#1e293b',
      color: '#fff'
    });
    if (reason !== undefined) {
      const res = await fetch('/api/admin/update-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-auth': adminToken },
        body: JSON.stringify({ orderId, status: 'rejected', rejectReason: reason })
      });
      if ((await res.json()).success) {
        showToast(`Order #${orderId} rejected`);
        await fetchOrders();
      }
    }
  }

  async function deleteOrder(orderId) {
    const confirm = await Swal.fire({ title: 'Delete Order?', text: 'This action cannot be undone', icon: 'warning', showCancelButton: true, background: '#1e293b', color: '#fff' });
    if (confirm.isConfirmed) {
      const res = await fetch('/api/admin/delete-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-auth': adminToken },
        body: JSON.stringify({ orderId })
      });
      if ((await res.json()).success) {
        showToast("Order deleted");
        await fetchOrders();
      }
    }
  }

  function showImage(url) {
    document.getElementById('modalImage').src = url;
    document.getElementById('imageModal').classList.add('show');
  }
  function closeModal() { document.getElementById('imageModal').classList.remove('show'); }
  function logout() {
    adminToken = "";
    document.getElementById('dashboardContainer').style.display = 'none';
    document.getElementById('loginContainer').style.display = 'flex';
    document.getElementById('adminPassword').value = '';
  }

  window.login = login;
  window.fetchOrders = fetchOrders;
  window.applyFilters = applyFilters;
  window.updateOrderStatus = updateOrderStatus;
  window.promptReject = promptReject;
  window.deleteOrder = deleteOrder;
  window.showImage = showImage;
  window.closeModal = closeModal;
  window.logout = logout;
</script>
</body>
</html>
